<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBM i Learning Tracker — Sistema Biblioteca</title>
<style>
/* ─── RESET & BASE ─────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bg4:#2d333b;
  --border:#30363d;--border2:#444c56;
  --text:#e6edf3;--text2:#8b949e;--text3:#6e7681;
  --blue:#58a6ff;--blue2:#1f6feb;--blue3:#0d419d;
  --green:#3fb950;--green2:#196c2e;
  --orange:#f0883e;--orange2:#9e4900;
  --red:#f85149;--red2:#8b1a1a;
  --purple:#bc8cff;--purple2:#6e40c9;
  --yellow:#d29922;--yellow2:#5a3e00;
  --teal:#39d353;
  --radius:8px;--radius-sm:6px;
}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
  font-size:14px;line-height:1.6;
  background:var(--bg);color:var(--text);
  min-height:100vh;
}

/* ─── LAYOUT ───────────────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{
  background:var(--bg2);border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;
}
.main{overflow-y:auto;padding:0}

/* ─── SIDEBAR ──────────────────────────────────────────────────────── */
.sidebar-header{
  padding:18px 16px 14px;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--bg2);z-index:10;
}
.sidebar-logo{
  font-size:15px;font-weight:700;color:var(--text);
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
}
.sidebar-logo span{font-size:20px}
.global-progress{background:var(--bg3);border-radius:var(--radius-sm);padding:10px 12px}
.gp-label{font-size:11px;color:var(--text2);margin-bottom:6px;display:flex;justify-content:space-between}
.gp-bar-track{background:var(--bg4);border-radius:20px;height:6px;overflow:hidden}
.gp-bar-fill{
  height:100%;border-radius:20px;
  background:linear-gradient(90deg,var(--blue2),var(--green));
  transition:width .4s ease;
}
.gp-stats{display:flex;gap:8px;margin-top:8px;font-size:11px}
.gp-stat{
  flex:1;background:var(--bg4);border-radius:4px;
  padding:4px 6px;text-align:center;
}
.gp-stat b{display:block;font-size:13px;color:var(--text)}
.gp-stat span{color:var(--text2)}

.nav-section{padding:10px 0}
.nav-section-title{
  font-size:10px;font-weight:600;color:var(--text3);
  text-transform:uppercase;letter-spacing:.8px;
  padding:4px 16px 2px;
}
.nav-phase{cursor:pointer;user-select:none}
.nav-phase-header{
  display:flex;align-items:center;gap:8px;
  padding:7px 16px;font-size:13px;font-weight:500;
  transition:background .15s;border-radius:0;
  position:relative;
}
.nav-phase-header:hover{background:var(--bg3)}
.nav-phase-header.active-phase{color:var(--blue)}
.ph-icon{font-size:14px;width:20px;text-align:center}
.ph-badge{
  margin-left:auto;font-size:10px;font-weight:700;
  background:var(--bg4);border-radius:10px;
  padding:1px 7px;color:var(--text2);
  border:1px solid var(--border);
}
.ph-badge.done{background:var(--green2);color:var(--green);border-color:var(--green2)}
.ph-badge.partial{background:var(--yellow2);color:var(--yellow);border-color:var(--yellow2)}
.nav-exercises{display:none;padding:0 0 4px 36px}
.nav-exercises.open{display:block}
.nav-ex{
  display:flex;align-items:center;gap:7px;
  padding:5px 12px 5px 8px;font-size:12px;color:var(--text2);
  cursor:pointer;border-radius:var(--radius-sm);
  transition:background .1s,color .1s;
  margin-right:8px;
}
.nav-ex:hover{background:var(--bg3);color:var(--text)}
.nav-ex.active{background:var(--bg3);color:var(--blue)}
.nav-ex.completed{color:var(--green)}
.nav-ex.completed .nav-check{color:var(--green)}
.nav-check{font-size:11px;width:14px;text-align:center;flex-shrink:0}
.nav-ex-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-lv{font-size:9px;font-weight:700;border-radius:3px;padding:1px 4px;flex-shrink:0}
.lv-e{background:#1a4731;color:#3fb950}
.lv-m{background:#3d2900;color:#f0883e}
.lv-d{background:#3d0d0d;color:#f85149}

/* ─── MAIN HEADER ──────────────────────────────────────────────────── */
.page-header{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:20px 28px 16px;
  position:sticky;top:0;z-index:9;
}
.page-title{font-size:18px;font-weight:700;margin-bottom:4px}
.page-sub{font-size:12px;color:var(--text2)}
.phase-tabs{
  display:flex;gap:6px;margin-top:14px;flex-wrap:wrap;
}
.phase-tab{
  padding:5px 12px;border-radius:20px;
  font-size:12px;font-weight:500;cursor:pointer;
  border:1px solid var(--border);background:transparent;
  color:var(--text2);transition:all .15s;
}
.phase-tab:hover{border-color:var(--border2);color:var(--text)}
.phase-tab.active{background:var(--blue2);border-color:var(--blue2);color:#fff}
.phase-tab.done{border-color:var(--green2);color:var(--green)}

/* ─── CONTENT AREA ─────────────────────────────────────────────────── */
.content{padding:24px 28px 40px}

/* ─── PHASE BANNER ─────────────────────────────────────────────────── */
.phase-banner{
  border-radius:var(--radius);padding:18px 20px;
  margin-bottom:20px;
  border:1px solid var(--border);
  display:flex;align-items:center;gap:16px;
}
.phase-banner-icon{font-size:32px}
.phase-banner-info h2{font-size:16px;font-weight:700;margin-bottom:3px}
.phase-banner-info p{font-size:12px;color:var(--text2);margin:0}
.phase-banner-progress{margin-left:auto;text-align:center;flex-shrink:0}
.phase-circle{
  width:54px;height:54px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;
  border:3px solid var(--border);
  background:var(--bg3);
  transition:all .3s;
}
.phase-circle span{font-size:10px;color:var(--text2);display:block}

/* ─── EXERCISE CARDS ───────────────────────────────────────────────── */
.exercises-grid{display:flex;flex-direction:column;gap:16px}
.ex-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
  transition:border-color .2s;
}
.ex-card:hover{border-color:var(--border2)}
.ex-card.completed{border-color:var(--green2)}
.ex-card.completed .ex-card-header{background:rgba(63,185,80,.05)}
.ex-card.active-card{border-color:var(--blue2)}

.ex-card-header{
  padding:14px 16px;display:flex;align-items:flex-start;gap:12px;
  cursor:pointer;
}
.ex-card-check{
  width:22px;height:22px;border-radius:50%;border:2px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:1px;cursor:pointer;
  transition:all .2s;font-size:12px;
}
.ex-card.completed .ex-card-check{
  background:var(--green);border-color:var(--green);color:#fff;
}
.ex-card-meta{flex:1}
.ex-card-id{font-size:10px;color:var(--text3);font-weight:600;margin-bottom:2px}
.ex-card-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px}
.ex-card-tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{
  font-size:10px;padding:2px 7px;border-radius:10px;
  font-weight:500;
}
.tag-fase{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.tag-e{background:#1a4731;color:#3fb950}
.tag-m{background:#3d2900;color:#f0883e}
.tag-d{background:#3d0d0d;color:#f85149}
.tag-concept{background:var(--blue3);color:var(--blue)}
.ex-card-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.btn-expand{
  background:transparent;border:1px solid var(--border);
  color:var(--text2);padding:4px 10px;border-radius:var(--radius-sm);
  font-size:11px;cursor:pointer;transition:all .15s;
  font-family:inherit;
}
.btn-expand:hover{border-color:var(--border2);color:var(--text);background:var(--bg3)}
.btn-done{
  background:var(--green2);border:1px solid var(--green2);
  color:var(--green);padding:4px 12px;border-radius:var(--radius-sm);
  font-size:11px;cursor:pointer;font-weight:600;
  transition:all .15s;font-family:inherit;
}
.btn-done:hover{background:#2ea043;color:#fff}
.btn-undone{
  background:var(--bg3);border:1px solid var(--border2);
  color:var(--text2);padding:4px 12px;border-radius:var(--radius-sm);
  font-size:11px;cursor:pointer;font-weight:600;
  transition:all .15s;font-family:inherit;
}
.btn-undone:hover{background:var(--red2);border-color:var(--red2);color:var(--red)}

/* ─── BOTÓN PRACTICAR EN SIMULADOR ────────────────────────────────── */
.btn-sim{
  background:transparent;
  border:1px solid var(--teal,#14b8a6);
  color:var(--teal,#14b8a6);
  padding:4px 12px;border-radius:var(--radius-sm);
  font-size:11px;cursor:pointer;font-weight:600;
  transition:all .15s;font-family:inherit;
  white-space:nowrap;
}
.btn-sim:hover{background:var(--teal,#14b8a6);color:#fff}

/* ─── EXERCISE BODY ────────────────────────────────────────────────── */
.ex-body{display:none;padding:0 16px 16px;border-top:1px solid var(--border)}
.ex-body.open{display:block}

.ex-section{margin-top:14px}
.ex-section-title{
  font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.6px;color:var(--text2);margin-bottom:6px;
  display:flex;align-items:center;gap:6px;
}
.ex-section-title::after{
  content:'';flex:1;height:1px;background:var(--border);
}
.obj-box{
  background:rgba(31,111,235,.1);border-left:3px solid var(--blue2);
  padding:8px 12px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  font-size:12px;color:var(--text);
}
.enun-text{font-size:12px;color:var(--text);line-height:1.7}
.hints-box{
  background:rgba(188,140,255,.08);border:1px solid rgba(188,140,255,.2);
  border-radius:var(--radius-sm);padding:10px 13px;
}
.hints-box ul{padding-left:15px;margin:0}
.hints-box li{font-size:12px;color:var(--text2);margin-bottom:3px}
.hints-box li code{
  background:var(--bg4);padding:1px 4px;border-radius:3px;
  font-size:11px;font-family:"Cascadia Code","Consolas",monospace;
  color:var(--orange);
}

/* ─── CODE BLOCKS ──────────────────────────────────────────────────── */
.sol-toggle-btn{
  background:var(--bg3);border:1px solid var(--border2);
  color:var(--text2);padding:6px 14px;border-radius:var(--radius-sm);
  font-size:11px;cursor:pointer;font-family:inherit;font-weight:600;
  display:flex;align-items:center;gap:6px;
  transition:all .15s;
}
.sol-toggle-btn:hover{background:var(--bg4);color:var(--text)}
.sol-toggle-btn .arrow{transition:transform .2s;display:inline-block}
.sol-toggle-btn.open .arrow{transform:rotate(90deg)}
.sol-code{display:none;margin-top:8px}
.sol-code.open{display:block}
pre{
  background:#161b22;border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:14px 16px;font-size:11px;overflow-x:auto;
  line-height:1.6;
  font-family:"Cascadia Code","Consolas","Courier New",monospace;
  color:#abb2bf;
}
.kw{color:#c678dd}.str{color:#98c379}.cm{color:#5c6370;font-style:italic}
.nm{color:#d19a66}.fn{color:#61afef}.op{color:#56b6c2}.ky2{color:#e06c75}

/* ─── NOTES ────────────────────────────────────────────────────────── */
.notes-area{
  width:100%;background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:10px 12px;
  color:var(--text);font-size:12px;line-height:1.6;
  font-family:inherit;resize:vertical;min-height:70px;
  transition:border-color .15s;
}
.notes-area:focus{outline:none;border-color:var(--blue2)}
.notes-area::placeholder{color:var(--text3)}

/* ─── COMPLETED BADGE ──────────────────────────────────────────────── */
.completed-ribbon{
  display:none;background:var(--green2);color:var(--green);
  font-size:11px;font-weight:700;padding:3px 10px;
  border-radius:0 0 var(--radius-sm) var(--radius-sm);
  text-align:center;
}
.ex-card.completed .completed-ribbon{display:block}

/* ─── STREAK / STATS ────────────────────────────────────────────────── */
.stats-bar{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:10px;margin-bottom:20px;
}
.stat-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 16px;
  text-align:center;
}
.stat-card .sv{font-size:24px;font-weight:700;color:var(--text)}
.stat-card .sl{font-size:11px;color:var(--text2);margin-top:2px}
.stat-card.blue .sv{color:var(--blue)}
.stat-card.green .sv{color:var(--green)}
.stat-card.orange .sv{color:var(--orange)}
.stat-card.purple .sv{color:var(--purple)}

/* ─── PHASE PROGRESS MINI ─────────────────────────────────────────── */
.phase-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.phase-row{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:10px 14px;
  display:flex;align-items:center;gap:12px;cursor:pointer;
  transition:border-color .15s;
}
.phase-row:hover{border-color:var(--border2)}
.phase-row-icon{font-size:16px;width:24px;text-align:center}
.phase-row-info{flex:1}
.phase-row-title{font-size:13px;font-weight:600}
.phase-row-sub{font-size:11px;color:var(--text2)}
.phase-row-bar{width:120px}
.phase-mini-track{background:var(--bg4);border-radius:20px;height:5px;overflow:hidden;margin-bottom:3px}
.phase-mini-fill{height:100%;border-radius:20px;background:var(--green);transition:width .3s}
.phase-mini-pct{font-size:10px;color:var(--text2);text-align:right}
.phase-row-count{
  font-size:11px;font-weight:700;color:var(--text2);
  background:var(--bg4);border-radius:4px;padding:2px 8px;
}

/* ─── EMPTY STATE ──────────────────────────────────────────────────── */
.empty{text-align:center;padding:40px 20px;color:var(--text2)}
.empty-icon{font-size:40px;margin-bottom:10px}
.empty p{font-size:13px}

/* ─── TOAST ────────────────────────────────────────────────────────── */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:999;
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:var(--radius);padding:10px 16px;
  font-size:13px;color:var(--text);
  transform:translateY(20px);opacity:0;
  transition:all .25s;pointer-events:none;
  display:flex;align-items:center;gap:8px;
}
.toast.show{transform:translateY(0);opacity:1}
.toast.green{border-color:var(--green2);color:var(--green)}
.toast.red{border-color:var(--red2);color:var(--red)}

/* ─── SCROLLBAR ────────────────────────────────────────────────────── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border2)}

/* ─── INTRO PANEL DE FASE ─────────────────────────────────────────── */
.phase-intro-toggle{
  display:flex;align-items:center;gap:10px;
  background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 16px;
  cursor:pointer;margin-bottom:8px;
  transition:border-color .2s,background .2s;
  user-select:none;
}
.phase-intro-toggle:hover{border-color:var(--border2);background:var(--bg4)}
.phase-intro-toggle .pi-icon{font-size:18px;flex-shrink:0}
.phase-intro-toggle .pi-label{flex:1;font-size:13px;font-weight:600;color:var(--text)}
.phase-intro-toggle .pi-arrow{
  font-size:11px;color:var(--text3);
  transition:transform .2s;
}
.phase-intro-toggle.open .pi-arrow{transform:rotate(180deg)}

.phase-intro-body{
  display:none;
  background:var(--bg2);border:1px solid var(--border);
  border-top:none;border-radius:0 0 var(--radius) var(--radius);
  padding:16px 20px;margin-top:-8px;margin-bottom:16px;
}
.phase-intro-body.open{display:block}

.pi-section{margin-bottom:14px}
.pi-section:last-child{margin-bottom:0}
.pi-section-title{
  font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;color:var(--text3);margin-bottom:6px;
  display:flex;align-items:center;gap:6px;
}
.pi-section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.pi-text{font-size:12px;color:var(--text2);line-height:1.75}
.pi-text strong{color:var(--text)}
.pi-text code{
  background:var(--bg4);padding:1px 5px;border-radius:3px;
  font-family:"Cascadia Code","Consolas",monospace;
  font-size:11px;color:var(--orange);
}
.pi-why{
  background:rgba(31,111,235,.07);border-left:3px solid var(--blue2);
  padding:8px 12px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  font-size:12px;color:var(--text);line-height:1.7;
}
.pi-concepts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* ─── BACKGROUND DEL EJERCICIO ────────────────────────────────────── */
.ex-background{
  background:rgba(188,140,255,.07);border:1px solid rgba(188,140,255,.18);
  border-radius:var(--radius-sm);padding:10px 14px;
  font-size:12px;color:var(--text2);line-height:1.75;
  margin-bottom:2px;
}
.ex-background strong{color:var(--purple)}

/* ─── TEORÍA APLICADA (bloque por ejercicio) ──────────────────────── */
.theory-block{
  border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;margin-top:0;
}
.theory-block-header{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;background:var(--bg3);
  cursor:pointer;user-select:none;
  font-size:12px;font-weight:600;color:var(--text);
  transition:background .15s;
}
.theory-block-header:hover{background:var(--bg4)}
.theory-block-header .th-icon{font-size:14px;flex-shrink:0}
.theory-block-header .th-label{flex:1}
.theory-block-header .th-arrow{
  font-size:10px;color:var(--text3);
  transition:transform .2s;
}
.theory-block-header.open .th-arrow{transform:rotate(180deg)}
.theory-body{
  display:none;padding:14px 16px;
  border-top:1px solid var(--border);
  background:var(--bg2);
}
.theory-body.open{display:block}

/* ── Componentes internos del bloque de teoría ── */
.th-concept{
  margin-bottom:12px;
  padding-bottom:12px;
  border-bottom:1px solid var(--border);
}
.th-concept:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}

.th-concept-name{
  font-size:11px;font-weight:700;color:var(--orange);
  text-transform:uppercase;letter-spacing:.5px;
  margin-bottom:5px;display:flex;align-items:center;gap:6px;
}
.th-concept-name code{
  font-size:12px;font-weight:700;
  background:var(--bg4);padding:1px 6px;border-radius:3px;
  color:var(--orange);font-family:"Cascadia Code","Consolas",monospace;
  text-transform:none;letter-spacing:0;
}
.th-concept-desc{
  font-size:12px;color:var(--text2);line-height:1.75;
}
.th-concept-desc strong{color:var(--text)}
.th-concept-desc code{
  background:var(--bg4);padding:1px 5px;border-radius:3px;
  font-family:"Cascadia Code","Consolas",monospace;
  font-size:11px;color:var(--blue);
}
.th-concept-desc em{color:var(--yellow);font-style:normal;font-weight:600}

/* ── Ejemplo visual de la teoría (mini snippet) ── */
.th-example{
  margin-top:6px;
  background:#0d1117;border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:8px 12px;
  font-family:"Cascadia Code","Consolas",monospace;
  font-size:11px;color:#abb2bf;
  overflow-x:auto;white-space:pre;
  line-height:1.6;
}
.th-example .cm{color:#5c6370;font-style:italic}
.th-example .kw{color:#c678dd}
.th-example .str{color:#98c379}
.th-example .nm{color:#d19a66}
.th-example .fn{color:#61afef}
.th-example .hl{color:#e5c07b;font-weight:600}   /* highlight: lo importante */
.th-example .bad{color:#f85149}   /* código "malo" */
.th-example .good{color:#3fb950}  /* código "bueno" */

/* ── Tabla comparativa dentro de teoría ── */
.th-table{
  width:100%;border-collapse:collapse;font-size:11px;margin-top:6px;
}
.th-table th{
  background:var(--bg4);color:var(--text2);
  padding:5px 10px;text-align:left;font-weight:600;
  border-bottom:1px solid var(--border);
}
.th-table td{

.sim-editor-label .lang-tag{

}
.sim-editor-wrap{
  margin:0 14px;
  border:1px solid var(--border);border-radius:var(--radius-sm);

}
.sim-card.expanded .sim-editor-wrap{margin:0 20px}
.sim-editor-wrap:focus-within{border-color:var(--blue2)}
.sim-editor-wrap.correct{border-color:var(--green)}
.sim-editor-wrap.wrong{border-color:var(--red)}

.sim-editor{

.sim-toolbar{

}
.sim-card:not(.expanded) .sim-toolbar{padding:6px 14px 8px}
.sim-btn{

  border-radius:var(--radius-sm);cursor:pointer;

}
.sim-btn-run{
  background:var(--blue3);border-color:var(--blue2);color:var(--blue);
}
.sim-btn-run:hover{background:var(--blue2);color:#fff}
.sim-btn-clear{background:var(--bg3);color:var(--text2)}
.sim-btn-clear:hover{background:var(--bg4);color:var(--text)}
.sim-btn-hint{background:rgba(210,153,34,.1);border-color:var(--yellow2);color:var(--yellow)}
.sim-btn-hint:hover{background:rgba(210,153,34,.2)}
.sim-btn-sol{background:rgba(248,81,73,.1);border-color:var(--red2);color:var(--red)}
.sim-btn-sol:hover{background:rgba(248,81,73,.2)}
.sim-shortcut{
  margin-left:auto;font-size:10px;color:var(--text3);
}
kbd{
  background:var(--bg4);border:1px solid var(--border2);
  border-radius:3px;padding:1px 5px;font-family:inherit;font-size:9px;color:var(--text2);
}

/* ── Resultado de la evaluación ────────────────────────────────── */
.sim-result{
  margin:0 18px 14px;
  border-radius:var(--radius-sm);

  font-size:13px;line-height:1.8;

}
.sim-card:not(.expanded) .sim-result{margin:0 14px 14px;font-size:12px;padding:10px 14px}
.sim-result.show{display:block}
.sim-result.ok{
  background:rgba(63,185,80,.08);
  border:1px solid rgba(63,185,80,.25);
  color:var(--green);
}
.sim-result.fail{
  background:rgba(248,81,73,.08);
  border:1px solid rgba(248,81,73,.25);
  color:var(--red);
}
.sim-result.partial{

  border:1px solid rgba(210,153,34,.25);
  color:var(--yellow);
}
.sim-result-title{font-weight:700;font-size:13px;margin-bottom:4px}
.sim-result ul{margin:4px 0 0 16px;padding:0}
.sim-result li{margin-bottom:3px;color:var(--text2)}
.sim-result li strong{color:var(--text)}
.sim-result code{
  background:var(--bg4);padding:1px 4px;border-radius:3px;

}

/* ── Hint y solución ────────────────────────────────────────────── */
.sim-hint-box{
  margin:0 18px 10px;

  border-left:3px solid var(--yellow);

  padding:10px 14px;

.sim-hint-box.show{display:block}
.sim-hint-box strong{color:var(--yellow)}
.sim-hint-box code{

}

.sim-sol-box{

}

.sim-sol-header{

/* ═══════════════════════════════════════════════════════════════
   EDITOR DDS COLUMNAR — Regla + Zonas de columnas
══════════════════════════════════════════════════════════════ */

/* Contenedor que agrupa regla horizontal + área de edición */
.dds-editor-outer{
  position:relative;
  background:#0d1117;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  overflow:hidden;
  margin:0 14px;
  font-family:"Cascadia Code","Consolas",monospace;
}
.sim-card.expanded .dds-editor-outer{margin:0 20px}
.dds-editor-outer:focus-within{border-color:var(--blue2)}
.dds-editor-outer.correct{border-color:var(--green)}
.dds-editor-outer.wrong{border-color:var(--red)}

/* ── Regla de columnas (parte superior) ──────────────────── */
.dds-col-ruler{
  display:flex;
  background:#161b22;
  border-bottom:1px solid #30363d;
  overflow:hidden;          /* se sincroniza con scrollLeft del editor */
  user-select:none;
  position:relative;
}
/* Bloque vacío alineado con el gutter de filas */
.dds-col-ruler-gutter{
  flex-shrink:0;
  width:28px;
  background:#161b22;
  border-right:1px solid #30363d;
}
/* Zona coloreada de la regla */
.dds-col-zone{
  flex-shrink:0;
  font-size:9px;
  line-height:1;
  color:#636e7b;
  border-right:1px dashed #21262d;
  padding:2px 0 2px 2px;
  box-sizing:border-box;
  white-space:nowrap;
  overflow:hidden;
  cursor:default;
  transition:background .1s;
  position:relative;
}
.dds-col-zone:hover{color:#e6edf3;background:rgba(255,255,255,.04)}

/* Tooltip de zona */
.dds-col-zone::after{
  content:attr(data-tip);
  position:absolute;
  top:calc(100% + 4px);
  left:0;
  background:#1c2128;
  border:1px solid #30363d;
  border-radius:4px;
  padding:4px 8px;
  font-size:10px;
  color:#e6edf3;
  white-space:nowrap;
  z-index:200;
  pointer-events:none;
  opacity:0;
  transition:opacity .15s;
  max-width:240px;
}
.dds-col-zone:hover::after{opacity:1}

/* Colores de zona — cada zona DDS tiene su color */
.dds-zone-seq   {background:rgba(139,148,158,.06)}  /* 1-5   Secuencia */
.dds-zone-form  {background:rgba(88,166,255,.08)}    /* 6     Tipo de forma */
.dds-zone-not   {background:rgba(255,255,255,.03)}   /* 7-16  Indicadores Not */
.dds-zone-type  {background:rgba(240,136,62,.10)}    /* 17-18 Tipo (R/K/A/S) */
.dds-zone-name  {background:rgba(188,140,255,.08)}   /* 19-28 Nombre campo/rec */
.dds-zone-ref   {background:rgba(255,255,255,.03)}   /* 29-38 Referencia */
.dds-zone-len   {background:rgba(63,185,80,.08)}     /* 39-44 Longitud */
.dds-zone-dt    {background:rgba(210,153,34,.08)}    /* 45-47 Tipo dato */
.dds-zone-dec   {background:rgba(255,255,255,.03)}   /* 48-51 Decimales */
.dds-zone-use   {background:rgba(248,81,73,.08)}     /* 52    Uso I/O/B/H/M/N/P */
.dds-zone-loc   {background:rgba(88,166,255,.06)}    /* 53-58 Fila+Col pantalla */
.dds-zone-kw    {background:rgba(255,255,255,.02)}   /* 59-80 Palabras clave */

/* ── Área de edición con gutter de filas ─────────────────── */
.dds-edit-area{
  display:flex;
  overflow:auto;
  max-height:300px;
  resize:vertical;
}
.sim-card.expanded .dds-edit-area{
  min-height:320px;
  max-height:600px;
}

/* Gutter de números de fila */
.dds-row-gutter{
  flex-shrink:0;
  width:28px;
  background:#161b22;
  border-right:1px solid #30363d;
  padding:12px 0;
  box-sizing:border-box;
  user-select:none;
  pointer-events:none;
}
.dds-row-num{
  display:block;
  font-size:9px;
  color:#484f58;
  text-align:right;
  padding-right:4px;
  line-height:1.7;  /* debe coincidir con el line-height del textarea */
  height:1.7em;
}

/* El textarea real */
.dds-textarea{
  flex:1;
  min-width:0;
  border:none;outline:none;
  background:#0d1117;
  color:#abb2bf;
  font-family:"Cascadia Code","Consolas",monospace;
  font-size:12px;
  line-height:1.7;
  padding:12px 12px 12px 4px;
  box-sizing:border-box;
  resize:none;           /* resize lo controla el contenedor */
  white-space:pre;
  overflow:visible;
  tab-size:1;
  caret-color:#58a6ff;
}
.sim-card.expanded .dds-textarea{font-size:13px;line-height:1.7;padding:12px 12px 12px 4px}
.dds-textarea::placeholder{color:#3d4451}

/* ── Barra de estado inferior (columna actual) ─────────────── */
.dds-statusbar{
  display:flex;align-items:center;gap:12px;
  background:#161b22;
  border-top:1px solid #30363d;
  padding:3px 8px 3px 36px;
  font-size:10px;color:#636e7b;
  font-family:"Cascadia Code","Consolas",monospace;
}
.dds-statusbar b{color:#e6edf3}
.dds-col-indicator{
  display:flex;align-items:center;gap:4px;
}
.dds-col-badge{
  padding:1px 6px;border-radius:3px;
  font-size:9px;font-weight:700;
  background:rgba(88,166,255,.15);
  color:#58a6ff;
}
/* El badge cambia de color según la zona activa */
.dds-col-badge.zone-seq  {background:rgba(139,148,158,.2);color:#8b949e}
.dds-col-badge.zone-form {background:rgba(88,166,255,.2);color:#58a6ff}
.dds-col-badge.zone-not  {background:rgba(255,255,255,.1);color:#8b949e}
.dds-col-badge.zone-type {background:rgba(240,136,62,.2);color:#f0883e}
.dds-col-badge.zone-name {background:rgba(188,140,255,.2);color:#bc8cff}
.dds-col-badge.zone-ref  {background:rgba(255,255,255,.08);color:#8b949e}
.dds-col-badge.zone-len  {background:rgba(63,185,80,.2);color:#3fb950}
.dds-col-badge.zone-dt   {background:rgba(210,153,34,.2);color:#d2a134}
.dds-col-badge.zone-dec  {background:rgba(255,255,255,.08);color:#8b949e}
.dds-col-badge.zone-use  {background:rgba(248,81,73,.2);color:#f85149}
.dds-col-badge.zone-loc  {background:rgba(88,166,255,.15);color:#58a6ff}
.dds-col-badge.zone-kw   {background:rgba(255,255,255,.05);color:#636e7b}

/* ── Responsive ─────────────────────────────────────────────────── */
@media(max-width:768px){
  .sim-grid{grid-template-columns:1fr;padding:12px 14px}
  .sim-hero{padding:16px 14px 14px}
  .sim-filters{padding:10px 14px}

    grid-template-columns:1fr;
  }
  .sim-body-left{border-right:none;border-bottom:1px solid var(--border)}
}
</style>

<script>
/* ════════════════════════════════════════════════════════════════
   DATA — Ejercicios del Sistema Biblioteca
═══════════════════════════════════════════════════════════════ */
const PHASES = [
  /* ═══════════════════════════════ FASE 0 — BIENVENIDA ══════════════════════════════ */
  {
    id:'f0', num:0, icon:'🌐', title:'Introducción a IBM i',
    color:'#8b949e', nivel:'Cero',
    desc:'Arquitectura del sistema, conceptos fundamentales, por qué IBM i sigue vigente',
    intro:`<p class="pi-text">
      <strong>IBM i</strong> (antes conocido como <strong>OS/400</strong> y <strong>i5/OS</strong>) es un sistema operativo de propósito especial creado por IBM para su familia de servidores <strong>IBM Power</strong>.
      A diferencia de Linux o Windows, IBM i integra en una sola plataforma el sistema operativo, la base de datos relacional (DB2 for i), el middleware y los lenguajes de programación.
    </p>
    <p class="pi-text" style="margin-top:8px">
      Su arquitectura es <strong>orientada a objetos a nivel de sistema operativo</strong>: todo en IBM i es un objeto
      (un programa, un archivo, una cola de mensajes, incluso un job). Esto le da una robustez y consistencia
      que pocos sistemas pueden igualar. Las empresas que lo usan lo hacen por su confiabilidad extrema —
      muchos sistemas bancarios, aseguradoras y retailers globales llevan décadas corriendo en IBM i sin
      interrupciones.
    </p>
    <p class="pi-text" style="margin-top:8px">
      En este tracker aprenderás desde los fundamentos del entorno hasta integración REST, CI/CD y patrones
      de arquitectura modernos. Todo sobre el contexto práctico de un <strong>sistema de gestión de biblioteca</strong>
      que construirás paso a paso.
    </p>`,
    whyMatters:`Aunque parece "tecnología antigua", IBM i procesa billones de transacciones bancarias y comerciales cada día. Saber programar en este entorno es una habilidad escasa y muy bien pagada. El 95% de las empresas Fortune 100 tienen IBM i en producción.`,
    keyTerms:['IBM Power','OS/400','DB2 for i','Library','Object','Job','ILE','CL','RPGLE','DDS'],
    exercises:[
      {
        id:'F0-E1', nivel:'E', title:'Arquitectura y conceptos clave de IBM i',
        background:'Antes de escribir una sola línea de código, necesitas entender cómo piensa IBM i. El sistema es radicalmente diferente a un servidor Linux: no hay sistema de archivos tradicional, no hay procesos como en Unix, y la base de datos está integrada al núcleo del OS.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">IBM i: un sistema de tipos, no de archivos</div>
  <div class="th-concept-desc">
    En Linux, todo es un archivo. En IBM i, <strong>todo es un objeto con tipo</strong>.
    Cada objeto tiene un tipo explícito (<code>*PGM</code>, <code>*FILE</code>, <code>*LIB</code>…)
    que determina qué operaciones son válidas sobre él. No puedes ejecutar un <code>*FILE</code>
    ni leer un <code>*PGM</code> como datos — el sistema lo impide a nivel de OS.
    <br><br>
    Esta arquitectura aporta una seguridad intrínseca: un error de programación no puede confundir
    un programa con datos. También permite que IBM i gestione los objetos con autoridades granulares
    (<code>GRTOBJAUT</code>) por tipo, usuario y operación.
  </div>
  <table class="th-table">
    <tr><th>Tipo</th><th>Analogía Linux</th><th>Descripción</th></tr>
    <tr><td><code>*LIB</code></td><td>Directorio raíz</td><td>Contenedor de objetos (namespace)</td></tr>
    <tr><td><code>*PGM</code></td><td>Binario ELF</td><td>Programa ejecutable compilado</td></tr>
    <tr><td><code>*FILE PF</code></td><td>Tabla SQL</td><td>Physical File — datos en disco</td></tr>
    <tr><td><code>*FILE LF</code></td><td>Vista SQL</td><td>Logical File — índice sobre PF</td></tr>
    <tr><td><code>*SRVPGM</code></td><td>Shared library .so</td><td>Librería de subprocedimientos ILE</td></tr>
    <tr><td><code>*DTAQ</code></td><td>Named pipe / cola MQ</td><td>Cola de mensajes entre jobs</td></tr>
    <tr><td><code>*JRN</code></td><td>WAL (Write-Ahead Log)</td><td>Bitácora transaccional</td></tr>
  </table>
</div>

<div class="th-concept">
  <div class="th-concept-name">OPM vs ILE: el salto generacional del lenguaje</div>
  <div class="th-concept-desc">
    <strong>OPM</strong> (Original Program Model) es la forma clásica: un fuente → un programa.
    RPG/400 y CL clásico operan en OPM. El ciclo RPG (el famoso ciclo implícito de lectura)
    es parte de OPM.
    <br><br>
    <strong>ILE</strong> (Integrated Language Environment) es el modelo moderno. Sus ventajas:
    <br>• Múltiples módulos en diferentes lenguajes enlazados en un solo *PGM o *SRVPGM
    <br>• Control de activation groups (ciclo de vida de recursos)
    <br>• Subprocedimientos reales con variables locales (sin riesgo de efectos laterales)
    <br>• Depuración integrada a nivel de fuente
    <br><br>
    En RPGLE moderno (<code>**FREE</code>), siempre usamos ILE:
    <code>CTL-OPT DFTACTGRP(*NO)</code> es la declaración que activa el modelo ILE.
  </div>
  <div class="th-example"><span class="cm">*── OPM: compilación directa, sin control de ciclo de vida</span>
<span class="bad">CRTRPGPGM PGM(MILIB/MIPGM) SRCFILE(MILIB/QRPGSRC)  ← RPG/400 clásico</span>

<span class="cm">*── ILE: dos pasos o CRTBNDRPG para programa único</span>
<span class="good">CRTBNDRPG PGM(BIBLIOTECA/LIBRAGR) SRCFILE(BIBLIOTECA/QRPGLESRC)</span>
<span class="cm">  ↑ equivale a: CRTRPGMOD + CRTPGM en un solo paso</span>

<span class="cm">*── En el fuente RPGLE **FREE: activar ILE explícitamente</span>
<span class="good">CTL-OPT DFTACTGRP(*NO) ACTGRP(*CALLER);</span>  <span class="cm">← ILE, hereda resources del llamador</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">Jobs: la unidad de trabajo en IBM i</div>
  <div class="th-concept-desc">
    Todo el trabajo en IBM i se ejecuta dentro de un <strong>job</strong>. Un job tiene su propia
    library list, su propia área de memoria, sus propios archivos abiertos y sus propias variables de entorno.
    <br><br>
    Los tipos de job definen el contexto de ejecución:
  </div>
  <table class="th-table">
    <tr><th>Tipo</th><th>Tiene pantalla</th><th>Caso de uso</th></tr>
    <tr><td><code>*INTER</code> — Interactivo</td><td>Sí (5250)</td><td>Pantallas PDM, SEU, ACS</td></tr>
    <tr><td><code>*BATCH</code> — Batch</td><td>No</td><td>Reportes nocturnos, procesos masivos</td></tr>
    <tr><td><code>*SERVER</code> — Servidor</td><td>No</td><td>QZDASOINIT (ODBC), servidores de host</td></tr>
    <tr><td><code>*AUTOSTART</code></td><td>No</td><td>Arrancan con el subsistema automáticamente</td></tr>
  </table>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes en principiantes IBM i</div>
  <ul>
    <li><strong>Buscar "el sistema de archivos" como en Linux:</strong> IBM i no tiene un filesystem raíz como Linux. Los objetos viven en librerías, no en directorios. El IFS (<code>/home</code>, <code>/tmp</code>...) existe pero es un sistema separado. Las librerías no son carpetas.</li>
    <li><strong>Ejecutar programas con nombres en minúsculas:</strong> En IBM i todos los nombres de objetos (librerías, programas, archivos) son automáticamente convertidos a MAYÚSCULAS. <code>CALL mipgm</code> y <code>CALL MIPGM</code> son equivalentes, pero en el sistema el objeto se llama MIPGM.</li>
    <li><strong>Confundir el ciclo RPG (OPM) con subprocedimientos ILE:</strong> En OPM el programa tiene un ciclo implícito: lee el archivo, procesa, escribe, repite. En ILE con <code>DFTACTGRP(*NO)</code> y <code>NOMAIN</code>, el ciclo no existe — el programa es una colección de procedimientos. Mezclar ambos modelos causa comportamientos inesperados.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>Para ver el tipo de job actual desde un programa RPGLE usa: <code>EXEC SQL VALUES(QSYS2.JOB_NAME()) INTO :vJobName</code>. El formato es <code>número/usuario/nombre</code>. Con <code>QSYS2.ACTIVE_JOB_INFO WHERE JOB_NAME = :vJobName</code> puedes ver el tipo de job, subsistema y estado en tiempo real.</p>
</div>`,
        obj:'Familiarizarse con los conceptos fundamentales de IBM i: objetos, librerías, jobs, library list y el modelo ILE.',
        enun:`Responde y explora los siguientes conceptos clave:
(a) ¿Qué es un "objeto" en IBM i y qué tipos de objetos existen (*PGM, *FILE, *LIB, *DTAQ)?
(b) ¿Qué es la "library list" y cómo afecta la resolución de nombres de objetos?
(c) ¿Qué diferencia hay entre OPM (Original Program Model) e ILE (Integrated Language Environment)?
(d) ¿Qué es un "job" en IBM i? ¿Qué diferencia hay entre un job interactivo y uno batch?
Usa los comandos de exploración para verificar tus respuestas en el sistema.`,
        hints:[
          'Ejecuta <code>WRKOBJ OBJ(*ALL/*ALL)</code> para ver tipos de objetos en el sistema',
          '<code>DSPLIBL</code> muestra la library list del job actual — orden importa para la resolución',
          'Un job interactivo tiene una sesión 5250 asociada; un job batch corre sin pantalla',
          'ILE permite combinar módulos de diferentes lenguajes (RPGLE, CL, C) en un solo programa',
          '<code>DSPJOB OPTION(*ACTGRP)</code> muestra los activation groups activos del job'
        ],
        conceptos:['Objeto IBM i','Library List','OPM vs ILE','Jobs','Activation Groups','5250'],
        solucion:`/* ─── F0-E1: Conceptos clave de IBM i ─── */

/* ── (a) Tipos de objetos ─────────────────────────────────────── */
/* Cada entidad en IBM i es un *OBJETO con tipo explícito:
   *LIB  — Librería (contenedor de objetos)
   *PGM  — Programa ejecutable
   *FILE — Archivo (PF, LF, DSPF, PRTF, SRCPF)
   *SRVPGM — Service Program (librería de subrutinas)
   *MODULE — Módulo compilado (no ejecutable por sí solo)
   *DTAQ — Data Queue (comunicación entre jobs)
   *DTAARA — Data Area (variable global del sistema)
   *MSGF — Message File (mensajes predefinidos)
   *JRN — Journal (bitácora de transacciones)
*/
WRKOBJ OBJ(QSYS/*ALL) OBJTYPE(*LIB)   /* Ver todas las librerías */
WRKOBJ OBJ(QGPL/*ALL) OBJTYPE(*PGM)   /* Programas en QGPL */

/* ── (b) Library List ──────────────────────────────────────────── */
/* La library list tiene 4 partes (en orden de búsqueda):
   1. *SYS  — librerías del sistema (QSYS, QSYS2, etc.)
   2. *PROD — librería de producto (*LIBL)
   3. *CUR  — librería actual (donde se crean objetos nuevos)
   4. *USR  — librerías de usuario (las que agrega el programador)
   
   Cuando haces CALL PGM(MIPGM), IBM i busca MIPGM en cada
   librería de la lista EN ORDEN. La primera coincidencia gana.
   Por eso ADDLIBLE con POSITION(*FIRST) es importante. */
DSPLIBL
ADDLIBLE LIB(BIBLIOTECA) POSITION(*FIRST)
DSPLIBL   /* Verificar que BIBLIOTECA está primera */

/* ── (c) OPM vs ILE ────────────────────────────────────────────── */
/* OPM (Original Program Model):
   - Programas clásicos RPG/400 y CL clásico
   - Un solo módulo por programa
   - Compilación directa: fuente → programa
   
   ILE (Integrated Language Environment):
   - Múltiples módulos → un programa o service program
   - Módulos de diferentes lenguajes pueden combinarse
   - Permite: RPGLE + CLLE + C en un mismo programa
   - Ciclo: CRTRPGMOD → CRTPGM (o CRTBNDRPG en un paso)
   - Permite ACTGRP, SRVPGM, BNDDIR */

/* ── (d) Jobs ──────────────────────────────────────────────────── */
/* Todo el trabajo en IBM i corre dentro de un JOB.
   Interactivo (*INTER): tiene pantalla 5250 asociada, responde a teclas
   Batch (*BATCH):       corre en background sin pantalla
   Server (*SERVER):     jobs de servidor (QZDASOINIT para ODBC, etc.)
   Autostart (*AUTOSTART): arrancan automáticamente con el subsistema */
WRKACTJOB SBS(QINTER)   /* Ver jobs interactivos activos */
WRKACTJOB SBS(QBATCH)   /* Ver jobs batch activos */
DSPJOB JOB(*) OPTION(*ACTGRP)  /* Activation groups del job actual */`
      },
      {
        id:'F0-E2', nivel:'E', title:'El IFS, QSYS y la dualidad de sistemas de archivos',
        background:'IBM i tiene DOS sistemas de archivos coexistentes: el sistema clásico basado en librerías (/QSYS.LIB/MILIB.LIB/...) y el IFS (Integrated File System) moderno, compatible con rutas Unix (/home/usuario/...). Ambos coexisten y se pueden mapear entre sí.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">Dos sistemas de archivos, una máquina</div>
  <div class="th-concept-desc">
    IBM i expone simultáneamente dos vistas del almacenamiento:
    <br>• <strong>QSYS.LIB</strong>: el sistema de librerías nativo. Los objetos viven como
      <code>/QSYS.LIB/MILIB.LIB/MIPGM.PGM</code>. Es el sistema que usamos con comandos
      como <code>CRTLIB</code>, <code>CALL</code>, <code>WRKMBRPDM</code>.
    <br>• <strong>IFS</strong> (Integrated File System): sistema de archivos de estilo Unix con rutas
      como <code>/home/usuario/</code>, <code>/tmp/</code>, <code>/www/</code>. Compatible con NFS, FTP,
      Samba y acceso desde Java/Python/Node.js corriendo en PASE.
    <br><br>
    La clave es que <em>ambos son el mismo almacenamiento físico</em> pero presentados de forma diferente.
    Puedes navegar <code>QSYS.LIB</code> desde el IFS con <code>DSPLNK OBJ('/QSYS.LIB')</code>
    — las librerías aparecen como directorios y los objetos como "archivos".
  </div>
  <div class="th-example"><span class="cm">*── Equivalencia entre notación QSYS y ruta IFS:</span>
<span class="fn">BIBLIOTECA/LIBROS</span>  <span class="cm">←→  /QSYS.LIB/BIBLIOTECA.LIB/LIBROS.FILE</span>
<span class="fn">BIBLIOTECA/LIBRAGR</span> <span class="cm">←→  /QSYS.LIB/BIBLIOTECA.LIB/LIBRAGR.PGM</span>
<span class="fn">BIBLIOTECA/QRPGLESRC(LIBRAGR)</span> <span class="cm">←→  /QSYS.LIB/BIBLIOTECA.LIB/QRPGLESRC.FILE/LIBRAGR.MBR</span>

<span class="cm">*── DSPLNK navega el IFS (incluida la vista de QSYS):</span>
<span class="fn">DSPLNK OBJ('/QSYS.LIB/BIBLIOTECA.LIB')</span>  <span class="cm">← lista objetos de la librería</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">¿Cuándo usar el IFS vs QSYS?</div>
  <div class="th-concept-desc">
    La regla práctica es sencilla:
    <br>• <strong>QSYS.LIB</strong> para todo lo que se compila, ejecuta o accede con comandos CL/RPGLE nativos.
      Código fuente, programas, archivos de datos.
    <br>• <strong>IFS</strong> para todo lo que necesita interoperabilidad con el mundo exterior.
      Archivos JSON/XML para APIs REST, logs, certificados SSL, scripts Python/Node.js en PASE,
      archivos de intercambio con sistemas externos vía SFTP/FTP.
    <br><br>
    DB2 for i puede leer y escribir en el IFS directamente desde SQL con
    <code>QSYS2.IFS_READ_UTF8</code> y <code>QSYS2.IFS_WRITE_UTF8</code> — lo que
    permite construir pipelines de datos modernos sin salir del SQL.
  </div>
  <table class="th-table">
    <tr><th>Necesidad</th><th>Sistema correcto</th><th>Herramienta</th></tr>
    <tr><td>Código fuente RPGLE/DDS/CL</td><td>QSYS.LIB (source file)</td><td>WRKMBRPDM, SEU, RDi</td></tr>
    <tr><td>Archivo JSON de respuesta API</td><td>IFS (/tmp/ o /home/)</td><td>QSYS2.IFS_WRITE_UTF8</td></tr>
    <tr><td>Certificado SSL para HTTPS</td><td>IFS (/etc/)</td><td>DCM, PASE</td></tr>
    <tr><td>Log de procesos batch</td><td>IFS (/var/log/)</td><td>CPYTOSTMF desde RPGLE</td></tr>
    <tr><td>Script bash/Python</td><td>IFS (/home/usuario/)</td><td>QSH, PASE</td></tr>
  </table>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>CPYTOSTMF</code> y <code>CPYFRMSTMF</code> — El puente entre mundos</div>
  <div class="th-concept-desc">
    <code>CPYTOSTMF</code> (Copy To Stream File) copia un miembro de source file al IFS.
    <code>CPYFRMSTMF</code> hace el camino inverso.
    <br><br>
    El parámetro <code>STMFCCSID(1208)</code> es crítico: especifica que el archivo IFS
    debe codificarse en UTF-8. Sin él, el archivo se graba en EBCDIC — el código de caracteres
    nativo de IBM i — y herramientas externas (editores, APIs) no lo pueden leer correctamente.
  </div>
  <div class="th-example"><span class="cm">*── Exportar fuente CL al IFS en UTF-8:</span>
<span class="fn">CPYTOSTMF FROMMBR('/QSYS.LIB/BIBLIOTECA.LIB/QCLSRC.FILE/PRESDIAC.MBR')</span>
<span class="fn">          TOSTMF('/home/dev/backup/PRESDIAC.clle')</span>
<span class="fn">          MBROPT(*REPLACE)</span>
<span class="hl">          STMFCCSID(1208)</span>   <span class="cm">← UTF-8: legible por cualquier editor</span>

<span class="cm">*── Leer JSON de API desde IFS con SQL:</span>
<span class="fn">SELECT LINE FROM TABLE(QSYS2.IFS_READ_UTF8('/tmp/respuesta.json'))</span>
<span class="fn">FETCH FIRST 10 ROWS ONLY;</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>Copiar fuente sin STMFCCSID(1208):</strong> <code>CPYTOSTMF</code> sin especificar <code>STMFCCSID(1208)</code> usa el CCSID del job (típicamente EBCDIC 37 o 284). El archivo en el IFS se guarda en EBCDIC y un editor de PC lo verá como caracteres extraños. Siempre especifica UTF-8 (CCSID 1208) para portabilidad.</li>
    <li><strong>Modificar el miembro en IFS y esperar que cambie en QSYS:</strong> <code>CPYTOSTMF</code> hace una copia — no es un enlace simbólico. Si editas el archivo en el IFS, los cambios NO se reflejan en el miembro QSYS original. Debes copiar de vuelta con <code>CPYFRMSTMF</code>.</li>
    <li><strong>Rutas IFS con barras inversas en Windows:</strong> Las rutas del IFS de IBM i siempre usan barra normal (<code>/</code>), no barra inversa (<code>\</code>). Al especificar rutas desde un cliente Windows, asegúrate de usar la barra correcta.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>Para navegar el IFS desde la línea de comandos IBM i usa <code>STRQSH</code> (QShell) — es un shell POSIX que te permite <code>ls</code>, <code>cd</code>, <code>cat</code>, y <code>cp</code> sobre el IFS. También puedes montar el IFS como unidad de red desde Windows con NetServer (<code>STRTCPSVR SERVER(*NETSVR)</code>) y arrastrarlo en el Explorador.</p>
</div>`,
        obj:'Entender la dualidad del sistema de archivos de IBM i: QSYS (librerías) vs IFS (rutas Unix).',
        enun:`Explora ambos sistemas de archivos:
(a) Navega /QSYS.LIB usando DSPLNK para ver cómo se mapean las librerías como directorios
(b) Crea un directorio en el IFS: /home/estudiante/practica
(c) Copia un miembro fuente de QGPL al IFS con CPYTOSTMF
(d) Lee el archivo desde el IFS con DSPLNK y luego desde SQL con QSYS2.IFS_READ_UTF8`,
        hints:[
          '<code>DSPLNK OBJ(\'/QSYS.LIB\')</code> muestra las librerías como directorios',
          '<code>DSPLNK OBJ(\'/QSYS.LIB/QGPL.LIB\')</code> muestra los objetos de QGPL',
          'Crea directorio: <code>CRTDIR DIR(\'/home/estudiante/practica\')</code>',
          '<code>CPYTOSTMF FROMMBR(\'/QSYS.LIB/QGPL.LIB/QCLSRC.FILE/QCLSRC.MBR\') TOSTMF(\'/home/estudiante/practica/test.cl\')</code>',
          'Desde SQL: <code>SELECT LINE FROM TABLE(QSYS2.IFS_READ_UTF8(\'/home/estudiante/practica/test.cl\'))</code>'
        ],
        conceptos:['IFS','QSYS.LIB','DSPLNK','CPYTOSTMF','IFS_READ_UTF8','Dualidad de FS'],
        solucion:`/* ─── F0-E2: IFS y sistema de librerías ─── */

/* (a) Ver cómo QSYS.LIB mapea las librerías */
DSPLNK OBJ('/QSYS.LIB')          /* Lista de librerías como dirs */
DSPLNK OBJ('/QSYS.LIB/QGPL.LIB')/* Objetos de QGPL */
/* Equivalencia:
   /QSYS.LIB/MILIB.LIB/MIPGM.PGM  ↔  CALL PGM(MILIB/MIPGM)
   /QSYS.LIB/MILIB.LIB/DATOS.FILE/REG.MBR ↔ BIBLIOTECA/DATOS(REG) */

/* (b) Crear directorio en IFS */
CRTDIR DIR('/home/estudiante')
CRTDIR DIR('/home/estudiante/practica')

/* (c) Copiar fuente al IFS */
CPYTOSTMF FROMMBR('/QSYS.LIB/QGPL.LIB/QCLSRC.FILE/QCLSRC.MBR') +
          TOSTMF('/home/estudiante/practica/test.cl') +
          MBROPT(*REPLACE) STMFCCSID(1208)  /* UTF-8 */

/* (d) Leer desde IFS con SQL */
SELECT LINENUMBER, LINE
FROM TABLE(QSYS2.IFS_READ_UTF8(
  PATH_NAME => '/home/estudiante/practica/test.cl'
))
FETCH FIRST 20 ROWS ONLY;

/* Ver IFS desde PASE/QSH: */
/* QSH CMD('ls -la /home/estudiante/practica') */
/* QSH CMD('cat /home/estudiante/practica/test.cl') */`
      }
    ]
  },
  /* ═══════════════════════════════ FASE 1 ══════════════════════════════════════════ */
  {
    id:'f1', num:1, icon:'🖥️', title:'Entorno IBM i',
    color:'#58a6ff', nivel:'Junior',
    desc:'PDM, SEU, RDi, comandos CL, library list, objetos IBM i',
    intro:`<p class="pi-text">
      El <strong>entorno de desarrollo IBM i</strong> gira en torno a tres herramientas principales:
      <strong>PDM</strong> (Program Development Manager), <strong>SEU</strong> (Source Entry Utility) y
      <strong>RDi</strong> (Rational Developer for i). PDM y SEU son las herramientas nativas de pantalla
      verde (5250), mientras que RDi es el IDE moderno basado en Eclipse.
    </p>
    <p class="pi-text" style="margin-top:8px">
      Todos los objetos en IBM i viven dentro de <strong>librerías</strong>. Una librería es como un
      namespace o un schema de base de datos: agrupa programas, archivos, módulos y otros objetos.
      La <strong>library list</strong> es la ruta de búsqueda del sistema — similar al PATH de Unix.
      Cuando ejecutas <code>CALL MIPGM</code>, IBM i busca MIPGM en cada librería de la lista, en orden.
    </p>
    <p class="pi-text" style="margin-top:8px">
      Los <strong>source files</strong> (<code>QDDSSRC</code>, <code>QRPGLESRC</code>, <code>QCLSRC</code>)
      son archivos de base de datos especiales que contienen los miembros fuente del código. Cada miembro
      es como un archivo de texto con el código de un objeto.
    </p>`,
    whyMatters:`Entender la estructura de librerías y library list es fundamental: es la razón por la que los programas funcionan en un ambiente y no en otro. Casi todos los bugs de "ambiente" en IBM i se deben a la library list mal configurada.`,
    keyTerms:['CRTLIB','CRTSRCPF','ADDLIBLE','DSPLIBL','WRKMBRPDM','SEU','PDM','Source File','Miembro'],
    exercises:[
      {
        id:'F1-E1', nivel:'E', title:'Crear librería y source files del proyecto',
        background:'En IBM i, antes de escribir una sola línea de código, necesitas crear la infraestructura que lo contendrá: una librería y los source files. Piensa en la librería como el proyecto en sí, y los source files como las carpetas donde irán los distintos tipos de código (DDS, RPGLE, CL, SQL).',
        theory:`
<div class="th-concept">
  <div class="th-concept-name"><code>CRTLIB</code> — La librería como contenedor de proyecto</div>
  <div class="th-concept-desc">
    En IBM i no existen carpetas del sistema de archivos para organizar el código como en Linux o Windows.
    En su lugar, todo vive dentro de <strong>librerías (*LIB)</strong>. Cada librería es un objeto del sistema
    que agrupa programas, archivos, módulos y cualquier otro tipo de objeto.
    <br><br>
    <code>TYPE(*PROD)</code> indica que es una librería de producción (vs <code>*TEST</code> para pruebas).
    Esta distinción permite, por ejemplo, aplicar políticas de seguridad diferentes según el tipo.
    <br><br>
    <strong>Analogía:</strong> Si IBM i fuera un servidor Linux, una librería sería equivalente a
    un directorio raíz de proyecto, pero con capacidades adicionales como seguridad por objeto,
    journaling propio, y búsqueda a través de la library list.
  </div>
  <div class="th-example"><span class="cm">*── Sin librería propia: todo va a QGPL (librería general del sistema)</span>
<span class="bad">CRTPF FILE(QGPL/LIBROS)</span>   <span class="cm">← mezclado con objetos del sistema</span>

<span class="cm">*── Con librería propia: organización y seguridad granular</span>
<span class="good">CRTLIB LIB(BIBLIOTECA) TYPE(*PROD) TEXT('Sistema Gestión Biblioteca')</span>
<span class="good">CRTPF  FILE(BIBLIOTECA/LIBROS)</span>  <span class="cm">← aislado, fácil de mover/salvar/asegurar</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>CRTSRCPF</code> — Source Files: los "repositorios" del código fuente</div>
  <div class="th-concept-desc">
    En IBM i el código fuente no vive en archivos de texto del IFS como en otros sistemas.
    Vive dentro de <strong>Physical Files de tipo SRCPF</strong>, donde cada <em>miembro</em> es como
    un archivo de texto con el código fuente de un objeto.
    <br><br>
    <code>RCDLEN(112)</code> define la longitud de cada registro del source file. El estándar es 112:
    6 bytes de número de línea + 94 bytes de código + 12 bytes de fecha de modificación.
    Usar 80 (el antiguo estándar) trunca código moderno con líneas largas.
  </div>
  <table class="th-table">
    <tr><th>Source File</th><th>Contenido</th><th>Tipos de miembro</th></tr>
    <tr><td><code>QDDSSRC</code></td><td>Definiciones DDS</td><td>PF, LF, DSPF, PRTF</td></tr>
    <tr><td><code>QRPGLESRC</code></td><td>Código RPGLE</td><td>RPGLE, SQLRPGLE</td></tr>
    <tr><td><code>QCLSRC</code></td><td>Programas CL</td><td>CLLE, CLP</td></tr>
    <tr><td><code>QCPYSRC</code></td><td>Copy books (include)</td><td>RPGLEINC</td></tr>
    <tr><td><code>QSQLSRC</code></td><td>Scripts SQL</td><td>SQLRPGLE, TXT</td></tr>
  </table>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>ADDLIBLE POSITION(*FIRST)</code> — Por qué el orden importa</div>
  <div class="th-concept-desc">
    Cuando ejecutas un comando como <code>CALL MIPGM</code>, IBM i busca el programa
    en <em>cada librería de la library list, en orden</em>. Si BIBLIOTECA no está primera,
    podría encontrar una versión diferente del programa en otra librería.
    <br><br>
    <code>POSITION(*FIRST)</code> coloca BIBLIOTECA al inicio de la lista de usuario,
    garantizando que siempre se usen los objetos del proyecto actual sobre cualquier librería
    que pudiera tener objetos con el mismo nombre.
  </div>
  <div class="th-example"><span class="cm">*── DSPLIBL muestra la library list en orden de búsqueda:</span>
<span class="cm">   *SYS   → QSYS, QSYS2, QHLPSYS, QUSRSYS   (sistema, inamovibles)</span>
<span class="cm">   *PROD  → QGPL, QTEMP                        (librerías del producto)</span>
<span class="hl">   *USR   → BIBLIOTECA                          (←  tu librería, primera)</span>
<span class="cm">            QGPL                               (segunda)</span>
<span class="cm">*── Si llamas CALL LIBRAGR, IBM i busca en orden y ejecuta el 1ro que encuentre</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>RCDLEN(80) en lugar de 112:</strong> El antiguo estándar RPG/400 era 80 chars. Con RPGLE moderno, las líneas de código pueden superar los 80 caracteres y se truncarán silenciosamente al compilar si el SRCPF tiene RCDLEN(80).</li>
    <li><strong>Crear objetos directamente en QGPL:</strong> QGPL es una librería del sistema compartida por todos los usuarios. Crear objetos de proyecto ahí mezcla tu código con otros objetos del sistema y complica la seguridad.</li>
    <li><strong>Olvidar ADDLIBLE antes de compilar:</strong> Si BIBLIOTECA no está en la library list, los comandos de compilación no encontrarán los source files y fallarán con <code>CPF2110 - Library not in library list</code>.</li>
    <li><strong>Crear la librería como *TEST en producción:</strong> El TYPE(*PROD vs *TEST) afecta las políticas de seguridad y respaldo automático. Usar *TEST en producción puede excluir la librería de los backups programados.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>Después de crear los source files, usa <code>WRKMBRPDM FILE(BIBLIOTECA/QRPGLESRC)</code> para verificar que aparecen en PDM. También puedes crear la librería y los source files con un script CL (<code>QCLSRC/CRENV</code>) que se convierte en el "script de creación del entorno" reutilizable en cualquier servidor.</p>
</div>`,
        obj:'Familiarizarse con los comandos básicos de creación de objetos en IBM i.',
        enun:'Crea la librería BIBLIOTECA, luego crea dentro de ella los source files necesarios: QDDSSRC, QRPGLESRC, QCLSRC, QCPYSRC y QSQLSRC. Agrega la librería a tu library list y verifica que aparece.',
        hints:[
          'Usa <code>CRTLIB LIB(BIBLIOTECA) TYPE(*PROD)</code> para crear la librería',
          'Usa <code>CRTSRCPF FILE(BIBLIOTECA/QDDSSRC) RCDLEN(112)</code> para cada source file',
          'Usa <code>ADDLIBLE LIB(BIBLIOTECA) POSITION(*FIRST)</code>',
          'Verifica con <code>DSPLIBL</code> que aparece en la lista'
        ],
        conceptos:['CRTLIB','CRTSRCPF','ADDLIBLE','DSPLIBL'],
        solucion:`/* ─── F1-E1: Crear librería y source files ─── */

/* 1. Crear librería */
CRTLIB LIB(BIBLIOTECA) TYPE(*PROD) TEXT('Sistema Gestión Biblioteca')

/* 2. Crear source files */
CRTSRCPF FILE(BIBLIOTECA/QDDSSRC)   RCDLEN(112) TEXT('Fuentes DDS')
CRTSRCPF FILE(BIBLIOTECA/QRPGLESRC) RCDLEN(112) TEXT('Fuentes RPGLE')
CRTSRCPF FILE(BIBLIOTECA/QCLSRC)    RCDLEN(112) TEXT('Fuentes CL')
CRTSRCPF FILE(BIBLIOTECA/QCPYSRC)   RCDLEN(112) TEXT('Copy books')
CRTSRCPF FILE(BIBLIOTECA/QSQLSRC)   RCDLEN(112) TEXT('Scripts SQL')

/* 3. Agregar a library list y verificar */
ADDLIBLE LIB(BIBLIOTECA) POSITION(*FIRST)
DSPLIBL`
      },
      {
        id:'F1-E2', nivel:'F', title:'Explorar objetos con PDM y CL',
        background:'PDM (Program Development Manager) es la interfaz principal de desarrollo en pantalla verde. Desde WRKMBRPDM puedes ver todos los miembros fuente de un source file y lanzar acciones (compilar, editar, ver) con opciones de una letra. Conocer los comandos de inspección te permite entender y documentar cualquier librería de producción.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">PDM: opciones de una letra que controlan el flujo de trabajo</div>
  <div class="th-concept-desc">
    Desde la pantalla de WRKMBRPDM, escribes una letra en la columna <strong>Opt</strong> frente al miembro
    y presionas Enter. Las opciones más usadas son:
  </div>
  <table class="th-table">
    <tr><th>Opción</th><th>Acción</th><th>Cuándo usarla</th></tr>
    <tr><td><code>2</code></td><td><strong>Editar</strong> (SEU)</td><td>Modificar código fuente</td></tr>
    <tr><td><code>3</code></td><td><strong>Copiar</strong> miembro</td><td>Duplicar fuente</td></tr>
    <tr><td><code>4</code></td><td><strong>Borrar</strong> miembro</td><td>Eliminar fuente</td></tr>
    <tr><td><code>5</code></td><td><strong>Mostrar</strong> (solo lectura)</td><td>Revisar sin modificar</td></tr>
    <tr><td><code>14</code></td><td><strong>Compilar</strong> (CRTPF/CRTPGM)</td><td>Compilar el objeto</td></tr>
    <tr><td><code>15</code></td><td><strong>Copiar archivo</strong> a otro</td><td>Exportar fuente</td></tr>
  </table>
  <div class="th-example"><span class="cm">*── WRKMBRPDM FILE(BIBLIOTECA/QRPGLESRC) muestra algo como:</span>
<span class="cm">  Opt  Miembro   Tipo      Modificado  Texto</span>
<span class="hl">   _   LIBRAGR   RPGLE     24/12/14    Agregar libro</span>
<span class="hl">   _   LIBLST    RPGLE     24/12/15    Listado de libros</span>
<span class="cm">  ── Escribe 14 frente a LIBRAGR + Enter → compila CRTBNDRPG</span>
<span class="cm">  ── Escribe 2  frente a LIBRAGR + Enter → abre en SEU para editar</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">Comandos de inspección: <code>DSPLIB</code>, <code>DSPFD</code>, <code>WRKOBJ</code></div>
  <div class="th-concept-desc">
    Estos comandos permiten auditar el contenido de una librería sin necesidad de editarla.
    Son la primera herramienta cuando llegas a un sistema desconocido en producción.
    <br><br>
    La diferencia clave entre <code>DSPLIB</code> y <code>WRKOBJ</code>: DSPLIB muestra una lista
    estática de texto, mientras que WRKOBJ abre una pantalla interactiva desde la que puedes
    lanzar acciones sobre cada objeto (editar, borrar, mover, etc.).
  </div>
  <div class="th-example"><span class="cm">*── DSPLIB: vista rápida de todos los objetos</span>
<span class="fn">DSPLIB LIB(BIBLIOTECA)</span>
<span class="cm">   → Lista: LIBROS *FILE PF, SOCIOS *FILE PF, LIBRAGR *PGM ...</span>

<span class="cm">*── WRKOBJ: pantalla interactiva con acciones</span>
<span class="fn">WRKOBJ OBJ(BIBLIOTECA/*ALL) OBJTYPE(*PGM)</span>
<span class="cm">   → Opt: 4=Borrar, 8=Mostrar descripción, 12=Trabajar con autorizaciones...</span>

<span class="cm">*── DSPFD: atributos técnicos del archivo</span>
<span class="fn">DSPFD FILE(BIBLIOTECA/LIBROS) TYPE(*ATR)</span>
<span class="cm">   → RCDLEN, MAXMBRS, ccsid, fecha de creación, usuario creador...</span>

<span class="cm">*── Equivalente moderno (SQL): catálogo del sistema</span>
<span class="fn">SELECT TABLE_NAME, TABLE_TYPE, LAST_ALTERED</span>
<span class="fn">FROM   QSYS2.SYSTABLES WHERE TABLE_SCHEMA = 'BIBLIOTECA'</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>Opción 4 (borrar) en lugar de 5 (ver):</strong> En pantalla verde es fácil confundirse. La opción 4 borra el miembro sin confirmación adicional en algunas versiones de PDM. Acostúmbrate a leer dos veces antes de presionar Enter.</li>
    <li><strong>DSPLIB vs DSPFD confundidos:</strong> <code>DSPLIB</code> muestra los objetos dentro de una librería. <code>DSPFD</code> muestra los atributos técnicos de un objeto FILE específico (campos, RCDLEN, etc.). Son herramientas distintas para preguntas distintas.</li>
    <li><strong>WRKOBJ con OBJTYPE(*ALL):</strong> En librerías grandes en producción, <code>WRKOBJ OBJ(QGPL/*ALL) OBJTYPE(*ALL)</code> puede devolver miles de objetos y saturar la pantalla. Siempre filtra por tipo.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>Para auditar un sistema de producción desconocido, el flujo es: <code>DSPLIB</code> para ver qué hay → <code>DSPFD</code> en archivos sospechosos para ver su estructura → <code>WRKOBJ ... OBJTYPE(*PGM)</code> para ver los programas. El catálogo SQL (<code>QSYS2.SYSTABLES</code>, <code>QSYS2.SYSCOLUMNS</code>) es más potente que los comandos CL para búsquedas complejas en sistemas modernos V7R3+.</p>
</div>`,
        obj:'Navegar la librería con PDM y usar comandos CL para inspeccionar objetos.',
        enun:'Usa WRKMBRPDM para ver los miembros del source file QDDSSRC. Luego: (a) muestra los objetos de la librería BIBLIOTECA, (b) muestra los atributos del source file QRPGLESRC, (c) lista solo los *FILE de la librería.',
        hints:[
          '<code>WRKMBRPDM FILE(BIBLIOTECA/QDDSSRC)</code> para ver miembros',
          '<code>DSPLIB LIB(BIBLIOTECA)</code> muestra todos los objetos',
          '<code>DSPFD FILE(BIBLIOTECA/QRPGLESRC) TYPE(*ATR)</code> para atributos',
          '<code>WRKOBJ OBJ(BIBLIOTECA/*ALL) OBJTYPE(*FILE)</code> filtra por tipo'
        ],
        conceptos:['WRKMBRPDM','DSPLIB','DSPFD','WRKOBJ'],
        solucion:`/* a) Ver miembros del source file */
WRKMBRPDM FILE(BIBLIOTECA/QDDSSRC)

/* b) Mostrar objetos de la librería */
DSPLIB LIB(BIBLIOTECA)

/* c) Atributos de un source file */
DSPFD FILE(BIBLIOTECA/QRPGLESRC) TYPE(*ATR)

/* d) Listar solo *FILE de la librería */
WRKOBJ OBJ(BIBLIOTECA/*ALL) OBJTYPE(*FILE)

/* e) Contar objetos por SQL */
SELECT COUNT(*) AS TOTAL
FROM   QSYS2.SYSTABLES
WHERE  TABLE_SCHEMA = 'BIBLIOTECA';`
      }
    ]
  },
