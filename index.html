  {
    id:'f4', num:4, icon:'🗄️', title:'SQLRPGLE + DB2 for i',
    color:'#f0883e', nivel:'Mid',
    desc:'SQL embebido, cursores, DDL, Stored Procedures, SQLSTATE',
    intro:`<p class="pi-text">
      <strong>SQLRPGLE</strong> combina el poder de RPGLE con SQL embebido mediante la directiva
      <code>EXEC SQL</code>. DB2 for i es la base de datos integrada en IBM i — no es un producto
      separado, sino parte del sistema operativo. Esto le da ventajas únicas: acceso de baja latencia
      y soporte nativo para funciones avanzadas como funciones de ventana y JSON.
    </p>
    <p class="pi-text" style="margin-top:8px">
      El código de estado <strong>SQLSTATE</strong> es clave: después de cada <code>EXEC SQL</code>
      debes verificar <code>SQLSTATE = '00000'</code> (éxito) o <code>'02000'</code> (not found).
      Los <strong>cursores</strong> permiten iterar por múltiples registros resultado de un SELECT.
      Los <strong>Stored Procedures</strong> encapsulan lógica de negocio directamente en DB2, con
      manejo de transacciones y <code>DECLARE HANDLER</code> para excepciones.
    </p>
    <p class="pi-text" style="margin-top:8px">
      DB2 for i en V7R4+ soporta características SQL modernas: <code>JSON_OBJECT</code>, funciones de
      ventana (<code>ROW_NUMBER</code>, <code>LAG</code>), <code>FOR SYSTEM_TIME AS OF</code> (time travel)
      y más de 200 servicios de catálogo en <code>QSYS2.*</code>.
    </p>`,
    whyMatters:`DB2 for i es una de las bases de datos más robustas del planeta. Entender SQL embebido en RPGLE es la forma moderna de acceder a datos: más flexible que las operaciones nativas y con soporte para transacciones completas. Los SPs en DB2 permiten mover lógica al motor de BD para máxima performance.`,
    keyTerms:['EXEC SQL','SQLSTATE','INTO','CURSOR','FETCH','DECLARE HANDLER','COMMIT','ROLLBACK','PRIMARY KEY','FOREIGN KEY','CHECK','CREATE TABLE'],
    exercises:[
      {
        id:'F4-E1', nivel:'E', title:'Crear tablas SQL con constraints', simId:'SIM-04',
        background:'En IBM i puedes crear tablas tanto con DDS (CRTPF) como con SQL DDL (CREATE TABLE). La ventaja de SQL es que permite expresar integridad referencial directamente: FOREIGN KEY garantiza que no haya libros con un autor inexistente, y CHECK restringe los valores válidos. DB2 for i aplica estas constraints en tiempo de escritura.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name"><code>PRIMARY KEY</code> — ¿Por qué es necesaria?</div>
  <div class="th-concept-desc">
    La clave primaria cumple tres funciones simultáneas en DB2 for i:
    <br>1. <strong>Unicidad:</strong> rechaza duplicados (equivalente a <code>UNIQUE</code> en DDS).
    <br>2. <strong>Índice automático:</strong> DB2 crea un índice físico sobre la PK para acceso rápido por clave.
    <br>3. <strong>Referencia para FK:</strong> es el campo que otras tablas usan en sus FOREIGN KEY.
    <br><br>
    Sin PRIMARY KEY, podrías tener dos libros con el mismo <code>LIBCOD</code>, lo que hace imposible
    la búsqueda determinista y rompe las referencias desde PRESTAMOS.
  </div>
  <div class="th-example"><span class="cm">-- Sin PK: estos dos INSERT pasarían sin error</span>
<span class="bad">INSERT INTO LIBROS (LIBCOD, LIBTTL) VALUES ('LIB001', 'Quijote');</span>
<span class="bad">INSERT INTO LIBROS (LIBCOD, LIBTTL) VALUES ('LIB001', 'Odisea');</span>
<span class="cm">-- ¿Cuál devuelve SELECT WHERE LIBCOD='LIB001'? Ambas → indeterminado</span>

<span class="cm">-- Con PRIMARY KEY (LIBCOD): el segundo INSERT falla</span>
<span class="good">-- Error: Duplicate key value specified. SQLSTATE=23505</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>FOREIGN KEY ... REFERENCES ... ON DELETE RESTRICT</code></div>
  <div class="th-concept-desc">
    Una FOREIGN KEY crea una restricción de integridad referencial: el valor del campo en la tabla
    hijo <em>debe existir</em> en la tabla padre. DB2 verifica esto en cada INSERT/UPDATE.
    <br><br>
    <code>ON DELETE RESTRICT</code> (o <code>NO ACTION</code>) protege la consistencia: si intentas
    borrar un AUTOR que tiene libros, DB2 lo rechaza. Alternativas:
    <br>• <code>ON DELETE CASCADE</code>: borra también los libros del autor (peligroso en producción).
    <br>• <code>ON DELETE SET NULL</code>: pone NULL en el campo LIBAUTO de los libros huérfanos.
  </div>
  <div class="th-example"><span class="cm">-- LIBROS referencia a AUTORES</span>
<span class="kw">FOREIGN KEY</span> (LIBAUTO) <span class="kw">REFERENCES</span> BIBLIOTECA/AUTORES (AUTCOD)
  <span class="hl">ON DELETE RESTRICT</span>  <span class="cm">← no borra el autor si tiene libros</span>
  <span class="kw">ON UPDATE CASCADE</span>   <span class="cm">← si cambia AUTCOD, actualiza LIBAUTO</span>

<span class="cm">-- Intento: borrar autor AUT0001 que tiene libros</span>
<span class="bad">DELETE FROM BIBLIOTECA/AUTORES WHERE AUTCOD = 'AUT0001';</span>
<span class="cm">-- Error: SQLSTATE=23001 — referential constraint violation</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>CHECK</code> — Validación a nivel de tabla</div>
  <div class="th-concept-desc">
    <code>CHECK</code> define una condición booleana que <em>debe ser verdadera</em> para que
    DB2 acepte el registro. Es el equivalente SQL de <code>VALUES()</code> y <code>RANGE()</code>
    en DDS, pero más expresivo: acepta cualquier expresión SQL.
    <br><br>
    DB2 evalúa el CHECK en cada INSERT y UPDATE. Si la condición es falsa, rechaza la operación.
    También puede usar subqueries, pero en la práctica se limita a validaciones de campo simple.
  </div>
  <table class="th-table">
    <tr><th>DDS</th><th>SQL CHECK equivalente</th></tr>
    <tr><td><code>VALUES('S' 'N')</code></td><td><code>CHECK (SOCACT IN ('S', 'N'))</code></td></tr>
    <tr><td><code>RANGE(1800 2099)</code></td><td><code>CHECK (LIBANIO BETWEEN 1800 AND 2099)</code></td></tr>
    <tr><td><code>RANGE(0 99)</code></td><td><code>CHECK (LIBDIS >= 0)</code></td></tr>
    <tr><td>(no equivalente directo)</td><td><code>CHECK (PRESDVL >= PRESFEC)</code> — lógica cruzada</td></tr>
  </table>
</div>

<div class="th-concept">
  <div class="th-concept-name">Orden de creación con FOREIGN KEYS</div>
  <div class="th-concept-desc">
    Cuando las tablas tienen referencias entre sí, el orden de creación importa:
    la tabla <em>referenciada</em> (padre) debe existir antes de crear la tabla que la referencia (hijo).
    Si lo haces al revés, DB2 falla con "Referenced object does not exist".
  </div>
  <div class="th-example"><span class="cm">-- Orden correcto para nuestro sistema:</span>
<span class="good">1. AUTORES</span>    <span class="cm">← sin dependencias</span>
<span class="good">2. LIBROS</span>     <span class="cm">← depende de AUTORES (FK LIBAUTO)</span>
<span class="good">3. SOCIOS</span>     <span class="cm">← sin dependencias</span>
<span class="good">4. PRESTAMOS</span>  <span class="cm">← depende de LIBROS y SOCIOS (2 FKs)</span>

<span class="cm">-- Si intentas crear LIBROS antes que AUTORES:</span>
<span class="bad">-- Error: SQLSTATE=42704 — AUTORES not found</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>ON DELETE sin especificar:</strong> Si omites la cláusula <code>ON DELETE</code>, la FK usa <code>RESTRICT</code> por defecto — cualquier intento de borrar un AUTOR con libros asociados falla. Define explícitamente <code>ON DELETE NO ACTION</code> o <code>SET NULL</code> según la lógica de negocio.</li>
    <li><strong>CHECK con comillas simples incorrectas:</strong> La sintaxis SQL requiere comillas simples literales: <code>CHECK (SOCACT IN ('S', 'N'))</code>. En algunos editores de IBM i las comillas tipográficas (&#x2018; &#x2019;) parecen iguales pero causan error de sintaxis.</li>
    <li><strong>Intentar DROP TABLE con FK dependientes:</strong> Si PRESTAMOS tiene FK a LIBROS y haces <code>DROP TABLE LIBROS</code>, obtienes <code>SQL0478 — Object in use</code>. Debes borrar las tablas dependientes primero o usar <code>DROP TABLE LIBROS RESTRICT</code> para que falle de forma explícita.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>Para ver las foreign keys definidas en el sistema usa: <code>SELECT * FROM QSYS2.SYSREFCST WHERE TABLE_SCHEMA = 'BIBLIOTECA'</code>. Muestra el nombre de la FK, la tabla origen, la tabla destino y la regla ON DELETE/UPDATE. Más rápido que buscar en el DDL fuente.</p>
</div>`,
        obj:'Escribir DDL equivalente a los PFs DDS con integridad referencial completa.',
        enun:'Crea las 4 tablas usando CREATE TABLE con: primary keys, foreign keys (LIBROS→AUTORES, PRESTAMOS→LIBROS/SOCIOS), CHECK constraints para SOCACT y PRESEST, y DEFAULT CURRENT_DATE para fechas.',
        hints:[
          'PRIMARY KEY se define al final: <code>PRIMARY KEY (campo)</code>',
          '<code>FOREIGN KEY (campo) REFERENCES lib/tabla (campo) ON DELETE RESTRICT</code>',
          '<code>CHECK (SOCACT IN (\'S\', \'N\'))</code> para valores permitidos',
          '<code>DEFAULT CURRENT_DATE</code> para fechas automáticas'
        ],
        conceptos:['PRIMARY KEY','FOREIGN KEY','CHECK constraint','DEFAULT','DDL'],
        solucion:`-- Crear tabla AUTORES (sin dependencias, va primero)
CREATE TABLE BIBLIOTECA/AUTORES (
  AUTCOD  CHAR(7)       NOT NULL,
  AUTNOM  VARCHAR(40)   NOT NULL,
  AUTPAI  VARCHAR(30)   DEFAULT '',
  AUTGEN  VARCHAR(30)   DEFAULT '',
  PRIMARY KEY (AUTCOD)
);

-- Crear tabla LIBROS (depende de AUTORES)
CREATE TABLE BIBLIOTECA/LIBROS (
  LIBCOD   CHAR(7)        NOT NULL,
  LIBTTL   VARCHAR(60)    NOT NULL,
  LIBAUTO  CHAR(7)        NOT NULL,
  LIBEDI   VARCHAR(20)    DEFAULT '',
  LIBANIO  SMALLINT       DEFAULT 2000,
  LIBDIS   SMALLINT       DEFAULT 0,
  PRIMARY KEY (LIBCOD),
  FOREIGN KEY (LIBAUTO) REFERENCES BIBLIOTECA/AUTORES (AUTCOD)
    ON DELETE RESTRICT ON UPDATE CASCADE,
  CHECK (LIBANIO BETWEEN 1800 AND 2099),
  CHECK (LIBDIS >= 0)
);

-- Crear tabla SOCIOS
CREATE TABLE BIBLIOTECA/SOCIOS (
  SOCCOD  CHAR(7)        NOT NULL,
  SOCNOM  VARCHAR(40)    NOT NULL,
  SOCEML  VARCHAR(60)    DEFAULT '',
  SOCFEC  DATE           DEFAULT CURRENT_DATE,
  SOCACT  CHAR(1)        DEFAULT 'S',
  PRIMARY KEY (SOCCOD),
  CHECK (SOCACT IN ('S', 'N'))
);

-- Crear tabla PRESTAMOS (depende de LIBROS y SOCIOS)
CREATE TABLE BIBLIOTECA/PRESTAMOS (
  PRESCOD  CHAR(9)        NOT NULL,
  PRESLIB  CHAR(7)        NOT NULL,
  PRESSOC  CHAR(7)        NOT NULL,
  PRESFEC  DATE           DEFAULT CURRENT_DATE,
  PRESDVL  DATE,
  PRESEST  CHAR(1)        DEFAULT 'P',
  PRIMARY KEY (PRESCOD),
  FOREIGN KEY (PRESLIB) REFERENCES BIBLIOTECA/LIBROS (LIBCOD)
    ON DELETE RESTRICT,
  FOREIGN KEY (PRESSOC) REFERENCES BIBLIOTECA/SOCIOS (SOCCOD)
    ON DELETE RESTRICT,
  CHECK (PRESEST IN ('P', 'D', 'V'))
);`
      },
      {
        id:'F4-E2', nivel:'M', title:'Consultas con JOINs, agregados y funciones de ventana', simId:'SIM-05',
        theory:`
<div class="th-concept">
  <div class="th-concept-name"><code>JOIN</code> — Combinar tablas por campo relacionado</div>
  <div class="th-concept-desc">
    <code>JOIN</code> (o <code>INNER JOIN</code>) combina filas de dos tablas cuando se cumple la condición <code>ON</code>.
    Solo incluye las filas que tienen match en ambas tablas.
    <code>LEFT JOIN</code> incluye todas las filas de la tabla izquierda, aunque no haya match en la derecha (los campos quedan NULL).
    <br><br>
    <strong>¿Cuándo usar LEFT JOIN vs INNER JOIN?</strong> Si quieres <em>socios con cero préstamos</em>,
    necesitas LEFT JOIN (los socios sin préstamos también aparecen, con COUNT=0).
    Con INNER JOIN, los socios sin préstamos desaparecen del resultado.
  </div>
  <div class="th-example"><span class="cm">-- INNER JOIN: solo socios que tienen préstamos</span>
<span class="fn">SELECT S.SOCNOM, COUNT(*) AS TOTAL</span>
<span class="fn">FROM   SOCIOS S</span>
<span class="kw">JOIN</span>   PRESTAMOS P <span class="kw">ON</span> P.PRESSOC = S.SOCCOD
<span class="kw">GROUP BY</span> S.SOCNOM;</span>  <span class="cm">← excluye socios sin préstamos</span>

<span class="cm">-- LEFT JOIN: todos los socios, incluso sin préstamos</span>
<span class="fn">SELECT S.SOCNOM, COUNT(P.PRESCOD) AS TOTAL</span>
<span class="fn">FROM   SOCIOS S</span>
<span class="kw">LEFT JOIN</span> PRESTAMOS P <span class="kw">ON</span> P.PRESSOC = S.SOCCOD
<span class="kw">GROUP BY</span> S.SOCNOM;</span>  <span class="cm">← socios sin préstamos → TOTAL=0</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>GROUP BY</code> y <code>HAVING</code> — Agrupar y filtrar grupos</div>
  <div class="th-concept-desc">
    <code>GROUP BY</code> colapsa filas con el mismo valor en una sola fila de resumen,
    aplicando funciones agregadas (<code>COUNT</code>, <code>SUM</code>, <code>AVG</code>, <code>MAX</code>).
    <br><br>
    <strong>Regla crítica:</strong> en el SELECT, solo puedes poner campos que estén en el GROUP BY
    o dentro de una función agregada. Cualquier otro campo es ambiguo.
    <br><br>
    <code>HAVING</code> filtra grupos (después de agrupar), mientras <code>WHERE</code> filtra filas
    (antes de agrupar). Un error común: usar WHERE para filtrar por COUNT — eso requiere HAVING.
  </div>
  <div class="th-example"><span class="cm">-- WHERE filtra filas ANTES de agrupar</span>
<span class="fn">SELECT PRESSOC, COUNT(*) AS TOTAL</span>
<span class="fn">FROM   PRESTAMOS</span>
<span class="kw">WHERE</span>  PRESEST = 'P'   <span class="cm">← solo préstamos pendientes</span>
<span class="kw">GROUP BY</span> PRESSOC
<span class="kw">HAVING</span> COUNT(*) &gt; 2;  <span class="cm">← socios con MÁS DE 2 pendientes</span>

<span class="cm">-- MAL: WHERE no puede usar COUNT(*) porque aún no hay grupos</span>
<span class="bad">WHERE COUNT(*) > 2</span>  <span class="cm">← Error: aggregate not allowed in WHERE</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>ROW_NUMBER() OVER(...)</code> — Funciones de ventana</div>
  <div class="th-concept-desc">
    Las funciones de ventana (<em>window functions</em>) calculan un valor para cada fila
    <em>considerando un conjunto de filas relacionadas</em>, sin colapsar el resultado como GROUP BY.
    <code>OVER(ORDER BY campo DESC)</code> define el orden en que se numera.
    <br><br>
    La diferencia clave con GROUP BY: con funciones de ventana, <em>sigues viendo todas las filas</em>
    del resultado — cada una con su número de ranking. Con GROUP BY, las filas se colapsan en grupos.
    <br><br>
    DB2 for i soporta desde V7R1: <code>ROW_NUMBER()</code>, <code>RANK()</code>, <code>DENSE_RANK()</code>,
    <code>LAG()</code>, <code>LEAD()</code>, <code>SUM() OVER()</code>, etc.
  </div>
  <div class="th-example"><span class="cm">-- Ranking de autores por total de libros disponibles</span>
<span class="fn">SELECT A.AUTNOM,</span>
       <span class="fn">SUM(L.LIBDIS) AS TOTAL_DIS,</span>
       <span class="hl">ROW_NUMBER() OVER(ORDER BY SUM(L.LIBDIS) DESC) AS RANKING</span>
<span class="fn">FROM   AUTORES A</span>
<span class="fn">LEFT JOIN LIBROS L ON A.AUTCOD = L.LIBAUTO</span>
<span class="fn">GROUP BY A.AUTCOD, A.AUTNOM;</span>

<span class="cm">-- Resultado:</span>
<span class="cm">-- AUTNOM           TOTAL_DIS  RANKING</span>
<span class="cm">-- García Márquez      15        1</span>
<span class="cm">-- Cervantes           12        2</span>
<span class="cm">-- Borges               8        3</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>COALESCE</code> y <code>CASE WHEN</code> — Manejo de NULLs y condiciones</div>
  <div class="th-concept-desc">
    <code>COALESCE(expr1, expr2)</code> retorna el primer valor no-NULL. Esencial cuando un campo
    puede ser NULL y necesitas un valor por defecto para cálculos.
    <br><br>
    <code>CASE WHEN condición THEN valor ELSE otro END</code> es el IF/ELSE del SQL — permite
    calcular campos condicionales dentro de un SELECT o GROUP BY.
  </div>
  <div class="th-example"><span class="cm">-- Días de retraso: PRESDVL puede ser NULL (préstamo vigente)</span>
<span class="fn">AVG(DAYS_BETWEEN(</span>
  <span class="hl">  COALESCE(P.PRESDVL, CURRENT_DATE),</span>  <span class="cm">← si NULL, usa hoy</span>
  <span class="fn">  P.PRESFEC</span>
<span class="fn">)) AS DIAS_PROM</span>

<span class="cm">-- Contar pendientes vs devueltos con CASE WHEN:</span>
<span class="fn">SUM(</span><span class="kw">CASE WHEN</span> PRESEST=<span class="str">'P'</span> <span class="kw">THEN</span> 1 <span class="kw">ELSE</span> 0 <span class="kw">END</span><span class="fn">) AS PENDIENTES,</span>
<span class="fn">SUM(</span><span class="kw">CASE WHEN</span> PRESEST=<span class="str">'D'</span> <span class="kw">THEN</span> 1 <span class="kw">ELSE</span> 0 <span class="kw">END</span><span class="fn">) AS DEVUELTOS</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>WHERE vs HAVING confundidos:</strong> <code>WHERE</code> filtra filas <em>antes</em> de agrupar. <code>HAVING</code> filtra <em>grupos</em> después de <code>GROUP BY</code>. No puedes usar funciones de agregación (<code>COUNT</code>, <code>SUM</code>) en la cláusula <code>WHERE</code> — solo en <code>HAVING</code>.</li>
    <li><strong>LEFT JOIN con condición en WHERE:</strong> <code>LEFT JOIN ... ON ... WHERE tabla_derecha.campo = valor</code> convierte implícitamente el LEFT JOIN en INNER JOIN porque el WHERE filtra los NULLs que retorna el LEFT. La condición del lado derecho siempre va en el <code>ON</code>, no en el <code>WHERE</code>.</li>
    <li><strong>ROW_NUMBER sin ORDER BY:</strong> <code>ROW_NUMBER() OVER()</code> sin <code>ORDER BY</code> produce números en orden no determinístico — el resultado puede cambiar entre ejecuciones. Siempre especifica <code>ORDER BY</code> dentro del <code>OVER()</code>.</li>
    <li><strong>COALESCE con tipos incompatibles:</strong> <code>COALESCE(campo_fecha, 'N/A')</code> falla si el campo es DATE y el fallback es CHAR. Ambos argumentos de COALESCE deben ser del mismo tipo o compatibles.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>En ACS → Run SQL Scripts activa <strong>View → Show Execution Details</strong> antes de ejecutar — muestra el tiempo real de ejecución, el número de filas procesadas y el método de acceso (index scan o table scan) para cada sentencia. Es el equivalente del <code>EXPLAIN</code> de otros motores SQL, sin necesidad de herramientas adicionales.</p>
</div>`,
        obj:'Escribir consultas SQL complejas con JOIN, GROUP BY, HAVING y ROW_NUMBER.',
        enun:'Escribe las siguientes queries: (a) Top 5 socios con más préstamos este mes, (b) Libros con más de 2 préstamos activos + nombre autor, (c) Estadísticas por socio (total, pendientes, días promedio), (d) Ranking de autores por disponibles con ROW_NUMBER().',
        hints:[
          'Mes actual: <code>WHERE MONTH(PRESFEC) = MONTH(CURRENT_DATE)</code>',
          '<code>HAVING COUNT(*) > 2</code> filtra grupos después de agrupar',
          '<code>COALESCE(PRESDVL, CURRENT_DATE)</code> maneja fechas NULL',
          '<code>ROW_NUMBER() OVER(ORDER BY SUM(LIBDIS) DESC)</code>'
        ],
        conceptos:['JOIN','GROUP BY','HAVING','ROW_NUMBER','COALESCE','CASE WHEN'],
        solucion:`-- a) Top 5 socios con más préstamos este mes
SELECT   S.SOCCOD, S.SOCNOM, COUNT(*) AS TOTAL_MES
FROM     BIBLIOTECA/PRESTAMOS P
JOIN     BIBLIOTECA/SOCIOS S ON P.PRESSOC = S.SOCCOD
WHERE    YEAR(P.PRESFEC)  = YEAR(CURRENT_DATE)
  AND    MONTH(P.PRESFEC) = MONTH(CURRENT_DATE)
GROUP BY S.SOCCOD, S.SOCNOM
ORDER BY TOTAL_MES DESC
FETCH FIRST 5 ROWS ONLY;

-- b) Libros con más de 2 préstamos activos + autor
SELECT   L.LIBCOD, L.LIBTTL, A.AUTNOM, COUNT(*) AS PREST_ACTIVOS
FROM     BIBLIOTECA/PRESTAMOS P
JOIN     BIBLIOTECA/LIBROS  L ON P.PRESLIB = L.LIBCOD
JOIN     BIBLIOTECA/AUTORES A ON L.LIBAUTO = A.AUTCOD
WHERE    P.PRESEST = 'P'
GROUP BY L.LIBCOD, L.LIBTTL, A.AUTNOM
HAVING   COUNT(*) > 2
ORDER BY PREST_ACTIVOS DESC;

-- c) Estadísticas por socio
SELECT   S.SOCCOD, S.SOCNOM,
         COUNT(*) AS TOTAL,
         SUM(CASE WHEN P.PRESEST='P' THEN 1 ELSE 0 END) AS PENDIENTES,
         AVG(DAYS_BETWEEN(COALESCE(P.PRESDVL,CURRENT_DATE),P.PRESFEC)) AS DIAS_PROM
FROM     BIBLIOTECA/SOCIOS    S
LEFT JOIN BIBLIOTECA/PRESTAMOS P ON S.SOCCOD = P.PRESSOC
GROUP BY S.SOCCOD, S.SOCNOM
ORDER BY TOTAL DESC;

-- d) Ranking de autores por disponibles
SELECT   A.AUTNOM,
         SUM(L.LIBDIS) AS TOTAL_DIS,
         COUNT(L.LIBCOD) AS NUM_LIBROS,
         ROW_NUMBER() OVER(ORDER BY SUM(L.LIBDIS) DESC) AS RANKING
FROM     BIBLIOTECA/AUTORES A
LEFT JOIN BIBLIOTECA/LIBROS  L ON A.AUTCOD = L.LIBAUTO
GROUP BY A.AUTCOD, A.AUTNOM
ORDER BY RANKING;`
      },
      {
        id:'F4-E3', nivel:'D', title:'Stored Procedure: procesar devolución', simId:'SIM-17',
        background:'Un Stored Procedure en DB2 for i encapsula lógica de negocio en la base de datos. A diferencia de un programa RPGLE que accede a la base de datos, el SP vive dentro del motor de BD — con acceso de latencia cero a los datos, soporte nativo de transacciones con COMMIT/ROLLBACK, y la posibilidad de ser llamado desde cualquier lenguaje que tenga un driver JDBC/ODBC.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">SP en DB2 vs lógica en RPGLE: cuándo elegir cada uno</div>
  <div class="th-concept-desc">
    La elección entre implementar lógica en un SP SQL o en un programa RPGLE tiene implicaciones
    importantes en mantenimiento, rendimiento y portabilidad.
  </div>
  <table class="th-table">
    <tr><th>Característica</th><th>Stored Procedure SQL</th><th>Programa RPGLE</th></tr>
    <tr><td>Latencia de datos</td><td>Cero (mismo motor)</td><td>IPC entre job y DB</td></tr>
    <tr><td>Llamable desde</td><td>SQL, JDBC, ODBC, cualquier lenguaje</td><td>CALL CL/RPGLE, IWS</td></tr>
    <tr><td>Lenguaje de lógica</td><td>SQL procedural (limitado)</td><td>RPGLE completo (rico)</td></tr>
    <tr><td>Debugging</td><td>Difícil sin herramientas específicas</td><td>Debugger RDi/ACS</td></tr>
    <tr><td>Transacciones</td><td>COMMIT/ROLLBACK nativo</td><td>Requiere journaling + EXEC SQL</td></tr>
  </table>
  <div class="th-example"><span class="cm">-- Llamar al SP desde cualquier lenguaje (JDBC, Python, etc.):</span>
<span class="fn">CALL BIBLIOTECA.PRC_DEVOLVER('P20241225001', ?, ?, ?);</span>
<span class="cm">-- Los ? son OUT parameters que el driver recibe como resultado</span>

<span class="cm">-- Desde RPGLE con SQL embebido:</span>
<span class="fn">EXEC SQL CALL BIBLIOTECA/PRC_DEVOLVER(:pCod, :pEst, :pDias, :pMsg);</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>DECLARE CONTINUE HANDLER FOR SQLEXCEPTION</code></div>
  <div class="th-concept-desc">
    El handler es el equivalente del <code>MONITOR/ON-ERROR</code> de RPGLE o del
    <code>try/catch</code> de Java. <code>CONTINUE</code> significa que el SP continúa
    ejecutando la sentencia siguiente al error — a diferencia de <code>EXIT</code> que
    termina el bloque BEGIN/END inmediatamente.
    <br><br>
    <strong>Trampa:</strong> sin un <code>RETURN</code> explícito dentro del handler,
    el SP puede continuar con datos en estado inconsistente. Siempre incluye <code>RETURN</code>
    al final del handler para garantizar que el SP termina limpiamente.
  </div>
  <div class="th-example"><span class="kw">DECLARE CONTINUE HANDLER FOR SQLEXCEPTION</span>
<span class="kw">  BEGIN</span>
<span class="fn">    SET pEstado  = SQLSTATE;</span>  <span class="cm">← captura el código del error</span>
<span class="fn">    SET pMensaje = 'Error: ' || SQLSTATE;</span>
<span class="fn">    ROLLBACK;</span>              <span class="cm">← deshace todos los cambios</span>
<span class="fn">    RETURN;</span>               <span class="cm">← sale del SP (sin esto, continuaría)</span>
<span class="kw">  END;</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>DAYS_BETWEEN(fecha1, fecha2)</code> — Días de diferencia</div>
  <div class="th-concept-desc">
    Retorna la diferencia en días: positivo si fecha1 &gt; fecha2, negativo si fecha1 &lt; fecha2.
    Para calcular días de retraso: <code>DAYS_BETWEEN(CURRENT_DATE, PRESDVL)</code>.
    <br>• Resultado positivo: la fecha de devolución ya pasó → hay retraso.
    <br>• Resultado negativo: la fecha de devolución aún no llega → sin retraso.
    <br>• Resultado cero: vence hoy.
    <br><br>
    El patrón <code>IF vDias &lt; 0 THEN SET vDias = 0</code> normaliza el valor
    para que los parámetros OUT siempre sean ≥ 0.
  </div>
  <div class="th-example"><span class="cm">-- Hoy=2024-12-30, PRESDVL=2024-12-25:</span>
<span class="fn">DAYS_BETWEEN(CURRENT_DATE, PRESDVL)</span>  <span class="cm">→ +5 (5 días de retraso)</span>

<span class="cm">-- Hoy=2024-12-20, PRESDVL=2024-12-25:</span>
<span class="fn">DAYS_BETWEEN(CURRENT_DATE, PRESDVL)</span>  <span class="cm">→ -5 (faltan 5 días)</span>

<span class="fn">IF vDias &lt; 0 THEN SET vDias = 0; END IF;</span>  <span class="cm">← normalizar</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>DECLARE HANDLER después de DECLARE variables:</strong> El orden dentro del SP es estricto: primero <code>DECLARE</code> de cursores y variables, luego <code>DECLARE ... HANDLER</code>. Si el HANDLER va antes de las variables, obtienes <code>SQL0104 - Unexpected token</code>.</li>
    <li><strong>SP sin RETURN al final de cada rama:</strong> Si el SP tiene múltiples rutas (éxito y error) y alguna no tiene <code>RETURN</code>, el SP continúa ejecutando código después del IF. Siempre cierra cada rama con <code>RETURN</code> explícito.</li>
    <li><strong>DAYS_BETWEEN argumento invertido:</strong> <code>DAYS_BETWEEN(A, B)</code> retorna cuántos días hay desde B hasta A (A - B en días). Si confundes el orden, obtienes el valor negativo del que esperabas.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>Puedes llamar a un Stored Procedure SQL desde RPGLE con <code>EXEC SQL CALL PRC_DEVOLVER(:vCod, :vEstado, :vDias, :vMsg)</code>. Los parámetros OUT del SP se mapean directamente a variables RPGLE — sin necesidad de <code>CALL</code> nativo ni prototipos de Service Program.</p>
</div>`,
        obj:'Crear un SP con lógica de negocio, DECLARE HANDLER y transacción completa.',
        enun:'Crea el SP PRC_DEVOLVER que: (a) verifica que el préstamo existe y está en "P", (b) calcula días de retraso, (c) actualiza PRESEST a "D" con fecha real, (d) incrementa LIBDIS en 1, (e) retorna estado, días retraso y mensaje. Todo en una transacción.',
        hints:[
          '<code>DECLARE CONTINUE HANDLER FOR SQLEXCEPTION BEGIN...END;</code>',
          '<code>DAYS_BETWEEN(CURRENT_DATE, PRESDVL)</code> para calcular retraso',
          'Si el resultado de SELECT es 02000 = NOT FOUND',
          '<code>COMMIT;</code> al final si todo está bien, <code>ROLLBACK;</code> en el handler'
        ],
        conceptos:['DECLARE HANDLER','DAYS_BETWEEN','COMMIT','ROLLBACK','SP transaccional'],
        solucion:`CREATE OR REPLACE PROCEDURE BIBLIOTECA/PRC_DEVOLVER (
  IN  pCodPres  CHAR(9),
  OUT pEstado   CHAR(5),
  OUT pDiasRet  INTEGER,
  OUT pMensaje  VARCHAR(100)
)
LANGUAGE SQL
MODIFIES SQL DATA
BEGIN
  DECLARE vCodLib  CHAR(7);
  DECLARE vDvlPrev DATE;
  DECLARE vEstPrev CHAR(1);
  DECLARE vDias    INTEGER DEFAULT 0;
  DECLARE CONTINUE HANDLER FOR SQLEXCEPTION
    BEGIN
      SET pEstado  = SQLSTATE;
      SET pMensaje = 'Error interno: ' || SQLSTATE;
      ROLLBACK;
    END;

  SELECT PRESLIB, PRESDVL, PRESEST
  INTO   vCodLib, vDvlPrev, vEstPrev
  FROM   BIBLIOTECA/PRESTAMOS
  WHERE  PRESCOD = pCodPres;

  IF SQLSTATE = '02000' THEN
    SET pEstado  = 'NOEXT';
    SET pMensaje = 'Préstamo no encontrado: ' || pCodPres;
    RETURN;
  END IF;

  IF vEstPrev <> 'P' THEN
    SET pEstado  = 'NOACT';
    SET pMensaje = 'El préstamo no está pendiente.';
    RETURN;
  END IF;

  SET vDias = DAYS_BETWEEN(CURRENT_DATE, vDvlPrev);
  IF vDias < 0 THEN SET vDias = 0; END IF;

  UPDATE BIBLIOTECA/PRESTAMOS
  SET    PRESEST = 'D', PRESDVL = CURRENT_DATE
  WHERE  PRESCOD = pCodPres;

  UPDATE BIBLIOTECA/LIBROS
  SET    LIBDIS = LIBDIS + 1
  WHERE  LIBCOD = vCodLib;

  COMMIT;

  SET pEstado  = '00000';
  SET pDiasRet = vDias;
  SET pMensaje = CASE WHEN vDias > 0
    THEN 'Devolución con ' || TRIM(CHAR(vDias)) || ' días de retraso.'
    ELSE 'Devolución en tiempo.'
  END;
END;`
      }
    ]
  },

  {
    id:'f5', num:5, icon:'🔧', title:'ILE Avanzado, Service Programs y CL',
    color:'#58a6ff', nivel:'Mid',
    desc:'Activation groups, CRTSRVPGM, binder language, CL programs, rpgunit',
    intro:`<p class="pi-text">
      El <strong>ILE (Integrated Language Environment)</strong> es el modelo de ejecución moderno de
      IBM i. A diferencia del OPM clásico (un programa = un fuente), ILE permite construir
      aplicaciones con múltiples módulos enlazados, en diferentes lenguajes, con control granular
      sobre el ciclo de vida de los recursos.
    </p>
    <p class="pi-text" style="margin-top:8px">
      Un <strong>Service Program (SRVPGM)</strong> es el equivalente IBM i de una DLL o librería
      compartida: contiene subprocedimientos reutilizables que otros programas pueden llamar.
      El ciclo de creación es: fuente RPGLE → <code>CRTRPGMOD</code> (módulo) → <code>CRTSRVPGM</code>
      (service program). Los <strong>copy books</strong> (<code>/COPY</code>) contienen los prototipos
      que permiten a los consumidores llamar al SRVPGM con seguridad de tipos.
    </p>
    <p class="pi-text" style="margin-top:8px">
      Los <strong>Activation Groups</strong> controlan el ciclo de vida de recursos: <code>*CALLER</code>
      hereda el grupo del llamador (comparte recursos), <code>*NEW</code> crea un grupo nuevo que se
      destruye al retornar (ideal para SPs con commit independiente), y un nombre propio crea un grupo
      persistente. Los programas <strong>CL</strong> son la "cola" que orquesta llamadas a programas
      RPGLE, maneja errores con <code>MONMSG</code> y realiza operaciones de sistema.
    </p>`,
    whyMatters:`Los Service Programs son la arquitectura correcta para código reutilizable en IBM i. Sin ellos, la lógica de negocio se duplica en cientos de programas. Con ellos, cambias un solo SRVPGM y todos los consumidores se actualizan. El dominio de ILE es lo que diferencia a un programador Junior de un Senior en IBM i.`,
    keyTerms:['NOMAIN','EXPORT','CRTSRVPGM','BNDDIR','/COPY','DCL-PR','ACTGRP','*CALLER','*NEW','MONMSG','CALL','CL Program','rpgunit'],
    exercises:[
      {
        id:'F5-E1', nivel:'E', title:'Crear y consumir un Service Program utilitario', simId:'SIM-13',
        background:'Un Service Program es un contenedor de subprocedimientos sin programa principal (usa <code>CTL-OPT NOMAIN</code>). El ciclo es: 1) Escribir el módulo RPGLE con <code>DCL-PROC xxx EXPORT</code>, 2) Compilar el módulo con CRTRPGMOD, 3) Crear el SRVPGM con CRTSRVPGM. El consumidor necesita los prototipos del copy book y referenciar el SRVPGM vía BNDDIR.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">*PGM vs *SRVPGM: ¿cuándo usar cada uno?</div>
  <div class="th-concept-desc">
    Un <strong>*PGM</strong> tiene un punto de entrada principal (la PI del programa), se llama con
    <code>CALL</code> o <code>CALLP</code> y tiene su propio ciclo de vida.
    Un <strong>*SRVPGM</strong> es una librería de subprocedimientos: no tiene punto de entrada
    único, solo expone procedimientos que otros pueden llamar.
    <br><br>
    <strong>¿Por qué SRVPGM?</strong> Imagina que 50 programas distintos necesitan formatear fechas.
    Sin SRVPGM, cada uno tiene su propia copia del código: si hay un bug, hay que tocar 50 programas.
    Con SRVPGM, hay una sola implementación: cambias el SRVPGM y los 50 consumidores se actualizan
    automáticamente sin recompilar.
  </div>
  <div class="th-example"><span class="cm">*── Sin SRVPGM: código duplicado en cada programa ────────────────────</span>
<span class="bad">// LIBRAGR.RPGLE</span>
<span class="bad">DCL-PROC FormatearFecha; ... END-PROC;</span>  <span class="cm">← copia 1</span>
<span class="bad">// PRESREG.RPGLE</span>
<span class="bad">DCL-PROC FormatearFecha; ... END-PROC;</span>  <span class="cm">← copia 2, puede divergir</span>

<span class="cm">*── Con SRVPGM: una sola implementación compartida ───────────────────</span>
<span class="good">// UTILSRV.RPGLE (módulo → CRTSRVPGM)</span>
<span class="good">DCL-PROC FormatearFecha EXPORT; ... END-PROC;</span>  <span class="cm">← única fuente de verdad</span>
<span class="cm">// LIBRAGR + PRESREG + 48 programas más → todos llaman al mismo SRVPGM</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">El ciclo de compilación ILE: MOD → SRVPGM</div>
  <div class="th-concept-desc">
    En ILE, la compilación es un proceso de dos pasos obligatorios:
    <br>1. <code>CRTRPGMOD</code>: compila el fuente RPGLE en un <strong>*MODULE</strong> (no ejecutable aún).
    <br>2. <code>CRTSRVPGM</code>: enlaza uno o más módulos en un <strong>*SRVPGM</strong> ejecutable.
    <br><br>
    El módulo es el análogo IBM i de un archivo <code>.o</code> (objeto compilado) en C.
    El SRVPGM es el análogo de una <code>.so</code> (shared library) en Linux.
    <br><br>
    El atajo <code>CRTBNDRPG</code> hace ambos pasos en uno — pero solo para programas principales (*PGM),
    no para Service Programs. Para SRVPGM siempre necesitas los dos pasos separados.
  </div>
  <div class="th-example"><span class="cm">// Paso 1: fuente → módulo</span>
<span class="fn">CRTRPGMOD MODULE(BIBLIOTECA/UTILSRV)</span>
<span class="fn">           SRCFILE(BIBLIOTECA/QRPGLESRC)</span>
<span class="fn">           SRCMBR(UTILSRV)</span>

<span class="cm">// Paso 2: módulo(s) → service program</span>
<span class="fn">CRTSRVPGM SRVPGM(BIBLIOTECA/UTILSRV)</span>
<span class="fn">           MODULE(BIBLIOTECA/UTILSRV)</span>
<span class="fn">           EXPORT(*ALL)</span>

<span class="cm">// EXPORT(*ALL): exporta todos los DCL-PROC marcados con EXPORT</span>
<span class="cm">// Alternativa: EXPORT(*SRCFILE) usa un "binder source" para control granular</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">Copy books y <code>DCL-PR</code> — El contrato de la interfaz</div>
  <div class="th-concept-desc">
    El copy book (miembro en QCPYSRC) contiene los <strong>prototipos</strong> (<code>DCL-PR</code>) de
    los procedimientos del SRVPGM. El consumidor hace <code>/COPY BIBLIOTECA/QCPYSRC,UTILSRV_H</code>
    para incluir estas declaraciones.
    <br><br>
    Sin el prototipo, el compilador no conoce los tipos de los parámetros y no puede verificarlos.
    Con el prototipo, si pasas el tipo incorrecto, el compilador lo detecta en tiempo de compilación
    — no en tiempo de ejecución con un crash.
    <br><br>
    <code>EXTPROC('nombre')</code> vincula el prototipo al nombre real del procedimiento exportado
    por el SRVPGM. Si el nombre difiere, el linker falla al crear el programa consumidor.
  </div>
  <div class="th-example"><span class="cm">// En QCPYSRC/UTILSRV_H (el "header" del SRVPGM):</span>
<span class="kw">DCL-PR FormatearFecha VARCHAR(10)</span> <span class="hl">EXTPROC('FormatearFecha')</span><span class="kw">;</span>
<span class="fn">  pFecha DATE CONST;</span>  <span class="cm">← tipo exacto del parámetro</span>
<span class="kw">END-PR;</span>

<span class="cm">// En el consumidor:</span>
<span class="fn">/COPY BIBLIOTECA/QCPYSRC,UTILSRV_H</span>  <span class="cm">← incluye el contrato</span>
<span class="fn">DCL-S vFmt VARCHAR(10);</span>
<span class="fn">vFmt = FormatearFecha(%DATE());</span>  <span class="cm">← compilador verifica tipos</span>

<span class="cm">// Si pasas CHAR donde espera DATE → error de compilación, no crash</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>CRTSRVPGM sin BNDDIR:</strong> Si el consumidor usa <code>/COPY</code> del copy book pero no vincula el SRVPGM en el <code>BNDDIR</code> de compilación, el programa compila pero al ejecutar falla con <code>MCH4439 - Pointer not set</code>. Siempre agrega el SRVPGM al BNDDIR antes de compilar los consumidores.</li>
    <li><strong>EXPORT(*ALL) en producción:</strong> <code>EXPORT(*ALL)</code> exporta todos los procedimientos del módulo, incluyendo los internos. En sistemas grandes, usa un archivo <code>.bnd</code> (binding source) para controlar exactamente qué procedimientos son públicos.</li>
    <li><strong>Cambiar firma del SRVPGM sin recompilar consumidores:</strong> Si cambias un prototipo (tipo o número de parámetros), el signature del SRVPGM cambia. Los programas que ya compilaron con el signature anterior fallan con <code>MCH3402</code> hasta que se recompilan.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>Para evitar recompilar todos los consumidores al cambiar la firma de un SRVPGM, usa <strong>binding source</strong> con la directiva <code>PGMEXPORT SYMBOL('nombre')</code>. Esto desacopla el signature externo del SRVPGM del código interno, permitiendo agregar nuevos procedimientos sin romper el signature existente — técnica usada en SRVPGMs de producción de larga vida.</p>
</div>`,
        obj:'Entender el ciclo completo: crear módulo RPGLE → CRTSRVPGM → consumir desde otro programa con prototipos.',
        enun:'Crea el Service Program UTILSRV con dos procedimientos: (a) FormatearFecha(pFecha DATE): retorna la fecha como VARCHAR en formato "DD/MM/YYYY", (b) PadIzq(pStr CHAR, pLen INT, pChar CHAR): rellena un string por la izquierda hasta la longitud indicada. Crea el copy book con los prototipos. Prueba desde un programa principal UTILTEST.',
        hints:[
          'El módulo usa <code>CTL-OPT NOMAIN</code> — sin programa principal',
          'Exporta con <code>DCL-PROC MiProc EXPORT;</code>',
          'Compila: <code>CRTRPGMOD MODULE(LIB/MOD)</code> luego <code>CRTSRVPGM SRVPGM(LIB/SRV) MODULE(LIB/MOD) EXPORT(*ALL)</code>',
          'El programa consumidor usa <code>BNDDIR</code> o <code>CALLP</code> con el prototipo del copy book',
          'Para el formato de fecha: <code>%CHAR(pFecha:*DMY/)</code> retorna DD/MM/YYYY'
        ],
        conceptos:['NOMAIN','EXPORT','CRTSRVPGM','BNDDIR','Copy book','/COPY','DCL-PR'],
        solucion:`// ── Copy book: QCPYSRC/UTILSRV_H ────────────────────────────────────
DCL-PR FormatearFecha VARCHAR(10) EXTPROC('FormatearFecha');
  pFecha DATE CONST;
END-PR;

DCL-PR PadIzq CHAR(50) EXTPROC('PadIzq');
  pStr  CHAR(50)  CONST;
  pLen  INT(10)   CONST;
  pChar CHAR(1)   CONST;
END-PR;

// ── Módulo: QRPGLESRC/UTILSRV ────────────────────────────────────────
**FREE
CTL-OPT NOMAIN OPTION(*NODEBUGIO:*SRCSTMT)
        DFTACTGRP(*NO) ACTGRP('BIBLIOTECA');

/COPY BIBLIOTECA/QCPYSRC,UTILSRV_H

DCL-PROC FormatearFecha EXPORT;
  DCL-PI *N VARCHAR(10);
    pFecha DATE CONST;
  END-PI;
  // Retorna DD/MM/YYYY
  RETURN %CHAR(pFecha:*DMY/);
END-PROC;

DCL-PROC PadIzq EXPORT;
  DCL-PI *N CHAR(50);
    pStr  CHAR(50) CONST;
    pLen  INT(10)  CONST;
    pChar CHAR(1)  CONST;
  END-PI;
  DCL-S vResult CHAR(50);
  DCL-S nActual INT(10);
  nActual = %LEN(%TRIMR(pStr));
  IF nActual >= pLen;
    RETURN pStr;
  ENDIF;
  vResult = %STR(%ADDR(pStr):%SIZE(pStr));
  // Rellenar por la izquierda
  vResult = %XLATE(' ':pChar:%SUBST(vResult:1:pLen-nActual))
            + %TRIMR(pStr);
  RETURN vResult;
END-PROC;

/* ── Compilar Service Program ── */
CRTRPGMOD MODULE(BIBLIOTECA/UTILSRV) SRCFILE(BIBLIOTECA/QRPGLESRC) SRCMBR(UTILSRV)
CRTSRVPGM SRVPGM(BIBLIOTECA/UTILSRV) MODULE(BIBLIOTECA/UTILSRV) EXPORT(*ALL)

// ── Programa consumidor: UTILTEST ────────────────────────────────────
**FREE
CTL-OPT OPTION(*NODEBUGIO:*SRCSTMT) DFTACTGRP(*NO) ACTGRP(*CALLER)
        BNDDIR('BIBLIOTECA/UTILSRV');  // Vincula el SRVPGM

/COPY BIBLIOTECA/QCPYSRC,UTILSRV_H

DCL-S vFechaFmt VARCHAR(10);
DCL-S vCodPad   CHAR(50);

vFechaFmt = FormatearFecha(%DATE());
// Resultado: '25/12/2024' (o la fecha actual)

vCodPad = PadIzq('LIB1':7:'0');
// Resultado: '000LIB1'

DSPLY vFechaFmt;
DSPLY vCodPad;
*INLR = *ON;`
      },
      {
        id:'F5-E2', nivel:'M', title:'Programa CL que orquesta el proceso de préstamos', simId:'SIM-18',
        background:'Los programas CL (Control Language) son el "pegamento" del sistema IBM i: orquestan la ejecución de programas RPGLE, manejan variables del sistema, manipulan objetos y gestionan errores. Cuando un proceso de negocio requiere llamar múltiples programas en secuencia, con manejo de errores y logging, un CL es la herramienta adecuada — no RPGLE.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">CL vs RPGLE: cuándo usar cada lenguaje</div>
  <div class="th-concept-desc">
    CL (Control Language) y RPGLE tienen roles muy diferentes en IBM i. Confundirlos genera código
    difícil de mantener.
  </div>
  <table class="th-table">
    <tr><th>CL</th><th>RPGLE</th></tr>
    <tr><td>Orquestar llamadas a programas</td><td>Lógica de negocio</td></tr>
    <tr><td>Manejar objetos del sistema (CRTLIB, DLTF)</td><td>Acceso a datos (CHAIN, READ, WRITE)</td></tr>
    <tr><td>Monitorear errores con MONMSG</td><td>Calcular, validar, transformar</td></tr>
    <tr><td>Enviar mensajes al operador</td><td>Generar reportes y pantallas</td></tr>
    <tr><td>Someter jobs batch (SBMJOB)</td><td>Subprocedimientos reutilizables</td></tr>
    <tr><td>Leer/escribir data areas (CHGDTAARA)</td><td>Leer/escribir archivos de base de datos</td></tr>
  </table>
  <div class="th-example"><span class="cm">*── CL típico: orquesta sin lógica de negocio ────────────────────────</span>
<span class="fn">CALL PGM(PRESRPT) PARM(&FECHA)</span>   <span class="cm">← delega el trabajo a RPGLE</span>
<span class="fn">MONMSG MSGID(CPF0000) EXEC(GOTO CMDLBL(ERROR))</span>
<span class="fn">CHGDTAARA DTAARA(ULTPRES) VALUE(&FECHA)</span>  <span class="cm">← registra la ejecución</span>

<span class="cm">*── MAL: lógica de negocio en CL ─────────────────────────────────────</span>
<span class="bad">IF (&DIAS *GT 15) THEN(...</span>  <span class="cm">← esta lógica pertenece a RPGLE</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>MONMSG</code> — El try/catch de CL</div>
  <div class="th-concept-desc">
    <code>MONMSG</code> (Monitor Message) intercepta mensajes de error del sistema antes de que
    aborten el programa. Es el equivalente de <code>MONITOR/ON-ERROR</code> en RPGLE o
    <code>try/catch</code> en Java.
    <br><br>
    <code>MSGID(CPF0000)</code> captura <em>cualquier</em> error CPF (el prefijo CPF cubre
    la mayoría de errores del sistema operativo). <code>EXEC(GOTO CMDLBL(ERROR))</code> salta
    a la etiqueta ERROR donde puedes registrar y retornar el error.
    <br><br>
    <strong>Trampa:</strong> si pones el MONMSG <em>antes</em> del CALL, cubre ese CALL.
    Si lo pones después, ya no lo protege. En CL, el MONMSG debe preceder al comando que protege.
  </div>
  <div class="th-example"><span class="cm">*── CORRECTO: MONMSG precede al CALL ────────────────────────────────</span>
<span class="good">MONMSG MSGID(CPF0000) EXEC(GOTO CMDLBL(ERROR))</span>
<span class="good">CALL   PGM(PRESRPT) PARM(&FECHA)</span>  <span class="cm">← si falla, va a ERROR:</span>

<span class="cm">*── MAL: MONMSG después del CALL no protege nada ────────────────────</span>
<span class="bad">CALL   PGM(PRESRPT) PARM(&FECHA)</span>  <span class="cm">← falla aquí → abortará el programa</span>
<span class="bad">MONMSG MSGID(CPF0000) EXEC(GOTO CMDLBL(ERROR))</span>  <span class="cm">← ya es tarde</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>CHGDTAARA</code> — Data Areas como variables globales del sistema</div>
  <div class="th-concept-desc">
    Una Data Area (<code>*DTAARA</code>) es un objeto IBM i que actúa como variable global persistente:
    sobrevive entre llamadas de programas, entre jobs diferentes, e incluso entre reinicios del sistema.
    <br><br>
    Se usa típicamente para almacenar: última fecha de proceso, contadores de secuencia,
    parámetros de configuración, flags de "proceso en ejecución". Es más liviana que
    una tabla de base de datos para datos de control pequeños.
    <br><br>
    <code>CHGDTAARA DTAARA(LIB/NOMBRE (posición longitud))</code> permite actualizar solo una
    porción de la data area, sin sobreescribir el resto.
  </div>
  <div class="th-example"><span class="cm">// Crear data area: CRTDTAARA DTAARA(BIBLIOTECA/ULTPRES) TYPE(*CHAR) LEN(10)</span>
<span class="fn">CHGDTAARA  DTAARA(BIBLIOTECA/ULTPRES (1 10)) VALUE(&FECHA)</span>
<span class="cm">                                     ↑  ↑</span>
<span class="cm">                              posición  longitud</span>

<span class="cm">// Leer la data area en otro programa:</span>
<span class="fn">RTVDTAARA  DTAARA(BIBLIOTECA/ULTPRES) RTNVAR(&ULTFEC)</span>
<span class="fn">DSPLY (&ULTFEC)  // muestra la última fecha procesada</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>MONMSG antes de CALL:</strong> <code>MONMSG</code> debe ir <em>después</em> del comando que quieres monitorear. Si lo pones antes, captura el mensaje del comando anterior, no del CALL. El patrón correcto es: <code>CALL PGM(MIPGM)</code> → nueva línea → <code>MONMSG MSGID(CPF0000) EXEC(...)</code>.</li>
    <li><strong>CHGDTAARA con posición incorrecta:</strong> <code>CHGDTAARA DTAARA(LIB/DTAARA (posición longitud))</code> — si la posición más la longitud exceden el tamaño de la data area, obtienes <code>CPF1001</code>. Siempre verifica el tamaño con <code>DSPOBJD OBJ(LIB/DTAARA) OBJTYPE(*DTAARA)</code>.</li>
    <li><strong>Variables CL sin inicializar:</strong> Las variables <code>*CHAR</code> en CL se inicializan con blancos, las <code>*DEC</code> con ceros. Si verificas una variable con IF y no la inicializas, podrías estar comparando blancos con un valor esperado sin error visible.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>En lugar de CL clásico para orquestar jobs batch, considera los <strong>IBM i Services</strong>: <code>QSYS2.SUBMIT_JOB</code> en SQL permite someter jobs batch directamente desde una sentencia SQL o desde RPGLE con <code>EXEC SQL</code>. Más fácil de parametrizar y de registrar que <code>SBMJOB</code> en CL.</p>
</div>`,
        obj:'Escribir un programa CL que llame programas RPGLE, capture errores con MONMSG y maneje parámetros.',
        enun:'Crea el programa CL PRESDIAC que: (a) recibe una fecha como parámetro, (b) llama al programa RPGLE PRESRPT pasándole la fecha, (c) si hay error lo captura con MONMSG y envía un mensaje al operador, (d) al terminar registra la ejecución en un data area. Usa CHGVAR, SNDPGMMSG y CHGDTAARA.',
        hints:[
          '<code>PGM PARM(&FECHA)</code> — declara parámetros al inicio',
          '<code>DCL VAR(&FECHA) TYPE(*CHAR) LEN(10)</code> — declara variables',
          '<code>MONMSG MSGID(CPF0000) EXEC(GOTO CMDLBL(ERROR))</code> — captura cualquier error',
          '<code>SNDPGMMSG MSG(\'Error en proceso\') TOPGMQ(*EXT)</code> — mensaje al operador',
          '<code>CHGDTAARA DTAARA(BIBLIOTECA/ULTPRES) VALUE(&FECHA)</code>'
        ],
        conceptos:['PGM PARM','DCL VAR','MONMSG','SNDPGMMSG','CHGDTAARA','CALL'],
        solucion:`/* ── QCLSRC/PRESDIAC — Proceso diario de préstamos ──────────────── */
PGM        PARM(&FECHA)

DCL        VAR(&FECHA)   TYPE(*CHAR) LEN(10)
DCL        VAR(&MSGDTA)  TYPE(*CHAR) LEN(100)
DCL        VAR(&JOBNAME) TYPE(*CHAR) LEN(10)
RTVJOBA    JOB(&JOBNAME)

/* Mensaje de inicio */
SNDPGMMSG  MSG('Iniciando proceso préstamos fecha: ' *CAT &FECHA) +
             TOPGMQ(*EXT) MSGTYPE(*INFO)

/* Llamar al programa de reporte */
MONMSG     MSGID(CPF0000) EXEC(GOTO CMDLBL(ERROR))
CALL       PGM(BIBLIOTECA/PRESRPT) PARM(&FECHA)

/* Registrar ejecución exitosa en data area */
CHGDTAARA  DTAARA(BIBLIOTECA/ULTPRES (1 10)) VALUE(&FECHA)

/* Mensaje de fin exitoso */
SNDPGMMSG  MSG('Proceso completado OK - Fecha: ' *CAT &FECHA) +
             TOPGMQ(*EXT) MSGTYPE(*COMP)
GOTO       CMDLBL(FIN)

/* Manejo de error */
ERROR:
RCVMSG     MSGDTA(&MSGDTA) RMV(*NO)
SNDPGMMSG  MSG('ERROR en PRESDIAC: ' *CAT &MSGDTA) +
             TOPGMQ(*EXT) MSGTYPE(*ESCAPE)

FIN:
ENDPGM

/* Compilar */
/* Primero crear data area: */
CRTDTAARA  DTAARA(BIBLIOTECA/ULTPRES) TYPE(*CHAR) LEN(10) VALUE(' ')

/* Luego compilar el CL: */
CRTBNDCL   PGM(BIBLIOTECA/PRESDIAC) SRCFILE(BIBLIOTECA/QCLSRC) SRCMBR(PRESDIAC)`
      },
      {
        id:'F5-E3', nivel:'M', title:'Activation Groups — entender el ciclo de vida ILE',
        background:'Un Activation Group (AG) es el contenedor de recursos de un programa ILE: archivos abiertos, variables estáticas, commit boundaries. Cuando IBM i ejecuta un programa ILE, lo hace dentro de un AG. La elección de ACTGRP determina si el programa comparte recursos con el llamador, tiene los suyos propios, o usa un grupo persistente entre llamadas.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">Qué es un Activation Group y por qué importa</div>
  <div class="th-concept-desc">
    Puedes pensar en un Activation Group como un proceso dentro del job.
    Cada AG tiene su propio espacio de recursos: archivos abiertos, cursores SQL activos,
    variables estáticas (<code>DCL-S vVar INT(10) STATIC</code>) y su propio <em>commit boundary</em>
    (el conjunto de cambios que confirma o deshace con COMMIT/ROLLBACK).
    <br><br>
    La elección de <code>ACTGRP</code> en el <code>CTL-OPT</code> define el comportamiento
    del programa respecto a los recursos:
  </div>
  <table class="th-table">
    <tr><th>ACTGRP</th><th>Comportamiento</th><th>Cuándo usarlo</th></tr>
    <tr><td><code>*CALLER</code></td><td>Hereda el AG del programa que lo llama</td><td>Módulos auxiliares, SRVPGMs compartidos</td></tr>
    <tr><td><code>*NEW</code></td><td>Crea un AG nuevo; se destruye al RETURN</td><td>SPs con commit boundary independiente</td></tr>
    <tr><td><code>'nombre'</code></td><td>Grupo nombrado persistente entre llamadas</td><td>Service Programs que cachean datos</td></tr>
    <tr><td><code>*DFTACTGRP</code></td><td>AG por defecto (solo OPM/legado)</td><td>Programas RPG/400 clásicos</td></tr>
  </table>
</div>

<div class="th-concept">
  <div class="th-concept-name">El impacto en COMMIT: ¿quién confirma qué?</div>
  <div class="th-concept-desc">
    Cada AG tiene su propia <em>commit boundary</em>. Un <code>EXEC SQL COMMIT</code> solo
    confirma los cambios realizados <em>dentro del AG actual</em>.
    <br><br>
    Con <code>ACTGRP(*CALLER)</code>: el programa comparte el AG del llamador.
    Un COMMIT confirma también los cambios pendientes del llamador — cuidado en pruebas.
    <br><br>
    Con <code>ACTGRP(*NEW)</code>: el programa tiene su propio AG.
    Un COMMIT solo confirma los cambios de <em>este</em> programa. El llamador no se ve afectado.
    Ideal para sub-transacciones independientes (ej: log de auditoría que debe confirmarse aunque
    la transacción principal haga ROLLBACK).
  </div>
  <div class="th-example"><span class="cm">// ACTGRP(*NEW): commit boundary aislado</span>
<span class="fn">CTL-OPT DFTACTGRP(*NO) ACTGRP(*NEW);</span>
<span class="fn">EXEC SQL INSERT INTO AUDIT_LOG VALUES (:v1, :v2);</span>
<span class="fn">EXEC SQL COMMIT;</span>  <span class="cm">← solo confirma el INSERT en AUDIT_LOG</span>
<span class="cm">                   ← si el llamador hace ROLLBACK, este log ya está confirmado</span>

<span class="cm">// ACTGRP(*CALLER): mismo commit que el llamador</span>
<span class="fn">CTL-OPT DFTACTGRP(*NO) ACTGRP(*CALLER);</span>
<span class="fn">EXEC SQL COMMIT;</span>  <span class="cm">← confirma TODO lo que hizo el llamador también</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">Variables STATIC y grupos nombrados: estado persistente entre llamadas</div>
  <div class="th-concept-desc">
    Con un grupo nombrado (<code>ACTGRP('BIBLIOTECA')</code>), el AG persiste mientras el job
    esté activo. Esto habilita variables <code>STATIC</code>: variables que mantienen su valor
    entre llamadas al programa.
    <br><br>
    Caso de uso real: un Service Program que tiene un contador de llamadas, o que cachea
    una configuración leída de una tabla (solo la lee la primera vez, luego la sirve desde
    memoria). Esto mejora el rendimiento al eliminar I/O repetitivo.
  </div>
  <div class="th-example"><span class="fn">CTL-OPT DFTACTGRP(*NO) ACTGRP('BIBLIOTECA');</span>

<span class="cm">// Variable STATIC: persiste entre llamadas al mismo AG</span>
<span class="fn">DCL-S nLlamadas INT(10)</span> <span class="hl">STATIC</span> <span class="fn">INZ(0);</span>
<span class="fn">DCL-S vConfig   CHAR(100) STATIC INZ('');</span>

<span class="fn">nLlamadas += 1;</span>
<span class="kw">IF vConfig = '';</span>
<span class="fn">  // Primera llamada: leer de la tabla</span>
<span class="fn">  EXEC SQL SELECT VALOR INTO :vConfig FROM CONFIG WHERE CLAVE = 'URL_API';</span>
<span class="kw">ENDIF;</span>
<span class="cm">// Llamadas 2, 3... usan vConfig cacheado en memoria → sin I/O</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>ACTGRP(*CALLER) con COMMIT boundary propio:</strong> Con <code>ACTGRP(*CALLER)</code>, el programa comparte el commit boundary del llamador. Si haces <code>COMMIT</code> dentro del programa, también confirmas las operaciones pendientes del llamador — puede causar commits parciales inesperados en transacciones del padre.</li>
    <li><strong>ACTGRP(*NEW) esperando persistencia:</strong> Las variables <code>STATIC</code> en un programa con <code>ACTGRP(*NEW)</code> se destruyen cuando el programa retorna (el activation group se destruye). Si necesitas que persistan entre llamadas, usa <code>ACTGRP('NOMBRE')</code> nombrado.</li>
    <li><strong>Archivos abiertos en ACTGRP(*NEW) no cerrados:</strong> Si el programa abre archivos y hace RETURN sin cerrarlos, con <code>ACTGRP(*NEW)</code> se cierran automáticamente al destruirse el grupo. Pero con <code>ACTGRP(*CALLER)</code>, los archivos quedan abiertos en el grupo del llamador hasta que este termine.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>Para ver todos los activation groups activos de un job en tiempo real usa: <code>SELECT * FROM QSYS2.ACTIVATION_GROUP_INFO WHERE JOB_NAME = QSYS2.JOB_NAME()</code>. Muestra el nombre del grupo, los programas vinculados a él y el estado. Invaluable para diagnosticar por qué un COMMIT afecta más tablas de las esperadas.</p>
</div>`,
        obj:'Comprender la diferencia entre ACTGRP(*CALLER), *NEW y nombre propio. Ver el impacto en COMMIT y en recursos compartidos.',
        enun:'Crea tres versiones del mismo programa PRESACT1/2/3, cada uno con un ACTGRP diferente (*CALLER, *NEW, "BIBLIOTECA"). Desde un programa principal ACTGTEST llama a los tres y observa: (a) cuál comparte recursos de archivo con el llamador, (b) cuál tiene su propio commit boundary, (c) qué pasa con los archivos abiertos al retornar.',
        hints:[
          '<code>CTL-OPT ACTGRP(*CALLER)</code> — hereda el grupo del llamador, comparte recursos',
          '<code>CTL-OPT ACTGRP(*NEW)</code> — grupo nuevo, propio commit boundary, destruido al retornar',
          '<code>CTL-OPT ACTGRP(\'BIBLIOTECA\')</code> — grupo nombrado, persiste entre llamadas',
          'Con ACTGRP(*NEW) un ROLLBACK solo afecta a ese programa, no al llamador',
          'Usa <code>DSPJOB</code> opción 20 para ver los activation groups activos'
        ],
        conceptos:['ACTGRP(*CALLER)','ACTGRP(*NEW)','Activation group nombrado','Commit boundary','ILE'],
        solucion:`// ── PRESACT1 — ACTGRP(*CALLER): hereda recursos del llamador ──────
**FREE
CTL-OPT OPTION(*NODEBUGIO:*SRCSTMT) DFTACTGRP(*NO) ACTGRP(*CALLER);
// Comparte archivos abiertos y commit boundary con el programa llamador.
// Si el llamador tiene LIBROS abierto con CHAIN, este programa lo ve igual.
// Un COMMIT aquí confirma TODAS las transacciones del grupo del llamador.
DCL-F LIBROS USAGE(*INPUT) KEYED;
DCL-S vTtl CHAR(60);
CHAIN 'LIB0001' LIBREC;
IF %FOUND(LIBROS); vTtl = LIBTTL; ENDIF;
DSPLY ('CALLER - ' + %TRIM(vTtl));
*INLR = *ON;

// ── PRESACT2 — ACTGRP(*NEW): grupo propio, se destruye al retornar ──
**FREE
CTL-OPT OPTION(*NODEBUGIO:*SRCSTMT) DFTACTGRP(*NO) ACTGRP(*NEW);
// Grupo completamente aislado. Los archivos abiertos aquí se cierran
// automáticamente al RETURN. COMMIT solo afecta a este grupo.
// IDEAL para SPs que deben tener commit boundary independiente.
DCL-F LIBROS USAGE(*INPUT) KEYED;
EXEC SQL SET OPTION COMMIT = *CHG;
// Aquí: SELECT, INSERT, etc. con su propio COMMIT/ROLLBACK
EXEC SQL COMMIT; // Solo confirma cambios de ESTE activation group
*INLR = *ON;

// ── PRESACT3 — ACTGRP('BIBLIOTECA'): grupo nombrado, persiste ───────
**FREE
CTL-OPT OPTION(*NODEBUGIO:*SRCSTMT) DFTACTGRP(*NO) ACTGRP('BIBLIOTECA');
// El grupo 'BIBLIOTECA' persiste mientras el job esté activo.
// Segunda llamada al mismo grupo: reutiliza archivos ya abiertos.
// Ideal para Service Programs que cachean datos entre llamadas.
DCL-F LIBROS USAGE(*INPUT) KEYED;
DCL-S nLlamada INT(10) STATIC INZ(0); // STATIC persiste entre llamadas!
nLlamada += 1;
DSPLY ('Llamada #' + %CHAR(nLlamada)); // Incrementa en cada llamada
*INLR = *ON;

/* Verificar activation groups activos: */
DSPJOB OPTION(*ACTGRP)
/* O desde SQL: */
SELECT * FROM QSYS2.ACT_GRP_INFO WHERE JOB_NAME = CURRENT_SERVER;`
      },
      {
        id:'F5-E4', nivel:'D', title:'Prueba unitaria con rpgunit para el Service Program',
        background:'rpgunit es el framework de pruebas unitarias open source para IBM i, mantenido por la comunidad. Funciona de forma similar a JUnit (Java) o pytest (Python): cada procedimiento cuyo nombre empieza con "test" es ejecutado automáticamente por el runner RUCALLTST, que reporta PASSED/FAILED con el mensaje del assert fallido.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">Por qué las pruebas unitarias son críticas en IBM i</div>
  <div class="th-concept-desc">
    En IBM i, los cambios a programas de producción tienen un costo alto: compilar, desplegar,
    y cualquier bug puede afectar miles de transacciones bancarias o comerciales.
    Las pruebas unitarias con rpgunit crean una red de seguridad: puedes cambiar la implementación
    de un Service Program y verificar en segundos que todas las funciones siguen comportándose
    como se espera.
    <br><br>
    <strong>Ventaja específica de rpgunit:</strong> corre directamente en IBM i, tiene acceso
    a todos los objetos del sistema, y puede probar código que accede a la base de datos real
    (aunque se prefiere usar fixtures/datos de prueba en una librería separada).
  </div>
  <div class="th-example"><span class="cm">// Estructura de un test suite rpgunit:</span>
<span class="fn">**FREE</span>
<span class="fn">CTL-OPT NOMAIN ACTGRP(*CALLER)</span>
<span class="fn">        BNDDIR('RPGUNIT/RPGUNIT' : 'BIBLIOTECA/UTILSRV');</span>
<span class="fn">/COPY RPGUNIT/QINCLUDE,ASSERT</span>
<span class="fn">/COPY BIBLIOTECA/QCPYSRC,UTILSRV_H</span>

<span class="cm">// setUp: se ejecuta ANTES de cada test individual</span>
<span class="kw">DCL-PROC setUp; ... END-PROC;</span>

<span class="cm">// tearDown: se ejecuta DESPUÉS de cada test</span>
<span class="kw">DCL-PROC tearDown; ... END-PROC;</span>

<span class="cm">// Los tests: deben empezar con "test"</span>
<span class="kw">DCL-PROC testFormatearFechaFormato; ... END-PROC;</span>
<span class="kw">DCL-PROC testPadIzqConCeros;        ... END-PROC;</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">Macros de aserción: <code>aEqual</code>, <code>iEqual</code>, <code>assert</code></div>
  <div class="th-concept-desc">
    Las aserciones son la pieza central de cualquier test: comparan el valor esperado con el
    valor real y reportan FAILED si difieren, con un mensaje descriptivo.
  </div>
  <table class="th-table">
    <tr><th>Macro</th><th>Tipo</th><th>Ejemplo</th></tr>
    <tr><td><code>aEqual(exp:act:msg)</code></td><td>CHAR / VARCHAR</td><td><code>aEqual('25/12/2024':vRes:'Formato fecha')</code></td></tr>
    <tr><td><code>iEqual(exp:act:msg)</code></td><td>INT numérico</td><td><code>iEqual(7:%LEN(vPad):'Longitud pad')</code></td></tr>
    <tr><td><code>assert(cond:msg)</code></td><td>Booleano</td><td><code>assert(vOk:'Debe retornar TRUE')</code></td></tr>
    <tr><td><code>fail(msg)</code></td><td>—</td><td><code>fail('No debería llegar aquí')</code></td></tr>
  </table>
  <div class="th-example"><span class="cm">// Test que verifica formato de fecha:</span>
<span class="kw">DCL-PROC testFormatearFechaFormato;</span>
<span class="fn">  DCL-S vFecha   DATE     INZ(D'2024-12-25');</span>
<span class="fn">  DCL-S vResulta VARCHAR(10);</span>
<span class="fn">  DCL-S vEspera  VARCHAR(10) INZ('25/12/2024');</span>

<span class="fn">  vResulta = FormatearFecha(vFecha);</span>

<span class="fn">  aEqual(vEspera : vResulta : 'FormatearFecha: formato DD/MM/YYYY');</span>
<span class="kw">END-PROC;</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">Ejecutar y leer resultados con <code>RUCALLTST</code></div>
  <div class="th-concept-desc">
    <code>RUCALLTST TSTPGM(BIBLIOTECA/TUTILSRV)</code> ejecuta todos los procedimientos
    que empiezan con "test" en orden alfabético. El resultado en pantalla muestra:
    <code>PASSED</code> o <code>FAILED: [mensaje del assert]</code> para cada test.
    <br><br>
    Para integración CI/CD, rpgunit también puede exportar resultados en formato JUnit XML
    que Jenkins, GitLab CI o GitHub Actions pueden procesar para mostrar los resultados
    en la interfaz del pipeline.
  </div>
  <div class="th-example"><span class="cm">/* Ejecutar todos los tests: */</span>
<span class="fn">RUCALLTST TSTPGM(BIBLIOTECA/TUTILSRV)</span>

<span class="cm">/* Resultado esperado:
   testFormatearFechaFormato .......... PASSED
   testFormatearFechaEspecifica ....... PASSED
   testPadIzqConCeros ................. PASSED
   testPadIzqStringMasLargo ........... PASSED
   4 tests, 0 failures, 0 errors */</span>

<span class="cm">/* Exportar XML para CI: */</span>
<span class="fn">RUCALLTST TSTPGM(BIBLIOTECA/TUTILSRV) XMLSTMF('/tmp/results.xml')</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>Nombre de procedimiento de test no empieza por "test":</strong> rpgunit solo ejecuta automáticamente los procedimientos cuyo nombre empieza con <code>test</code> (minúsculas). <code>TestFormatear</code> o <code>testformatear</code> funcionan, pero <code>verificarFormato</code> no se ejecuta.</li>
    <li><strong>aEqual con tipos incompatibles:</strong> <code>aEqual('12/12/2024' : vFecha)</code> falla si <code>vFecha</code> es DATE en lugar de CHAR. Convierte el resultado con <code>%CHAR</code> antes de comparar con <code>aEqual</code>.</li>
    <li><strong>setUp modificando datos de prueba entre tests:</strong> Si <code>setUp</code> no limpia el estado completamente antes de cada test, un test puede contaminar al siguiente. Cada test debe ser independiente — usa <code>setUp</code> para inicializar todo desde cero.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>Integra rpgunit en un pipeline CI usando <code>RUCALLTST XMLSTMF('/tmp/results.xml')</code> y un plugin JUnit para Jenkins/GitLab CI. El XML de rpgunit es compatible con JUnit — tus tests RPGLE aparecerán en el mismo dashboard que los tests de Java, Python o cualquier otro lenguaje del equipo.</p>
</div>`,
        obj:'Escribir tests rpgunit para validar los procedimientos del SRVPGM UTILSRV creado en F5-E1.',
        enun:'Crea el programa de prueba TUTILSRV usando rpgunit que verifique: (a) FormatearFecha retorna formato DD/MM/YYYY, (b) PadIzq rellena correctamente con ceros, (c) PadIzq no recorta strings que ya son más largos, (d) FormatearFecha con una fecha específica retorna el valor esperado.',
        hints:[
          'Instala rpgunit: <code>RSTOBJ OBJ(*ALL) SAVLIB(RPGUNIT) DEV(*SAVF)</code>',
          'Un test program rpgunit usa <code>CTL-OPT NOMAIN</code> y cada test es un <code>DCL-PROC setUp/testXXX</code>',
          '<code>aEqual(expected:actual:testName)</code> — assert de igualdad',
          '<code>iEqual(expectedInt:actualInt:testName)</code> — assert entero',
          'Ejecuta con: <code>RUCALLTST TSTPGM(BIBLIOTECA/TUTILSRV)</code>'
        ],
        conceptos:['rpgunit','RUCALLTST','aEqual','iEqual','setUp','Test unitario','NOMAIN'],
        solucion:`// ── QRPGLESRC/TUTILSRV — Test suite para UTILSRV ───────────────────
**FREE
CTL-OPT NOMAIN OPTION(*NODEBUGIO:*SRCSTMT)
        DFTACTGRP(*NO) ACTGRP(*CALLER)
        BNDDIR('RPGUNIT/RPGUNIT' : 'BIBLIOTECA/UTILSRV');

/COPY BIBLIOTECA/QCPYSRC,UTILSRV_H
/COPY RPGUNIT/QINCLUDE,ASSERT  // Macros de aserción

// ── setUp: se ejecuta antes de cada test ─────────────────────────────
DCL-PROC setUp;
  // Inicialización si necesaria
END-PROC;

// ── Test 1: FormatearFecha retorna formato correcto ───────────────────
DCL-PROC testFormatearFechaFormato;
  DCL-S vFecha   DATE   INZ(D'2024-12-25');
  DCL-S vResulta VARCHAR(10);
  DCL-S vEsperada VARCHAR(10) INZ('25/12/2024');

  vResulta = FormatearFecha(vFecha);
  aEqual(vEsperada : vResulta : 'Formato DD/MM/YYYY');
END-PROC;

// ── Test 2: FormatearFecha con fecha de inicio de año ─────────────────
DCL-PROC testFormatearFechaEnero;
  DCL-S vFecha   DATE   INZ(D'2024-01-01');
  DCL-S vResulta VARCHAR(10);

  vResulta = FormatearFecha(vFecha);
  aEqual('01/01/2024' : vResulta : 'Fecha 1 de enero');
END-PROC;

// ── Test 3: PadIzq rellena con ceros correctamente ────────────────────
DCL-PROC testPadIzqConCeros;
  DCL-S vResulta CHAR(50);

  vResulta = PadIzq('LIB1' : 7 : '0');
  aEqual('000LIB1' : %TRIMR(vResulta) : 'PadIzq con 0s');
END-PROC;

// ── Test 4: PadIzq no recorta strings largos ─────────────────────────
DCL-PROC testPadIzqNoRecorta;
  DCL-S vResulta CHAR(50);

  vResulta = PadIzq('LIBRERO' : 3 : '0'); // 7 chars > 3 pedidos
  aEqual('LIBRERO' : %TRIMR(vResulta) : 'No recortar largo');
END-PROC;

// ── Test 5: PadIzq con espacios ───────────────────────────────────────
DCL-PROC testPadIzqConEspacios;
  DCL-S vResulta CHAR(50);

  vResulta = PadIzq('ABC' : 6 : ' ');
  aEqual('   ABC' : %LEFT(vResulta:6) : 'PadIzq con espacios');
END-PROC;

/* Ejecutar las pruebas: */
RUCALLTST TSTPGM(BIBLIOTECA/TUTILSRV)

/* Ver resultados en pantalla — muestra PASSED/FAILED por cada test */`
