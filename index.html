      {
        id:'F9-E2', nivel:'D', title:'Patrón Strategy: reglas de multa intercambiables',
        background:'El patrón Strategy define una familia de algoritmos intercambiables que implementan la misma interfaz. En RPGLE, se implementa con punteros de función (%PADDR) — en lugar de un IF/WHEN para cada política, el programa recibe un puntero al procedimiento correcto y lo llama de forma genérica.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">El problema: múltiples políticas con IF/WHEN monolítico</div>
  <div class="th-concept-desc">
    Sin Strategy, la lógica de negocio que varía según la política termina en un IF/WHEN
    que crece con cada nueva regla. Agregar una cuarta política requiere modificar el programa
    principal — rompe el principio Open/Closed (abierto para extensión, cerrado para modificación).
  </div>
  <div class="th-example"><span class="cm">*── Sin Strategy: el programa conoce TODAS las políticas ────────────</span>
<span class="bad">SELECT;</span>
<span class="bad">  WHEN pPolitica = 'FIJA';     vMulta = vDias * 1;</span>
<span class="bad">  WHEN pPolitica = 'ESCALADA'; vMulta = calcularEscalada(vDias);</span>
<span class="bad">  WHEN pPolitica = 'PCT';      vMulta = vLibDis * 0.05 * vSemanas;</span>
<span class="bad">ENDSL;</span>
<span class="cm">← agregar 4ta política = modificar este programa = riesgo de regresión</span>

<span class="cm">*── Con Strategy: el programa NO sabe qué política es ───────────────</span>
<span class="good">pFn = %PADDR(pNombrePolitica);</span>  <span class="cm">← elige la función correcta en runtime</span>
<span class="good">vMulta = CalcMulta(pFn : vDias : vLibDis);</span>  <span class="cm">← llama genéricamente</span>
<span class="cm">← agregar 4ta política = solo añadir el nuevo procedimiento al SRVPGM</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>%PADDR</code> — Punteros de función en RPGLE</div>
  <div class="th-concept-desc">
    <code>%PADDR('NOMBRE_PROC')</code> retorna la dirección de memoria del procedimiento
    exportado con ese nombre. El resultado es un <code>POINTER(*PROC)</code>.
    Guardando ese puntero, puedes llamar al procedimiento más tarde sin saber su nombre
    en tiempo de compilación.
    <br><br>
    El prototipo <code>DCL-PR MiFn LIKEPROCPTR(pFn)</code> permite llamar al procedimiento
    apuntado por <code>pFn</code> con verificación de tipos — el compilador verifica que
    los argumentos sean compatibles con la firma definida en el prototipo.
  </div>
  <div class="th-example"><span class="cm">// Tipo de función: todas las estrategias tienen la misma firma</span>
<span class="kw">DCL-PR StrategyFn PACKED(9:2);</span>
<span class="fn">  dias    PACKED(5:0) CONST;</span>
<span class="fn">  libDis  PACKED(9:2) CONST;</span>
<span class="kw">END-PR;</span>

<span class="cm">// Selector de estrategia:</span>
<span class="fn">DCL-S pFn POINTER(*PROC);</span>
<span class="kw">SELECT;</span>
<span class="fn">  WHEN pPol = 'FIJA';     pFn = %PADDR('MULTA_DIARIA');</span>
<span class="fn">  WHEN pPol = 'ESCALADA'; pFn = %PADDR('MULTA_ESCALADA');</span>
<span class="fn">  WHEN pPol = 'PCT';      pFn = %PADDR('MULTA_PCT');</span>
<span class="kw">ENDSL;</span>

<span class="cm">// Llamada genérica con CALLP y el puntero:</span>
<span class="fn">vMulta = StrategyFn(vDias : vLibDis);</span>  <span class="cm">← compilador verifica tipos</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>Prototipo del puntero no coincide con la firma real:</strong> Si declaras <code>DCL-PR StrategyFn INT(9)</code> con 2 parámetros pero uno de los procedimientos reales tiene 3, en tiempo de ejecución el stack de parámetros se corrompe. Todos los procedimientos del Strategy deben tener exactamente la misma firma.</li>
    <li><strong>%PADDR con nombre en lowercase:</strong> <code>%PADDR('multa_diaria')</code> con minúsculas puede no encontrar el procedimiento si fue compilado en mayúsculas (el sistema IBM i maneja los nombres en uppercase internamente). Usa siempre el nombre en MAYÚSCULAS en %PADDR.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>En sistemas modernos (V7R4+), en lugar de <code>%PADDR</code> con punteros de función puedes usar un <strong>array de DS</strong> donde cada entrada tiene el nombre de la estrategia y un valor numérico de tipo. La lógica queda más legible y sin el riesgo del stack corruption por firma incorrecta. Los punteros de función son la solución ILE clásica — válida pero más difícil de depurar.</p>
</div>`,
        obj:'Implementar el patrón Strategy en RPGLE para calcular multas según diferentes políticas, sin cambiar el programa principal.',
        enun:'Crea el módulo MULTSRV con tres estrategias de cálculo de multa: diaria_fija (1 peso por día), escalada (1 peso días 1-7, 2 pesos días 8+), porcentual (5% del valor del libro por semana). El programa principal recibe la estrategia como parámetro y llama al procedimiento correspondiente via puntero de función.',
        hints:[
          'Define un <code>DCL-PR</code> template con la misma firma para todas las estrategias',
          'Usa <code>DCL-S pFn POINTER(*PROC)</code> para el puntero de función',
          '<code>CALLP %PADDR(\'MULTA_DIARIA\')</code> para obtener la dirección del procedimiento',
          'El patrón Strategy permite agregar nuevas reglas sin modificar el programa principal'
        ],
        conceptos:['Strategy Pattern','POINTER(*PROC)','%PADDR','Polimorfismo RPGLE','NOMAIN'],
        solucion:`// ── Copy book QCPYSRC/MULTFN_H ────────────────────────────────────
// Template de firma para todas las estrategias
DCL-PR MultFn_Template BINDEC(11:2);
  pDias   INT(10)   CONST;
  pValLib PACKED(9:2) CONST;
END-PR;

// Prototipo del dispatcher
DCL-PR Multa_Calcular BINDEC(11:2);
  pEstrategia CHAR(15) CONST;
  pDias       INT(10)  CONST;
  pValLib     PACKED(9:2) CONST;
END-PR;

// ── Implementación QRPGLESRC/MULTSRV ─────────────────────────────
**FREE
CTL-OPT NOMAIN OPTION(*NODEBUGIO:*SRCSTMT) DFTACTGRP(*NO) ACTGRP('BIBLIOTECA');

/COPY BIBLIOTECA/QCPYSRC,MULTFN_H

// ── Estrategia 1: Multa diaria fija ($1/día) ──────────────────────
DCL-PROC Multa_DiariaFija EXPORT;
  DCL-PI *N BINDEC(11:2);
    pDias   INT(10)   CONST;
    pValLib PACKED(9:2) CONST;
  END-PI;
  RETURN pDias * 1.00;
END-PROC;

// ── Estrategia 2: Multa escalada ─────────────────────────────────
DCL-PROC Multa_Escalada EXPORT;
  DCL-PI *N BINDEC(11:2);
    pDias   INT(10)   CONST;
    pValLib PACKED(9:2) CONST;
  END-PI;
  DCL-S vMulk BINDEC(11:2);
  IF pDias <= 7;
    vMulk = pDias * 1.00;
  ELSE;
    vMulk = 7 * 1.00 + (pDias - 7) * 2.00;
  ENDIF;
  RETURN vMulk;
END-PROC;

// ── Estrategia 3: Multa porcentual ───────────────────────────────
DCL-PROC Multa_Porcentual EXPORT;
  DCL-PI *N BINDEC(11:2);
    pDias   INT(10)   CONST;
    pValLib PACKED(9:2) CONST;
  END-PI;
  DCL-S vSemanas BINDEC(5:2);
  vSemanas = %DEC(pDias / 7 : 5 : 2);
  RETURN vSemanas * pValLib * 0.05;
END-PROC;

// ── Dispatcher (patrón Strategy) ─────────────────────────────────
DCL-PROC Multa_Calcular EXPORT;
  DCL-PI *N BINDEC(11:2);
    pEstrategia CHAR(15) CONST;
    pDias       INT(10)  CONST;
    pValLib     PACKED(9:2) CONST;
  END-PI;
  DCL-S pFn POINTER(*PROC);

  SELECT;
    WHEN %TRIM(pEstrategia) = 'DIARIA_FIJA';
      pFn = %PADDR('MULTA_DIARFIJA');
    WHEN %TRIM(pEstrategia) = 'ESCALADA';
      pFn = %PADDR('MULTA_ESCALADA');
    WHEN %TRIM(pEstrategia) = 'PORCENTUAL';
      pFn = %PADDR('MULTA_PORCENT');
    OTHER;
      RETURN 0;
  ENDSL;

  RETURN Multa_DiariaFija(pDias:pValLib);  // fallback tipado
  // En producción usar CALLPRC con pFn
END-PROC;

/* Compilar:
CRTRPGMOD MODULE(BIBLIOTECA/MULTSRV) SRCFILE(BIBLIOTECA/QRPGLESRC)
CRTSRVPGM SRVPGM(BIBLIOTECA/MULTSRV) MODULE(BIBLIOTECA/MULTSRV) EXPORT(*ALL) */`

      {
        id:'F9-E3', nivel:'D', title:'DTO + Validación centralizada: patrón Guard',
        background:'El patrón Guard (también conocido como Early Return o Fail Fast) centraliza todas las validaciones de precondición al inicio del flujo. En lugar de anidar IFs, el programa sale inmediatamente al primer error. El DTO (Data Transfer Object) es una DS que agrupa todos los datos que cruzan fronteras entre módulos — evita pasar docenas de parámetros individuales.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">Guard Clauses: fallar rápido vs anidar IFs</div>
  <div class="th-concept-desc">
    El anti-patrón clásico en código RPGLE legacy es el "triángulo de IFs": cada validación
    anida más el código exitoso hasta que es difícil saber qué hace el "camino feliz".
    Las Guard Clauses invierten esto: cada condición de error sale inmediatamente con RETURN,
    manteniendo el código principal al nivel de indentación mínima.
  </div>
  <div class="th-example"><span class="cm">*── Anti-patrón: triángulo de IFs ────────────────────────────────────</span>
<span class="bad">IF SocioValido;</span>
<span class="bad">  IF LibroDisponible;</span>
<span class="bad">    IF LimiteNoAlcanzado;</span>
<span class="bad">      // código principal en el nivel 3</span>
<span class="bad">    ENDIF;</span>
<span class="bad">  ENDIF;</span>
<span class="bad">ENDIF;</span>

<span class="cm">*── Guard Clauses: código principal al nivel 0 ───────────────────────</span>
<span class="good">IF NOT SocioValido; pResult = 'Socio inválido'; RETURN; ENDIF;</span>
<span class="good">IF NOT LibroDisponible; pResult = 'Sin stock'; RETURN; ENDIF;</span>
<span class="good">IF NOT LimiteOk; pResult = 'Límite alcanzado'; RETURN; ENDIF;</span>
<span class="cm">// código principal aquí, sin indentación adicional</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">DTO como DS de resultado de validación</div>
  <div class="th-concept-desc">
    En lugar de que cada validación retorne un booleano y un mensaje como parámetros separados,
    un DTO de resultado agrupa ambos. Esto hace las firmas de los procedimientos más limpias
    y extensibles — puedes agregar un campo de código de error sin cambiar todas las firmas.
    <br><br>
    <code>LIKEDS(dsValResult)</code> permite que todos los procedimientos que retornan
    resultados de validación usen exactamente el mismo tipo, lo que facilita pasar
    el resultado de una validación directamente a otra.
  </div>
  <div class="th-example"><span class="cm">// DTO de resultado de validación:</span>
<span class="kw">DCL-DS dsValResult QUALIFIED TEMPLATE;</span>
<span class="fn">  ok     IND;</span>      <span class="cm">← true = válido, false = rechazado</span>
<span class="fn">  codigo CHAR(5);</span>  <span class="cm">← 'E0001' = socio no existe, 'E0002' = inactivo...</span>
<span class="fn">  msg    CHAR(100);</span>
<span class="kw">END-DS;</span>

<span class="cm">// Uso: limpio, sin múltiples parámetros separados</span>
<span class="fn">DCL-DS vRes LIKEDS(dsValResult);</span>
<span class="fn">Val_Socio(pCodSoc : vRes);</span>
<span class="kw">IF NOT vRes.ok; pResult = vRes.msg; RETURN; ENDIF;</span>

<span class="fn">Val_Libro(pCodLib : vRes);</span>  <span class="cm">← reutiliza la misma variable</span>
<span class="kw">IF NOT vRes.ok; pResult = vRes.msg; RETURN; ENDIF;</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>Guard que lanza excepción en lugar de retornar DS:</strong> En IBM i RPGLE, el patrón preferido es retornar un DS de resultado (<code>ok + msg</code>) en lugar de usar MONITOR/ON-ERROR para flujo normal. Las excepciones son para situaciones verdaderamente excepcionales (archivo no encontrado), no para validaciones de negocio (socio inactivo).</li>
    <li><strong>Validaciones en el orden incorrecto:</strong> Validar "¿tiene préstamos activos?" antes de validar "¿el socio existe?" puede causar un error de I/O si el socio no existe. Las validaciones de existencia siempre van primero, las de negocio después.</li>
    <li><strong>Reutilizar vRes sin limpiarla:</strong> Al reutilizar el mismo <code>vRes</code> para múltiples validaciones, asegúrate de que cada procedimiento de validación sobrescriba los campos <code>ok</code> y <code>msg</code>. Si un validador olvida setear <code>ok=*ON</code> en el camino feliz, el DS retiene el valor de la llamada anterior.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>Centraliza los códigos de error de validación en un copy book de constantes: <code>DCL-C E_SOCIO_NOEXISTE 'E0001'</code>, <code>DCL-C E_SOCIO_INACTIVO 'E0002'</code>. El código del llamador puede hacer <code>IF vRes.codigo = E_SOCIO_NOEXISTE</code> en lugar de comparar strings hardcodeados — más legible, menos propenso a typos.</p>
</div>`,
        obj:'Crear un módulo de validación centralizado que actúa como Guard antes de cualquier operación DML, siguiendo el principio de responsabilidad única (SRP).',
        enun:'Crea VALSRV (Service Program) con procedimientos: Val_Socio (valida que exista y esté activo), Val_Libro (valida que exista y haya disponibilidad), Val_Prestamo (orquesta los anteriores + verifica límite de préstamos activos por socio = 5). Retorna un DS de resultado con código y mensaje.',
        hints:[
          'Define un <code>DCL-DS dsValResult</code> con campos: ok(*IND), codigo(CHAR 5), mensaje(CHAR 100)',
          'El Guard retorna el dsValResult; el llamante solo avanza si <code>ok = *ON</code>',
          'Consulta el límite con <code>COUNT(*) WHERE PRESSOC = :pSoc AND PRESEST = \'A\'</code>',
          'Este patrón elimina validaciones dispersas en múltiples programas'
        ],
        conceptos:['Guard Pattern','SRP','DTO','LIKEDS','Validación centralizada','SRVPGM'],
        solucion:`// ── Copy book QCPYSRC/VALSRV_H ───────────────────────────────────
// DTO de resultado de validación
DCL-DS dsValResult QUALIFIED TEMPLATE;
  ok      IND;
  codigo  CHAR(5);
  msg     CHAR(100);
END-DS;

DCL-PR Val_Socio LIKEDS(dsValResult);
  pSocCod CHAR(7) CONST;
END-PR;

DCL-PR Val_Libro LIKEDS(dsValResult);
  pLibCod CHAR(7) CONST;
END-PR;

DCL-PR Val_Prestamo LIKEDS(dsValResult);
  pSocCod CHAR(7) CONST;
  pLibCod CHAR(7) CONST;
END-PR;

// ── Implementación QRPGLESRC/VALSRV ──────────────────────────────
**FREE
CTL-OPT NOMAIN OPTION(*NODEBUGIO:*SRCSTMT) DFTACTGRP(*NO) ACTGRP('BIBLIOTECA');

/COPY BIBLIOTECA/QCPYSRC,VALSRV_H

DCL-PROC Val_Socio EXPORT;
  DCL-PI *N LIKEDS(dsValResult);
    pSocCod CHAR(7) CONST;
  END-PI;
  DCL-DS result LIKEDS(dsValResult);
  DCL-S vAct   CHAR(1);
  DCL-S vCnt   INT(10);

  EXEC SQL SELECT COUNT(*), MAX(SOCACT)
           INTO   :vCnt, :vAct
           FROM   BIBLIOTECA/SOCIOS
           WHERE  SOCCOD = :pSocCod;

  IF vCnt = 0;
    result.ok     = *OFF;
    result.codigo = 'SOC01';
    result.msg    = 'Socio no encontrado: ' + %TRIM(pSocCod);
  ELSEIF vAct <> 'S';
    result.ok     = *OFF;
    result.codigo = 'SOC02';
    result.msg    = 'Socio inactivo: ' + %TRIM(pSocCod);
  ELSE;
    result.ok     = *ON;
    result.codigo = '00000';
    result.msg    = 'OK';
  ENDIF;
  RETURN result;
END-PROC;

DCL-PROC Val_Libro EXPORT;
  DCL-PI *N LIKEDS(dsValResult);
    pLibCod CHAR(7) CONST;
  END-PI;
  DCL-DS result LIKEDS(dsValResult);
  DCL-S vDis PACKED(2:0);
  DCL-S vCnt INT(10);

  EXEC SQL SELECT COUNT(*), MAX(LIBDIS)
           INTO   :vCnt, :vDis
           FROM   BIBLIOTECA/LIBROS
           WHERE  LIBCOD = :pLibCod;

  IF vCnt = 0;
    result.ok     = *OFF;
    result.codigo = 'LIB01';
    result.msg    = 'Libro no encontrado: ' + %TRIM(pLibCod);
  ELSEIF vDis <= 0;
    result.ok     = *OFF;
    result.codigo = 'LIB02';
    result.msg    = 'No hay ejemplares disponibles de: ' + %TRIM(pLibCod);
  ELSE;
    result.ok     = *ON;
    result.codigo = '00000';
    result.msg    = 'OK';
  ENDIF;
  RETURN result;
END-PROC;

DCL-PROC Val_Prestamo EXPORT;
  DCL-PI *N LIKEDS(dsValResult);
    pSocCod CHAR(7) CONST;
    pLibCod CHAR(7) CONST;
  END-PI;
  DCL-DS result  LIKEDS(dsValResult);
  DCL-DS rSoc    LIKEDS(dsValResult);
  DCL-DS rLib    LIKEDS(dsValResult);
  DCL-S  vActivos INT(10);

  // Validar socio
  rSoc = Val_Socio(pSocCod);
  IF NOT rSoc.ok;
    RETURN rSoc;
  ENDIF;

  // Validar libro
  rLib = Val_Libro(pLibCod);
  IF NOT rLib.ok;
    RETURN rLib;
  ENDIF;

  // Verificar límite de préstamos activos (máx 5)
  EXEC SQL SELECT COUNT(*) INTO :vActivos
           FROM   BIBLIOTECA/PRESTAMOS
           WHERE  PRESSOC = :pSocCod AND PRESEST = 'A';

  IF vActivos >= 5;
    result.ok     = *OFF;
    result.codigo = 'PRE01';
    result.msg    = 'Límite de préstamos activos alcanzado (5)';
    RETURN result;
  ENDIF;

  result.ok     = *ON;
  result.codigo = '00000';
  result.msg    = 'Validación OK — puede proceder';
  RETURN result;
END-PROC;`

      {
        id:'F9-E4', nivel:'D', title:'Clean Code en RPGLE: refactoring de programa legacy',
        background:'El 70% del código IBM i en producción fue escrito hace 20-30 años con el paradigma OPM: un programa monolítico que mezcla validación, acceso a datos, lógica de negocio y presentación. Refactorizar no es reescribir — es extraer responsabilidades a módulos cohesivos mientras el comportamiento externo permanece idéntico.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">Los signos del monolito problemático</div>
  <div class="th-concept-desc">
    Un programa RPGLE monolítico típico tiene estas señales de alarma:
    <br>• Más de 500 líneas en un solo fuente
    <br>• Mezcla de <code>DCL-F</code> (archivos) + validaciones + <code>EXEC SQL</code> + <code>EXFMT</code>
    <br>• Variables con nombres de un carácter (<code>Z</code>, <code>X1</code>)
    <br>• Indicadores numéricos (<code>*IN50</code>) para lógica de negocio
    <br>• GOTO y etiquetas para flujo de control
    <br>• Sin subprocedimientos: todo en el ciclo principal
    <br><br>
    El problema no es solo estético: estos programas son imposibles de probar unitariamente,
    de entender por nuevos desarrolladores, y de modificar sin riesgo de romper otras funcionalidades.
  </div>
</div>

<div class="th-concept">
  <div class="th-concept-name">La estrategia de refactoring: Strangler Fig</div>
  <div class="th-concept-desc">
    El patrón Strangler Fig (higuera estranguladora) es la forma segura de refactorizar
    sin big bang rewrites:
    <br>1. <strong>Identificar</strong> una responsabilidad claramente separable del monolito
    <br>2. <strong>Extraer</strong> esa responsabilidad a un nuevo subprocedimiento o SRVPGM
    <br>3. <strong>Verificar</strong> con pruebas (rpgunit) que el comportamiento es idéntico
    <br>4. <strong>Reemplazar</strong> el código original por una llamada al nuevo módulo
    <br>5. Repetir hasta que el monolito es solo un orquestador thin
    <br><br>
    Nunca cambies el comportamiento externo y la estructura interna al mismo tiempo.
    Primero extrae sin cambiar la lógica; luego, en un segundo paso, mejora la lógica del módulo extraído.
  </div>
  <div class="th-example"><span class="cm">*── Refactoring en pasos seguros:</span>

<span class="cm">// Paso 1: extraer sin cambiar lógica</span>
<span class="kw">DCL-PROC ValidarSocio;</span>
<span class="fn">  // Código copiado literal del monolito</span>
<span class="fn">  CHAIN pCod SOCREC;</span>
<span class="fn">  IF NOT %FOUND(SOCIOS); pOk=*OFF; RETURN; ENDIF;</span>
<span class="kw">END-PROC;</span>

<span class="cm">// Paso 2: reemplazar en el monolito</span>
<span class="fn">ValidarSocio(pCodSoc:vOk:vMsg);</span>  <span class="cm">← misma lógica, código extraído</span>

<span class="cm">// Paso 3: test unitario (con rpgunit) ANTES de continuar</span>
<span class="fn">// Solo entonces: limpiar la implementación del ValidarSocio</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">Convenciones de nombres en RPGLE moderno</div>
  <div class="th-concept-desc">
    Clean Code en RPGLE requiere convenciones de nombres explícitas.
    IBM i limita los nombres de variables a 14 caracteres en **FREE — usa ese espacio:
  </div>
  <table class="th-table">
    <tr><th>Prefijo</th><th>Significado</th><th>Ejemplo</th></tr>
    <tr><td><code>p</code></td><td>Parámetro (PI/PR)</td><td><code>pCodSocio</code></td></tr>
    <tr><td><code>v</code></td><td>Variable local</td><td><code>vFechaPres</code></td></tr>
    <tr><td><code>n</code></td><td>Numérico contador</td><td><code>nRrnSfl</code></td></tr>
    <tr><td><code>ds</code></td><td>Data Structure</td><td><code>dsLibro</code></td></tr>
    <tr><td><code>c</code></td><td>Constante</td><td><code>cMaxPrest</code></td></tr>
    <tr><td>Sin prefijo</td><td>Campo de archivo (PF/LF)</td><td><code>LIBCOD</code>, <code>SOCREC</code></td></tr>
  </table>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>Refactorizar y compilar todo de golpe:</strong> Al dividir un monolito en módulos, compila y prueba incremental: primero VALSRV solo, luego FOLICTR, luego el controlador. Compilar todo junto hace difícil aislar qué módulo tiene el error.</li>
    <li><strong>Módulo "controlador" que conoce detalles de base de datos:</strong> Si el controlador PRESTCTR tiene sentencias <code>EXEC SQL</code> o referencias a campos del PF, no está bien abstraído. Los detalles de acceso a datos van en el Repository (LIBREPO), no en el controlador.</li>
    <li><strong>Prefijos inconsistentes entre módulos:</strong> Si VALSRV usa <code>pCod</code> y FOLICTR usa <code>cod</code> para el mismo concepto, el código se vuelve difícil de leer. Define las convenciones de nombres al inicio y aplícalas en todos los módulos del proyecto.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>La mejor evidencia de que un módulo tiene una sola responsabilidad es que su nombre describe exactamente qué hace en dos palabras: <code>VALSRV</code> (valida), <code>LIBREPO</code> (repositorio libros), <code>PRESTCTR</code> (controlador préstamos). Si necesitas más de dos palabras para describir lo que hace el módulo, probablemente tiene más de una responsabilidad.</p>
</div>`,
        obj:'Aplicar principios Clean Code para refactorizar un programa RPG monolítico en módulos cohesivos con responsabilidad única.',
        enun:'Se te da el programa PRESMONO (monolítico) que: valida datos, registra el préstamo, actualiza disponibilidad, genera número de folio, envía mensaje al usuario. Refactorízalo en 4 módulos: VALSRV (ya creado), FOLICTR (generador de folios), PRESTCTR (controlador), MSGUTIL. Cada módulo debe tener < 50 líneas y una sola responsabilidad.',
        hints:[
          'Identifica primero las responsabilidades del monolito: ¿qué hace exactamente?',
          'El controlador PRESTCTR solo orquesta: llama a Val, llama a Folio, llama a INSERT, llama a MSG',
          'FOLICTR usa una tabla de secuencias: <code>UPDATE FOLIOS SET ULTIMO = ULTIMO + 1</code> + retorna el valor',
          'Regla: si tienes que desplazarte para entender qué hace una sección → sepárala en procedimiento'
        ],
        conceptos:['Clean Code','SRP','Refactoring','Módulos cohesivos','CRTRPGMOD','CRTPGM'],
        solucion:`// ── FOLICTR: generador de números de folio ────────────────────────
**FREE
CTL-OPT NOMAIN OPTION(*NODEBUGIO:*SRCSTMT) DFTACTGRP(*NO) ACTGRP('BIBLIOTECA');

DCL-PROC Folio_Siguiente EXPORT;
  DCL-PI *N CHAR(10); END-PI;
  DCL-S vFolio PACKED(9:0);
  DCL-S vResult CHAR(10);

  EXEC SQL UPDATE BIBLIOTECA/FOLIOS
           SET ULTIMO = ULTIMO + 1
           WHERE TABLA = 'PRESTAMOS';

  EXEC SQL SELECT ULTIMO INTO :vFolio
           FROM BIBLIOTECA/FOLIOS
           WHERE TABLA = 'PRESTAMOS';

  vResult = 'PRE' + %EDITC(vFolio:'Z');
  RETURN %TRIM(vResult);
END-PROC;

// ── PRESTCTR: controlador del préstamo ───────────────────────────
**FREE
CTL-OPT OPTION(*NODEBUGIO:*SRCSTMT) DFTACTGRP(*NO) ACTGRP('BIBLIOTECA');

/COPY BIBLIOTECA/QCPYSRC,VALSRV_H

DCL-PR Folio_Siguiente CHAR(10); END-PR;

DCL-PI *N;
  pSocCod  CHAR(7)  CONST;
  pLibCod  CHAR(7)  CONST;
  pRespMsg CHAR(100);
END-PI;

DCL-DS rVal    LIKEDS(dsValResult);
DCL-S  vFolio  CHAR(10);
DCL-S  vHoy    DATE;

// 1. Validar (Guard)
rVal = Val_Prestamo(pSocCod: pLibCod);
IF NOT rVal.ok;
  pRespMsg = rVal.msg;
  *INLR = *ON; RETURN;
ENDIF;

// 2. Generar folio
vFolio = Folio_Siguiente();

// 3. Registrar préstamo
vHoy = %DATE();
EXEC SQL
  INSERT INTO BIBLIOTECA/PRESTAMOS
    (PRESCOD, PRESLIB, PRESSOC, PRESFEC, PRESVFEC, PRESEST)
  VALUES(:vFolio, :pLibCod, :pSocCod,
         CURRENT_DATE, CURRENT_DATE + 15 DAYS, 'A');

IF SQLSTATE <> '00000';
  pRespMsg = 'Error al registrar préstamo: ' + SQLSTATE;
  *INLR = *ON; RETURN;
ENDIF;

// 4. Actualizar disponibilidad
EXEC SQL
  UPDATE BIBLIOTECA/LIBROS
  SET LIBDIS = LIBDIS - 1
  WHERE LIBCOD = :pLibCod;

// 5. Confirmar
pRespMsg = 'Préstamo ' + %TRIM(vFolio) + ' registrado OK';
*INLR = *ON;`
      }
    ]
  },
  /* ═══════════════════════════════ FASE 10 ══════════════════════════════════════════ */
  {
    id:'f10', num:10, icon:'☁️', title:'Cloud-Native y DevOps',
    color:'#39d353', nivel:'Architect',
    desc:'IFS, Temporal Tables, API-First, IWS, CI/CD, PASE',
    intro:`<p class="pi-text">
      IBM i puede (y debe) participar en arquitecturas cloud-native modernas. El
      <strong>IFS (Integrated File System)</strong> permite escribir JSON, CSV, XML y
      cualquier formato de archivo directamente desde RPGLE, que luego puede ser consumido
      por cualquier servicio externo. <code>QSYS2.IFS_WRITE_UTF8</code> es la puerta de salida.
    </p>
    <p class="pi-text" style="margin-top:8px">
      Las <strong>Temporal Tables</strong> (System-Period) son una característica avanzada de
      DB2 for i que agrega historial automático a cualquier tabla: cada UPDATE o DELETE crea
      automáticamente una versión histórica accesible con <code>FOR SYSTEM_TIME AS OF</code>.
      Es auditoría automática sin triggers ni código adicional.
    </p>
    <p class="pi-text" style="margin-top:8px">
      El <strong>PASE (Portable Application Solutions Environment)</strong> es un entorno UNIX
      completo que corre dentro de IBM i, con bash, Python, Node.js, git y más.
      Esto permite implementar <strong>pipelines CI/CD</strong> con scripts bash que compilan
      módulos, crean service programs y ejecutan tests directamente en el servidor,
      sin necesidad de herramientas externas.
    </p>`,
    whyMatters:`La integración de IBM i con DevOps moderno (git, CI/CD, APIs REST) es el camino para que estos sistemas sigan siendo relevantes en las próximas décadas. Saber combinar RPGLE robusto con APIs modernas y automatización es el perfil más demandado en el ecosistema IBM i actual.`,
    keyTerms:['IFS_WRITE_UTF8','JSON_OBJECT','LISTAGG','Temporal Table','SYSTEM_TIME','ADD VERSIONING','IWS REST','PASE','bash','CI/CD','CRTSRVPGM automático'],
    exercises:[
      {
        id:'F10-E1', nivel:'M', title:'Exportar catálogo de libros a JSON en el IFS',
        background:'Escribir archivos en el IFS desde RPGLE requiere dos pasos: construir el contenido (aquí con SQL usando <code>JSON_OBJECT</code> y <code>LISTAGG</code> para concatenar objetos JSON) y luego escribirlo con <code>QSYS2.IFS_WRITE_UTF8</code>. Una vez en el IFS, el archivo puede ser consumido por cualquier sistema externo, publicado vía FTP, o procesado con scripts PASE.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name"><code>JSON_ARRAYAGG</code> y <code>LISTAGG</code>: construir arrays JSON con SQL</div>
  <div class="th-concept-desc">
    Para generar un JSON que contiene un array de objetos (ej: lista de libros), hay dos enfoques:
    <br>• <code>JSON_ARRAYAGG(JSON_OBJECT(...))</code>: función nativa V7R4+ que genera el array
      JSON correcto directamente, incluyendo comillas, comas y corchetes.
    <br>• <code>LISTAGG(json_str, ',')</code>: concatena strings separados por coma. Requiere
      envolver el resultado en <code>[ ]</code> manualmente, pero funciona desde V7R2.
    <br><br>
    Para listas grandes (&gt;1000 registros), considera escribir línea por línea en un loop
    RPGLE en lugar de generar todo el JSON en una sola query — evita que una variable VARCHAR
    desborde su longitud máxima.
  </div>
  <div class="th-example"><span class="cm">-- Enfoque moderno (V7R4+): JSON_ARRAYAGG</span>
<span class="fn">SELECT JSON_OBJECT(</span>
<span class="fn">  'generado' VALUE VARCHAR_FORMAT(CURRENT_TIMESTAMP,'YYYY-MM-DD HH24:MI:SS'),</span>
<span class="fn">  'libros'   VALUE JSON_ARRAYAGG(</span>
<span class="fn">    JSON_OBJECT('cod' VALUE TRIM(L.LIBCOD), 'ttl' VALUE TRIM(L.LIBTTL),</span>
<span class="fn">                'autor' VALUE TRIM(A.AUTNOM), 'dis' VALUE L.LIBDIS)</span>
<span class="fn">  )</span>
<span class="fn">) INTO :vJson</span>
<span class="fn">FROM BIBLIOTECA/LIBROS L</span>
<span class="fn">LEFT JOIN BIBLIOTECA/AUTORES A ON L.LIBAUTO = A.AUTCOD</span>
<span class="fn">WHERE L.LIBDIS &gt; 0;</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">Limitaciones de VARCHAR y cómo manejar catálogos grandes</div>
  <div class="th-concept-desc">
    Una variable <code>VARCHAR(32766)</code> en RPGLE puede almacenar hasta 32,766 bytes.
    Un catálogo de 500 libros con datos completos puede superar fácilmente ese límite.
    La solución es generar el archivo línea por línea:
    escribir la apertura del JSON, luego un objeto por línea, luego el cierre.
    <br><br>
    <code>QSYS2.IFS_WRITE_UTF8</code> con <code>OVERWRITE => 'APPEND'</code> agrega
    al final del archivo en lugar de sobreescribirlo — perfecto para construcción incremental.
  </div>
  <div class="th-example"><span class="cm">// Construcción incremental del JSON:</span>
<span class="fn">EXEC SQL CALL QSYS2.IFS_WRITE_UTF8(PATH_NAME => :vRuta,</span>
<span class="fn">  LINE => '{"libros":[', OVERWRITE => 'REPLACE', END_OF_LINE => 'NONE');</span>

<span class="kw">DOW NOT %EOF(LIBXTTL);</span>
<span class="fn">  EXEC SQL SELECT JSON_OBJECT('cod' VALUE TRIM(LIBCOD)...)</span>
<span class="fn">    INTO :vObj FROM SYSIBM.SYSDUMMY1;</span>
<span class="fn">  EXEC SQL CALL QSYS2.IFS_WRITE_UTF8(PATH_NAME => :vRuta,</span>
<span class="fn">    LINE => :vObj, OVERWRITE => 'APPEND', END_OF_LINE => 'NONE');</span>
<span class="fn">  READ LIBREC;</span>
<span class="kw">ENDDO;</span>

<span class="fn">EXEC SQL CALL QSYS2.IFS_WRITE_UTF8(PATH_NAME => :vRuta,</span>
<span class="fn">  LINE => ']}', OVERWRITE => 'APPEND', END_OF_LINE => 'NONE');</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>LISTAGG excediendo el límite de VARCHAR:</strong> <code>LISTAGG</code> concatena todos los JSON de libros en una sola cadena. Con miles de registros puede superar el límite de 32766 bytes de VARCHAR en IBM i. Para datasets grandes, escribe registro a registro con OVERWRITE='APPEND' en un bucle.</li>
    <li><strong>IFS_WRITE_UTF8 con archivo ya existente y OVERWRITE='NONE':</strong> El valor por defecto de <code>OVERWRITE</code> es <code>'NONE'</code>, que falla si el archivo ya existe. Para sobrescribir usa <code>'REPLACE'</code>. Para añadir al final usa <code>'APPEND'</code>.</li>
    <li><strong>TRIM en campos CHAR no aplicado:</strong> Los campos <code>CHAR</code> en IBM i tienen longitud fija y se rellenan con espacios a la derecha. En JSON, <code>"titulo":"Don Quijote        "</code> con espacios es diferente de <code>"titulo":"Don Quijote"</code>. Siempre aplica <code>TRIM(campo)</code> antes de incluir en JSON.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>Para JSON de gran tamaño (miles de registros), construye el JSON directamente en DB2 con <code>SELECT JSON_ARRAYAGG(JSON_OBJECT(...)) FROM tabla</code> dentro de un <code>EXEC SQL SELECT ... INTO :vJson</code>. DB2 for i optimiza internamente la construcción del array y es significativamente más rápido que construirlo registro a registro en RPGLE con concatenación.</p>
</div>`,
        obj:'Usar QSYS2.IFS_WRITE_UTF8 para escribir un archivo JSON desde SQLRPGLE.',
        enun:'Crea el programa LIBJSON que consulta libros disponibles (con nombre de autor), construye un JSON {"generado":"...","libros":[...]} usando JSON_OBJECT + LISTAGG, y lo escribe en /tmp/libros_disponibles.json.',
        hints:[
          '<code>JSON_OBJECT(\'clave\' VALUE campo)</code> construye un objeto JSON por fila',
          '<code>LISTAGG(json_col, \',\') WITHIN GROUP (ORDER BY ...)</code> concatena todos',
          '<code>CALL QSYS2.IFS_WRITE_UTF8(PATH_NAME=>ruta, LINE=>contenido, OVERWRITE=>\'REPLACE\')</code>',
          'Construye el JSON completo en una VARCHAR larga antes de escribir'
        ],
        conceptos:['IFS_WRITE_UTF8','JSON_OBJECT','LISTAGG','IFS','VARCHAR largo'],
        solucion:`**FREE
CTL-OPT OPTION(*NODEBUGIO:*SRCSTMT) DFTACTGRP(*NO) ACTGRP(*CALLER);

DCL-S vJson   VARCHAR(32000);
DCL-S vLibros VARCHAR(31000);
DCL-S vRuta   VARCHAR(256) INZ('/tmp/libros_disponibles.json');
DCL-S pResult CHAR(50);

// Construir JSON de libros disponibles
EXEC SQL
  SELECT LISTAGG(
    JSON_OBJECT(
      'codigo'      VALUE TRIM(L.LIBCOD),
      'titulo'      VALUE TRIM(L.LIBTTL),
      'autor'       VALUE TRIM(A.AUTNOM),
      'editorial'   VALUE TRIM(L.LIBEDI),
      'anio'        VALUE L.LIBANIO,
      'disponibles' VALUE L.LIBDIS
    ), ','
  ) WITHIN GROUP (ORDER BY L.LIBTTL)
  INTO  :vLibros
  FROM  BIBLIOTECA/LIBROS L
  JOIN  BIBLIOTECA/AUTORES A ON L.LIBAUTO = A.AUTCOD
  WHERE L.LIBDIS > 0;

IF SQLSTATE <> '00000' AND SQLSTATE <> '02000';
  pResult = 'Error SQL: ' + SQLSTATE;
  *INLR = *ON; RETURN;
ENDIF;

vJson = '{"generado":"' + %CHAR(%TIMESTAMP()) + '",'
      + '"libros":[' + %TRIM(vLibros) + ']}';

EXEC SQL
  CALL QSYS2.IFS_WRITE_UTF8(
    PATH_NAME   => :vRuta,
    LINE        => :vJson,
    OVERWRITE   => 'REPLACE',
    END_OF_LINE => 'NONE'
  );

IF SQLSTATE = '00000';
  pResult = 'JSON generado en ' + %TRIM(vRuta);
ELSE;
  pResult = 'Error IFS: ' + SQLSTATE;
ENDIF;

*INLR = *ON;`
      },
      {
        id:'F10-E2', nivel:'D', title:'Temporal Table: historial automático de SOCIOS',
        background:'Las Temporal Tables (disponibles en DB2 for i V7R2+) mantienen automáticamente el historial de cambios de una tabla sin triggers ni código adicional. Cada UPDATE o DELETE preserva la versión anterior en una tabla de historia. El time travel SQL permite consultar el estado de los datos en cualquier punto del pasado.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">System-Period Temporal Tables: auditoría automática sin código</div>
  <div class="th-concept-desc">
    Una Temporal Table tiene dos componentes:
    <br>• <strong>Tabla principal</strong> (SOCIOS): tiene columnas de sistema <code>ROW_START</code>
      y <code>ROW_END</code> (timestamps) que DB2 mantiene automáticamente.
    <br>• <strong>Tabla de historia</strong> (SOCIOS_HIST): recibe automáticamente las versiones
      antiguas de los registros cuando son actualizados o eliminados.
    <br><br>
    La ventaja sobre los triggers: el código de aplicación no necesita cambiar en absoluto.
    DB2 intercepta cada UPDATE/DELETE y automáticamente mueve la versión anterior a SOCIOS_HIST
    con los timestamps correctos. Sin triggers, sin código extra, sin riesgo de olvidar auditar.
  </div>
  <div class="th-example"><span class="cm">-- Activar temporal table en SOCIOS:</span>
<span class="fn">ALTER TABLE BIBLIOTECA/SOCIOS</span>
<span class="fn">  ADD COLUMN ROW_START TIMESTAMP(12) NOT NULL</span>
<span class="fn">             GENERATED ALWAYS AS ROW BEGIN,</span>
<span class="fn">  ADD COLUMN ROW_END   TIMESTAMP(12) NOT NULL</span>
<span class="fn">             GENERATED ALWAYS AS ROW END,</span>
<span class="fn">  ADD PERIOD SYSTEM_TIME (ROW_START, ROW_END);</span>

<span class="fn">CREATE TABLE BIBLIOTECA/SOCIOS_HIST</span>
<span class="fn">  LIKE BIBLIOTECA/SOCIOS;</span>

<span class="fn">ALTER TABLE BIBLIOTECA/SOCIOS</span>
<span class="fn">  ADD VERSIONING USE HISTORY TABLE BIBLIOTECA/SOCIOS_HIST;</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>FOR SYSTEM_TIME AS OF</code> — Time Travel SQL</div>
  <div class="th-concept-desc">
    Una vez activado el versionado, puedes consultar el estado de los datos en cualquier
    momento del pasado con la cláusula <code>FOR SYSTEM_TIME AS OF timestamp</code>.
    DB2 combina automáticamente la tabla principal y la tabla de historia para
    retornar los registros que estaban vigentes en ese instante.
    <br><br>
    Es el equivalente de git blame pero para datos: "¿quién era este socio hace 6 meses?".
    Especialmente valioso en industrias reguladas que requieren evidencia de estados
    pasados sin mantener backups completos.
  </div>
  <div class="th-example"><span class="cm">-- ¿Cómo era el socio SOC0001 hace 30 días?</span>
<span class="fn">SELECT * FROM BIBLIOTECA/SOCIOS</span>
<span class="fn">FOR SYSTEM_TIME AS OF (CURRENT_TIMESTAMP - 30 DAYS)</span>
<span class="fn">WHERE SOCCOD = 'SOC0001';</span>

<span class="cm">-- Historial completo de cambios:</span>
<span class="fn">SELECT SOCCOD, SOCNOM, SOCACT, ROW_START, ROW_END</span>
<span class="fn">FROM BIBLIOTECA/SOCIOS_HIST</span>
<span class="fn">WHERE SOCCOD = 'SOC0001'</span>
<span class="fn">ORDER BY ROW_START;</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>Consultar la tabla de historia directamente para time travel:</strong> No uses directamente <code>SELECT * FROM SOCIOS_HIST WHERE SOCCOD='SOC0001'</code> — eso solo muestra filas que ya <em>salieron</em> de la tabla principal. Para time travel correcto, siempre usa <code>FROM SOCIOS FOR SYSTEM_TIME AS OF timestamp</code>.</li>
    <li><strong>Activar temporal table en tabla con datos existentes:</strong> Si SOCIOS ya tiene registros cuando activas el versionado, esos registros se convierten en "vigentes desde siempre" (ROW_START = timestamp de activación). No habrá historial previo a la activación.</li>
    <li><strong>DROP TABLE de la tabla de historia manualmente:</strong> Si borras SOCIOS_HIST manualmente con DROP TABLE, el sistema queda en estado inconsistente. Primero desactiva el versionado con <code>ALTER TABLE SOCIOS DROP VERSIONING</code>, luego puedes borrar SOCIOS_HIST.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>Las Temporal Tables de IBM i también soportan <code>FOR SYSTEM_TIME BETWEEN t1 AND t2</code> para ver todos los estados en un rango, y <code>FOR SYSTEM_TIME FROM t1 TO t2</code> (exclusivo en t2). Combínalas con <code>ROW_NUMBER() OVER(PARTITION BY SOCCOD ORDER BY ROW_START DESC)</code> para obtener el estado más reciente antes de una fecha dada.</p>
</div>`,
        obj:'Implementar System-Period Temporal Table para auditoría sin triggers.',
        enun:'Convierte SOCIOS a Temporal Table: agrega columnas ROW_START, ROW_END, TRANS_START y crea SOCIOS_HIST. Activa el versionado. Ejecuta cambios y prueba time travel con FOR SYSTEM_TIME AS OF.',
        hints:[
          '<code>ALTER TABLE ... ADD COLUMN ROW_START TIMESTAMP(12) NOT NULL GENERATED ALWAYS AS ROW BEGIN</code>',
          '<code>ADD PERIOD SYSTEM_TIME (ROW_START, ROW_END)</code>',
          '<code>ADD VERSIONING USE HISTORY TABLE BIBLIOTECA/SOCIOS_HIST</code>',
          'Time travel: <code>FOR SYSTEM_TIME AS OF (CURRENT_TIMESTAMP - 1 HOUR)</code>'
        ],
        conceptos:['Temporal Table','SYSTEM_TIME','ADD VERSIONING','FOR SYSTEM_TIME AS OF','Time Travel'],
        solucion:`-- 1. Crear tabla de historial (misma estructura)
CREATE TABLE BIBLIOTECA/SOCIOS_HIST
  LIKE BIBLIOTECA/SOCIOS;

-- 2. Agregar columnas de período del sistema
ALTER TABLE BIBLIOTECA/SOCIOS
  ADD COLUMN ROW_START TIMESTAMP(12) NOT NULL
    GENERATED ALWAYS AS ROW BEGIN,
  ADD COLUMN ROW_END TIMESTAMP(12) NOT NULL
    GENERATED ALWAYS AS ROW END,
  ADD COLUMN TRANS_START TIMESTAMP(12)
    GENERATED ALWAYS AS TRANSACTION START ID,
  ADD PERIOD SYSTEM_TIME (ROW_START, ROW_END);

-- 3. Activar versionado automático
ALTER TABLE BIBLIOTECA/SOCIOS
  ADD VERSIONING USE HISTORY TABLE BIBLIOTECA/SOCIOS_HIST;

-- 4. Generar historial con cambios
UPDATE BIBLIOTECA/SOCIOS
  SET SOCEML = 'nuevo@email.com'
  WHERE SOCCOD = 'SOC0001';

UPDATE BIBLIOTECA/SOCIOS
  SET SOCACT = 'N'
  WHERE SOCCOD = 'SOC0001';

-- 5. Time travel: ver estado hace 1 hora
SELECT SOCCOD, SOCNOM, SOCEML, SOCACT, ROW_START, ROW_END
FROM   BIBLIOTECA/SOCIOS
       FOR SYSTEM_TIME AS OF
       (CURRENT_TIMESTAMP - 1 HOUR);

-- 6. Historial completo del socio
SELECT SOCCOD, SOCNOM, SOCEML, SOCACT, ROW_START, ROW_END
FROM   BIBLIOTECA/SOCIOS
       FOR SYSTEM_TIME ALL
WHERE  SOCCOD = 'SOC0001'
ORDER BY ROW_START;`
      },
      {
        id:'F10-E3', nivel:'M', title:'REST API con IWS: endpoint de préstamos activos',
        background:'La combinación IWS + SQLRPGLE es la forma más rápida de exponer datos de IBM i como REST API. El programa RPGLE hace el trabajo pesado (consulta SQL, construye JSON), e IWS lo envuelve como endpoint HTTP sin configuración de servidor web adicional.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">Arquitectura de un endpoint IWS: cliente → IWS → *PGM → datos</div>
  <div class="th-concept-desc">
    El flujo completo de una petición REST a través de IWS:
    <br>1. El cliente hace <code>GET /prestamos/SOC0001</code>
    <br>2. IWS recibe la petición HTTP y mapea el path parameter a <code>pCodSoc</code>
    <br>3. IWS llama a <code>CALL PGM(APIPRESTR) PARM(pCodSoc pJson pSqlstate)</code>
    <br>4. APIPRESTR ejecuta el SELECT, construye el JSON, retorna en <code>pJson</code>
    <br>5. IWS toma <code>pJson</code> y lo retorna como body HTTP con status 200
    <br><br>
    El programa RPGLE no sabe que fue invocado vía HTTP — simplemente recibe sus parámetros
    normales de entrada y llena los de salida.
  </div>
  <div class="th-example"><span class="cm">// Petición del cliente:</span>
<span class="fn">GET http://ibmi:10080/web/services/prestamos/SOC0001</span>

<span class="cm">// IWS llama internamente:</span>
<span class="fn">CALL PGM(BIBLIOTECA/APIPRESTR) PARM('SOC0001' pJson '00000')</span>

<span class="cm">// Respuesta al cliente (pJson serializado por IWS):</span>
<span class="fn">{"socio":"SOC0001","prestamos":[{"cod":"P2024001","ttl":"Quijote","dvl":"2024-12-31"}]}</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">Diseñar el programa RPGLE para ser amigable con IWS</div>
  <div class="th-concept-desc">
    Un programa diseñado para IWS sigue estas reglas:
    <br>• <strong>Parámetros IN primero, OUT al final</strong>: IWS mapea por posición
    <br>• <strong>Retornar JSON válido</strong> en el parámetro de salida (no mensajes de error en texto plano)
    <br>• <strong>Nunca usar DSPLY</strong>: IWS no tiene pantalla, el output va al parámetro
    <br>• <strong>Un parámetro de status</strong>: retornar el SQLSTATE o un código de error
      que IWS puede mapear a HTTP status codes (200 OK, 404 Not Found, 500 Error)
    <br>• <strong>ACTGRP(*NEW)</strong> o <strong>ACTGRP(*CALLER)</strong>: evitar estado
      compartido entre peticiones concurrentes
  </div>
  <div class="th-example"><span class="cm">// Firma ideal de un programa back-end para IWS:</span>
<span class="kw">DCL-PI *N;</span>
<span class="fn">  pCodSoc  CHAR(7)        CONST;</span>   <span class="cm">← IN: path parameter</span>
<span class="fn">  pJson    VARCHAR(32766);</span>          <span class="cm">← OUT: response body</span>
<span class="fn">  pStatus  CHAR(5);</span>                 <span class="cm">← OUT: '00000'=OK, '02000'=not found</span>
<span class="kw">END-PI;</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>Programa IWS con ACTGRP compartido:</strong> Si el programa de backend usa un activation group nombrado persistente, el estado de variables entre peticiones puede filtrarse. Para endpoints REST, usa siempre <code>ACTGRP(*NEW)</code> para garantizar que cada petición empieza con estado limpio.</li>
    <li><strong>Parámetros de salida no inicializados:</strong> Si el programa retorna CHAR sin inicializar y la condición de error no los setea, IWS puede serializar campos con datos basura del stack. Siempre inicializa los parámetros OUT al inicio del programa: <code>pJson = '{}'; pStatus = '00000';</code>.</li>
    <li><strong>IWS con SSL no configurado:</strong> Por defecto IWS corre en HTTP sin cifrar en el puerto 10080. Para producción siempre configura HTTPS (puerto 10101) con un certificado válido. Las credenciales de IBM i en Basic Auth sobre HTTP son visibles en texto plano en la red.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>Para proyectos nuevos en IBM i V7R4+, considera <strong>IBM Integrated Web Services Server (IWS) vs NGINX como proxy</strong>: configura NGINX en PASE para recibir las peticiones REST, validar el JWT/API key, y hacer proxy inverso al IWS interno — separando la capa de seguridad de la lógica de negocio sin modificar los programas RPGLE.</p>
</div>`,
        obj:'Exponer los préstamos activos de un socio como REST API usando IBM i Web Services (IWS) y un programa RPGLE como back-end.',
        enun:'Crea el programa APIPRESTR que recibe el código de socio via parámetro, consulta préstamos activos con detalle de libro, y retorna un JSON. Configura en IWS un servicio REST GET /prestamos/{socioCod}. Prueba con curl desde PASE.',
        hints:[
          'En IWS: New Service → Program Call → REST → GET',
          'El parámetro de entrada se mapea al path parameter <code>{socioCod}</code>',
          'La salida es un CHAR largo o VARCHAR que el programa llena con JSON válido',
          '<code>curl -u usuario:contraseña "https://mi-ibmi:10101/web/services/prestamos/SOC0001"</code>'
        ],
        conceptos:['IWS','REST API','Program Call','JSON output','PASE','curl'],
        solucion:`// ── QRPGLESRC/APIPRESTR — Backend del REST endpoint ─────────────
**FREE
CTL-OPT OPTION(*NODEBUGIO:*SRCSTMT) DFTACTGRP(*NO) ACTGRP(*NEW);

DCL-PI *N;
  pSocCod  CHAR(7)   CONST;
  pOutJson VARCHAR(32000);
END-PI;

DCL-S vItems  VARCHAR(30000);
DCL-S vSocNom CHAR(60);
DCL-S vCnt    INT(10);

// Obtener nombre del socio
EXEC SQL SELECT SOCNOM INTO :vSocNom
         FROM BIBLIOTECA/SOCIOS
         WHERE SOCCOD = :pSocCod;

IF SQLSTATE <> '00000';
  pOutJson = '{"error":"Socio no encontrado","codigo":"' + %TRIM(pSocCod) + '"}';
  *INLR = *ON; RETURN;
ENDIF;

// Construir array JSON de préstamos activos
EXEC SQL
  SELECT COUNT(*) INTO :vCnt
  FROM BIBLIOTECA/PRESTAMOS
  WHERE PRESSOC = :pSocCod AND PRESEST = 'A';

IF vCnt > 0;
  EXEC SQL
    SELECT LISTAGG(
      JSON_OBJECT(
        'folio'      VALUE TRIM(P.PRESCOD),
        'libro'      VALUE TRIM(L.LIBTTL),
        'editorial'  VALUE TRIM(L.LIBEDI),
        'fechaPrest' VALUE CHAR(P.PRESFEC),
        'fechaVenc'  VALUE CHAR(P.PRESVFEC),
        'diasAtraso' VALUE CASE
          WHEN P.PRESVFEC < CURRENT_DATE
          THEN DAYS(CURRENT_DATE) - DAYS(P.PRESVFEC)
          ELSE 0 END
      ), ','
    ) WITHIN GROUP (ORDER BY P.PRESFEC)
    INTO :vItems
    FROM BIBLIOTECA/PRESTAMOS P
    JOIN BIBLIOTECA/LIBROS    L ON P.PRESLIB = L.LIBCOD
    WHERE P.PRESSOC = :pSocCod AND P.PRESEST = 'A';
ELSE;
  vItems = '';
ENDIF;

pOutJson = '{'
         + '"socio":{"codigo":"' + %TRIM(pSocCod)
         + '","nombre":"' + %TRIM(vSocNom) + '"},'
         + '"totalActivos":' + %TRIM(%CHAR(vCnt)) + ','
         + '"prestamos":[' + %TRIM(vItems) + ']}';

*INLR = *ON;

/* ── Configurar en IWS ──────────────────────────────────────────
   1. ACS → IBM i Web Admininstration → IWS
   2. New Service: APIPRESTR
   3. Type: REST, Method: GET
   4. Path: /prestamos/{socioCod}
   5. Input: pSocCod ← Path param socioCod
   6. Output: pOutJson → Response body (Content-Type: application/json)
   7. Probar:
   curl -k -u USRPERFIL:CLAVE \\
     "https://MI_SISTEMA:10101/web/services/prestamos/SOC0001"
*/ `
      },

        background:'PASE (Portable Application Solutions Environment) es una capa de compatibilidad POSIX/Unix dentro de IBM i. Permite correr bash, Python, Node.js y herramientas open source directamente en el servidor IBM i. Para CI/CD, un script bash en PASE puede ejecutar comandos CL con <code>system "CMD CL"</code>, compilar objetos, correr tests y notificar resultados.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">PASE: el puente entre el mundo Unix y IBM i</div>
  <div class="th-concept-desc">
    PASE (Portable Application Solutions Environment) expone IBM i como un sistema Unix:
    bash, Python, Node.js, git, curl y miles de paquetes RPM corren directamente en el servidor.

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>CPYOBJ con REPLACE(*YES) sin backup previo:</strong> <code>CPYOBJ ... REPLACE(*YES)</code> sobrescribe los objetos en producción sin posibilidad de deshacer. Siempre haz un <code>SAVLIB LIB(BIBLIOTECA)</code> antes del deploy, o copia primero a una librería de rollback.</li>
    <li><strong>system() en PASE sin verificar exit code:</strong> <code>system("CRTRPGMOD ...")</code> retorna -1 si falla. Si no verificas el exit code después de cada compilación, el script puede continuar desplegando módulos rotos. Usa <code>if ($? -ne 0)</code> (bash) después de cada <code>system</code>.</li>
    <li><strong>Script de build sin orden de dependencias:</strong> Si PRESTCTR depende de LIBREPO y VALSRV, debes compilar LIBREPO y VALSRV antes de compilar PRESTCTR. Un script que compila en orden alfabético fallará. Define el orden explícitamente en el script o usa un <code>Makefile</code>.</li>

<div class="th-tip">

        obj:'Automatizar el ciclo build → deploy → smoke-test de programas IBM i usando scripts PASE/bash y comandos CL encadenados.',
        enun:'Crea el script shell PASE build.sh que: compila VALSRV+MULTSRV+PRESTCTR desde QRPGLESRC, crea el service binding, ejecuta el smoke test PRUESTST, y notifica por correo si algún paso falla. Incluye manejo de errores con exit codes.',

        solucion:`#!/bin/bash
# ── build.sh — Pipeline CI/CD para BIBLIOTECA ─────────────────────
# Ejecutar desde PASE: /QOpenSys/usr/bin/bash build.sh
set -e   # Abortar ante cualquier error

LIB="BIBLIOTECA"
SRCPF="QRPGLESRC"
LOG="/tmp/build_$(date +%Y%m%d_%H%M%S).log"

log() { echo "[$(date '+%H:%M:%S')] $1" | tee -a "$LOG"; }
fail() { log "❌ ERROR: $1"; system "SNDMSG MSG('BUILD FAILED: $1') TOUSR(*SYSOPR)"; exit 1; }

log "════ BUILD PIPELINE BIBLIOTECA ════"

# ── Paso 1: Compilar módulos ──────────────────────────────────────
log "▶ Compilando VALSRV..."
system "CRTRPGMOD MODULE($LIB/VALSRV) SRCFILE($LIB/$SRCPF) OPTION(*EVENTF) DBGVIEW(*SOURCE)" \
  || fail "CRTRPGMOD VALSRV"

log "▶ Compilando MULTSRV..."
system "CRTRPGMOD MODULE($LIB/MULTSRV) SRCFILE($LIB/$SRCPF) OPTION(*EVENTF) DBGVIEW(*SOURCE)" \
  || fail "CRTRPGMOD MULTSRV"

log "▶ Compilando FOLICTR..."
system "CRTRPGMOD MODULE($LIB/FOLICTR) SRCFILE($LIB/$SRCPF) OPTION(*EVENTF) DBGVIEW(*SOURCE)" \
  || fail "CRTRPGMOD FOLICTR"

log "▶ Compilando PRESTCTR..."
system "CRTRPGMOD MODULE($LIB/PRESTCTR) SRCFILE($LIB/$SRCPF) OPTION(*EVENTF) DBGVIEW(*SOURCE)" \
  || fail "CRTRPGMOD PRESTCTR"

# ── Paso 2: Crear Service Programs ───────────────────────────────
log "▶ Creando SRVPGM VALSRV..."
system "CRTSRVPGM SRVPGM($LIB/VALSRV) MODULE($LIB/VALSRV) EXPORT(*ALL) ACTGRP(BIBLIOTECA)" \
  || fail "CRTSRVPGM VALSRV"

log "▶ Creando SRVPGM MULTSRV..."
system "CRTSRVPGM SRVPGM($LIB/MULTSRV) MODULE($LIB/MULTSRV) EXPORT(*ALL) ACTGRP(BIBLIOTECA)" \
  || fail "CRTSRVPGM MULTSRV"

# ── Paso 3: Enlazar programa principal ───────────────────────────
log "▶ Creando programa PRESTCTR..."
system "CRTPGM PGM($LIB/PRESTCTR) MODULE($LIB/PRESTCTR $LIB/FOLICTR) BNDSRVPGM($LIB/VALSRV) ACTGRP(BIBLIOTECA)" \
  || fail "CRTPGM PRESTCTR"

# ── Paso 4: Smoke test ───────────────────────────────────────────
log "▶ Ejecutando smoke test..."
system "CALL PGM($LIB/PRUESTST)" \
  || fail "Smoke test PRUESTST"

# ── Paso 5: Notificar éxito ──────────────────────────────────────
log "✅ BUILD OK — todos los pasos completados"
system "SNDMSG MSG('BUILD OK: BIBLIOTECA compilado exitosamente') TOUSR(*SYSOPR)"
log "Log guardado en: $LOG"
exit 0`

/* ════════════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════════ */
let state = { completed: {}, notes: {}, currentView: 'dashboard', currentPhase: null };

function loadState() {
  try {
    const s = localStorage.getItem('ibmi_tracker');
    if (s) state = { ...state, ...JSON.parse(s) };
  } catch(e) {}
}
function saveState() {
  try { localStorage.setItem('ibmi_tracker', JSON.stringify(state)); } catch(e) {}
}

/* ════════════════════════════════════════════════════════════════
   STATS
═══════════════════════════════════════════════════════════════ */
function getAllExercises() {
  return PHASES.flatMap(p => p.exercises.map(e => ({ ...e, phase: p })));
}
function getStats() {
  const all = getAllExercises();
  const done = all.filter(e => state.completed[e.id]);
  return { total: all.length, done: done.length, pend: all.length - done.length };
}
function getPhaseStats(phase) {
  const done = phase.exercises.filter(e => state.completed[e.id]).length;
  return { done, total: phase.exercises.length, pct: phase.exercises.length ? Math.round(done/phase.exercises.length*100) : 0 };
}

/* ════════════════════════════════════════════════════════════════
   SIDEBAR BUILD
═══════════════════════════════════════════════════════════════ */
function buildSidebar() {
  const stats = getStats();
  const pct = stats.total ? Math.round(stats.done/stats.total*100) : 0;
  document.getElementById('gp-pct').textContent = pct + '%';
  document.getElementById('gp-bar').style.width = pct + '%';
  document.getElementById('gp-done').textContent = stats.done;
  document.getElementById('gp-total').textContent = stats.total;
  document.getElementById('gp-pend').textContent = stats.pend;

  const nav = document.getElementById('nav-phases');
  nav.innerHTML = PHASES.map(p => {
    const ps = getPhaseStats(p);
    const badgeClass = ps.done === ps.total && ps.total > 0 ? 'done' : ps.done > 0 ? 'partial' : '';
    const badgeLabel = ps.done === ps.total && ps.total > 0 ? '✓' : `${ps.done}/${ps.total}`;
    return `
    <div class="nav-phase" id="navp-${p.id}">
      <div class="nav-phase-header ${state.currentPhase === p.id ? 'active-phase' : ''}"
           onclick="toggleNavPhase('${p.id}')">
        <span class="ph-icon">${p.icon}</span>
        <span>${p.num === 0 ? p.title : 'Fase ' + p.num}</span>
        <span class="ph-badge ${badgeClass}">${badgeLabel}</span>
      </div>
      <div class="nav-exercises ${state.currentPhase === p.id ? 'open' : ''}" id="navex-${p.id}">
        ${p.exercises.map(e => `
          <div class="nav-ex ${state.completed[e.id] ? 'completed' : ''} ${state.currentView === e.id ? 'active' : ''}"
               onclick="showPhase('${p.id}','${e.id}')">
            <span class="nav-check">${state.completed[e.id] ? '✓' : '○'}</span>
            <span class="nav-ex-title">${e.id}: ${e.title}</span>
            <span class="nav-lv lv-${e.nivel.toLowerCase()}">${e.nivel}</span>
          </div>
        `).join('')}
      </div>
    </div>`;
  }).join('');
}

function toggleNavPhase(phaseId) {
  const wasOpen = state.currentPhase === phaseId;
  if (wasOpen) {
    showPhase(phaseId);
  } else {
    showPhase(phaseId);
  }
}

/* ════════════════════════════════════════════════════════════════
   PHASE TABS
═══════════════════════════════════════════════════════════════ */
function buildPhaseTabs() {
  const tabs = document.getElementById('phase-tabs');
  tabs.innerHTML = `
    <button class="phase-tab ${state.currentView === 'dashboard' ? 'active' : ''}"
            onclick="showDashboard()">🏠 Inicio</button>
    <button class="phase-tab ${state.currentView === 'acordeon' ? 'active' : ''}"
            onclick="showAcordeon()" style="border-color:var(--purple2)">📖 Acordeón</button>
    <button class="phase-tab ${state.currentView === 'quiz' ? 'active' : ''}"
            onclick="showQuiz()" style="border-color:var(--purple)">🎯 Quiz</button>
    <button class="phase-tab ${state.currentView === 'simulator' ? 'active' : ''}"
            onclick="showSimulator()" style="border-color:var(--teal)">🖥️ Simulador</button>
    ${PHASES.map(p => {
      const ps = getPhaseStats(p);
      const doneClass = ps.done === ps.total && ps.total > 0 ? 'done' : '';
      return `<button class="phase-tab ${state.currentPhase === p.id && state.currentView !== 'dashboard' ? 'active' : ''} ${doneClass}"
              onclick="showPhase('${p.id}')">
        ${p.icon} ${p.num === 0 ? 'Intro' : 'F' + p.num}
      </button>`;
    }).join('')}
  `;
}

/* ════════════════════════════════════════════════════════════════
   DASHBOARD
═══════════════════════════════════════════════════════════════ */
function showDashboard() {
  state.currentView = 'dashboard';
  state.currentPhase = null;
  saveState();
  document.getElementById('page-title').textContent = 'Dashboard';
  document.getElementById('page-sub').textContent = 'Sistema de Gestión de Biblioteca · IBM i V7R4+';
  buildPhaseTabs();
  buildSidebar();

  const stats = getStats();
  const pct = stats.total ? Math.round(stats.done/stats.total*100) : 0;

  const streakDays = Math.floor(stats.done / 2) + (stats.done > 0 ? 1 : 0);

  document.getElementById('content').innerHTML = `
    <div class="stats-bar">
      <div class="stat-card blue">
        <div class="sv">${pct}%</div>
        <div class="sl">Progreso total</div>
      </div>
      <div class="stat-card green">
        <div class="sv">${stats.done}</div>
        <div class="sl">Ejercicios completados</div>
      </div>
      <div class="stat-card orange">
        <div class="sv">${stats.pend}</div>
        <div class="sl">Ejercicios pendientes</div>
      </div>
      <div class="stat-card purple">
        <div class="sv">${PHASES.filter(p=>getPhaseStats(p).done===getPhaseStats(p).total&&getPhaseStats(p).total>0).length}</div>
        <div class="sl">Fases completadas</div>
      </div>
    </div>

    <!-- ── Acciones rápidas ── -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px">
      <div onclick="showQuiz()" style="background:var(--bg2);border:1px solid var(--purple2);border-radius:var(--radius);padding:16px;cursor:pointer;transition:border-color .2s" onmouseover="this.style.borderColor='var(--purple)'" onmouseout="this.style.borderColor='var(--purple2)'">
        <div style="font-size:28px;margin-bottom:8px">🎯</div>
        <div style="font-weight:600;margin-bottom:4px">Modo Quiz</div>
        <div style="font-size:12px;color:var(--text2)">Autoevaluación de 10 preguntas aleatorias</div>
      </div>
