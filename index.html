  {
    id:'f6', num:6, icon:'🔒', title:'Seguridad y Auditoría',
    color:'#f85149', nivel:'Senior',
    desc:'RCAC, Triggers DB2, Journaling, Constraints, User Profiles',
    intro:`<p class="pi-text">
      IBM i tiene uno de los modelos de seguridad más sofisticados en el mundo empresarial.
      La seguridad se maneja a múltiples niveles: nivel de objeto (<code>GRTOBJAUT</code>),
      nivel de campo (RCAC — Row and Column Access Control), y nivel de auditoría
      (journaling y triggers de auditoría).
    </p>
    <p class="pi-text" style="margin-top:8px">
      Los <strong>Triggers DB2</strong> son procedimientos SQL que se ejecutan automáticamente
      BEFORE o AFTER operaciones DML (INSERT, UPDATE, DELETE). Son la forma correcta de implementar
      auditoría automática: cada cambio en una tabla sensitiva puede registrarse en una tabla de
      auditoría sin que el programa que realiza el cambio tenga que hacer nada extra.
    </p>
    <p class="pi-text" style="margin-top:8px">
      El <strong>Journaling</strong> es el mecanismo de bitácora transaccional de IBM i.
      Es requisito previo para usar <code>COMMIT/ROLLBACK</code>. El journal registra TODOS los
      cambios en los archivos bajo su control, permitiendo recuperación punto a punto ante fallos.
      Sin journaling, no hay transacciones; sin transacciones, los datos pueden quedar inconsistentes
      ante cualquier fallo a mitad de un proceso.
    </p>`,
    whyMatters:`La seguridad y el journaling no son opcionales en sistemas de producción. Un audit trail correcto es requisito legal en industrias reguladas (banca, salud, gobierno). Entender triggers y journaling te permite implementar estas capacidades sin modificar los programas existentes.`,
    keyTerms:['CREATE TRIGGER','REFERENCING OLD/NEW','AFTER UPDATE','SEQUENCE','STRJRNPF','CRTJRN','COMMIT','ROLLBACK','GRTOBJAUT','RCAC'],
    exercises:[
      {
        id:'F6-E1', nivel:'M', title:'Trigger de auditoría para cambios en LIBROS',
        background:'Un trigger SQL en DB2 for i es código que se ejecuta automáticamente cuando ocurre un evento DML. La cláusula <code>REFERENCING OLD AS ant NEW AS nue</code> da acceso a los valores anterior y nuevo del registro. <code>WHEN (ant.LIBDIS <> nue.LIBDIS)</code> evita que el trigger dispare si el campo no cambió realmente. <code>NEXT VALUE FOR secuencia</code> genera un ID único autoincremental.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">BEFORE vs AFTER trigger: ¿cuándo se ejecuta cada uno?</div>
  <div class="th-concept-desc">
    DB2 for i soporta dos momentos de disparo:
    <br>• <code>BEFORE</code>: se ejecuta <em>antes</em> de que los datos cambien. Puede modificar los
      valores <code>NEW</code> (útil para normalizar datos). No puede hacer INSERT/UPDATE/DELETE adicionales.
    <br>• <code>AFTER</code>: se ejecuta <em>después</em> de que los datos cambiaron. Puede hacer
      operaciones adicionales como insertar en tablas de auditoría. Los valores ya están confirmados.
    <br><br>
    Para auditoría, siempre <code>AFTER</code>: queremos registrar lo que <em>realmente ocurrió</em>,
    no lo que iba a ocurrir.
  </div>
  <table class="th-table">
    <tr><th>Evento</th><th>OLD disponible</th><th>NEW disponible</th><th>Uso típico</th></tr>
    <tr><td><code>INSERT</code></td><td>No</td><td>Sí (datos nuevos)</td><td>Log de creación</td></tr>
    <tr><td><code>UPDATE</code></td><td>Sí (antes)</td><td>Sí (después)</td><td>Log de cambios</td></tr>
    <tr><td><code>DELETE</code></td><td>Sí (eliminado)</td><td>No</td><td>Log de eliminaciones</td></tr>
  </table>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>WHEN (condición)</code> — Disparar solo cuando algo cambia</div>
  <div class="th-concept-desc">
    Sin <code>WHEN</code>, el trigger se dispara en <em>cada</em> UPDATE de la tabla, aunque
    el campo de interés no haya cambiado. Por ejemplo, si actualizas solo LIBTTL, un trigger sobre
    LIBDIS sin <code>WHEN</code> seguiría ejecutándose — generando filas de auditoría innecesarias
    y degradando el rendimiento.
    <br><br>
    <code>WHEN (ant.LIBDIS &lt;&gt; nue.LIBDIS)</code> garantiza que el trigger solo se activa
    cuando el valor realmente cambia, eliminando el ruido.
  </div>
  <div class="th-example"><span class="cm">-- Sin WHEN: dispara en cualquier UPDATE de LIBROS</span>
<span class="bad">UPDATE BIBLIOTECA/LIBROS SET LIBTTL = 'Don Quijote (2024)'</span>
<span class="bad">WHERE LIBCOD = 'LIB0001';</span>
<span class="cm">-- → trigger dispara aunque LIBDIS no cambió → fila de auditoría basura</span>

<span class="cm">-- Con WHEN: solo si LIBDIS cambió</span>
<span class="good">WHEN (ant.LIBDIS &lt;&gt; nue.LIBDIS)</span>
<span class="cm">-- → el mismo UPDATE no dispara el trigger → sin basura en AUDIT_LIBROS</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>CREATE SEQUENCE</code> — IDs autoincrementales en DB2</div>
  <div class="th-concept-desc">
    Una secuencia genera números únicos, incrementales y garantizados sin colisiones,
    incluso en entornos con múltiples jobs insertando simultáneamente.
    <code>NEXT VALUE FOR seq</code> avanza y retorna el siguiente valor; el valor
    <em>nunca se repite</em> y <em>nunca disminuye</em>.
    <br><br>
    <code>NO CYCLE</code> hace que la secuencia falle cuando llega al máximo (en lugar de
    volver a 1). Es la opción correcta para claves de auditoría donde un número reciclado
    crearía confusión sobre qué registro es más reciente.
  </div>
  <div class="th-example"><span class="cm">-- Crear secuencia:</span>
<span class="fn">CREATE SEQUENCE BIBLIOTECA/AUDSEC</span>
<span class="fn">  START WITH 1 INCREMENT BY 1</span>
<span class="fn">  MINVALUE 1 MAXVALUE 9999999999</span>
<span class="fn">  NO CYCLE NO ORDER;    </span><span class="cm">← NO CYCLE: falla si se agota (evita duplicados)</span>

<span class="cm">-- Usar en el trigger:</span>
<span class="fn">NEXT VALUE FOR BIBLIOTECA/AUDSEC</span>  <span class="cm">← retorna 1, 2, 3... sin repetir</span>

<span class="cm">-- Equivalente moderno (V7R3+): campo GENERATED ALWAYS AS IDENTITY</span>
<span class="fn">AUDID BIGINT GENERATED ALWAYS AS IDENTITY</span>  <span class="cm">← autoincremental por columna</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>Trigger BEFORE para auditoría:</strong> Un trigger <code>BEFORE UPDATE</code> se ejecuta antes de que el cambio esté confirmado. Si el UPDATE falla después, la fila de auditoría ya fue insertada pero el cambio real no ocurrió. Para auditoría real usa siempre <code>AFTER UPDATE</code>.</li>
    <li><strong>INSERT dentro del trigger sin COMMIT:</strong> El INSERT de auditoría dentro del trigger va en la misma transacción que el UPDATE original. Si el UPDATE hace ROLLBACK, el INSERT de auditoría también se revierte. Esto es lo correcto — no intentes hacer COMMIT dentro del trigger.</li>
    <li><strong>WHEN con OLD en trigger BEFORE INSERT:</strong> En un trigger <code>BEFORE INSERT</code> no existe <code>OLD</code> (la fila aún no existe). Solo <code>NEW</code> está disponible. Intentar referenciar <code>OLD</code> en un INSERT trigger da error de compilación.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>Para ver todos los triggers activos en el sistema usa: <code>SELECT TRIGGER_NAME, EVENT_OBJECT_TABLE, ACTION_TIMING, EVENT_MANIPULATION FROM QSYS2.SYSTRIGGERS WHERE TRIGGER_SCHEMA = 'BIBLIOTECA'</code>. Muestra cuándo se disparan y sobre qué tabla — imprescindible al llegar a un sistema legacy desconocido.</p>
</div>`,
        obj:'Crear un trigger AFTER UPDATE que registre automáticamente cambios en LIBDIS.',
        enun:'Crea la tabla AUDIT_LIBROS con una SEQUENCE para el ID. Crea el trigger TRG_LIB_UPD que se activa AFTER UPDATE OF LIBDIS y registra: código, valor anterior, valor nuevo, usuario y timestamp. Activa solo cuando LIBDIS cambia.',
        hints:[
          'Crea <code>CREATE SEQUENCE BIBLIOTECA/AUDSEC START WITH 1 NO CYCLE;</code>',
          '<code>REFERENCING OLD AS ant NEW AS nue</code> para acceder a valores',
          '<code>WHEN (ant.LIBDIS <> nue.LIBDIS)</code> — solo cuando cambia',
          '<code>NEXT VALUE FOR BIBLIOTECA/AUDSEC</code> para el ID automático'
        ],
        conceptos:['CREATE TRIGGER','CREATE SEQUENCE','REFERENCING OLD/NEW','CURRENT_USER','CURRENT_TIMESTAMP'],
        solucion:`-- 1. Secuencia para ID de auditoría
CREATE SEQUENCE BIBLIOTECA/AUDSEC
  START WITH 1 INCREMENT BY 1 NO CYCLE;

-- 2. Tabla de auditoría
CREATE TABLE BIBLIOTECA/AUDIT_LIBROS (
  AUDID      BIGINT       NOT NULL,
  AUDCOD     CHAR(7)      NOT NULL,
  AUDDIS_ANT SMALLINT     NOT NULL,
  AUDDIS_NUE SMALLINT     NOT NULL,
  AUDUSR     VARCHAR(18)  NOT NULL,
  AUDTS      TIMESTAMP    NOT NULL,
  PRIMARY KEY (AUDID)
);

-- 3. Trigger AFTER UPDATE en LIBROS
CREATE OR REPLACE TRIGGER BIBLIOTECA/TRG_LIB_UPD
  AFTER UPDATE OF LIBDIS ON BIBLIOTECA/LIBROS
  REFERENCING OLD AS ant NEW AS nue
  FOR EACH ROW
  WHEN (ant.LIBDIS <> nue.LIBDIS)
BEGIN ATOMIC
  INSERT INTO BIBLIOTECA/AUDIT_LIBROS
    (AUDID, AUDCOD, AUDDIS_ANT, AUDDIS_NUE, AUDUSR, AUDTS)
  VALUES (
    NEXT VALUE FOR BIBLIOTECA/AUDSEC,
    nue.LIBCOD,
    ant.LIBDIS,
    nue.LIBDIS,
    CURRENT_USER,
    CURRENT_TIMESTAMP
  );
END;

-- Verificar: simular cambio y consultar auditoría
UPDATE BIBLIOTECA/LIBROS SET LIBDIS = LIBDIS - 1
WHERE  LIBCOD = 'LIB0001';

SELECT * FROM BIBLIOTECA/AUDIT_LIBROS ORDER BY AUDTS DESC;`
      },
      {
        id:'F6-E2', nivel:'D', title:'Journaling y transacción con ROLLBACK', simId:'SIM-06',
        background:'El journaling en IBM i es el prerequisito obligatorio para transacciones con COMMIT/ROLLBACK. Sin journal, los archivos no participan en el protocolo de transacciones y un fallo a mitad de un proceso (corte de luz, error del sistema) puede dejar los datos en un estado inconsistente — por ejemplo, el préstamo registrado pero el LIBDIS sin decrementar.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">Qué es un Journal y para qué sirve</div>
  <div class="th-concept-desc">
    Un <strong>Journal</strong> (<code>*JRN</code>) es un objeto IBM i que actúa como un log
    WAL (Write-Ahead Log) de base de datos: antes de que cualquier cambio se confirme en disco,
    se escribe en el journal. Esto permite:
    <br>1. <strong>COMMIT/ROLLBACK</strong>: confirmar o deshacer un conjunto de cambios atómicamente.
    <br>2. <strong>Forward recovery</strong>: reproducir el journal para recuperar datos ante un fallo de disco.
    <br>3. <strong>Replicación</strong>: enviar los cambios del journal a otro sistema en tiempo real (MIMIX, PowerHA).
    <br><br>
    Un Journal necesita un <strong>Journal Receiver</strong> (<code>*JRNRCV</code>): el archivo de
    datos donde se escriben las entradas. Cuando el receiver se llena, IBM i puede rotarlo automáticamente.
  </div>
  <div class="th-example"><span class="cm">*── Jerarquía de journaling:</span>
<span class="cm">   JRNRCV1   (Journal Receiver *JRNRCV) ← archivo de datos del journal</span>
<span class="cm">      ↑</span>
<span class="cm">   BIBLIJNL  (Journal *JRN)              ← objeto que coordina el receiver</span>
<span class="cm">      ↑</span>
<span class="cm">   PRESTAMOS, LIBROS  (archivos *FILE)   ← bajo journaling con STRJRNPF</span>

<span class="cm">*── Sin journaling: COMMIT/ROLLBACK falla con CPF8350</span>
<span class="bad">EXEC SQL SET OPTION COMMIT = *CHG;</span>
<span class="bad">EXEC SQL COMMIT;</span>  <span class="cm">← CPF8350: File PRESTAMOS not under journaling</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">Isolation Levels: <code>COMMIT(*NONE)</code>, <code>*CHG</code>, <code>*ALL</code></div>
  <div class="th-concept-desc">
    El nivel de aislamiento controla qué tan estrictamente se protegen los datos de lecturas
    concurrentes entre jobs:
  </div>
  <table class="th-table">
    <tr><th>COMMIT option</th><th>Nombre estándar SQL</th><th>Qué protege</th></tr>
    <tr><td><code>*NONE</code></td><td>No Commit (NC)</td><td>Sin transacciones. Más rápido, sin protección.</td></tr>
    <tr><td><code>*CHG</code></td><td>Read Uncommitted (UR)</td><td>Puede leer datos no confirmados de otros jobs.</td></tr>
    <tr><td><code>*CS</code></td><td>Cursor Stability (CS)</td><td>No lee datos no confirmados. El más común en producción.</td></tr>
    <tr><td><code>*RS</code></td><td>Read Stability (RS)</td><td>Las filas leídas no cambian durante la transacción.</td></tr>
    <tr><td><code>*ALL</code></td><td>Serializable</td><td>Máximo aislamiento. Bloquea más recursos.</td></tr>
  </table>
  <div class="th-example"><span class="cm">// En SQLRPGLE: SET OPTION antes de cualquier SQL</span>
<span class="fn">EXEC SQL SET OPTION COMMIT = *CHG;</span>  <span class="cm">← transacciones activas, nivel mínimo</span>

<span class="cm">// Después de operaciones exitosas:</span>
<span class="fn">EXEC SQL COMMIT;</span>     <span class="cm">← confirma TODOS los cambios del bloque</span>

<span class="cm">// Si algo falla:</span>
<span class="fn">EXEC SQL ROLLBACK;</span>   <span class="cm">← deshace TODOS los cambios del bloque</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">La regla del commit: <em>un solo camino a COMMIT</em></div>
  <div class="th-concept-desc">
    Un programa transaccional bien diseñado tiene exactamente <strong>un único camino</strong>
    que llega a <code>COMMIT</code> — el camino feliz — y <em>todos los demás caminos</em>
    terminan en <code>ROLLBACK</code>. Si hay múltiples rutas que llevan al COMMIT, es fácil
    olvidar hacer ROLLBACK en algún caso de error y dejar datos inconsistentes.
    <br><br>
    El patrón correcto: verificar SQLSTATE después de <em>cada</em> EXEC SQL. Si SQLSTATE
    no es '00000', hacer ROLLBACK y retornar inmediatamente.
  </div>
  <div class="th-example"><span class="cm">*── Patrón correcto: solo 1 camino a COMMIT ─────────────────────────</span>
<span class="fn">EXEC SQL UPDATE prestamos SET presest = 'D' WHERE prescod = :v;</span>
<span class="kw">IF SQLSTATE &lt;&gt; '00000'; EXEC SQL ROLLBACK; RETURN; ENDIF;</span>

<span class="fn">EXEC SQL UPDATE libros SET libdis = libdis + 1 WHERE libcod = :w;</span>
<span class="kw">IF SQLSTATE &lt;&gt; '00000'; EXEC SQL ROLLBACK; RETURN; ENDIF;</span>

<span class="good">EXEC SQL COMMIT;</span>  <span class="cm">← solo si AMBAS operaciones fueron exitosas</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>STRJRNPF en archivo con registros abiertos:</strong> No puedes iniciar journaling en una tabla mientras algún job la tiene abierta. Asegúrate de que no haya jobs activos con la tabla antes de ejecutar <code>STRJRNPF</code>.</li>
    <li><strong>Múltiples COMMIT en un programa:</strong> Hacer <code>COMMIT</code> después de cada operación individual elimina la atomicidad. El patrón correcto es agrupar todas las operaciones relacionadas en una sola transacción y hacer un solo <code>COMMIT</code> al final de todas.</li>
    <li><strong>ROLLBACK parcial con SAVEPOINT:</strong> <code>ROLLBACK</code> sin <code>TO SAVEPOINT</code> revierte <em>toda</em> la transacción desde el último COMMIT. Si solo quieres revertir una parte, usa <code>SAVEPOINT sp1</code> + <code>ROLLBACK TO SAVEPOINT sp1</code>.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>Para ver el estado del journal en tiempo real: <code>SELECT * FROM QSYS2.JOURNAL_INFO WHERE JOURNAL_LIBRARY = 'BIBLIOTECA'</code>. Muestra el nombre del receiver activo, tamaño acumulado y si hay objetos abiertos sin commit (un indicador clave de transacciones largas que pueden bloquear el sistema).</p>
</div>`,
        obj:'Activar journaling y escribir un programa SQLRPGLE con transacción completa.',
        enun:'Activa journaling para PRESTAMOS y LIBROS. Escribe el programa PRESDEV2 que en una sola transacción: actualiza PRESEST a "D", incrementa LIBDIS, y hace COMMIT. Si algún UPDATE falla, ejecuta ROLLBACK y retorna el error detallado.',
        hints:[
          'Primero: <code>CRTJRNRCV</code> → <code>CRTJRN</code> → <code>STRJRNPF</code>',
          'En el programa: <code>EXEC SQL SET OPTION COMMIT = *CHG;</code>',
          'Verifica SQLSTATE después de CADA EXEC SQL antes de continuar',
          'Solo UN camino termina en COMMIT — todos los demás terminan en ROLLBACK'
        ],
        conceptos:['STRJRNPF','CRTJRN','SET OPTION COMMIT','EXEC SQL COMMIT','EXEC SQL ROLLBACK'],
        solucion:`/* ── Preparar journaling (CL) ─────────────────────────────── */
CRTJRNRCV JRNRCV(BIBLIOTECA/JRNRCV1) THRESHOLD(100000)
CRTJRN    JRN(BIBLIOTECA/BIBLIJNL) JRNRCV(BIBLIOTECA/JRNRCV1)
STRJRNPF  FILE(BIBLIOTECA/PRESTAMOS) JRN(BIBLIOTECA/BIBLIJNL)
STRJRNPF  FILE(BIBLIOTECA/LIBROS)    JRN(BIBLIOTECA/BIBLIJNL)

// ── PRESDEV2 — Devolución con transacción ───────────────────────────
**FREE
CTL-OPT OPTION(*NODEBUGIO:*SRCSTMT) DFTACTGRP(*NO) ACTGRP(*CALLER);

DCL-PI *N;
  pCodPres CHAR(9)   CONST;
  pResult  CHAR(100);
END-PI;

DCL-S vCodLib CHAR(7);

EXEC SQL SET OPTION COMMIT = *CHG;

// Obtener libro del préstamo pendiente
EXEC SQL SELECT PRESLIB INTO :vCodLib
         FROM  BIBLIOTECA/PRESTAMOS
         WHERE PRESCOD = :pCodPres AND PRESEST = 'P';

IF SQLSTATE = '02000';
  pResult = 'Préstamo no encontrado o ya devuelto.';
  *INLR = *ON; RETURN;
ELSEIF SQLSTATE <> '00000';
  EXEC SQL ROLLBACK;
  pResult = 'Error SELECT: ' + SQLSTATE;
  *INLR = *ON; RETURN;
ENDIF;

// Marcar como devuelto
EXEC SQL UPDATE BIBLIOTECA/PRESTAMOS
         SET PRESEST = 'D', PRESDVL = CURRENT_DATE
         WHERE PRESCOD = :pCodPres;

IF SQLSTATE <> '00000';
  EXEC SQL ROLLBACK;
  pResult = 'Error UPDATE préstamo: ' + SQLSTATE;
  *INLR = *ON; RETURN;
ENDIF;

// Incrementar disponibles
EXEC SQL UPDATE BIBLIOTECA/LIBROS
         SET LIBDIS = LIBDIS + 1
         WHERE LIBCOD = :vCodLib;

IF SQLSTATE <> '00000';
  EXEC SQL ROLLBACK;
  pResult = 'Error UPDATE libro: ' + SQLSTATE;
  *INLR = *ON; RETURN;
ENDIF;

EXEC SQL COMMIT;
pResult = 'Devolución registrada correctamente.';
*INLR = *ON;`
      }
    ]
  },

  {
    id:'f7', num:7, icon:'🔌', title:'Integración, Comunicación y APIs',

    desc:'Data Queues (DTAQ), HTTPAPI, YAJL (JSON), XML-INTO, IWS, Sockets TCP/IP',
    intro:`<p class="pi-text">
      IBM i tiene múltiples mecanismos de integración, desde los más clásicos hasta los más modernos.
      Las <strong>Data Queues (DTAQ)</strong> son colas de mensajes de alto rendimiento para
      comunicación asíncrona entre jobs — el equivalente IBM i de una cola de mensajes (MQ/Kafka
      liviano) nativo del sistema. Son extremadamente rápidas porque viven en memoria del sistema.
    </p>
    <p class="pi-text" style="margin-top:8px">
      Para conectarse al mundo exterior, IBM i puede consumir APIs REST mediante <strong>HTTPAPI</strong>
      (librería open source de Scott Klement) o la función <code>UTL_HTTP</code> de DB2.
      Para procesar respuestas, <strong>YAJL</strong> permite parsear y generar JSON de forma
      estructurada, mientras que <strong>XML-INTO</strong> es la opción nativa de RPGLE para
