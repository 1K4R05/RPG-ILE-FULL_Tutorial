<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBM i Learning Tracker — Sistema Biblioteca</title>
<style>
/* ─── RESET & BASE ─────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bg4:#2d333b;
  --border:#30363d;--border2:#444c56;
  --text:#e6edf3;--text2:#8b949e;--text3:#6e7681;
  --blue:#58a6ff;--blue2:#1f6feb;--blue3:#0d419d;
  --green:#3fb950;--green2:#196c2e;
  --orange:#f0883e;--orange2:#9e4900;
  --red:#f85149;--red2:#8b1a1a;
  --purple:#bc8cff;--purple2:#6e40c9;
  --yellow:#d29922;--yellow2:#5a3e00;
  --teal:#39d353;
  --radius:8px;--radius-sm:6px;
}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
  font-size:14px;line-height:1.6;
  background:var(--bg);color:var(--text);
  min-height:100vh;
}

/* ─── LAYOUT ───────────────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{
  background:var(--bg2);border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;
}
.main{overflow-y:auto;padding:0}

/* ─── SIDEBAR ──────────────────────────────────────────────────────── */
.sidebar-header{
  padding:18px 16px 14px;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--bg2);z-index:10;
}
.sidebar-logo{
  font-size:15px;font-weight:700;color:var(--text);
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
}
.sidebar-logo span{font-size:20px}
.global-progress{background:var(--bg3);border-radius:var(--radius-sm);padding:10px 12px}
.gp-label{font-size:11px;color:var(--text2);margin-bottom:6px;display:flex;justify-content:space-between}
.gp-bar-track{background:var(--bg4);border-radius:20px;height:6px;overflow:hidden}
.gp-bar-fill{
  height:100%;border-radius:20px;
  background:linear-gradient(90deg,var(--blue2),var(--green));
  transition:width .4s ease;
}
.gp-stats{display:flex;gap:8px;margin-top:8px;font-size:11px}
.gp-stat{
  flex:1;background:var(--bg4);border-radius:4px;
  padding:4px 6px;text-align:center;
}
.gp-stat b{display:block;font-size:13px;color:var(--text)}
.gp-stat span{color:var(--text2)}

.nav-section{padding:10px 0}
.nav-section-title{
  font-size:10px;font-weight:600;color:var(--text3);
  text-transform:uppercase;letter-spacing:.8px;
  padding:4px 16px 2px;
}
.nav-phase{cursor:pointer;user-select:none}
.nav-phase-header{
  display:flex;align-items:center;gap:8px;
  padding:7px 16px;font-size:13px;font-weight:500;
  transition:background .15s;border-radius:0;
  position:relative;
}
.nav-phase-header:hover{background:var(--bg3)}
.nav-phase-header.active-phase{color:var(--blue)}
.ph-icon{font-size:14px;width:20px;text-align:center}
.ph-badge{
  margin-left:auto;font-size:10px;font-weight:700;
  background:var(--bg4);border-radius:10px;
  padding:1px 7px;color:var(--text2);
  border:1px solid var(--border);
}
.ph-badge.done{background:var(--green2);color:var(--green);border-color:var(--green2)}
.ph-badge.partial{background:var(--yellow2);color:var(--yellow);border-color:var(--yellow2)}
.nav-exercises{display:none;padding:0 0 4px 36px}
.nav-exercises.open{display:block}
.nav-ex{
  display:flex;align-items:center;gap:7px;
  padding:5px 12px 5px 8px;font-size:12px;color:var(--text2);
  cursor:pointer;border-radius:var(--radius-sm);
  transition:background .1s,color .1s;
  margin-right:8px;
}
.nav-ex:hover{background:var(--bg3);color:var(--text)}
.nav-ex.active{background:var(--bg3);color:var(--blue)}
.nav-ex.completed{color:var(--green)}
.nav-ex.completed .nav-check{color:var(--green)}
.nav-check{font-size:11px;width:14px;text-align:center;flex-shrink:0}
.nav-ex-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-lv{font-size:9px;font-weight:700;border-radius:3px;padding:1px 4px;flex-shrink:0}
.lv-e{background:#1a4731;color:#3fb950}
.lv-m{background:#3d2900;color:#f0883e}
.lv-d{background:#3d0d0d;color:#f85149}

/* ─── MAIN HEADER ──────────────────────────────────────────────────── */
.page-header{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:20px 28px 16px;
  position:sticky;top:0;z-index:9;
}
.page-title{font-size:18px;font-weight:700;margin-bottom:4px}
.page-sub{font-size:12px;color:var(--text2)}
.phase-tabs{
  display:flex;gap:6px;margin-top:14px;flex-wrap:wrap;
}
.phase-tab{
  padding:5px 12px;border-radius:20px;
  font-size:12px;font-weight:500;cursor:pointer;
  border:1px solid var(--border);background:transparent;
  color:var(--text2);transition:all .15s;
}
.phase-tab:hover{border-color:var(--border2);color:var(--text)}
.phase-tab.active{background:var(--blue2);border-color:var(--blue2);color:#fff}
.phase-tab.done{border-color:var(--green2);color:var(--green)}

/* ─── CONTENT AREA ─────────────────────────────────────────────────── */
.content{padding:24px 28px 40px}

/* ─── PHASE BANNER ─────────────────────────────────────────────────── */
.phase-banner{
  border-radius:var(--radius);padding:18px 20px;
  margin-bottom:20px;
  border:1px solid var(--border);
  display:flex;align-items:center;gap:16px;
}
.phase-banner-icon{font-size:32px}
.phase-banner-info h2{font-size:16px;font-weight:700;margin-bottom:3px}
.phase-banner-info p{font-size:12px;color:var(--text2);margin:0}
.phase-banner-progress{margin-left:auto;text-align:center;flex-shrink:0}
.phase-circle{
  width:54px;height:54px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;
  border:3px solid var(--border);
  background:var(--bg3);
  transition:all .3s;
}
.phase-circle span{font-size:10px;color:var(--text2);display:block}

/* ─── EXERCISE CARDS ───────────────────────────────────────────────── */
.exercises-grid{display:flex;flex-direction:column;gap:16px}
.ex-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
  transition:border-color .2s;
}
.ex-card:hover{border-color:var(--border2)}
.ex-card.completed{border-color:var(--green2)}
.ex-card.completed .ex-card-header{background:rgba(63,185,80,.05)}
.ex-card.active-card{border-color:var(--blue2)}

.ex-card-header{
  padding:14px 16px;display:flex;align-items:flex-start;gap:12px;
  cursor:pointer;
}
.ex-card-check{
  width:22px;height:22px;border-radius:50%;border:2px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:1px;cursor:pointer;
  transition:all .2s;font-size:12px;
}
.ex-card.completed .ex-card-check{
  background:var(--green);border-color:var(--green);color:#fff;
}
.ex-card-meta{flex:1}
.ex-card-id{font-size:10px;color:var(--text3);font-weight:600;margin-bottom:2px}
.ex-card-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px}
.ex-card-tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{
  font-size:10px;padding:2px 7px;border-radius:10px;
  font-weight:500;
}
.tag-fase{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.tag-e{background:#1a4731;color:#3fb950}
.tag-m{background:#3d2900;color:#f0883e}
.tag-d{background:#3d0d0d;color:#f85149}
.tag-concept{background:var(--blue3);color:var(--blue)}
.ex-card-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.btn-expand{
  background:transparent;border:1px solid var(--border);
  color:var(--text2);padding:4px 10px;border-radius:var(--radius-sm);
  font-size:11px;cursor:pointer;transition:all .15s;
  font-family:inherit;
}
.btn-expand:hover{border-color:var(--border2);color:var(--text);background:var(--bg3)}
.btn-done{
  background:var(--green2);border:1px solid var(--green2);
  color:var(--green);padding:4px 12px;border-radius:var(--radius-sm);
  font-size:11px;cursor:pointer;font-weight:600;
  transition:all .15s;font-family:inherit;
}
.btn-done:hover{background:#2ea043;color:#fff}
.btn-undone{
  background:var(--bg3);border:1px solid var(--border2);
  color:var(--text2);padding:4px 12px;border-radius:var(--radius-sm);
  font-size:11px;cursor:pointer;font-weight:600;
  transition:all .15s;font-family:inherit;
}
.btn-undone:hover{background:var(--red2);border-color:var(--red2);color:var(--red)}

/* ─── EXERCISE BODY ────────────────────────────────────────────────── */
.ex-body{display:none;padding:0 16px 16px;border-top:1px solid var(--border)}
.ex-body.open{display:block}

.ex-section{margin-top:14px}
.ex-section-title{
  font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.6px;color:var(--text2);margin-bottom:6px;
  display:flex;align-items:center;gap:6px;
}
.ex-section-title::after{
  content:'';flex:1;height:1px;background:var(--border);
}
.obj-box{
  background:rgba(31,111,235,.1);border-left:3px solid var(--blue2);
  padding:8px 12px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  font-size:12px;color:var(--text);
}
.enun-text{font-size:12px;color:var(--text);line-height:1.7}
.hints-box{
  background:rgba(188,140,255,.08);border:1px solid rgba(188,140,255,.2);
  border-radius:var(--radius-sm);padding:10px 13px;
}
.hints-box ul{padding-left:15px;margin:0}
.hints-box li{font-size:12px;color:var(--text2);margin-bottom:3px}
.hints-box li code{
  background:var(--bg4);padding:1px 4px;border-radius:3px;
  font-size:11px;font-family:"Cascadia Code","Consolas",monospace;
  color:var(--orange);
}

/* ─── CODE BLOCKS ──────────────────────────────────────────────────── */
.sol-toggle-btn{
  background:var(--bg3);border:1px solid var(--border2);
  color:var(--text2);padding:6px 14px;border-radius:var(--radius-sm);
  font-size:11px;cursor:pointer;font-family:inherit;font-weight:600;
  display:flex;align-items:center;gap:6px;
  transition:all .15s;
}
.sol-toggle-btn:hover{background:var(--bg4);color:var(--text)}
.sol-toggle-btn .arrow{transition:transform .2s;display:inline-block}
.sol-toggle-btn.open .arrow{transform:rotate(90deg)}
.sol-code{display:none;margin-top:8px}
.sol-code.open{display:block}
pre{
  background:#161b22;border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:14px 16px;font-size:11px;overflow-x:auto;
  line-height:1.6;
  font-family:"Cascadia Code","Consolas","Courier New",monospace;
  color:#abb2bf;
}
.kw{color:#c678dd}.str{color:#98c379}.cm{color:#5c6370;font-style:italic}
.nm{color:#d19a66}.fn{color:#61afef}.op{color:#56b6c2}.ky2{color:#e06c75}

/* ─── NOTES ────────────────────────────────────────────────────────── */
.notes-area{
  width:100%;background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:10px 12px;
  color:var(--text);font-size:12px;line-height:1.6;
  font-family:inherit;resize:vertical;min-height:70px;
  transition:border-color .15s;
}
.notes-area:focus{outline:none;border-color:var(--blue2)}
.notes-area::placeholder{color:var(--text3)}

/* ─── COMPLETED BADGE ──────────────────────────────────────────────── */
.completed-ribbon{
  display:none;background:var(--green2);color:var(--green);
  font-size:11px;font-weight:700;padding:3px 10px;
  border-radius:0 0 var(--radius-sm) var(--radius-sm);
  text-align:center;
}
.ex-card.completed .completed-ribbon{display:block}

/* ─── STREAK / STATS ────────────────────────────────────────────────── */
.stats-bar{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:10px;margin-bottom:20px;
}
.stat-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 16px;
  text-align:center;
}
.stat-card .sv{font-size:24px;font-weight:700;color:var(--text)}
.stat-card .sl{font-size:11px;color:var(--text2);margin-top:2px}
.stat-card.blue .sv{color:var(--blue)}
.stat-card.green .sv{color:var(--green)}
.stat-card.orange .sv{color:var(--orange)}
.stat-card.purple .sv{color:var(--purple)}

/* ─── PHASE PROGRESS MINI ─────────────────────────────────────────── */
.phase-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.phase-row{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:10px 14px;
  display:flex;align-items:center;gap:12px;cursor:pointer;
  transition:border-color .15s;
}
.phase-row:hover{border-color:var(--border2)}
.phase-row-icon{font-size:16px;width:24px;text-align:center}
.phase-row-info{flex:1}
.phase-row-title{font-size:13px;font-weight:600}
.phase-row-sub{font-size:11px;color:var(--text2)}
.phase-row-bar{width:120px}
.phase-mini-track{background:var(--bg4);border-radius:20px;height:5px;overflow:hidden;margin-bottom:3px}
.phase-mini-fill{height:100%;border-radius:20px;background:var(--green);transition:width .3s}
.phase-mini-pct{font-size:10px;color:var(--text2);text-align:right}
.phase-row-count{
  font-size:11px;font-weight:700;color:var(--text2);
  background:var(--bg4);border-radius:4px;padding:2px 8px;
}

/* ─── EMPTY STATE ──────────────────────────────────────────────────── */
.empty{text-align:center;padding:40px 20px;color:var(--text2)}
.empty-icon{font-size:40px;margin-bottom:10px}
.empty p{font-size:13px}

/* ─── TOAST ────────────────────────────────────────────────────────── */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:999;
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:var(--radius);padding:10px 16px;
  font-size:13px;color:var(--text);
  transform:translateY(20px);opacity:0;
  transition:all .25s;pointer-events:none;
  display:flex;align-items:center;gap:8px;
}
.toast.show{transform:translateY(0);opacity:1}
.toast.green{border-color:var(--green2);color:var(--green)}
.toast.red{border-color:var(--red2);color:var(--red)}

/* ─── SCROLLBAR ────────────────────────────────────────────────────── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border2)}

/* ─── ACORDEÓN CL ──────────────────────────────────────────────────── */
.ac-page{padding:0}
.ac-hero{
  background:linear-gradient(135deg,#0d1117 0%,#1a1040 100%);
  border-bottom:1px solid var(--border);
  padding:22px 28px 18px;
}
.ac-hero h2{font-size:18px;font-weight:700;margin-bottom:4px}
.ac-hero p{font-size:12px;color:var(--text2)}
.ac-search-wrap{
  display:flex;align-items:center;gap:10px;
  margin-top:14px;position:relative;
}
.ac-search{
  flex:1;background:var(--bg3);border:1px solid var(--border2);
  border-radius:var(--radius);padding:10px 14px 10px 40px;
  color:var(--text);font-size:14px;font-family:inherit;
  outline:none;transition:border-color .2s;
}
.ac-search:focus{border-color:var(--purple2)}
.ac-search::placeholder{color:var(--text3)}
.ac-search-icon{
  position:absolute;left:13px;color:var(--text3);font-size:15px;
  pointer-events:none;
}
.ac-filter-wrap{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ac-filter{
  padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;
  cursor:pointer;border:1px solid var(--border);background:transparent;
  color:var(--text2);transition:all .15s;font-family:inherit;
}
.ac-filter:hover{border-color:var(--border2);color:var(--text)}
.ac-filter.active{color:#fff}
.ac-stats-bar{
  display:flex;align-items:center;gap:14px;
  padding:10px 28px;border-bottom:1px solid var(--border);
  background:var(--bg2);font-size:12px;color:var(--text2);
}
.ac-count{font-weight:700;color:var(--text)}
.ac-body{padding:16px 28px 40px}
.ac-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:10px;
}
.ac-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
  transition:border-color .2s,transform .15s;
}
.ac-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.ac-card-top{
  padding:10px 13px 8px;
  display:flex;align-items:flex-start;gap:10px;
  border-bottom:1px solid var(--border);
  background:var(--bg3);
}
.ac-cmd{
  font-family:"Cascadia Code","Consolas",monospace;
  font-size:13px;font-weight:700;color:var(--purple);
  flex:1;word-break:break-all;
}
.ac-cat{
  font-size:9px;font-weight:700;padding:2px 7px;
  border-radius:10px;white-space:nowrap;flex-shrink:0;
  margin-top:2px;
}
.ac-body-card{padding:10px 13px}
.ac-desc{font-size:12px;color:var(--text);margin-bottom:6px;line-height:1.5}
.ac-uso{
  font-size:11px;color:var(--text2);
  background:var(--bg4);border-radius:4px;
  padding:5px 9px;line-height:1.5;
}
.ac-uso b{color:var(--orange);display:block;font-size:10px;margin-bottom:2px}
.ac-example{
  margin-top:6px;background:#1e2229;border-radius:4px;
  padding:6px 9px;font-family:"Cascadia Code","Consolas",monospace;
  font-size:10px;color:#abb2bf;overflow-x:auto;white-space:pre;
}
.ac-no-results{
  text-align:center;padding:48px 20px;color:var(--text2);
  grid-column:1/-1;
}
.ac-no-results .icon{font-size:36px;margin-bottom:10px}

/* ─── RESPONSIVE ───────────────────────────────────────────────────── */
@media(max-width:768px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:-260px;z-index:100;transition:left .25s;height:100vh}
  .sidebar.open{left:0}
  .stats-bar{grid-template-columns:1fr 1fr}
  .ac-grid{grid-template-columns:1fr}
  .ac-body{padding:12px 14px 40px}
  .ac-hero{padding:16px 14px 14px}
  .ac-stats-bar{padding:8px 14px}
}
</style>
</head>
<body>
<div class="app">

<!-- ═══════════════════════ SIDEBAR ═══════════════════════════════ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <span>📚</span> IBM i Tracker
    </div>
    <div class="global-progress">
      <div class="gp-label">
        <span>Progreso global</span>
        <span id="gp-pct">0%</span>
      </div>
      <div class="gp-bar-track"><div class="gp-bar-fill" id="gp-bar" style="width:0%"></div></div>
      <div class="gp-stats">
        <div class="gp-stat"><b id="gp-done">0</b><span>Listos</span></div>
        <div class="gp-stat"><b id="gp-total">0</b><span>Total</span></div>
        <div class="gp-stat"><b id="gp-pend">0</b><span>Pendientes</span></div>
      </div>
    </div>
  </div>
  <nav class="nav-section">
    <div class="nav-section-title">Dashboard</div>
    <div class="nav-phase">
      <div class="nav-phase-header" onclick="showDashboard()">
        <span class="ph-icon">🏠</span> Inicio
      </div>
    </div>
    <div class="nav-phase">
      <div class="nav-phase-header" onclick="showAcordeon()">
        <span class="ph-icon">📖</span> Acordeón CL
      </div>
    </div>
    <div class="nav-phase">
      <div class="nav-phase-header" onclick="showQuiz()" style="color:var(--purple)">
        <span class="ph-icon">🎯</span> Modo Quiz
      </div>
    </div>
    <div class="nav-section-title" style="margin-top:10px">Progreso</div>
    <div class="nav-phase">
      <div class="nav-phase-header" onclick="exportProgress()" style="color:var(--green)">
        <span class="ph-icon">📥</span> Exportar JSON
      </div>
    </div>
    <div class="nav-phase">
      <div class="nav-phase-header" onclick="importProgress()" style="color:var(--blue)">
        <span class="ph-icon">📤</span> Importar JSON
      </div>
    </div>
    <div class="nav-phase">
      <div class="nav-phase-header" onclick="resetProgress()" style="color:var(--red)">
        <span class="ph-icon">🗑️</span> Reiniciar todo
      </div>

  *IN71 = *ON;
  EXFMT SFCTLLIB;
  SELECT;
    WHEN *IN03; vSalir = *ON;
    WHEN *IN05; CargarSubfile();

DCL-PROC CargarSubfile;
  nRrn  = 0;
  *IN71 = *OFF;
  *IN72 = *ON;
  WRITE SFCTLLIB;
  *IN72 = *OFF;
  *IN73 = *OFF;

  SETLL *LOVAL LIBREC;
  READ  LIBREC;

  DOW NOT %EOF(LIBXTTL);
    nRrn += 1;
    SFLLIB = LIBCOD;
    SFLTTL = LIBTTL;
    SFLDIS = LIBDIS;
    WRITE SFLIB;
    READ LIBREC;
  ENDDO;

  *IN73 = *ON;

InsertarPrestamo(pCodSoc : pCodLib : nSec : vOk : vMsg);

    UPDATE LIBREC;

DCL-PROC ValidarSocio;
  DCL-PI *N; pCod CHAR(7) CONST; pOk IND; pMsg CHAR(100); END-PI;
  CHAIN pCod SOCREC;
  IF NOT %FOUND(SOCIOS);
    pOk=*OFF; pMsg='Socio no encontrado: '+pCod; RETURN;
  ENDIF;
  IF SOCACT <> 'S';
    pOk=*OFF; pMsg='Socio inactivo: '+pCod; RETURN;

DCL-PROC ValidarLibro;

  ENDIF;
  IF LIBDIS <= 0;
    pOk=*OFF; pMsg='Sin disponibles: '+pCod; RETURN;
  ENDIF;
  pOk=*ON; pMsg=*BLANKS;
END-PROC;

  OUT pEstado   CHAR(5),
  OUT pDiasRet  INTEGER,
  OUT pMensaje  VARCHAR(100)
)
LANGUAGE SQL
MODIFIES SQL DATA
BEGIN
  DECLARE vCodLib  CHAR(7);
  DECLARE vDvlPrev DATE;
  DECLARE vEstPrev CHAR(1);
  DECLARE vDias    INTEGER DEFAULT 0;
  DECLARE CONTINUE HANDLER FOR SQLEXCEPTION
    BEGIN
      SET pEstado  = SQLSTATE;
      SET pMensaje = 'Error interno: ' || SQLSTATE;
      ROLLBACK;
    END;

  SELECT PRESLIB, PRESDVL, PRESEST
  INTO   vCodLib, vDvlPrev, vEstPrev
  FROM   BIBLIOTECA/PRESTAMOS

  IF SQLSTATE = '02000' THEN

    SET pMensaje = 'Préstamo no encontrado: ' || pCodPres;

  IF vEstPrev <> 'P' THEN
    SET pEstado  = 'NOACT';
    SET pMensaje = 'El préstamo no está pendiente.';
    RETURN;

  SET vDias = DAYS_BETWEEN(CURRENT_DATE, vDvlPrev);
  IF vDias < 0 THEN SET vDias = 0; END IF;

  UPDATE BIBLIOTECA/PRESTAMOS
  SET    PRESEST = 'D', PRESDVL = CURRENT_DATE
  WHERE  PRESCOD = pCodPres;

  UPDATE BIBLIOTECA/LIBROS
  SET    LIBDIS = LIBDIS + 1
  WHERE  LIBCOD = vCodLib;

  COMMIT;

  SET pEstado  = '00000';
  SET pDiasRet = vDias;
  SET pMensaje = CASE WHEN vDias > 0
    THEN 'Devolución con ' || TRIM(CHAR(vDias)) || ' días de retraso.'
    ELSE 'Devolución en tiempo.'
  END;
END;`

  DCL-PI *N CHAR(50);
    pStr  CHAR(50) CONST;

**FREE

  *INLR = *ON; RETURN;

DCL-PROC Multa_DiariaFija EXPORT;
  DCL-PI *N BINDEC(11:2);

    pValLib PACKED(9:2) CONST;
  END-PI;
  RETURN pDias * 1.00;

DCL-PROC Multa_Escalada EXPORT;
  DCL-PI *N BINDEC(11:2);
    pDias   INT(10)   CONST;
    pValLib PACKED(9:2) CONST;
  END-PI;
  DCL-S vMulk BINDEC(11:2);
  IF pDias <= 7;
    vMulk = pDias * 1.00;
  ELSE;
    vMulk = 7 * 1.00 + (pDias - 7) * 2.00;
  ENDIF;
  RETURN vMulk;
END-PROC;

  DCL-PI *N BINDEC(11:2);
    pDias   INT(10)   CONST;

  END-PI;
  DCL-S vSemanas BINDEC(5:2);
  vSemanas = %DEC(pDias / 7 : 5 : 2);

    OTHER;

DCL-PROC Val_Socio EXPORT;
  DCL-PI *N LIKEDS(dsValResult);

  DCL-DS result LIKEDS(dsValResult);

           INTO   :vCnt, :vAct
           FROM   BIBLIOTECA/SOCIOS
           WHERE  SOCCOD = :pSocCod;

  IF vCnt = 0;
    result.ok     = *OFF;
    result.codigo = 'SOC01';
    result.msg    = 'Socio no encontrado: ' + %TRIM(pSocCod);
  ELSEIF vAct <> 'S';
    result.ok     = *OFF;
    result.codigo = 'SOC02';
    result.msg    = 'Socio inactivo: ' + %TRIM(pSocCod);
  ELSE;
    result.ok     = *ON;
    result.codigo = '00000';
    result.msg    = 'OK';
  ENDIF;
  RETURN result;

DCL-PROC Val_Libro EXPORT;
  DCL-PI *N LIKEDS(dsValResult);
    pLibCod CHAR(7) CONST;

  DCL-DS result LIKEDS(dsValResult);
  DCL-S vDis PACKED(2:0);
  DCL-S vCnt INT(10);

  EXEC SQL SELECT COUNT(*), MAX(LIBDIS)
           INTO   :vCnt, :vDis
           FROM   BIBLIOTECA/LIBROS
           WHERE  LIBCOD = :pLibCod;

  IF vCnt = 0;
    result.ok     = *OFF;
    result.codigo = 'LIB01';
    result.msg    = 'Libro no encontrado: ' + %TRIM(pLibCod);
  ELSEIF vDis <= 0;
    result.ok     = *OFF;
    result.codigo = 'LIB02';
    result.msg    = 'No hay ejemplares disponibles de: ' + %TRIM(pLibCod);
  ELSE;
    result.ok     = *ON;
    result.codigo = '00000';
    result.msg    = 'OK';
  ENDIF;
  RETURN result;

    result.codigo = 'PRE01';
    result.msg    = 'Límite de préstamos activos alcanzado (5)';
    RETURN result;
  ENDIF;

  result.ok     = *ON;
  result.codigo = '00000';
  result.msg    = 'Validación OK — puede proceder';
  RETURN result;

/* ════════════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════════ */
let state = { completed: {}, notes: {}, currentView: 'dashboard', currentPhase: null };

function loadState() {
  try {
    const s = localStorage.getItem('ibmi_tracker');
    if (s) state = { ...state, ...JSON.parse(s) };
  } catch(e) {}
}
function saveState() {
  try { localStorage.setItem('ibmi_tracker', JSON.stringify(state)); } catch(e) {}
}

/* ════════════════════════════════════════════════════════════════
   STATS
═══════════════════════════════════════════════════════════════ */
function getAllExercises() {
  return PHASES.flatMap(p => p.exercises.map(e => ({ ...e, phase: p })));
}
function getStats() {
  const all = getAllExercises();
  const done = all.filter(e => state.completed[e.id]);
  return { total: all.length, done: done.length, pend: all.length - done.length };
}
function getPhaseStats(phase) {
  const done = phase.exercises.filter(e => state.completed[e.id]).length;
  return { done, total: phase.exercises.length, pct: phase.exercises.length ? Math.round(done/phase.exercises.length*100) : 0 };
}

/* ════════════════════════════════════════════════════════════════
   SIDEBAR BUILD
═══════════════════════════════════════════════════════════════ */
function buildSidebar() {
  const stats = getStats();
  const pct = stats.total ? Math.round(stats.done/stats.total*100) : 0;
  document.getElementById('gp-pct').textContent = pct + '%';
  document.getElementById('gp-bar').style.width = pct + '%';
  document.getElementById('gp-done').textContent = stats.done;
  document.getElementById('gp-total').textContent = stats.total;
  document.getElementById('gp-pend').textContent = stats.pend;

  const nav = document.getElementById('nav-phases');
  nav.innerHTML = PHASES.map(p => {
    const ps = getPhaseStats(p);
    const badgeClass = ps.done === ps.total && ps.total > 0 ? 'done' : ps.done > 0 ? 'partial' : '';
    const badgeLabel = ps.done === ps.total && ps.total > 0 ? '✓' : `${ps.done}/${ps.total}`;
    return `
    <div class="nav-phase" id="navp-${p.id}">
      <div class="nav-phase-header ${state.currentPhase === p.id ? 'active-phase' : ''}"
           onclick="toggleNavPhase('${p.id}')">
        <span class="ph-icon">${p.icon}</span>
        <span>Fase ${p.num}</span>
        <span class="ph-badge ${badgeClass}">${badgeLabel}</span>
      </div>
      <div class="nav-exercises ${state.currentPhase === p.id ? 'open' : ''}" id="navex-${p.id}">
        ${p.exercises.map(e => `
          <div class="nav-ex ${state.completed[e.id] ? 'completed' : ''} ${state.currentView === e.id ? 'active' : ''}"
               onclick="showPhase('${p.id}','${e.id}')">
            <span class="nav-check">${state.completed[e.id] ? '✓' : '○'}</span>
            <span class="nav-ex-title">${e.id}: ${e.title}</span>
            <span class="nav-lv lv-${e.nivel.toLowerCase()}">${e.nivel}</span>
          </div>
        `).join('')}
      </div>
    </div>`;
  }).join('');
}

function toggleNavPhase(phaseId) {
  const wasOpen = state.currentPhase === phaseId;
  if (wasOpen) {
    showPhase(phaseId);
  } else {
    showPhase(phaseId);
  }
}

      const ps = getPhaseStats(p);

      return `<button class="phase-tab ${state.currentPhase === p.id && state.currentView !== 'dashboard' ? 'active' : ''} ${doneClass}"

/* ════════════════════════════════════════════════════════════════
   PHASE VIEW
═══════════════════════════════════════════════════════════════ */
function showPhase(phaseId, scrollToId) {
  const phase = PHASES.find(p => p.id === phaseId);
  if (!phase) return;
  state.currentPhase = phaseId;
  state.currentView = phaseId;
  saveState();
  document.getElementById('page-title').textContent = `Fase ${phase.num} — ${phase.title}`;
  document.getElementById('page-sub').textContent = phase.desc + ' · Nivel ' + phase.nivel;
  buildPhaseTabs();
  buildSidebar();

  const ps = getPhaseStats(phase);
  const bannerBg = ps.done === ps.total && ps.total > 0
    ? 'rgba(63,185,80,.08)' : 'var(--bg2)';
  const borderColor = ps.done === ps.total && ps.total > 0
    ? 'var(--green2)' : 'var(--border)';

  document.getElementById('content').innerHTML = `
    <div class="phase-banner" style="background:${bannerBg};border-color:${borderColor}">
      <div class="phase-banner-icon">${phase.icon}</div>
      <div class="phase-banner-info">
        <h2>Fase ${phase.num} — ${phase.title}</h2>
        <p>${phase.desc}</p>
      </div>
      <div class="phase-banner-progress">
        <div class="phase-circle" style="${ps.pct===100?'border-color:var(--green);color:var(--green);background:rgba(63,185,80,.1)':'border-color:var(--blue2);color:var(--blue)'}">
          ${ps.pct}%
        </div>
        <span style="font-size:10px;color:var(--text2);margin-top:4px;display:block">${ps.done}/${ps.total} listos</span>
      </div>
    </div>
    <div class="exercises-grid" id="exercises-grid">
      ${phase.exercises.map(e => renderExCard(e, phase)).join('')}
    </div>
  `;

  if (scrollToId) {
    setTimeout(() => {
      const el = document.getElementById('ex-' + scrollToId);
      if (el) { el.scrollIntoView({ behavior:'smooth', block:'center' }); openExBody(scrollToId); }
    }, 100);
  }
}

        </button>

          ? `<button class="btn-undone" onclick="event.stopPropagation();toggleDone('${ex.id}','${phase.id}')">↩ Deshacer</button>`
          : `<button class="btn-done" onclick="event.stopPropagation();toggleDone('${ex.id}','${phase.id}')">✓ Completado</button>`
        }
      </div>

/* ════════════════════════════════════════════════════════════════
   INTERACTIONS
═══════════════════════════════════════════════════════════════ */
function toggleExBody(exId) {
  const body = document.getElementById('body-' + exId);
  const arrow = document.getElementById('arrow-' + exId);
  const isOpen = body && body.classList.contains('open');
  if (body) body.classList.toggle('open', !isOpen);
  if (arrow) arrow.textContent = isOpen ? '▼' : '▲';
}
function openExBody(exId) {
  const body = document.getElementById('body-' + exId);
  const arrow = document.getElementById('arrow-' + exId);
  if (body) body.classList.add('open');
  if (arrow) arrow.textContent = '▲';
}
function toggleSol(exId) {
  const sol = document.getElementById('sol-' + exId);
  const btn = document.getElementById('solbtn-' + exId);
  const isOpen = sol && sol.classList.contains('open');
  if (sol) sol.classList.toggle('open', !isOpen);
  if (btn) {
    btn.classList.toggle('open', !isOpen);
    btn.innerHTML = (isOpen
      ? '<span class="arrow">▶</span> Mostrar solución'
      : '<span class="arrow" style="transform:rotate(90deg)">▶</span> Ocultar solución');
  }
}
function toggleDone(exId, phaseId) {
  const wasDone = state.completed[exId];
  if (wasDone) {
    delete state.completed[exId];
    showToast('↩ Ejercicio marcado como pendiente', 'red');
  } else {
    state.completed[exId] = Date.now();
    showToast('✓ ¡Ejercicio completado!', 'green');
  }
  saveState();
  showPhase(phaseId);
}
function saveNote(exId, value) {
  state.notes[exId] = value;
  saveState();
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

/* ════════════════════════════════════════════════════════════════
   EXPORTAR PROGRESO A JSON
═══════════════════════════════════════════════════════════════ */
function exportProgress() {
  const all = getAllExercises();
  const exportData = {
    exportado: new Date().toISOString(),
    resumen: getStats(),
    fases: PHASES.map(p => {
      const ps = getPhaseStats(p);
      return {
        fase: p.num,
        titulo: p.title,
        progreso: `${ps.done}/${ps.total} (${ps.pct}%)`,
        ejercicios: p.exercises.map(e => ({
          id: e.id,
          titulo: e.title,
          nivel: { E:'Fácil', M:'Medio', D:'Difícil' }[e.nivel],
          completado: !!state.completed[e.id],
          fechaCompletado: state.completed[e.id]
            ? new Date(state.completed[e.id]).toLocaleDateString('es-MX')
            : null,
          nota: state.notes[e.id] || ''
        }))
      };
    })
  };
  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ibmi_progreso_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('📥 Progreso exportado a JSON', 'green');
}

function importProgress() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        let imported = 0;
        // Restaurar completed y notes
        data.fases && data.fases.forEach(f => {
          f.ejercicios && f.ejercicios.forEach(ex => {
            if (ex.completado) {
              state.completed[ex.id] = state.completed[ex.id] || Date.now();
              imported++;
            }
            if (ex.nota) state.notes[ex.id] = ex.nota;
          });
        });
        saveState();
        showDashboard();
        showToast(`✅ ${imported} ejercicios importados`, 'green');
      } catch(err) {
        showToast('❌ Error al importar: JSON inválido', 'red');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetProgress() {
  if (!confirm('⚠️ ¿Seguro que quieres borrar TODO el progreso y notas?\nEsta acción no se puede deshacer.')) return;
  state = { completed: {}, notes: {}, currentView: 'dashboard', currentPhase: null };
  saveState();
  showDashboard();
  showToast('🗑️ Progreso reiniciado', 'red');
}

let quizState = { active: false, exercises: [], idx: 0, score: 0, shown: false };

function showQuiz() {
  state.currentView = 'quiz';
  state.currentPhase = null;
  saveState();
  document.getElementById('page-title').textContent = '🎯 Modo Quiz';
  document.getElementById('page-sub').textContent = 'Autoevaluación — responde sin ver la solución';
  buildPhaseTabs();
  buildSidebar();

  // Filtrar ejercicios pendientes o todos
  const all = getAllExercises();
  const pending = all.filter(e => !state.completed[e.id]);
  const pool = pending.length >= 5 ? pending : all;
  // Mezclar aleatoriamente
  const shuffled = [...pool].sort(() => Math.random() - 0.5).slice(0, 10);
  quizState = { active: true, exercises: shuffled, idx: 0, score: 0, shown: false };

  renderQuizCard();
}

          <div style="font-size:10px;color:var(--text2)">puntos</div>
        </div>
        <button onclick="showDashboard()" style="background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:6px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px">✕ Salir</button>
      </div>

      <!-- Tarjeta de pregunta -->
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:12px">
        <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
          <span class="tag tag-fase">Fase ${phase.num}</span>
          <span class="tag ${lvClass[ex.nivel]}">${lvMap[ex.nivel]}</span>

          <button onclick="quizRevealSol()" style="background:var(--bg3);border:1px solid var(--orange);color:var(--orange);padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px">👁 Ver solución (0pt)</button>

        </div>

function quizShowHint() {
  quizState.score = Math.max(0, quizState.score - 1);

}

function quizRevealSol() {
  quizState.shown = true;
  document.getElementById('quiz-sol-box').style.display = 'block';
  document.getElementById('quiz-actions').style.display = 'none';
}

function quizMarkKnew() {
  quizState.score += 3;
  quizState.idx++;
  showToast('⭐ +3 puntos — ¡excelente!', 'green');
  setTimeout(renderQuizCard, 300);
}

function quizAnswer(pts) {
  quizState.score += pts;
  quizState.idx++;
  const msgs = { 1:'Sigue practicando 💪', 2:'¡Vas bien! 🤔', 3:'¡Correcto! ⭐' };
  const types = { 1:'red', 2:'orange', 3:'green' };
  showToast(`${msgs[pts]} +${pts}pt`, types[pts]);
  setTimeout(renderQuizCard, 300);
}

function renderQuizResults() {
  const q = quizState;
  const max = q.exercises.length * 3;
  const pct = Math.round((q.score / max) * 100);
  const grade = pct >= 90 ? '🏆 Experto' : pct >= 70 ? '⭐ Muy bien' : pct >= 50 ? '👍 Bien' : '💪 Sigue practicando';
  const col = pct >= 90 ? 'var(--teal)' : pct >= 70 ? 'var(--green)' : pct >= 50 ? 'var(--yellow)' : 'var(--orange)';

  document.getElementById('content').innerHTML = `
    <div style="max-width:600px;margin:40px auto;text-align:center">
      <div style="font-size:64px;margin-bottom:16px">🎯</div>
      <h2 style="font-size:28px;margin-bottom:8px">${grade}</h2>
      <div style="font-size:64px;font-weight:700;color:${col};margin:16px 0">${q.score}<span style="font-size:24px;color:var(--text2)"> / ${max}</span></div>
      <div style="font-size:16px;color:var(--text2);margin-bottom:32px">${pct}% de aciertos en ${q.exercises.length} preguntas</div>
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:24px">
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px">

          <div><div style="font-size:24px;font-weight:700;color:var(--purple)">${pct}%</div><div style="font-size:12px;color:var(--text2)">Porcentaje</div></div>
        </div>
      </div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">

let toastTimer;

  const t = document.getElementById('toast');

}

/* ════════════════════════════════════════════════════════════════
   ACORDEÓN — ESTADO Y RENDER
═══════════════════════════════════════════════════════════════ */
let acSearch = '';
let acFilter = '*';

function showAcordeon() {
  state.currentView = 'acordeon';
  state.currentPhase = null;
  saveState();
  document.getElementById('page-title').textContent = 'Acordeón de Comandos IBM i';
  document.getElementById('page-sub').textContent = 'Búsqueda inteligente · ' + CMDS.length + ' comandos AS/400 · Descripción + Uso habitual + Ejemplo';
  buildPhaseTabs();
  buildSidebar();
  acSearch = '';
  acFilter = '*';
  renderAcordeon();
}

function renderAcordeon() {
  const q = acSearch.toLowerCase().trim();
  const filtered = CMDS.filter(c => {
    const matchCat = acFilter === '*' || c.cat === acFilter;
    if (!matchCat) return false;
    if (!q) return true;
    return c.cmd.toLowerCase().includes(q)
        || c.desc.toLowerCase().includes(q)
        || c.uso.toLowerCase().includes(q)
        || c.ej.toLowerCase().includes(q)
        || CATS[c.cat].label.toLowerCase().includes(q);
  });

  const catCounts = {};
  CMDS.forEach(c => { catCounts[c.cat] = (catCounts[c.cat]||0)+1; });

  document.getElementById('content').innerHTML = `
    <div class="ac-page">
      <div class="ac-hero">
        <h2>📖 Acordeón de Comandos IBM i / AS400</h2>
        <p>Busca por nombre del comando, descripción o uso habitual. Filtra por categoría.</p>
        <div class="ac-search-wrap">
          <span class="ac-search-icon">🔍</span>
          <input class="ac-search" id="ac-input" type="text"
            placeholder="Buscar: CRTPF, 'crear archivo', 'journaling', 'depurar'..."
            value="${acSearch}"
            oninput="acOnInput(this.value)"
            autocomplete="off" spellcheck="false">
        </div>
        <div class="ac-filter-wrap">
          <button class="ac-filter ${acFilter==='*'?'active':''}"
                  style="${acFilter==='*'?'background:var(--purple2);border-color:var(--purple2)':''}"
                  onclick="acSetFilter('*')">Todos (${CMDS.length})</button>
          ${Object.entries(CATS).map(([k,v]) => `
            <button class="ac-filter ${acFilter===k?'active':''}"
                    style="${acFilter===k?`background:${v.color};border-color:${v.color}`:`border-color:${v.color}33;color:${v.color}`}"
                    onclick="acSetFilter('${k}')">
              ${v.label} (${catCounts[k]||0})
            </button>
          `).join('')}
        </div>
      </div>
      <div class="ac-stats-bar">
        <span>Mostrando</span>
        <span class="ac-count">${filtered.length}</span>
        <span>de ${CMDS.length} comandos</span>
        ${q ? `<span>· búsqueda: "<strong style="color:var(--purple)">${q}</strong>"</span>` : ''}
      </div>
      <div class="ac-body">
        <div class="ac-grid" id="ac-grid">
          ${filtered.length === 0
            ? `<div class="ac-no-results">
                <div class="icon">🔎</div>
                <p>No se encontraron comandos para "<strong>${q}</strong>"</p>
                <p style="margin-top:6px;font-size:11px">Intenta con parte del nombre o una palabra de la descripción</p>
               </div>`
            : filtered.map(c => renderCmdCard(c, q)).join('')
          }
        </div>
      </div>
    </div>`;
  // Focus en el input después de render
  setTimeout(() => { const inp = document.getElementById('ac-input'); if(inp) inp.focus(); }, 50);
}

function renderCmdCard(c, q) {
  const cat = CATS[c.cat];
  const hl = (txt) => {
    if (!q) return txt;
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
    return txt.replace(re, '<mark style="background:rgba(188,140,255,.25);color:var(--purple);border-radius:2px">$1</mark>');
  };
  const ejLines = c.ej.split('\n').join('\n');
  return `
  <div class="ac-card">
    <div class="ac-card-top">
      <span class="ac-cmd">${hl(c.cmd)}</span>
      <span class="ac-cat" style="background:${cat.bg};color:${cat.color};border:1px solid ${cat.color}33">${cat.label}</span>
    </div>
    <div class="ac-body-card">
      <div class="ac-desc">${hl(c.desc)}</div>
      <div class="ac-uso">
        <b>💡 Uso habitual</b>
        ${hl(c.uso)}
      </div>
      <div class="ac-example">${c.ej.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
    </div>
  </div>`;
}

let acDebounce;
function acOnInput(val) {
  acSearch = val;
  clearTimeout(acDebounce);
  acDebounce = setTimeout(() => {
    const grid = document.getElementById('ac-grid');
    if (!grid) { renderAcordeon(); return; }
    const q = val.toLowerCase().trim();
    const filtered = CMDS.filter(c => {
      const matchCat = acFilter === '*' || c.cat === acFilter;
      if (!matchCat) return false;
      if (!q) return true;
      return c.cmd.toLowerCase().includes(q)
          || c.desc.toLowerCase().includes(q)
          || c.uso.toLowerCase().includes(q)
          || c.ej.toLowerCase().includes(q)
          || CATS[c.cat].label.toLowerCase().includes(q);
    });
    const statsEl = document.querySelector('.ac-stats-bar');
    if (statsEl) {
      statsEl.innerHTML = `
        <span>Mostrando</span>
        <span class="ac-count">${filtered.length}</span>
        <span>de ${CMDS.length} comandos</span>
        ${q ? `<span>· búsqueda: "<strong style="color:var(--purple)">${q}</strong>"</span>` : ''}`;
    }
    grid.innerHTML = filtered.length === 0
      ? `<div class="ac-no-results"><div class="icon">🔎</div>
          <p>No se encontraron comandos para "<strong>${q}</strong>"</p>
          <p style="margin-top:6px;font-size:11px">Intenta con parte del nombre o una descripción</p>
         </div>`
      : filtered.map(c => renderCmdCard(c, q)).join('');
  }, 150);
}

function acSetFilter(cat) {
  acFilter = cat;
  renderAcordeon();
}

/* ════════════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════════ */
loadState();
checkResponsive();
showDashboard();
</script>
