/* ════════════════════════════════════════════════════════════════
   PHASE VIEW
═══════════════════════════════════════════════════════════════ */
function showPhase(phaseId, scrollToId) {
  const phase = PHASES.find(p => p.id === phaseId);
  if (!phase) return;
  state.currentPhase = phaseId;
  state.currentView = phaseId;
  saveState();
  const label = phase.num === 0 ? phase.title : `Fase ${phase.num} — ${phase.title}`;
  document.getElementById('page-title').textContent = label;
  document.getElementById('page-sub').textContent = phase.desc + ' · Nivel ' + phase.nivel;
  buildPhaseTabs();
  buildSidebar();

  const ps = getPhaseStats(phase);
  const bannerBg = ps.done === ps.total && ps.total > 0
    ? 'rgba(63,185,80,.08)' : 'var(--bg2)';
  const borderColor = ps.done === ps.total && ps.total > 0
    ? 'var(--green2)' : 'var(--border)';

  // Panel de introducción de la fase
  const introHtml = phase.intro ? `
    <div class="phase-intro-toggle" id="pi-toggle-${phase.id}" onclick="togglePhaseIntro('${phase.id}')">
      <span class="pi-icon">📖</span>
      <span class="pi-label">Introducción al tema — ¿Qué es esto y por qué importa?</span>
      <span class="pi-arrow">▼</span>
    </div>
    <div class="phase-intro-body" id="pi-body-${phase.id}">
      <div class="pi-section">
        <div class="pi-section-title">Conceptos del tema</div>
        ${phase.intro}
      </div>
      ${phase.whyMatters ? `
      <div class="pi-section">
        <div class="pi-section-title">¿Por qué esto importa en producción?</div>
        <div class="pi-why">${phase.whyMatters}</div>
      </div>` : ''}
      ${phase.keyTerms ? `
      <div class="pi-section">
        <div class="pi-section-title">Términos clave de esta fase</div>
        <div class="pi-concepts">
          ${phase.keyTerms.map(t => `<span class="tag tag-concept">${t}</span>`).join('')}
        </div>
      </div>` : ''}
    </div>` : '';

  document.getElementById('content').innerHTML = `
    <div class="phase-banner" style="background:${bannerBg};border-color:${borderColor}">
      <div class="phase-banner-icon">${phase.icon}</div>
      <div class="phase-banner-info">
        <h2>${label}</h2>
        <p>${phase.desc}</p>
      </div>
      <div class="phase-banner-progress">
        <div class="phase-circle" style="${ps.pct===100?'border-color:var(--green);color:var(--green);background:rgba(63,185,80,.1)':'border-color:var(--blue2);color:var(--blue)'}">
          ${ps.pct}%
        </div>
        <span style="font-size:10px;color:var(--text2);margin-top:4px;display:block">${ps.done}/${ps.total} listos</span>
      </div>
    </div>
    ${introHtml}
    <div class="exercises-grid" id="exercises-grid">
      ${phase.exercises.map(e => renderExCard(e, phase)).join('')}
    </div>
  `;

  if (scrollToId) {
    setTimeout(() => {
      const el = document.getElementById('ex-' + scrollToId);
      if (el) { el.scrollIntoView({ behavior:'smooth', block:'center' }); openExBody(scrollToId); }
    }, 100);
  }
}

function togglePhaseIntro(phaseId) {
  const toggle = document.getElementById('pi-toggle-' + phaseId);
  const body   = document.getElementById('pi-body-'   + phaseId);
  if (!toggle || !body) return;
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  toggle.classList.toggle('open', !isOpen);
}

/* ════════════════════════════════════════════════════════════════
   EXERCISE CARD RENDER
═══════════════════════════════════════════════════════════════ */
function renderExCard(ex, phase) {
  const done = state.completed[ex.id];
  const lvMap = { E:'Fácil', M:'Medio', D:'Difícil' };
  const lvClass = { E:'tag-e', M:'tag-m', D:'tag-d' };
  const note = state.notes[ex.id] || '';
  const hintsHtml = ex.hints.map(h => `<li>${h}</li>`).join('');
  const conceptsHtml = ex.conceptos.map(c => `<span class="tag tag-concept">${c}</span>`).join('');
  const solLines = ex.solucion.replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const phaseLabel = phase.num === 0 ? phase.title : `Fase ${phase.num}`;

  return `
  <div class="ex-card ${done ? 'completed' : ''}" id="ex-${ex.id}">
    <div class="ex-card-header" onclick="toggleExBody('${ex.id}')">
      <div class="ex-card-check" onclick="event.stopPropagation();toggleDone('${ex.id}','${phase.id}')">
        ${done ? '✓' : ''}
      </div>
      <div class="ex-card-meta">
        <div class="ex-card-id">${ex.id}</div>
        <div class="ex-card-title">${ex.title}</div>
        <div class="ex-card-tags">
          <span class="tag tag-fase">${phaseLabel}</span>
          <span class="tag ${lvClass[ex.nivel]}">${lvMap[ex.nivel]}</span>
          ${conceptsHtml}
        </div>
      </div>
      <div class="ex-card-actions">
        <button class="btn-expand" onclick="event.stopPropagation();toggleExBody('${ex.id}')">
          <span id="arrow-${ex.id}">▼</span> Ver
        </button>
        ${ex.simId
          ? `<button class="btn-sim" onclick="event.stopPropagation();showSimulator('${ex.simId}')" title="Abrir ${ex.simId} en el Simulador">🖥️ Practicar</button>`
          : ''}
        ${done
          ? `<button class="btn-undone" onclick="event.stopPropagation();toggleDone('${ex.id}','${phase.id}')">↩ Deshacer</button>`
          : `<button class="btn-done" onclick="event.stopPropagation();toggleDone('${ex.id}','${phase.id}')">✓ Completado</button>`
        }
      </div>
    </div>
    <div class="completed-ribbon">✓ Ejercicio completado</div>
    <div class="ex-body" id="body-${ex.id}">
      ${ex.background ? `
      <div class="ex-section">
        <div class="ex-section-title">🧩 Contexto del ejercicio</div>
        <div class="ex-background">${ex.background}</div>
      </div>` : ''}
      <div class="ex-section">
        <div class="ex-section-title">Objetivo</div>
        <div class="obj-box">${ex.obj}</div>
      </div>
      <div class="ex-section">
        <div class="ex-section-title">Enunciado</div>
        <p class="enun-text">${ex.enun}</p>
      </div>
      ${ex.theory ? `
      <div class="ex-section">
        <div class="ex-section-title">📚 Teoría aplicada</div>
        <div class="theory-block">
          <div class="theory-block-header" id="th-hdr-${ex.id}" onclick="toggleTheory('${ex.id}')">
            <span class="th-icon">📚</span>
            <span class="th-label">Conceptos clave para resolver este ejercicio</span>
            <span class="th-arrow">▼</span>
          </div>
          <div class="theory-body" id="th-body-${ex.id}">
            ${ex.theory}
          </div>
        </div>
      </div>` : ''}
      <div class="ex-section">
        <div class="ex-section-title">Hints</div>
        <div class="hints-box"><ul>${hintsHtml}</ul></div>
      </div>
      <div class="ex-section">
        <div class="ex-section-title">Solución</div>
        <button class="sol-toggle-btn" id="solbtn-${ex.id}" onclick="toggleSol('${ex.id}')">
          <span class="arrow">▶</span> Mostrar solución
        </button>
        <div class="sol-code" id="sol-${ex.id}">
          <pre>${solLines}</pre>
        </div>
      </div>
      <div class="ex-section">
        <div class="ex-section-title">Notas personales</div>
        <textarea class="notes-area" placeholder="Escribe tus notas, dudas o aprendizajes aquí..."
          onchange="saveNote('${ex.id}',this.value)">${note}</textarea>
      </div>
    </div>
  </div>`;
}

/* ════════════════════════════════════════════════════════════════
   INTERACTIONS
═══════════════════════════════════════════════════════════════ */
function toggleTheory(exId) {
  const hdr  = document.getElementById('th-hdr-'  + exId);
  const body = document.getElementById('th-body-' + exId);
  if (!hdr || !body) return;
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  hdr.classList.toggle('open', !isOpen);
}

function toggleExBody(exId) {
  const body = document.getElementById('body-' + exId);
  const arrow = document.getElementById('arrow-' + exId);
  const isOpen = body && body.classList.contains('open');
  if (body) body.classList.toggle('open', !isOpen);
  if (arrow) arrow.textContent = isOpen ? '▼' : '▲';
}
function openExBody(exId) {
  const body = document.getElementById('body-' + exId);
  const arrow = document.getElementById('arrow-' + exId);
  if (body) body.classList.add('open');
  if (arrow) arrow.textContent = '▲';
}
function toggleSol(exId) {
  const sol = document.getElementById('sol-' + exId);
  const btn = document.getElementById('solbtn-' + exId);
  const isOpen = sol && sol.classList.contains('open');
  if (sol) sol.classList.toggle('open', !isOpen);
  if (btn) {
    btn.classList.toggle('open', !isOpen);
    btn.innerHTML = (isOpen
      ? '<span class="arrow">▶</span> Mostrar solución'
      : '<span class="arrow" style="transform:rotate(90deg)">▶</span> Ocultar solución');
  }
}
function toggleDone(exId, phaseId) {
  const wasDone = state.completed[exId];
  if (wasDone) {
    delete state.completed[exId];
    showToast('↩ Ejercicio marcado como pendiente', 'red');
  } else {
    state.completed[exId] = Date.now();
    showToast('✓ ¡Ejercicio completado!', 'green');
  }
  saveState();
  showPhase(phaseId);
}
function saveNote(exId, value) {
  state.notes[exId] = value;
  saveState();
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

/* ════════════════════════════════════════════════════════════════
   EXPORTAR PROGRESO A JSON
═══════════════════════════════════════════════════════════════ */
function exportProgress() {
  const all = getAllExercises();
  const exportData = {
    exportado: new Date().toISOString(),
    resumen: getStats(),
    fases: PHASES.map(p => {
      const ps = getPhaseStats(p);
      return {
        fase: p.num,
        titulo: p.title,
        progreso: `${ps.done}/${ps.total} (${ps.pct}%)`,
        ejercicios: p.exercises.map(e => ({
          id: e.id,
          titulo: e.title,
          nivel: { E:'Fácil', M:'Medio', D:'Difícil' }[e.nivel],
          completado: !!state.completed[e.id],
          fechaCompletado: state.completed[e.id]
            ? new Date(state.completed[e.id]).toLocaleDateString('es-MX')
            : null,
          nota: state.notes[e.id] || ''
        }))
      };
    })
  };
  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ibmi_progreso_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('📥 Progreso exportado a JSON', 'green');
}

function importProgress() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        let imported = 0;
        // Restaurar completed y notes
        data.fases && data.fases.forEach(f => {
          f.ejercicios && f.ejercicios.forEach(ex => {
            if (ex.completado) {
              state.completed[ex.id] = state.completed[ex.id] || Date.now();
              imported++;
            }
            if (ex.nota) state.notes[ex.id] = ex.nota;
          });
        });
        saveState();
        showDashboard();
        showToast(`✅ ${imported} ejercicios importados`, 'green');
      } catch(err) {
        showToast('❌ Error al importar: JSON inválido', 'red');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetProgress() {
  if (!confirm('⚠️ ¿Seguro que quieres borrar TODO el progreso y notas?\nEsta acción no se puede deshacer.')) return;
  state = { completed: {}, notes: {}, currentView: 'dashboard', currentPhase: null };
  saveState();
  showDashboard();
  showToast('🗑️ Progreso reiniciado', 'red');
}

/* ════════════════════════════════════════════════════════════════
   MODO QUIZ
═══════════════════════════════════════════════════════════════ */
let quizState = { active: false, exercises: [], idx: 0, score: 0, shown: false };

function showQuiz() {
  state.currentView = 'quiz';
  state.currentPhase = null;
  saveState();
  document.getElementById('page-title').textContent = '🎯 Modo Quiz';
  document.getElementById('page-sub').textContent = 'Autoevaluación — responde sin ver la solución';
  buildPhaseTabs();
  buildSidebar();

  // Filtrar ejercicios pendientes o todos
  const all = getAllExercises();
  const pending = all.filter(e => !state.completed[e.id]);
  const pool = pending.length >= 5 ? pending : all;
  // Mezclar aleatoriamente
  const shuffled = [...pool].sort(() => Math.random() - 0.5).slice(0, 10);
  quizState = { active: true, exercises: shuffled, idx: 0, score: 0, shown: false };

  renderQuizCard();
}

function renderQuizCard() {
  const q = quizState;
  if (q.idx >= q.exercises.length) {
    renderQuizResults();
    return;
  }
  const ex = q.exercises[q.idx];
  const phase = PHASES.find(p => p.exercises.some(e => e.id === ex.id));
  const lvMap = { E:'Fácil', M:'Medio', D:'Difícil' };
  const lvClass = { E:'tag-e', M:'tag-m', D:'tag-d' };
  const progress = `${q.idx + 1} / ${q.exercises.length}`;
  const pct = Math.round((q.idx / q.exercises.length) * 100);
  const solLines = ex.solucion.replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const conceptsHtml = ex.conceptos.map(c => `<span class="tag tag-concept">${c}</span>`).join('');

  document.getElementById('content').innerHTML = `
    <div style="max-width:780px;margin:0 auto">
      <!-- Cabecera quiz -->
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;display:flex;align-items:center;gap:16px">
        <div style="font-size:28px">🎯</div>
        <div style="flex:1">
          <div style="font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.6px">Pregunta ${progress}</div>
          <div style="background:var(--bg3);border-radius:4px;height:6px;margin-top:6px;overflow:hidden">
            <div style="width:${pct}%;height:100%;background:var(--purple2);transition:width .3s"></div>
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-size:20px;font-weight:700;color:var(--green)">${q.score}</div>
          <div style="font-size:10px;color:var(--text2)">puntos</div>
        </div>
        <button onclick="showDashboard()" style="background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:6px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px">✕ Salir</button>
      </div>

      <!-- Tarjeta de pregunta -->
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:12px">
        <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
          <span class="tag tag-fase">Fase ${phase.num}</span>
          <span class="tag ${lvClass[ex.nivel]}">${lvMap[ex.nivel]}</span>
          ${conceptsHtml}
        </div>
        <div style="font-size:18px;font-weight:600;margin-bottom:12px;color:var(--text)">${ex.title}</div>
        <div style="background:var(--bg3);border-radius:var(--radius-sm);padding:12px;margin-bottom:16px;font-size:13px;color:var(--text2)">
          <strong style="color:var(--blue)">🎯 Objetivo:</strong> ${ex.obj}
        </div>
        <div style="font-size:13px;line-height:1.7;margin-bottom:20px">${ex.enun}</div>

        <!-- Botones de acción -->
        <div id="quiz-actions" style="display:flex;gap:10px;flex-wrap:wrap">
          <button onclick="quizShowHint()" style="background:var(--bg3);border:1px solid var(--yellow);color:var(--yellow);padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px">💡 Ver hint (−1pt)</button>
          <button onclick="quizRevealSol()" style="background:var(--bg3);border:1px solid var(--orange);color:var(--orange);padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px">👁 Ver solución (0pt)</button>
          <button onclick="quizMarkKnew()" style="background:rgba(63,185,80,.1);border:1px solid var(--green);color:var(--green);padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;margin-left:auto">✅ ¡Lo sabía! (+3pt)</button>
        </div>

        <!-- Hint (oculto) -->
        <div id="quiz-hint-box" style="display:none;margin-top:14px">
          <div style="background:rgba(210,153,34,.08);border:1px solid var(--yellow);border-radius:var(--radius-sm);padding:12px">
            <div style="font-size:11px;color:var(--yellow);margin-bottom:6px;text-transform:uppercase">💡 Hint</div>
            <ul style="padding-left:16px;color:var(--text2);font-size:13px">
              ${ex.hints.map(h=>`<li style="margin-bottom:4px">${h}</li>`).join('')}
            </ul>
          </div>
        </div>

        <!-- Solución (oculta) -->
        <div id="quiz-sol-box" style="display:none;margin-top:14px">
          <div style="background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:12px">
            <div style="font-size:11px;color:var(--text2);margin-bottom:8px;text-transform:uppercase">Solución de referencia</div>
            <pre style="font-family:monospace;font-size:12px;white-space:pre-wrap;color:var(--text);overflow-x:auto;max-height:300px;overflow-y:auto">${solLines}</pre>
          </div>
          <div style="display:flex;gap:10px;margin-top:12px">
            <button onclick="quizAnswer(1)" style="flex:1;background:rgba(248,81,73,.1);border:1px solid var(--red);color:var(--red);padding:10px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px">👎 No lo sabía (+1pt)</button>
            <button onclick="quizAnswer(2)" style="flex:1;background:rgba(240,136,62,.1);border:1px solid var(--orange);color:var(--orange);padding:10px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px">🤔 Casi (+2pt)</button>
            <button onclick="quizAnswer(3)" style="flex:1;background:rgba(63,185,80,.1);border:1px solid var(--green);color:var(--green);padding:10px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px">✅ Lo tenía (+3pt)</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function quizShowHint() {
  quizState.score = Math.max(0, quizState.score - 1);
  document.getElementById('quiz-hint-box').style.display = 'block';
}

function quizRevealSol() {
  quizState.shown = true;
  document.getElementById('quiz-sol-box').style.display = 'block';
  document.getElementById('quiz-actions').style.display = 'none';
}

function quizMarkKnew() {
  quizState.score += 3;
  quizState.idx++;
  showToast('⭐ +3 puntos — ¡excelente!', 'green');
  setTimeout(renderQuizCard, 300);
}

function quizAnswer(pts) {
  quizState.score += pts;
  quizState.idx++;
  const msgs = { 1:'Sigue practicando 💪', 2:'¡Vas bien! 🤔', 3:'¡Correcto! ⭐' };
  const types = { 1:'red', 2:'orange', 3:'green' };
  showToast(`${msgs[pts]} +${pts}pt`, types[pts]);
  setTimeout(renderQuizCard, 300);
}

function renderQuizResults() {
  const q = quizState;
  const max = q.exercises.length * 3;
  const pct = Math.round((q.score / max) * 100);
  const grade = pct >= 90 ? '🏆 Experto' : pct >= 70 ? '⭐ Muy bien' : pct >= 50 ? '👍 Bien' : '💪 Sigue practicando';
  const col = pct >= 90 ? 'var(--teal)' : pct >= 70 ? 'var(--green)' : pct >= 50 ? 'var(--yellow)' : 'var(--orange)';

  document.getElementById('content').innerHTML = `
    <div style="max-width:600px;margin:40px auto;text-align:center">
      <div style="font-size:64px;margin-bottom:16px">🎯</div>
      <h2 style="font-size:28px;margin-bottom:8px">${grade}</h2>
      <div style="font-size:64px;font-weight:700;color:${col};margin:16px 0">${q.score}<span style="font-size:24px;color:var(--text2)"> / ${max}</span></div>
      <div style="font-size:16px;color:var(--text2);margin-bottom:32px">${pct}% de aciertos en ${q.exercises.length} preguntas</div>
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:24px">
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px">
          <div><div style="font-size:24px;font-weight:700;color:var(--blue)">${q.exercises.length}</div><div style="font-size:12px;color:var(--text2)">Preguntas</div></div>
          <div><div style="font-size:24px;font-weight:700;color:${col}">${q.score}</div><div style="font-size:12px;color:var(--text2)">Puntos</div></div>
          <div><div style="font-size:24px;font-weight:700;color:var(--purple)">${pct}%</div><div style="font-size:12px;color:var(--text2)">Porcentaje</div></div>
        </div>
      </div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button onclick="showQuiz()" style="background:var(--purple2);border:none;color:white;padding:12px 24px;border-radius:var(--radius);cursor:pointer;font-size:14px;font-weight:600">🔄 Nuevo Quiz</button>
        <button onclick="showDashboard()" style="background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:12px 24px;border-radius:var(--radius);cursor:pointer;font-size:14px">🏠 Dashboard</button>
      </div>
    </div>
  `;
}

/* ════════════════════════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════════════════════ */
let toastTimer;
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 2500);
}

/* ════════════════════════════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════════════════════════ */
function checkResponsive() {
  const btn = document.getElementById('menu-btn');
  if (window.innerWidth <= 768) {
    btn.style.display = 'block';
  } else {
    btn.style.display = 'none';
    document.getElementById('sidebar').classList.remove('open');
  }
}
window.addEventListener('resize', checkResponsive);

let acSearch = '';
let acFilter = '*';

function showAcordeon() {
  state.currentView = 'acordeon';
  state.currentPhase = null;
  saveState();
  document.getElementById('page-title').textContent = 'Acordeón de Comandos IBM i';
  document.getElementById('page-sub').textContent = 'Búsqueda inteligente · ' + CMDS.length + ' comandos AS/400 · Descripción + Uso habitual + Ejemplo';
  buildPhaseTabs();
  buildSidebar();
  acSearch = '';
  acFilter = '*';
  renderAcordeon();
}

function renderAcordeon() {
  const q = acSearch.toLowerCase().trim();
  const filtered = CMDS.filter(c => {
    const matchCat = acFilter === '*' || c.cat === acFilter;
    if (!matchCat) return false;
    if (!q) return true;
    return c.cmd.toLowerCase().includes(q)
        || c.desc.toLowerCase().includes(q)
        || c.uso.toLowerCase().includes(q)
        || c.ej.toLowerCase().includes(q)
        || CATS[c.cat].label.toLowerCase().includes(q);
  });

  const catCounts = {};
  CMDS.forEach(c => { catCounts[c.cat] = (catCounts[c.cat]||0)+1; });

  document.getElementById('content').innerHTML = `
    <div class="ac-page">
      <div class="ac-hero">
        <h2>📖 Acordeón de Comandos IBM i / AS400</h2>
        <p>Busca por nombre del comando, descripción o uso habitual. Filtra por categoría.</p>
        <div class="ac-search-wrap">
          <span class="ac-search-icon">🔍</span>
          <input class="ac-search" id="ac-input" type="text"
            placeholder="Buscar: CRTPF, 'crear archivo', 'journaling', 'depurar'..."
            value="${acSearch}"
            oninput="acOnInput(this.value)"
            autocomplete="off" spellcheck="false">
        </div>
        <div class="ac-filter-wrap">
          <button class="ac-filter ${acFilter==='*'?'active':''}"
                  style="${acFilter==='*'?'background:var(--purple2);border-color:var(--purple2)':''}"
                  onclick="acSetFilter('*')">Todos (${CMDS.length})</button>
          ${Object.entries(CATS).map(([k,v]) => `
            <button class="ac-filter ${acFilter===k?'active':''}"
                    style="${acFilter===k?`background:${v.color};border-color:${v.color}`:`border-color:${v.color}33;color:${v.color}`}"
                    onclick="acSetFilter('${k}')">
              ${v.label} (${catCounts[k]||0})
            </button>
          `).join('')}
        </div>
      </div>
      <div class="ac-stats-bar">
        <span>Mostrando</span>
        <span class="ac-count">${filtered.length}</span>
        <span>de ${CMDS.length} comandos</span>
        ${q ? `<span>· búsqueda: "<strong style="color:var(--purple)">${q}</strong>"</span>` : ''}
      </div>
      <div class="ac-body">
        <div class="ac-grid" id="ac-grid">
          ${filtered.length === 0
            ? `<div class="ac-no-results">
                <div class="icon">🔎</div>
                <p>No se encontraron comandos para "<strong>${q}</strong>"</p>
                <p style="margin-top:6px;font-size:11px">Intenta con parte del nombre o una palabra de la descripción</p>
               </div>`
            : filtered.map(c => renderCmdCard(c, q)).join('')
          }
        </div>
      </div>
    </div>`;
  // Focus en el input después de render
  setTimeout(() => { const inp = document.getElementById('ac-input'); if(inp) inp.focus(); }, 50);
}

function renderCmdCard(c, q) {
  const cat = CATS[c.cat];
  const hl = (txt) => {
    if (!q) return txt;
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
    return txt.replace(re, '<mark style="background:rgba(188,140,255,.25);color:var(--purple);border-radius:2px">$1</mark>');
  };
  const ejLines = c.ej.split('\n').join('\n');
  return `
  <div class="ac-card">
    <div class="ac-card-top">
      <span class="ac-cmd">${hl(c.cmd)}</span>
      <span class="ac-cat" style="background:${cat.bg};color:${cat.color};border:1px solid ${cat.color}33">${cat.label}</span>
    </div>
    <div class="ac-body-card">
      <div class="ac-desc">${hl(c.desc)}</div>
      <div class="ac-uso">
        <b>💡 Uso habitual</b>
        ${hl(c.uso)}
      </div>
      <div class="ac-example">${c.ej.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
    </div>
  </div>`;
}

let acDebounce;
function acOnInput(val) {
  acSearch = val;
  clearTimeout(acDebounce);
  acDebounce = setTimeout(() => {
    const grid = document.getElementById('ac-grid');
    if (!grid) { renderAcordeon(); return; }
    const q = val.toLowerCase().trim();
    const filtered = CMDS.filter(c => {
      const matchCat = acFilter === '*' || c.cat === acFilter;
      if (!matchCat) return false;
      if (!q) return true;
      return c.cmd.toLowerCase().includes(q)
          || c.desc.toLowerCase().includes(q)
          || c.uso.toLowerCase().includes(q)
          || c.ej.toLowerCase().includes(q)
          || CATS[c.cat].label.toLowerCase().includes(q);
    });
    const statsEl = document.querySelector('.ac-stats-bar');
    if (statsEl) {
      statsEl.innerHTML = `
        <span>Mostrando</span>
        <span class="ac-count">${filtered.length}</span>
        <span>de ${CMDS.length} comandos</span>
        ${q ? `<span>· búsqueda: "<strong style="color:var(--purple)">${q}</strong>"</span>` : ''}`;
    }
    grid.innerHTML = filtered.length === 0
      ? `<div class="ac-no-results"><div class="icon">🔎</div>
          <p>No se encontraron comandos para "<strong>${q}</strong>"</p>
          <p style="margin-top:6px;font-size:11px">Intenta con parte del nombre o una descripción</p>
         </div>`
      : filtered.map(c => renderCmdCard(c, q)).join('');
  }, 150);
}

function acSetFilter(cat) {
  acFilter = cat;
  renderAcordeon();
}

    checks:[
      { desc:'DCL-PI retorna IND', test: s => /DCL-PI\s+ACTUALIZARDISPONIBLES\s+IND/.test(s.toUpperCase().replace(/\s+/g,' ')) },
      { desc:'CHAIN pCodLib LIBREC', test: s => /CHAIN\s+PCODLIB\s+LIBREC/.test(s.toUpperCase().replace(/\s+/g,' ')) },
      { desc:'IF %FOUND', test: s => /%FOUND/.test(s.toUpperCase()) },
      { desc:'LIBDIS += pDelta o LIBDIS = LIBDIS + pDelta', test: s => /LIBDIS\s*\+=\s*PDELTA|LIBDIS\s*=\s*LIBDIS\s*\+\s*PDELTA/.test(s.toUpperCase().replace(/\s+/g,' ')) },
      { desc:'UPDATE LIBREC', test: s => /UPDATE\s+LIBREC/.test(s.toUpperCase()) },
      { desc:'RETURN *ON / RETURN *OFF', test: s => { const u=s.toUpperCase(); return u.includes('RETURN *ON') && u.includes('RETURN *OFF'); } },

    hint:`Estructura base:<br><code>CREATE OR REPLACE PROCEDURE BIBLIOTECA/PRC_BUSCAR_LIBRO(</code><br><code>  IN pCod CHAR(7), OUT pTitulo VARCHAR(60),</code><br><code>  OUT pDisponibles INT, OUT pEncontrado INT)</code><br><code>BEGIN</code><br><code>  DECLARE CONTINUE HANDLER FOR NOT FOUND SET pEncontrado = 0;</code><br><code>  SET pEncontrado = 1;</code><br><code>  SELECT LIBTTL, LIBDIS INTO pTitulo, pDisponibles</code><br><code>    FROM BIBLIOTECA/LIBROS WHERE LIBCOD = pCod;</code><br><code>END</code>`,
    solution:`CREATE OR REPLACE PROCEDURE BIBLIOTECA/PRC_BUSCAR_LIBRO(
  IN  pCod          CHAR(7),
  OUT pTitulo       VARCHAR(60),
  OUT pDisponibles  INT,
  OUT pEncontrado   INT
)
BEGIN
  DECLARE CONTINUE HANDLER FOR NOT FOUND
    SET pEncontrado = 0;

  SET pEncontrado = 1;

  SELECT LIBTTL, LIBDIS
    INTO pTitulo, pDisponibles
    FROM BIBLIOTECA/LIBROS

    hint:`Patrón CTE:<br><code>WITH PrestamosActivos AS (</code><br><code>  SELECT PRESCOD, PRESSOC, PRESLIB,</code><br><code>         DAYS_BETWEEN(PRESDVL, CURRENT_DATE) AS DIAS_PEND</code><br><code>  FROM BIBLIOTECA/PRESTAMOS WHERE PRESEST='P'</code><br><code>),</code><br><code>SociosConPrestamos AS (</code><br><code>  SELECT p.*, s.SOCNOM FROM PrestamosActivos p</code><br><code>    JOIN BIBLIOTECA/SOCIOS s ON p.PRESSOC = s.SOCCOD</code><br><code>)</code><br><code>SELECT sc.SOCNOM, sc.PRESCOD, l.LIBTTL, sc.DIAS_PEND</code><br><code>FROM SociosConPrestamos sc</code><br><code>  JOIN BIBLIOTECA/LIBROS l ON sc.PRESLIB = l.LIBCOD</code><br><code>ORDER BY sc.DIAS_PEND DESC;</code>`,
    solution:`WITH PrestamosActivos AS (
  SELECT PRESCOD, PRESSOC, PRESLIB,
         DAYS_BETWEEN(PRESDVL, CURRENT_DATE) AS DIAS_PEND

  WHERE  PRESEST = 'P'
),
SociosConPrestamos AS (
  SELECT p.*, s.SOCNOM
  FROM   PrestamosActivos        p
    JOIN BIBLIOTECA/SOCIOS s  ON p.PRESSOC = s.SOCCOD
)

    solution:`DCL-F LIBROS USAGE(*INPUT) USROPN;

DCL-PROC AbrirYContar;
  DCL-PI AbrirYContar INT(10);
  END-PI;

  DCL-S nCount INT(10) INZ(0);

  OPEN LIBROS;
  READ LIBREC;

  ENDDO;

/* ── Estado del simulador ────────────────────────────────── */
const simState = {
  filter: 'ALL',
  solved: {},
};

/* ── Cargar/guardar progreso del simulador ───────────────── */
function simLoadState() {
  try {
    const saved = localStorage.getItem('ibmi_sim_state');
    if (saved) Object.assign(simState, JSON.parse(saved));
  } catch(e){}
}
function simSaveState() {
  try { localStorage.setItem('ibmi_sim_state', JSON.stringify({ solved: simState.solved, filter: simState.filter })); } catch(e){}
}
simLoadState();

/* ── Render de la vista principal del simulador ──────────── */
function showSimulator(openId) {
  state.currentView = 'simulator';
  state.currentPhase = null;
  saveState();
  document.getElementById('page-title').textContent = '🖥️ Simulador de Código IBM i';
  document.getElementById('page-sub').textContent = 'Escribe código real · El evaluador verifica clave a clave · RPGLE · SQL · CL · DDS';
  buildPhaseTabs();
  buildSidebar();
  renderSimulator(openId);
}

function renderSimulator(openId) {
  const total  = SIM_EXERCISES.length;
  const solved = Object.keys(simState.solved).filter(k => simState.solved[k]).length;

  /* Si venimos desde un ejercicio del tracker, forzar filtro ALL para que
     la tarjeta destino sea siempre visible independientemente del filtro activo */
  if (openId) simState.filter = 'ALL';
  const f = simState.filter;

  const filtered = f === 'ALL' ? SIM_EXERCISES
    : SIM_EXERCISES.filter(e => e.lang === f);

  const filters = ['ALL','RPGLE','SQL','CL','DDS'];
  const filterLabels = { ALL:'Todos', RPGLE:'RPGLE', SQL:'SQL / DB2', CL:'CL', DDS:'DDS' };

  document.getElementById('content').innerHTML = `
  <div class="sim-hero">
    <h2>🖥️ Simulador de Código IBM i</h2>
    <p>Escribe código real en el editor — el evaluador verifica que los elementos clave estén presentes. No necesitas sintaxis perfecta, sino los conceptos correctos.</p>
  </div>
  <div class="sim-stats-bar">
    <div class="sim-stat">Ejercicios resueltos: <b>${solved}</b> / <b>${total}</b></div>
    <span class="sim-stat-sep">·</span>
    <div class="sim-stat">RPGLE: <b>${SIM_EXERCISES.filter(e=>e.lang==='RPGLE'&&simState.solved[e.id]).length}/${SIM_EXERCISES.filter(e=>e.lang==='RPGLE').length}</b></div>
    <div class="sim-stat">SQL: <b>${SIM_EXERCISES.filter(e=>e.lang==='SQL'&&simState.solved[e.id]).length}/${SIM_EXERCISES.filter(e=>e.lang==='SQL').length}</b></div>
    <div class="sim-stat">CL: <b>${SIM_EXERCISES.filter(e=>e.lang==='CL'&&simState.solved[e.id]).length}/${SIM_EXERCISES.filter(e=>e.lang==='CL').length}</b></div>
    <div class="sim-stat">DDS: <b>${SIM_EXERCISES.filter(e=>e.lang==='DDS'&&simState.solved[e.id]).length}/${SIM_EXERCISES.filter(e=>e.lang==='DDS').length}</b></div>
  </div>
  <div class="sim-filters">
    ${filters.map(fl=>`
      <button class="sim-filter-btn lang-${fl.toLowerCase()} ${f===fl?'active':''}"
              onclick="simSetFilter('${fl}')">${filterLabels[fl]}</button>
    `).join('')}
  </div>
  <div class="sim-grid">
    ${filtered.map(ex => renderSimCard(ex)).join('')}
  </div>`;

  /* Auto-expandir y scroll a la tarjeta si viene desde el tracker */
  if (openId) {
    setTimeout(() => {
      toggleSimCard(openId);
      const card = document.getElementById('simcard-' + openId);
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 60);
  }
}

function renderSimCard(ex) {
  const isSolved = !!simState.solved[ex.id];
  const lvMap = { E:'Fácil', M:'Medio', D:'Difícil' };
  const taskHtml = ex.task.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  const savedCode = isSolved && simState.solved[ex.id] !== true ? simState.solved[ex.id] : '';
  const isDDS = ex.lang === 'DDS';

  const editorBlock = isDDS
    ? ddsEditorHtml(ex.id, savedCode)
    : `<div class="sim-editor-wrap" id="simwrap-${ex.id}">
          <textarea class="sim-editor" id="simeditor-${ex.id}"
                    placeholder="Escribe tu código ${ex.lang} aquí..."
                    spellcheck="false"
                    onkeydown="simHandleKey(event,'${ex.id}')">${savedCode}</textarea>
        </div>`;

  return `
  <div class="sim-card ${isSolved?'solved':''}" id="simcard-${ex.id}">
    <div class="sim-card-header" onclick="toggleSimCard('${ex.id}')">
      <span class="sim-card-icon">${ex.icon}</span>
      <div class="sim-card-meta">
        <div class="sim-card-title">${ex.title}</div>
        <div class="sim-card-sub">${ex.id} · haz clic para expandir</div>
        <div class="sim-card-badges">
          <span class="sim-badge badge-${ex.lang.toLowerCase()}">${ex.lang}</span>
          <span class="sim-badge badge-${ex.nivel.toLowerCase()}">${lvMap[ex.nivel]}</span>
          ${isDDS ? '<span class="sim-badge" style="background:rgba(255,255,255,.06);color:#8b949e">📐 Columnar</span>' : ''}
        </div>
      </div>
      ${isSolved ? '<span class="sim-solved-badge">✓ Resuelto</span>' : ''}
      <span class="sim-expand-hint" id="simexpand-${ex.id}" style="font-size:11px;color:var(--text3);margin-left:8px">▼</span>
    </div>
    <div class="sim-body" id="simbody-${ex.id}">
      <!-- Columna izquierda: descripción + objetivo -->
      <div class="sim-body-left">
        <div class="sim-desc">${ex.desc}</div>
        <div class="sim-expected">📋 Objetivo</div>
        <div class="sim-expected-code">${taskHtml}</div>
      </div>
      <!-- Columna derecha: editor + controles -->
      <div class="sim-body-right">
        <div class="sim-editor-label">
          Tu código
          <span class="lang-tag">${ex.lang}</span>
          ${isDDS ? '<span style="font-size:9px;color:var(--text3);margin-left:auto">Pasa el cursor sobre la regla para ver qué va en cada columna</span>' : ''}
        </div>
        ${editorBlock}

        <div class="sim-toolbar">
          <button class="sim-btn sim-btn-run" onclick="simRun('${ex.id}')">▶ Evaluar</button>
          <button class="sim-btn sim-btn-hint" onclick="simToggleHint('${ex.id}')">💡 Pista</button>
          <button class="sim-btn sim-btn-sol"  onclick="simToggleSol('${ex.id}')">👁 Solución</button>
          <button class="sim-btn sim-btn-clear" onclick="simClear('${ex.id}')">✕ Limpiar</button>
          <span class="sim-shortcut"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> evalúa</span>
        </div>

        <div class="sim-hint-box" id="simhint-${ex.id}">${ex.hint}</div>
        <div class="sim-result" id="simresult-${ex.id}"></div>
        <div class="sim-sol-box" id="simsol-${ex.id}">
          <div class="sim-sol-header">⚠ Solución de referencia — intenta resolverlo tú primero</div>
          <div class="sim-sol-code">${ex.solution.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
        </div>
      </div>
    </div>
  </div>`;
}

/* ── Toggle de tarjeta — añade/quita clase expanded en la card ── */
function toggleSimCard(id) {
  const card = document.getElementById('simcard-' + id);
  const body = document.getElementById('simbody-' + id);
  const arrow = document.getElementById('simexpand-' + id);
  if (!card || !body) return;

  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  card.classList.toggle('expanded', !isOpen);
  if (arrow) arrow.textContent = isOpen ? '▼' : '▲';

  /* Cerrar otras tarjetas abiertas (una a la vez) */
  if (!isOpen) {
    SIM_EXERCISES.forEach(ex => {
      if (ex.id === id) return;
      const ob = document.getElementById('simbody-' + ex.id);
      const oc = document.getElementById('simcard-' + ex.id);
      const oa = document.getElementById('simexpand-' + ex.id);
      if (ob && ob.classList.contains('open')) {
        ob.classList.remove('open');
        if (oc) oc.classList.remove('expanded');
        if (oa) oa.textContent = '▼';
      }
    });
  }
}

/* ── Filtro de lenguaje ─────────────────────────────────── */
function simSetFilter(lang) {
  simState.filter = lang;
  renderSimulator();
}

/* ── Evaluar código ─────────────────────────────────────── */
function simRun(id) {
  const ex = SIM_EXERCISES.find(e => e.id === id);
  if (!ex) return;

  const editor  = document.getElementById('simeditor-' + id);
  const result  = document.getElementById('simresult-' + id);
  const wrap    = document.getElementById('simwrap-' + id);
  if (!editor || !result) return;

  const code = editor.value.trim();
  if (!code) {
    result.className = 'sim-result fail show';
    result.innerHTML = '<div class="sim-result-title">✕ Editor vacío</div><p>Escribe tu código antes de evaluar.</p>';
    return;
  }

  const passed = [];
  const failed = [];

  ex.checks.forEach(chk => {
    try {
      if (chk.test(code)) passed.push(chk.desc);
      else failed.push(chk.desc);
    } catch(e) { failed.push(chk.desc); }
  });

  const total   = ex.checks.length;
  const nPassed = passed.length;
  const allOk   = nPassed === total;
  const partial = nPassed > 0 && nPassed < total;

  if (allOk) {
    // Guardar código resuelto
    simState.solved[id] = code;
    simSaveState();
    wrap.className  = 'sim-editor-wrap correct';
    result.className = 'sim-result ok show';
    result.innerHTML = `
      <div class="sim-result-title">✓ ¡Correcto! Todos los criterios cumplidos</div>
      <ul>${passed.map(p=>`<li>✓ ${p}</li>`).join('')}</ul>`;
    // Actualizar cabecera de tarjeta
    const card = document.getElementById('simcard-' + id);
    if (card) card.classList.add('solved');
    const header = card ? card.querySelector('.sim-card-header') : null;
    if (header && !header.querySelector('.sim-solved-badge')) {
      const badge = document.createElement('span');
      badge.className = 'sim-solved-badge';
      badge.textContent = '✓ Resuelto';
      header.appendChild(badge);
    }
    // Actualizar stats
    renderSimStatsBar();
  } else if (partial) {
    wrap.className  = 'sim-editor-wrap';
    result.className = 'sim-result partial show';
    result.innerHTML = `
      <div class="sim-result-title">⚠ Parcialmente correcto (${nPassed}/${total})</div>
      <ul>
        ${passed.map(p=>`<li style="color:var(--green)">✓ ${p}</li>`).join('')}
        ${failed.map(f=>`<li>✗ ${f}</li>`).join('')}
      </ul>`;
  } else {
    wrap.className  = 'sim-editor-wrap wrong';
    result.className = 'sim-result fail show';
    result.innerHTML = `
      <div class="sim-result-title">✕ Ningún criterio cumplido (${nPassed}/${total})</div>
      <ul>${failed.map(f=>`<li>✗ ${f}</li>`).join('')}</ul>
      <p style="margin-top:8px;font-size:11px;color:var(--text3)">
        Revisa el enunciado o usa la pista 💡
      </p>`;
  }
}

/* ── Actualizar barra de stats sin re-renderizar todo ──── */
function renderSimStatsBar() {
  const bar = document.querySelector('.sim-stats-bar');
  if (!bar) return;
  const total  = SIM_EXERCISES.length;
  const solved = Object.keys(simState.solved).filter(k => simState.solved[k]).length;
  bar.querySelector('.sim-stat').innerHTML = `Ejercicios resueltos: <b>${solved}</b> / <b>${total}</b>`;
}

/* ── Limpiar editor ─────────────────────────────────────── */
function simClear(id) {
  const ed   = document.getElementById('simeditor-' + id);
  const res  = document.getElementById('simresult-' + id);
  const wrap = document.getElementById('simwrap-' + id);
  const outer = document.getElementById('ddsouter-' + id);
  if (ed)  { ed.value = ''; ddsUpdateGutter(id); }
  if (res) { res.className = 'sim-result'; res.innerHTML = ''; }
  if (wrap)  wrap.className  = 'sim-editor-wrap';
  if (outer) outer.className = 'dds-editor-outer';
}

/* ── Toggle de pista ────────────────────────────────────── */
function simToggleHint(id) {
  const box = document.getElementById('simhint-' + id);
  if (box) box.classList.toggle('show');
}

/* ── Toggle de solución ─────────────────────────────────── */
function simToggleSol(id) {
  const box = document.getElementById('simsol-' + id);
  if (box) box.classList.toggle('show');
}

/* ── Atajo teclado Ctrl+Enter ───────────────────────────── */
function simHandleKey(e, id) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    simRun(id);
  }
  // Tab → insertar 1 espacio (DDS usa columnas individuales)
  if (e.key === 'Tab') {
    e.preventDefault();
    const ed  = e.target;
    const s   = ed.selectionStart;
    const end = ed.selectionEnd;
    ed.value  = ed.value.substring(0, s) + ' ' + ed.value.substring(end);
    ed.selectionStart = ed.selectionEnd = s + 1;
  }
}

/* ══════════════════════════════════════════════════════════════
   EDITOR DDS COLUMNAR — funciones
══════════════════════════════════════════════════════════════ */

/* Definición de zonas DDS (columnas 1-indexed) */
const DDS_ZONES = [
  { from:1,  to:5,  cls:'zone-seq',  label:'1-5',   name:'Secuencia',         tip:'Cols 1-5: Número de secuencia (opcional). Normalmente en blanco.' },
  { from:6,  to:6,  cls:'zone-form', label:'6',     name:'Tipo de forma',     tip:'Col 6: Tipo de especificación. Siempre "A" en DDS.' },
  { from:7,  to:16, cls:'zone-not',  label:'7-16',  name:'Indicadores NOT',   tip:'Cols 7-16: Indicadores de condición (N xx). Controlan si la especificación se procesa.' },
  { from:17, to:18, cls:'zone-type', label:'17-18', name:'Tipo (R/K/A/S/O)',  tip:'Cols 17-18: R=Registro, K=Clave, A=Campo, S=Selección, O=Omisión.' },
  { from:19, to:28, cls:'zone-name', label:'19-28', name:'Nombre campo/rec',  tip:'Cols 19-28: Nombre del registro (R) o del campo. Máx 10 caracteres.' },
  { from:29, to:38, cls:'zone-ref',  label:'29-38', name:'Referencia',        tip:'Cols 29-38: Referencia a otro campo (REF). Normalmente en blanco.' },
  { from:39, to:44, cls:'zone-len',  label:'39-44', name:'Longitud',          tip:'Cols 39-44: Longitud del campo en posiciones (ej: 7, 40, 100).' },
  { from:45, to:47, cls:'zone-dt',   label:'45-47', name:'Tipo de dato',      tip:'Cols 45-47: A=Carácter, S=Zoned decimal, P=Packed, B=Binario, L=Fecha, T=Hora.' },
  { from:48, to:51, cls:'zone-dec',  label:'48-51', name:'Decimales',         tip:'Cols 48-51: Posiciones decimales (solo para campos numéricos S/P/B).' },
  { from:52, to:52, cls:'zone-use',  label:'52',    name:'Uso (I/O/B/H/M)',   tip:'Col 52 (DSPF): I=Entrada, O=Salida, B=Ambos, H=Oculto, M=Message, N=No display, P=Program-to-system.' },
  { from:53, to:58, cls:'zone-loc',  label:'53-58', name:'Fila / Columna',    tip:'Cols 53-58: Posición en pantalla. Primeras 3=Fila, últimas 3=Columna (DSPF solamente).' },
  { from:59, to:80, cls:'zone-kw',   label:'59-80', name:'Palabras clave',    tip:'Cols 59-80: Palabras clave DDS: COLHDG, TEXT, PFILE, UNIQUE, COMP, DESCEND, CF, CHECK, etc.' },
];

/* Calcula qué zona corresponde a una columna (1-indexed) */
function ddsZoneForCol(col) {
  return DDS_ZONES.find(z => col >= z.from && col <= z.to) || null;
}

/* Genera el HTML del editor DDS completo (regla + gutter + textarea) */
function ddsEditorHtml(id, savedCode) {
  /* Ancho fijo por carácter en la fuente monoespaciada.
     Usamos ch units: cada zona ocupa (to-from+1)ch */
  const rulerZones = DDS_ZONES.map(z => {
    const cols = z.to - z.from + 1;
    const label = cols <= 3 ? z.label : `${z.label} ${z.name}`;
    return `<span class="dds-col-zone dds-${z.cls}"
      style="width:${cols}ch"
      data-tip="${z.tip}">${label}</span>`;
  }).join('');

  /* Gutter de filas (generamos 30 números) */
  const gutterNums = Array.from({length:30},(_,i)=>
    `<span class="dds-row-num" id="ddsrow-${id}-${i+1}">${i+1}</span>`
  ).join('');

  return `
  <div class="dds-editor-outer" id="ddsouter-${id}">
    <div class="dds-col-ruler" id="ddsruler-${id}">
      <div class="dds-col-ruler-gutter"></div>
      <div style="display:flex;font-family:'Cascadia Code','Consolas',monospace;font-size:12px">
        ${rulerZones}
      </div>
    </div>
    <div class="dds-edit-area" id="ddsedit-${id}"
         onscroll="ddsSyncScroll('${id}')">
      <div class="dds-row-gutter" id="ddsgutter-${id}">${gutterNums}</div>
      <textarea class="dds-textarea" id="simeditor-${id}"
                spellcheck="false"
                onkeydown="simHandleKey(event,'${id}');ddsUpdateGutter('${id}')"
                onkeyup="ddsUpdateCursor('${id}')"
                onclick="ddsUpdateCursor('${id}')"
                oninput="ddsUpdateGutter('${id}')"
                placeholder="       A          R NOMBREREC&#10;       A            CAMPO01        7A         COLHDG('Etiqueta')&#10;       A          K CAMPO01"
      >${savedCode}</textarea>
    </div>
    <div class="dds-statusbar" id="ddsstatus-${id}">
      <div class="dds-col-indicator">
        Fila <b id="ddsrow-indicator-${id}">1</b>
        &nbsp;·&nbsp;
        Col <b id="ddscol-indicator-${id}">1</b>
      </div>
      <div class="dds-col-indicator" id="ddszone-indicator-${id}">
        <span class="dds-col-badge" id="ddsbadge-${id}">Col 1-5 · Secuencia</span>
      </div>
      <span style="margin-left:auto;opacity:.5">Tab = 1 espacio · Ctrl+Enter = Evaluar</span>
    </div>
  </div>`;
}

/* Sincroniza el scroll horizontal de la regla con el textarea */
function ddsSyncScroll(id) {
  const area   = document.getElementById('ddsedit-'   + id);
  const ruler  = document.getElementById('ddsruler-'  + id);
  const gutter = document.getElementById('ddsgutter-' + id);
  if (!area || !ruler) return;
  /* La regla solo necesita scrollLeft; el gutter sincroniza scrollTop */
  const rulerContent = ruler.querySelector('div');
  if (rulerContent) rulerContent.style.marginLeft = -area.scrollLeft + 'px';
  if (gutter) gutter.style.marginTop = (12 - area.scrollTop) + 'px';
}

/* Actualiza los números de fila según el contenido actual */
function ddsUpdateGutter(id) {
  const ta = document.getElementById('simeditor-' + id);
  if (!ta) return;
  const lines = ta.value.split('\n').length;
  const gutter = document.getElementById('ddsgutter-' + id);
  if (!gutter) return;
  /* Asegurar que hay suficientes números */
  const existing = gutter.querySelectorAll('.dds-row-num').length;
  if (lines + 2 > existing) {
    for (let i = existing + 1; i <= lines + 5; i++) {
      const span = document.createElement('span');
      span.className = 'dds-row-num';
      span.id = 'ddsrow-' + id + '-' + i;
      span.textContent = i;
      gutter.appendChild(span);
    }
  }
  ddsUpdateCursor(id);
}

/* Actualiza el indicador de fila/columna y el badge de zona */
function ddsUpdateCursor(id) {
  const ta = document.getElementById('simeditor-' + id);
  const rowEl  = document.getElementById('ddsrow-indicator-' + id);
  const colEl  = document.getElementById('ddscol-indicator-'  + id);
  const badge  = document.getElementById('ddsbadge-'          + id);
  const zoneEl = document.getElementById('ddszone-indicator-' + id);
  if (!ta || !rowEl || !colEl || !badge) return;

  const pos  = ta.selectionStart;
  const text = ta.value.substring(0, pos);
  const lines = text.split('\n');
  const row   = lines.length;
  const col   = lines[lines.length - 1].length + 1;  /* 1-indexed */

  rowEl.textContent = row;
  colEl.textContent = col;

  const zone = ddsZoneForCol(col);
  if (zone) {
    badge.textContent = `Col ${zone.label} · ${zone.name}`;
    badge.className   = 'dds-col-badge ' + zone.cls;
  } else {
    badge.textContent = `Col ${col}`;
    badge.className   = 'dds-col-badge';
  }
}
