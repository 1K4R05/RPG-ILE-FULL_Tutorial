  {
    id:'f2', num:2, icon:'🗂️', title:'DDS — PF · LF · DSPF · PRTF',
    color:'#3fb950', nivel:'Junior',
    desc:'Physical Files, Logical Files, Display Files y Printer Files con DDS',
    intro:`<p class="pi-text">
      <strong>DDS</strong> (Data Description Specifications) es el lenguaje nativo de IBM i para definir
      la estructura de archivos de base de datos y pantallas. Es el equivalente de CREATE TABLE en SQL,
      pero más poderoso: permite definir validaciones, formatos de pantalla interactiva (DSPF) y reportes
      impresos (PRTF) en el mismo lenguaje.
    </p>
    <p class="pi-text" style="margin-top:8px">
      Los cuatro tipos de archivos DDS son:
      <br>• <strong>PF (Physical File)</strong>: tabla de base de datos. Almacena los datos reales.
      <br>• <strong>LF (Logical File)</strong>: vista lógica sobre un PF. Permite diferente orden de claves, selección de registros o joins sin duplicar datos.
      <br>• <strong>DSPF (Display File)</strong>: pantalla 5250 interactiva para captura y consulta de datos.
      <br>• <strong>PRTF (Printer File)</strong>: formato de reporte impreso, con encabezados, detalles y totales.
    </p>
    <p class="pi-text" style="margin-top:8px">
      DDS usa una sintaxis de <strong>columnas fijas</strong> (como el COBOL fijo): las posiciones de las
      columnas tienen significado específico. La columna 6 es para niveles de secuencia, la 17 para el tipo
      de campo (A, S, P, L), etc. Esto es diferente al formato libre de RPGLE moderno.
    </p>`,
    whyMatters:`DDS es el corazón de la capa de datos en IBM i. Entenderlo bien te permite manipular archivos de producción con seguridad, crear vistas optimizadas (LFs) sin tocar el PF base, y construir pantallas de captura nativas. Aunque SQL está reemplazando DDL puro, el 90% del código legacy existente usa DDS.`,
    keyTerms:['PF Physical File','LF Logical File','DSPF Display File','PRTF Printer File','UNIQUE','K clave','PFILE','SFLCTL','Subfile','EDTCDE'],
    exercises:[
      {
        id:'F2-E1', nivel:'E', title:'Crear los 4 Physical Files del sistema', simId:'SIM-09',
        background:'Un Physical File en DDS es exactamente lo que sería una tabla SQL, pero con sintaxis propia. La diferencia clave: en DDS la clave se define con <code>K campo</code> al final del formato de registro. El modificador <code>UNIQUE</code> a nivel de archivo garantiza que no haya duplicados en la clave. IBM i compila el DDS para crear el objeto *FILE en el sistema.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name"><code>K campo</code> — La clave del Physical File</div>
  <div class="th-concept-desc">
    La clave (<strong>K</strong>) define cómo IBM i <em>organiza físicamente</em> los datos en disco y cómo los programas los buscan con <code>CHAIN</code>.
    Sin clave, el sistema no puede hacer búsqueda directa por valor — tendría que leer el archivo entero (table scan).
    Con clave, IBM i mantiene un árbol B+ interno y localiza cualquier registro en tiempo logarítmico.
    <br><br>
    <strong>¿Por qué el campo LIBCOD y no LIBTTL como clave?</strong> Porque las claves deben ser:
    <em>únicas</em> (dos libros pueden tener el mismo título), <em>cortas</em> (mejor rendimiento en el árbol), y
    <em>estables</em> (no deben cambiar: cambiar el título no rompe referencias; cambiar el código sí).
  </div>
  <div class="th-example"><span class="cm">*── Sin clave: cada CHAIN recorre TODO el archivo ──────────────────</span>
<span class="bad">*   Sin K campo  → acceso secuencial, O(n), lento en tablas grandes</span>

<span class="cm">*── Con clave: IBM i navega el árbol B+, O(log n) ──────────────────</span>
<span class="good">       A          K LIBCOD    </span><span class="cm">← IBM i crea índice físico por este campo</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>UNIQUE</code> — Integridad de la clave primaria</div>
  <div class="th-concept-desc">
    <code>UNIQUE</code> va a nivel de archivo (antes del registro R) e instruye a IBM i a rechazar cualquier
    <code>WRITE</code> que intente insertar un registro con una clave ya existente.
    Sin <code>UNIQUE</code>, el archivo acepta duplicados en la clave — lo cual corrompe la lógica
    de <code>CHAIN</code> (retornaría el primero que encuentre, ignorando el resto).
    <br><br>
    <strong>Analogía:</strong> <code>UNIQUE</code> equivale a <code>PRIMARY KEY</code> en SQL.
    Si no lo pones, el archivo se comporta como una tabla sin PK: datos inconsistentes garantizados.
  </div>
  <div class="th-example"><span class="kw">       A                                      UNIQUE</span>  <span class="cm">← nivel archivo</span>
<span class="kw">       A          R LIBREC</span>
<span class="hl">       A            LIBCOD         7A</span>
<span class="kw">       A          K LIBCOD</span>

<span class="cm">* Si intentas hacer WRITE con LIBCOD='LIB0001' cuando ya existe:</span>
<span class="bad">* → Error CPF5027: Duplicate key. El WRITE falla.</span>
<span class="cm">* Sin UNIQUE, el WRITE sería aceptado → datos duplicados</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">Tipos de campo: <code>A</code> <code>S</code> <code>P</code> <code>L</code></div>
  <div class="th-concept-desc">
    Cada campo en DDS tiene un tipo que determina cómo se almacena en disco y cómo se manipula en RPGLE.
    Elegir el tipo incorrecto tiene consecuencias en storage, comparaciones y rendimiento.
  </div>
  <table class="th-table">
    <tr><th>Tipo</th><th>Nombre</th><th>Uso correcto</th><th>Ejemplo</th></tr>
    <tr><td><code>A</code></td><td><strong>Alfanumérico</strong></td><td>Texto, códigos, descripciones. Siempre en mayúsculas por defecto.</td><td><code>LIBCOD 7A</code></td></tr>
    <tr><td><code>S</code></td><td><strong>Zoned Decimal</strong></td><td>Números editables (uno por carácter). Usado para campos en pantalla o clave.</td><td><code>LIBANIO 4S 0</code></td></tr>
    <tr><td><code>P</code></td><td><strong>Packed Decimal</strong></td><td>Cálculos internos. Más compacto que S (2 dígitos por byte). Nunca usar como clave.</td><td><code>IMPORTE 9P 2</code></td></tr>
    <tr><td><code>L</code></td><td><strong>Date</strong></td><td>Fechas con formato explícito. Siempre acompañar con <code>DATFMT(*ISO)</code>.</td><td><code>SOCFEC L</code></td></tr>
  </table>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>VALUES</code> y <code>RANGE</code> — Validación declarativa</div>
  <div class="th-concept-desc">
    Estas keywords restringen los valores aceptados <em>a nivel de archivo</em>, antes de que el dato
    llegue al programa. IBM i rechaza automáticamente valores inválidos en el momento del <code>WRITE</code>.
    Es más confiable que validar en el programa porque aplica a CUALQUIER acceso, incluyendo
    scripts SQL directos o herramientas de DFU.
  </div>
  <div class="th-example"><span class="kw">       A            SOCACT         1A</span>
<span class="hl">       A                                      VALUES('S' 'N')</span>  <span class="cm">← solo 'S' o 'N'</span>

<span class="kw">       A            LIBANIO        4S 0</span>
<span class="hl">       A                                      RANGE(1800 2099)</span>  <span class="cm">← entre 1800 y 2099</span>

<span class="cm">* Intento de WRITE con SOCACT='X' → Error CPF5021: Value not in list</span>
<span class="cm">* Intento de WRITE con LIBANIO=1700 → Error CPF5022: Value out of range</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>Usar tipo P como clave:</strong> Los campos Packed Decimal (<code>P</code>) no deben usarse como clave en un PF. IBM i los acepta, pero son comparativamente lentos. Usa <code>S</code> (Zoned) para claves numéricas.</li>
    <li><strong>Olvidar DATFMT(*ISO) en campos L:</strong> Sin <code>DATFMT</code>, la fecha usa el formato del job (DATFMT del sistema), lo cual crea inconsistencias entre ambientes. Siempre especifica <code>DATFMT(*ISO)</code>.</li>
    <li><strong>Poner UNIQUE después del registro R:</strong> <code>UNIQUE</code> debe ir <em>antes</em> del <code>R registro</code>, a nivel de archivo. Si va después, el compilador da error <code>DDS0015</code>.</li>
    <li><strong>RANGE en campo A (alfanumérico):</strong> <code>RANGE</code> hace comparación lexicográfica en campos A, no numérica. <code>RANGE('0' '9')</code> no valida dígitos — usa <code>VALUES</code> o valida en el programa.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>Para ver los campos definidos en un PF ya compilado sin tener el fuente, usa <code>DSPFFD FILE(BIBLIOTECA/LIBROS)</code>. Muestra el nombre, tipo, longitud, decimales y COLHDG de cada campo. Es la herramienta de documentación más rápida en producción.</p>
</div>`,
        obj:'Definir Physical Files con claves, tipos de campo correctos y documentación TEXT/COLHDG.',
        enun:'Crea los PFs LIBROS, SOCIOS, PRESTAMOS y AUTORES con la estructura del modelo. Todos deben tener UNIQUE en la clave, y TEXT/COLHDG en cada campo. Compila los 4 con CRTPF.',
        hints:[
          'Tipos: A=alfanumérico, S=zoned decimal, P=packed decimal, L=fecha',
          'La clave en PF se define con <code>K campo</code> al final del registro R',
          '<code>UNIQUE</code> va antes del registro R, a nivel de archivo',
          '<code>VALUES(\'S\' \'N\')</code> restringe los valores del campo SOCACT'
        ],
        conceptos:['UNIQUE','TEXT','COLHDG','K clave','VALUES','RANGE','CRTPF'],
        solucion:`*── LIBROS ───────────────────────────────────────────────────────────
      A                                      UNIQUE
      A          R LIBREC                    TEXT('Registro de libro')
      A            LIBCOD         7A         COLHDG('CODIGO')
      A            LIBTTL        60A         COLHDG('TITULO')
      A            LIBAUTO        7A         COLHDG('COD AUTOR')
      A            LIBEDI        20A         COLHDG('EDITORIAL')
      A            LIBANIO        4S 0       COLHDG('AÑO')
      A                                      RANGE(1800 2099)
      A            LIBDIS         2S 0       COLHDG('DISPONIBLES')
      A                                      RANGE(0 99)
      A          K LIBCOD

*── SOCIOS ───────────────────────────────────────────────────────────
      A                                      UNIQUE
      A          R SOCREC                    TEXT('Registro de socio')
      A            SOCCOD         7A         COLHDG('CODIGO')
      A            SOCNOM        40A         COLHDG('NOMBRE')
      A            SOCEML        60A         COLHDG('EMAIL')
      A            SOCFEC         L          COLHDG('FECHA ALTA')
      A                                      DATFMT(*ISO)
      A            SOCACT         1A         COLHDG('ACTIVO')
      A                                      VALUES('S' 'N')
      A          K SOCCOD

*── PRESTAMOS ────────────────────────────────────────────────────────
      A                                      UNIQUE
      A          R PRESREC                   TEXT('Registro de préstamo')
      A            PRESCOD        9A         COLHDG('COD PRESTAMO')
      A            PRESLIB        7A         COLHDG('COD LIBRO')
      A            PRESSOC        7A         COLHDG('COD SOCIO')
      A            PRESFEC        L          COLHDG('FECHA PREST')
      A                                      DATFMT(*ISO)
      A            PRESDVL        L          COLHDG('FECHA DEVOL')
      A                                      DATFMT(*ISO)
      A            PRESEST        1A         COLHDG('ESTADO')
      A                                      VALUES('P' 'D' 'V')
      A          K PRESCOD

*── AUTORES ──────────────────────────────────────────────────────────
      A                                      UNIQUE
      A          R AUTREC                    TEXT('Registro de autor')
      A            AUTCOD         7A         COLHDG('CODIGO')
      A            AUTNOM        40A         COLHDG('NOMBRE')
      A            AUTPAI        30A         COLHDG('PAIS')
      A            AUTGEN        30A         COLHDG('GENERO')
      A          K AUTCOD

/* Compilar */
CRTPF FILE(BIBLIOTECA/LIBROS)    SRCFILE(BIBLIOTECA/QDDSSRC) SRCMBR(LIBROS)
CRTPF FILE(BIBLIOTECA/SOCIOS)    SRCFILE(BIBLIOTECA/QDDSSRC) SRCMBR(SOCIOS)
CRTPF FILE(BIBLIOTECA/PRESTAMOS) SRCFILE(BIBLIOTECA/QDDSSRC) SRCMBR(PRESTAMOS)
CRTPF FILE(BIBLIOTECA/AUTORES)   SRCFILE(BIBLIOTECA/QDDSSRC) SRCMBR(AUTORES)`
      },
      {
        id:'F2-E2', nivel:'M', title:'Logical Files para consultas frecuentes', simId:'SIM-10',
        background:'Un Logical File no almacena datos propios — apunta al PF base y presenta los mismos registros con diferente organización. Cuando un programa RPGLE abre un LF, lee físicamente el PF pero en el orden que el LF define. Esto evita copiar datos: un solo PF puede tener decenas de LFs para distintos patrones de acceso.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name"><code>PFILE</code> — El vínculo entre LF y PF</div>
  <div class="th-concept-desc">
    <code>PFILE(LIBROS)</code> le dice a IBM i qué Physical File sirve como fuente de datos.
    El LF no duplica los registros — solo mantiene un índice separado con el orden de claves que definas.
    En disco, el LF ocupa solo el espacio del índice, no los datos.
    <br><br>
    Cuando el LF define campos, solo incluye los que necesita. Cuando <em>no</em> define campos
    (solo el registro R con PFILE), hereda automáticamente todos los campos del PF.
  </div>
  <div class="th-example"><span class="cm">*── LF mínimo: solo redefine la clave, hereda todos los campos ─────</span>
<span class="kw">       A          R LIBREC                    PFILE(LIBROS)</span>
<span class="hl">       A          K LIBTTL</span>  <span class="cm">← mismos datos, diferente orden</span>

<span class="cm">*── En RPGLE, abrir LIBXTTL lee los libros en orden alfabético:</span>
<span class="fn">DCL-F LIBXTTL USAGE(*INPUT) KEYED;</span>
<span class="fn">SETLL *LOVAL LIBREC;</span>   <span class="cm">← posiciona al inicio del índice por título</span>
<span class="fn">READ  LIBREC;</span>           <span class="cm">← primer libro alfabéticamente</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">Orden de claves: ¿por qué importa en consultas compuestas?</div>
  <div class="th-concept-desc">
    Cuando un LF tiene <strong>múltiples claves</strong> (como PRESXSOC con PRESSOC + PRESFEC),
    el <em>orden</em> define la jerarquía de ordenación. Piensa en un directorio telefónico:
    primero ordena por apellido, luego por nombre. Solo puedes buscar eficientemente si empiezas
    por el nivel superior.
    <br><br>
    <strong>Regla práctica:</strong> el campo por el que filtras o haces <code>SETRANGE</code>
    en RPGLE debe ser la <em>primera</em> clave del LF. Si colocas PRESFEC primero y PRESSOC segundo,
    un <code>SETLL socCod</code> hará un table scan porque el índice está ordenado por fecha.
  </div>
  <div class="th-example"><span class="cm">*── CORRECTO: buscar préstamos de un socio, ordenados por fecha ────</span>
<span class="good">       A          K PRESSOC</span>   <span class="cm">← primera: por socio (campo de búsqueda)</span>
<span class="good">       A          K PRESFEC</span>   <span class="cm">← segunda: fecha dentro de ese socio</span>

<span class="cm">*── MAL: si invirtieras el orden...</span>
<span class="bad">       A          K PRESFEC</span>   <span class="cm">← ¿buscar todos los préstamos del 2024? OK</span>
<span class="bad">       A          K PRESSOC</span>   <span class="cm">← ¿buscar préstamos de SOC0001? ← table scan</span>

<span class="cm">*── En RPGLE con el LF correcto (PRESSOC primero):</span>
<span class="fn">SETLL pCodSoc PRESREC;</span>   <span class="cm">← posiciona al primer préstamo del socio</span>
<span class="fn">READE pCodSoc PRESREC;</span>  <span class="cm">← lee solo los préstamos de ese socio, eficiente</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>S campo COMP(GT 0)</code> — Selección de registros</div>
  <div class="th-concept-desc">
    La cláusula <code>S</code> (select) filtra qué registros del PF son visibles en el LF.
    Los registros que <em>no</em> cumplen la condición simplemente no aparecen — es como una cláusula
    WHERE permanente en el índice del LF.
    <br><br>
    <code>COMP</code> acepta: <code>EQ</code>, <code>NE</code>, <code>GT</code>, <code>LT</code>,
    <code>GE</code>, <code>LE</code>. También existe <code>O</code> (omisión): los registros que
    cumplan la condición <em>de omisión</em> son excluidos.
    <br><br>
    <strong>Ventaja importante:</strong> cuando RPGLE usa este LF, <em>nunca ve los registros excluidos</em>.
    No necesitas filtrar en el programa — el LF lo hace automáticamente.
  </div>
  <div class="th-example"><span class="cm">*── Solo libros con disponibles > 0 ─────────────────────────────────</span>
<span class="kw">       A          R LIBREC                    PFILE(LIBROS)</span>
<span class="hl">       A          S LIBDIS                    COMP(GT 0)</span>  <span class="cm">← solo si LIBDIS &gt; 0</span>
<span class="kw">       A          K LIBDIS                    DESCEND</span>    <span class="cm">← más disponibles primero</span>

<span class="cm">*── RPGLE leyendo LIBXDIS: nunca ve libros agotados</span>
<span class="fn">SETLL *HIVAL LIBREC;</span>   <span class="cm">← *HIVAL + DESCEND = empieza por el mayor stock</span>
<span class="fn">READP  LIBREC;</span>         <span class="cm">← primer libro: el de más disponibles</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>DESCEND</code> — Orden descendente en la clave</div>
  <div class="th-concept-desc">
    Por defecto todas las claves son ascendentes. <code>DESCEND</code> invierte el orden para ese campo.
    Es crucial entender cómo afecta la posición inicial con <code>SETLL</code>/<code>SETGT</code>:
    con <code>DESCEND</code>, <em>el valor mayor es el primero</em> — por lo que para leer del inicio
    usas <code>*HIVAL</code> con <code>READP</code>, o <code>*LOVAL</code> con <code>READ</code>
    dependiendo de la dirección.
  </div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>PFILE apunta a la librería incorrecta:</strong> Si compilas el LF en un ambiente diferente sin tener BIBLIOTECA en la library list, el <code>PFILE(LIBROS)</code> no se resuelve y el compilador da <code>CPF2110</code>. Siempre especifica la librería: <code>PFILE(BIBLIOTECA/LIBROS)</code>.</li>
    <li><strong>Clave LF que no existe en el PF:</strong> Todos los campos usados como <code>K</code> en el LF deben existir en el PF base. Si el campo tiene diferente nombre o tipo, el compilador da error <code>DDS0082</code>.</li>
    <li><strong>SELECT/OMIT con campos no en el formato:</strong> Los campos referenciados en <code>S COMP()</code> deben ser parte del registro del LF (heredados del PF). Si eliminas un campo con <code>*NONE</code> pero lo usas en SELECT, obtienes <code>DDS0141</code>.</li>
    <li><strong>DESCEND sin ajustar SETLL/SETGT:</strong> Con <code>DESCEND</code> en la clave, la dirección de lectura se invierte. El error clásico es usar <code>SETLL *LOVAL</code> (en vez de <code>*HIVAL</code>) creyendo que posiciona al inicio del archivo — con DESCEND hace lo contrario.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>Puedes tener decenas de LFs sobre el mismo PF sin costo extra de almacenamiento — solo el índice ocupa espacio. Usa <code>DSPDBR FILE(BIBLIOTECA/LIBROS)</code> para ver todos los LFs que dependen de un PF dado. Es la forma más rápida de entender las vistas existentes sobre una tabla en producción.</p>
</div>`,
        obj:'Definir LFs con diferentes claves de acceso y selección de registros.',
        enun:'Crea 3 LFs: (a) LIBXTTL — libros ordenados por título, (b) LIBXDIS — solo libros con LIBDIS > 0 ordenados por disponibles DESC, (c) PRESXSOC — préstamos con estado "P", ordenados por socio y fecha.',
        hints:[
          'Para orden descendente: <code>K campo DESCEND</code>',
          'Selección: <code>S CAMPO COMP(GT 0)</code> filtra registros',
          'El LF hereda todos los campos del PF cuando no los redeclara',
          'Compila con <code>CRTLF FILE(LIB/NOMBRE) SRCFILE(LIB/QDDSSRC)</code>'
        ],
        conceptos:['PFILE','COMP','DESCEND','Selección/omisión','CRTLF'],
        solucion:`*── LIBXTTL: Libros ordenados por título ─────────────────────────────
      A          R LIBREC                    PFILE(LIBROS)
      A          K LIBTTL

*── LIBXDIS: Libros disponibles ordenados por stock ─────────────────
      A          R LIBREC                    PFILE(LIBROS)
      A          S LIBDIS                    COMP(GT 0)
      A          K LIBDIS                    DESCEND

*── PRESXSOC: Préstamos pendientes por socio y fecha ─────────────────
      A          R PRESREC                   PFILE(PRESTAMOS)
      A          S PRESEST                   COMP(EQ 'P')
      A          K PRESSOC
      A          K PRESFEC

/* Compilar */
CRTLF FILE(BIBLIOTECA/LIBXTTL)  SRCFILE(BIBLIOTECA/QDDSSRC) SRCMBR(LIBXTTL)
CRTLF FILE(BIBLIOTECA/LIBXDIS)  SRCFILE(BIBLIOTECA/QDDSSRC) SRCMBR(LIBXDIS)
CRTLF FILE(BIBLIOTECA/PRESXSOC) SRCFILE(BIBLIOTECA/QDDSSRC) SRCMBR(PRESXSOC)`
      },
      {
        id:'F2-E3', nivel:'D', title:'Pantalla de consulta de libros (DSPF con Subfile)',
        background:'Un Subfile es el mecanismo nativo de IBM i para mostrar listas en pantalla verde. Requiere DOS formatos DDS: el <strong>SFL</strong> (define una fila de la lista) y el <strong>SFLCTL</strong> (controla la pantalla completa: título, teclas, paginación). El programa RPGLE carga las filas una a una en el SFL con WRITE, luego llama EXFMT al SFLCTL para mostrar todo.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">Arquitectura del Subfile: SFL + SFLCTL</div>
  <div class="th-concept-desc">
    Un subfile funciona como una tabla de datos en memoria que IBM i muestra en pantalla.
    Necesita dos formatos que trabajan juntos:
    <br>• <strong>SFL (subfile)</strong>: define cómo luce <em>una sola fila</em> de la lista. Es el "molde" de cada renglón.
    <br>• <strong>SFLCTL (control)</strong>: contiene el encabezado, las teclas de función, y controla cuántas filas se ven y cuántas se cargan en memoria.
    <br><br>
    <strong>Regla de oro:</strong> el formato SFL <em>siempre va primero</em> en el DDS. Si lo pones después del SFLCTL, el compilador CRTDSPF falla con error de secuencia.
  </div>
  <div class="th-example"><span class="cm">*── Estructura obligatoria ───────────────────────────────────────────</span>
<span class="kw">       A          R SFLIB                     SFL</span>        <span class="cm">← 1ro: una fila</span>
<span class="kw">       A            SFLLIB         7A  O   5  3</span>
<span class="kw">       A            SFLTTL        60A  O   5 12</span>

<span class="kw">       A          R SFCTLLIB                  SFLCTL(SFLIB)</span>  <span class="cm">← 2do: control</span>
<span class="kw">       A                                      SFLSIZ(0100)</span>  <span class="cm">← máx 100 filas en memoria</span>
<span class="kw">       A                                      SFLPAG(0015)</span>  <span class="cm">← 15 filas visibles a la vez</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">Los 3 indicadores de control del Subfile</div>
  <div class="th-concept-desc">
    El SFLCTL usa <strong>indicadores numéricos</strong> (71, 72, 73) que el programa RPGLE activa
    o desactiva con <code>*IN71 = *ON</code>. Cada uno controla un aspecto crítico del ciclo de vida:
  </div>
  <table class="th-table">
    <tr><th>Indicador</th><th>Keyword</th><th>Cuándo se activa</th><th>Efecto</th></tr>
    <tr><td><code>*IN71</code></td><td><code>SFLDSP / SFLDSPCTL</code></td><td>Cuando hay filas para mostrar</td><td>Hace visible el subfile y su encabezado. Sin él, la pantalla aparece vacía.</td></tr>
    <tr><td><code>*IN72</code></td><td><code>SFLCLR</code></td><td>Antes de cargar nuevas filas</td><td>Borra todas las filas del SFL en memoria. Obligatorio antes de recargar con F5.</td></tr>
    <tr><td><code>*IN73</code></td><td><code>SFLEND(*MORE)</code></td><td>Al llegar al último registro</td><td>Controla si aparece "Más..." al final. Si está OFF con filas visibles, el usuario puede paginar.</td></tr>
  </table>
  <div class="th-example"><span class="cm">*── Ciclo de carga en RPGLE ──────────────────────────────────────────</span>
<span class="cm">* 1. Limpiar SFL:</span>
<span class="fn">  *IN72 = *ON;  WRITE SFCTLLIB;  *IN72 = *OFF;</span>  <span class="cm">← borra y apaga</span>
<span class="cm">* 2. Cargar filas:</span>
<span class="fn">  nRrn += 1;  SFLLIB = LIBCOD;  SFLTTL = LIBTTL;  WRITE SFLIB;</span>
<span class="cm">* 3. Indicar fin:</span>
<span class="fn">  *IN73 = *ON;</span>  <span class="cm">← último registro cargado</span>
<span class="cm">* 4. Mostrar:</span>
<span class="fn">  *IN71 = *ON;  EXFMT SFCTLLIB;</span>  <span class="cm">← muestra la pantalla y espera tecla</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>SFLSIZ</code> vs <code>SFLPAG</code> — Memoria vs pantalla</div>
  <div class="th-concept-desc">
    <code>SFLSIZ</code> es cuántas filas caben <em>en memoria</em> del subfile.
    <code>SFLPAG</code> es cuántas filas son <em>visibles en pantalla</em> simultáneamente.
    IBM i pagina automáticamente entre lo que está en memoria.
    <br><br>
    Ejemplo: <code>SFLSIZ(0100)</code> y <code>SFLPAG(0015)</code> → cargamos hasta 100 filas,
    se ven 15 a la vez, IBM i maneja las páginas 1-7 automáticamente.
    Si cargas más de SFLSIZ registros, el subfile da error — debes aumentar SFLSIZ o implementar
    carga por páginas.
  </div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>Definir SFLCTL antes del SFL:</strong> El formato subfile (<code>R SFLIB</code> con keyword <code>SFL</code>) <em>debe</em> estar antes del control (<code>R SFCTLLIB</code> con <code>SFLCTL(SFLIB)</code>). Si el orden es inverso, el compilador da error de referencia no resuelta.</li>
    <li><strong>SFLSIZ igual a SFLPAG:</strong> Cuando <code>SFLSIZ = SFLPAG</code>, el subfile no puede crecer más allá de una página. Para listas con más registros que la pantalla, siempre pon <code>SFLSIZ</code> mayor que <code>SFLPAG</code>.</li>
    <li><strong>Olvidar activar SFLDSP con el indicador:</strong> Si el indicador 71 no está activado antes de mostrar la pantalla, el subfile aparece vacío aunque hayas escrito registros. El flujo correcto es: WRITE subfile → activar indicador → EXFMT control.</li>
    <li><strong>No limpiar con SFLCLR entre búsquedas:</strong> Sin activar el indicador de <code>SFLCLR</code> antes de recargar, los registros de la búsqueda anterior siguen visibles mezclados con los nuevos.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>Para depurar problemas de subfile en producción sin acceso al fuente, usa <code>DSPFD FILE(BIBLIOTECA/LIBD01) TYPE(*MBRLIST)</code> para ver los formatos del DSPF, o bien desde ACS → Database → Tables explora el Display File con el campo por campo. El indicador de SFLDSP activo/inactivo es la causa del 80% de subfiles que "aparecen vacíos".</p>
</div>`,
        obj:'Crear un DSPF con subfile para mostrar una lista paginada de libros.',
        enun:'Crea el DSPF LIBD01 con: (a) SFLIB — subfile con LIBCOD, LIBTTL, LIBDIS, (b) SFCTLLIB — control de subfile con F3=Salir, F5=Refrescar y encabezado. Compila con CRTDSPF.',
        hints:[
          'El formato SFL (subfile) va PRIMERO; el SFLCTL (control) va después',
          'SFLCTL necesita: <code>SFLCTL(SFLIB)</code>, <code>SFLSIZ</code>, <code>SFLPAG</code>',
          'Indicadores de control: 71=SFLDSP/SFLDSPCTL, 72=SFLCLR, 73=SFLEND',
          'La posición de los campos: fila columna, ej: <code>5  3</code>'
        ],
        conceptos:['SFL','SFLCTL','SFLDSP','SFLCLR','SFLEND','SFLPAG','CRTDSPF'],
        solucion:`*── LIBD01 ────────────────────────────────────────────────────────────
      A                                      DSPSIZ(24 80 *DS3)
      A                                      INDARA
      A          R SFLIB                     SFL
      A            SFLLIB         7A  O   5  3
      A            SFLTTL        60A  O   5 12
      A            SFLDIS         2S 0O   5 74
      A                                      EDTCDE(3)

      A          R SFCTLLIB                  SFLCTL(SFLIB)
      A                                      SFLSIZ(0100)
      A                                      SFLPAG(0015)
      A  71                                  SFLDSP
      A  71                                  SFLDSPCTL
      A  72                                  SFLCLR
      A  73                                  SFLEND(*MORE)
      A                                      CF03(03 'Salir')
      A                                      CF05(05 'Refrescar')
      A                                  1  2'CONSULTA DE LIBROS'
      A                                      DSPATR(HI)
      A                                  1 70DATE
      A                                      EDTCDE(Y)
      A                                  3  2'Código'
      A                                  3 12'Título'
      A                                  3 74'Dis'
      A                                 24  2'F3=Salir  F5=Refrescar'
      A                                      COLOR(BLU)

CRTDSPF FILE(BIBLIOTECA/LIBD01) SRCFILE(BIBLIOTECA/QDDSSRC) SRCMBR(LIBD01)`
      },
      {
        id:'F2-E4', nivel:'M', title:'Reporte de préstamos pendientes (PRTF)',
        background:'Un Printer File (PRTF) en DDS es la definición del layout de un reporte impreso o spool. A diferencia de generar texto en RPGLE, el PRTF encapsula el formato visual: qué aparece en cada posición de la página, cómo se formatean los números, cuándo saltar de página y cómo se encabezan las columnas.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">Arquitectura del PRTF: múltiples formatos por reporte</div>
  <div class="th-concept-desc">
    Un Printer File tiene varios formatos de registro (<strong>R nombre</strong>), cada uno responsable
    de un tipo de línea del reporte. El programa RPGLE llama al formato correcto con <code>WRITE</code>
    en el momento adecuado.
    <br><br>
    El programa controla la lógica: cuándo imprimir encabezado, cuándo imprimir una fila de detalle,
    cuándo imprimir los totales. El PRTF controla la estética: en qué columna aparece cada dato,
    si hay espacio antes/después, cómo se formatean los números.
  </div>
  <table class="th-table">
    <tr><th>Formato</th><th>Propósito</th><th>WRITE desde RPGLE</th></tr>
    <tr><td><code>ENCABEZ</code></td><td>Encabezado de página (título, fecha, número de página)</td><td>Al inicio y al saltar página</td></tr>
    <tr><td><code>COLUMS</code></td><td>Cabeceras de columnas</td><td>Después de cada encabezado</td></tr>
    <tr><td><code>DETPRES</code></td><td>Una fila de detalle por préstamo</td><td>En cada iteración del loop</td></tr>
    <tr><td><code>TOTALES</code></td><td>Línea de totales al final</td><td>Después del loop</td></tr>
  </table>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>SKIPB</code> / <code>SPACEA</code> / <code>SPACEB</code> — Control del papel</div>
  <div class="th-concept-desc">
    Estas keywords controlan el avance del papel:
    <br>• <code>SKIPB(1)</code>: salta al inicio de la página (<em>antes</em> de imprimir este formato).
      Equivale a un "nueva página". Se usa en el formato de encabezado.
    <br>• <code>SPACEA(n)</code>: avanza <em>n</em> líneas <em>después</em> de imprimir.
      <code>SPACEA(1)</code> = interlineado simple; <code>SPACEA(2)</code> = doble espacio.
    <br>• <code>SPACEB(n)</code>: avanza <em>n</em> líneas <em>antes</em> de imprimir.
    <br><br>
    <strong>Trampa común:</strong> poner <code>SKIPB</code> en el formato de detalle hace que cada
    fila salte a una nueva página — solo debe ir en el encabezado.
  </div>
  <div class="th-example"><span class="cm">*── Flujo de impresión en RPGLE:</span>
<span class="fn">WRITE ENCABEZ;   </span><span class="cm">← SKIPB(1): salta página, imprime título y fecha</span>
<span class="fn">WRITE COLUMS;    </span><span class="cm">← SPACEA(2): imprime cabeceras con doble espacio</span>
<span class="kw">DOW NOT %EOF(PRESXSOC);</span>
<span class="fn">  WRITE DETPRES; </span><span class="cm">← SPACEA(1): imprime fila de detalle, espacio simple</span>
<span class="fn">  READ PRESREC;  </span>
<span class="kw">ENDDO;</span>
<span class="fn">WRITE TOTALES;   </span><span class="cm">← SPACEA(3): imprime totales con 3 líneas de separación</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>EDTCDE</code> — Formatear números para lectura humana</div>
  <div class="th-concept-desc">
    <code>EDTCDE</code> (Edit Code) formatea automáticamente números en el reporte.
    Sin EDTCDE, un campo numérico de 7 dígitos como <code>0001234</code> imprime tal cual.
    Con EDTCDE(3) imprime <code>1,234</code> (separador de miles, sin signo).
  </div>
  <table class="th-table">
    <tr><th>EDTCDE</th><th>Formato</th><th>Ejemplo (1234.56)</th></tr>
    <tr><td><code>1</code></td><td>Comas + signo negativo</td><td><code>1,234.56-</code></td></tr>
    <tr><td><code>2</code></td><td>Comas + CR para negativo</td><td><code>1,234.56CR</code></td></tr>
    <tr><td><code>3</code></td><td>Comas + sin signo</td><td><code>1,234.56</code></td></tr>
    <tr><td><code>4</code></td><td>Sin comas + sin signo</td><td><code>1234.56</code></td></tr>
    <tr><td><code>Y</code></td><td>Fecha con / (mm/dd/aa)</td><td><code>12/25/24</code></td></tr>
    <tr><td><code>Z</code></td><td>Suprime ceros a la izquierda</td><td><code>1234.56</code></td></tr>
  </table>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>SKIPB sin 1 en el encabezado:</strong> Si olvidas <code>SKIPB(1)</code> en ENCABEZ, el reporte no salta al inicio de página — los encabezados de distintas páginas se mezclan con el detalle de la página anterior.</li>
    <li><strong>EDTCDE en campos alfanuméricos:</strong> <code>EDTCDE</code> solo aplica a campos numéricos (<code>S</code> o <code>P</code>). Aplicarlo a un campo <code>A</code> da error de compilación <code>DDS0153</code>.</li>
    <li><strong>Posición de columna incorrecta:</strong> DDS usa formato fijo — la posición de fila/columna de cada campo se define en columnas específicas del fuente. Un error de una columna de indentación puede mover visualmente el campo o causar error de solapamiento.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>Para verificar el diseño de un PRTF sin imprimirlo, usa <code>DSPFFD FILE(BIBLIOTECA/PRESR01)</code> para ver los formatos definidos y sus campos, o usa ACS → Database → Tables para explorar el formato visualmente.</p>
</div>`,
        obj:'Definir un Printer File con encabezado, detalle, subtotal y total.',
        enun:'Crea el PRTF PRESR01 con 4 formatos: ENCABEZ, COLUMS, DETPRES y TOTALES. El reporte muestra: código préstamo, nombre socio, título libro, fecha préstamo y días pendientes.',
        hints:[

  {
    id:'f3', num:3, icon:'⚙️', title:'RPGLE Moderno (**FREE)',
    color:'#bc8cff', nivel:'Mid',
    desc:'Formato libre, subprocedimientos, ILE, operaciones de archivo',
    intro:`<p class="pi-text">
      <strong>RPGLE **FREE</strong> (formato libre) es la evolución moderna del lenguaje RPG. A diferencia
      del RPG clásico con columnas fijas y el ciclo implícito, el formato libre usa una sintaxis limpia
      similar a C o Java, con declaraciones explícitas y control total del flujo.
    </p>
    <p class="pi-text" style="margin-top:8px">
      Las operaciones de archivo son el núcleo de RPGLE: <code>CHAIN</code> (buscar por clave),
      <code>READ/READE</code> (leer secuencialmente), <code>WRITE</code> (insertar), <code>UPDATE</code>
      (actualizar) y <code>DELETE</code> (borrar). Todas operan sobre buffers de registro que se populan
      antes de la operación.
    </p>
    <p class="pi-text" style="margin-top:8px">
      Los <strong>subprocedimientos</strong> (<code>DCL-PROC</code>) permiten dividir la lógica en
      funciones cohesivas con sus propias variables locales. El <strong>manejo de errores</strong> con
      <code>MONITOR/ON-ERROR/ENDMON</code> es el try-catch de RPGLE. Y la directiva <code>CTL-OPT</code>
      controla el comportamiento global del programa.
    </p>`,
    whyMatters:`RPGLE es el lenguaje principal de negocio en IBM i. Entender el formato libre moderno (**FREE) es indispensable: permite mantener código legado y escribir soluciones nuevas con lógica robusta. El 70% de las pantallas y procesos de negocio en ambientes IBM i productivos usan RPGLE.`,
    keyTerms:['**FREE','CTL-OPT','DCL-F','DCL-PI','CHAIN','%FOUND','WRITE','UPDATE','MONITOR','DCL-PROC','*INLR','SETLL','%EOF'],
    exercises:[
      {
        id:'F3-E1', nivel:'E', title:'Agregar un libro con validaciones', simId:'SIM-02',
        background:'En RPGLE, el acceso a archivos es diferente al SQL: declaras el archivo con <code>DCL-F</code>, luego usas operaciones como <code>CHAIN</code> para buscar un registro por clave. Si el registro existe, <code>%FOUND(archivo)</code> retorna *ON. Para insertar, primero debes <code>CLEAR</code> el buffer del registro, llenarlo y luego <code>WRITE</code>. El <code>MONITOR</code> captura cualquier error de I/O durante la operación.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name"><code>DCL-F</code> — Declarar un archivo en RPGLE</div>
  <div class="th-concept-desc">
    <code>DCL-F</code> es la declaración de archivo en formato libre. Le dice al programa qué archivo
    va a usar y cómo lo va a acceder. Los parámetros clave:
    <br>• <code>USAGE(*INPUT)</code>: solo leer. No puede hacer WRITE ni UPDATE.
    <br>• <code>USAGE(*OUTPUT)</code>: solo escribir. No puede hacer CHAIN ni READ.
    <br>• <code>USAGE(*INPUT *OUTPUT)</code>: leer y escribir (pero no UPDATE — para eso necesitas *UPDATE).
    <br>• <code>KEYED</code>: acceso por clave (necesario para CHAIN). Sin KEYED, solo puedes READ secuencial.
  </div>
  <div class="th-example"><span class="fn">DCL-F LIBROS USAGE(*INPUT *OUTPUT) KEYED;</span>
<span class="cm">         ↑              ↑                  ↑</span>
<span class="cm">      nombre       puede leer y           acceso por clave</span>
<span class="cm">      del PF       escribir               (para CHAIN)</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>CHAIN clave FORMATO</code> y <code>%FOUND(archivo)</code></div>
  <div class="th-concept-desc">
    <code>CHAIN</code> busca un registro por valor de clave. Si lo encuentra, carga los campos del
    registro en el buffer del programa (variables con el mismo nombre que los campos del PF).
    El resultado se verifica con <code>%FOUND(LIBROS)</code>:
    <code>*ON</code> = encontrado, <code>*OFF</code> = no existe.
    <br><br>
    <strong>Importante:</strong> <code>CHAIN</code> no retorna error si no encuentra — simplemente
    pone <code>%FOUND = *OFF</code>. El error ocurre solo si hay problemas de I/O (archivo bloqueado,
    disco con fallo, etc.) — para eso existe <code>MONITOR</code>.
  </div>
  <div class="th-example"><span class="fn">CHAIN pCod LIBREC;</span>  <span class="cm">← busca en LIBROS donde LIBCOD = pCod</span>
<span class="kw">IF %FOUND(LIBROS);</span>
  <span class="cm">  ↑ Los campos LIBCOD, LIBTTL, etc. están cargados en el buffer</span>
  <span class="fn">  pResult = 'Libro encontrado: ' + LIBTTL;</span>
<span class="kw">ELSE;</span>
  <span class="fn">  pResult = 'No existe: ' + pCod;</span>
<span class="kw">ENDIF;</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>CLEAR FORMATO</code> — El buffer de registro</div>
  <div class="th-concept-desc">
    Cuando haces <code>CHAIN</code>, los campos del registro (LIBCOD, LIBTTL, etc.) se cargan como
    variables en el programa — ese es el "buffer". Si luego quieres hacer <code>WRITE</code> para
    insertar un nuevo registro, <strong>debes limpiar ese buffer primero</strong> con <code>CLEAR LIBREC</code>.
    <br><br>
    Sin <code>CLEAR</code>, los campos que no asignes explícitamente tendrían el valor del último
    CHAIN — un bug silencioso muy común. <code>CLEAR</code> pone todos los campos en blanco/cero
    según su tipo.
  </div>
  <div class="th-example"><span class="cm">*── Sin CLEAR: bug silencioso ───────────────────────────────────────</span>
<span class="fn">CHAIN 'LIB0001' LIBREC;</span>  <span class="cm">← buffer: LIBCOD=LIB0001, LIBTTL=Don Quijote...</span>
<span class="bad">LIBCOD = 'LIB0002';</span>
<span class="bad">LIBTTL = 'Nuevo libro';</span>
<span class="bad">WRITE LIBREC;</span>            <span class="cm">← LIBAUTO, LIBEDI, LIBANIO = valores del libro anterior!</span>

<span class="cm">*── Con CLEAR: correcto ─────────────────────────────────────────────</span>
<span class="good">CLEAR LIBREC;</span>             <span class="cm">← todos los campos = blancos/cero</span>
<span class="fn">LIBCOD = 'LIB0002';</span>
<span class="fn">LIBTTL = 'Nuevo libro';</span>
<span class="fn">LIBDIS = 1;</span>
<span class="fn">WRITE LIBREC;</span>            <span class="cm">← solo los campos asignados, el resto en blanco</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>MONITOR / ON-ERROR / ENDMON</code> — Manejo de errores de I/O</div>
  <div class="th-concept-desc">
    <code>MONITOR</code> es el equivalente de <code>try/catch</code> en Java o Python. Captura errores
    en tiempo de ejecución que de otro modo abortarían el programa con un dump.
    <br><br>
    <code>ON-ERROR</code> puede ser genérico (captura cualquier error) o específico por código
    de status: <code>ON-ERROR 01211</code> captura solo "archivo no encontrado".
    <code>%STATUS</code> dentro del bloque retorna el código de error numérico.
  </div>
  <div class="th-example"><span class="kw">MONITOR;</span>
  <span class="fn">  WRITE LIBREC;</span>
  <span class="fn">  pResult = 'OK: libro agregado';</span>
<span class="kw">ON-ERROR 01021;</span>  <span class="cm">← 01021 = duplicate key (UNIQUE violation)</span>
  <span class="fn">  pResult = 'ERROR: libro ya existe';</span>
<span class="kw">ON-ERROR;</span>        <span class="cm">← cualquier otro error de I/O</span>
   <span class="fn">  pResult = 'ERROR genérico: ' + %CHAR(%STATUS);</span>
<span class="kw">ENDMON;</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>CHAIN sin verificar %FOUND:</strong> <code>CHAIN</code> posiciona el cursor en el registro, pero no retorna error si no lo encuentra — simplemente deja el buffer vacío. Si no verificas <code>%FOUND(LIBREC)</code>, podrías procesar campos en blanco creyendo que el registro existe.</li>
    <li><strong>WRITE sin CLEAR previo del buffer:</strong> Si no limpias los campos del DS antes de asignar, el buffer puede contener datos de una operación anterior. Usa <code>CLEAR LIBREC;</code> antes de asignar los campos para un <code>WRITE</code> limpio.</li>
    <li><strong>MONITOR sin ON-ERROR genérico:</strong> Si usas <code>ON-ERROR 01021</code> pero el error es <code>01022</code> (record locked), el error no es capturado y el programa aborta con dump. Siempre añade un <code>ON-ERROR;</code> genérico al final del MONITOR.</li>
    <li><strong>Confundir %STATUS con %ERROR:</strong> <code>%ERROR</code> es un indicador binario (¿hubo error?). <code>%STATUS</code> es el código numérico del último error (¿cuál fue?). Para diagnóstico, siempre loggea <code>%STATUS</code>.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>En RPGLE moderno puedes usar <code>EXEC SQL SELECT ... INTO :dsLibro</code> con una Data Structure para leer un registro directamente desde SQL en una sola sentencia — sin necesidad de DCL-F + CHAIN. Es más legible y portátil que el acceso nativo por archivo, especialmente para queries con JOIN o filtros complejos.</p>
</div>`,
        obj:'Practicar CHAIN, WRITE y manejo de errores con MONITOR en RPGLE **FREE.',
        enun:'Escribe el programa LIBRAGR que: (a) verifica si el libro ya existe con CHAIN, (b) si no existe lo agrega con WRITE, (c) si ya existe retorna mensaje de error. Usa una DS para los datos y subprocedimiento para cada validación.',
        hints:[
          '<code>DCL-F LIBROS USAGE(*OUTPUT *INPUT) KEYED;</code>',
          'Después de CHAIN: <code>%FOUND(LIBROS)</code> indica si existe',
          '<code>CLEAR LIBREC;</code> limpia el buffer antes de poblar y hacer WRITE',
          'Siempre envuelve WRITE en MONITOR para capturar errores'
        ],
        conceptos:['CHAIN','WRITE','%FOUND','MONITOR','DCL-F','DCL-PI'],
        solucion:`**FREE
CTL-OPT OPTION(*NODEBUGIO:*SRCSTMT) DFTACTGRP(*NO) ACTGRP(*CALLER);

DCL-F LIBROS USAGE(*INPUT *OUTPUT) KEYED;

DCL-PI *N;
  pCod    CHAR(7)     CONST;
  pTtl    CHAR(60)    CONST;
  pAuto   CHAR(7)     CONST;
  pEdi    CHAR(20)    CONST;
  pAnio   PACKED(4:0) CONST;
  pResult CHAR(50);
END-PI;

CHAIN pCod LIBREC;
IF %FOUND(LIBROS);
  pResult = 'ERROR: Libro ' + %TRIM(pCod) + ' ya existe.';
  *INLR = *ON;
  RETURN;
ENDIF;

CLEAR LIBREC;
LIBCOD   = pCod;
LIBTTL   = pTtl;
LIBAUTO  = pAuto;
LIBEDI   = pEdi;
LIBANIO  = pAnio;
LIBDIS   = 1;

MONITOR;
  WRITE LIBREC;
  pResult = 'OK: Libro ' + %TRIM(pCod) + ' agregado.';
ON-ERROR;
  pResult = 'ERROR escritura: ' + %CHAR(%STATUS);
ENDMON;

*INLR = *ON;`
      },
      {
        id:'F3-E2', nivel:'M', title:'Listado de libros con subfile',
        background:'El ciclo de carga de un subfile es uno de los patrones más usados en IBM i. A diferencia de una pantalla simple, el subfile requiere coordinar tres indicadores, un contador de RRN y el comportamiento de dos archivos a la vez: el LF de datos y el DSPF con el subfile. Entender el orden exacto de las operaciones es clave para evitar pantallas vacías o errores de RRN.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name"><code>DCL-F LIBD01 WORKSTN SFILE(SFLIB:nRrn)</code> — El archivo de pantalla en RPGLE</div>
  <div class="th-concept-desc">
    Cuando un DSPF contiene un subfile, la declaración en RPGLE necesita el modificador
    <code>SFILE(formatoSFL:variableRRN)</code> para informarle al compilador que hay un
    subfile dentro del archivo de pantalla. <code>nRrn</code> es una variable <code>INT(5)</code>
    que el programa incrementa manualmente antes de cada <code>WRITE SFLIB</code>.
    <br><br>
    <strong>¿Por qué el RRN manual?</strong> El sistema necesita saber en qué "ranura" de
    memoria del subfile colocar cada fila. Si no incrementas nRrn, sobreescribirías siempre
    la misma fila — la pantalla mostraría solo el último registro, repetido SFLPAG veces.
  </div>
  <div class="th-example"><span class="cm">// Declaración correcta para DSPF con subfile:</span>
<span class="fn">DCL-F LIBXTTL USAGE(*INPUT) KEYED;</span>    <span class="cm">← LF de datos</span>
<span class="fn">DCL-F LIBD01  WORKSTN</span> <span class="hl">SFILE(SFLIB:nRrn)</span><span class="fn">;</span>  <span class="cm">← DSPF con subfile</span>
<span class="fn">DCL-S nRrn INT(5) INZ(0);</span>  <span class="cm">← contador de RRN: empieza en 0</span>

<span class="cm">// En el loop de carga:</span>
<span class="fn">nRrn += 1;</span>           <span class="cm">← incrementar ANTES del WRITE</span>
<span class="fn">SFLLIB = LIBCOD;</span>    <span class="cm">← poblar campos del SFL</span>
<span class="fn">WRITE SFLIB;</span>        <span class="cm">← escribe en la ranura nRrn del SFL</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">El ciclo de 4 pasos para cargar y mostrar el subfile</div>
  <div class="th-concept-desc">
    El orden de operaciones es <em>estricto</em>. Un solo paso fuera de orden produce
    pantallas vacías, errores CPF o duplicados.
  </div>
  <table class="th-table">
    <tr><th>Paso</th><th>Código RPGLE</th><th>Qué hace</th></tr>
    <tr><td>1. Resetear</td><td><code>nRrn=0; *IN72=*ON; WRITE SFCTLLIB; *IN72=*OFF;</code></td><td>Borra el SFL en memoria y apaga el indicador</td></tr>
    <tr><td>2. Cargar filas</td><td><code>nRrn+=1; SFLLIB=...; WRITE SFLIB;</code></td><td>Inserta cada fila en el SFL</td></tr>
    <tr><td>3. Señalar fin</td><td><code>*IN73=*ON;</code></td><td>Indica al SFL que es la última página</td></tr>
    <tr><td>4. Mostrar</td><td><code>*IN71=*ON; EXFMT SFCTLLIB;</code></td><td>Hace visible el SFL y espera una tecla</td></tr>
  </table>
  <div class="th-example"><span class="cm">// Subprocedimiento CargarSubfile completo:</span>
<span class="kw">DCL-PROC CargarSubfile;</span>
<span class="fn">  nRrn=0; *IN71=*OFF;</span>
<span class="fn">  *IN72=*ON;  WRITE SFCTLLIB;  *IN72=*OFF;</span>  <span class="cm">← limpiar SFL</span>
<span class="fn">  *IN73=*OFF;</span>
<span class="fn">  SETLL *LOVAL LIBREC;</span>   <span class="cm">← posicionar al inicio</span>
<span class="fn">  READ  LIBREC;</span>
<span class="kw">  DOW NOT %EOF(LIBXTTL);</span>
<span class="fn">    nRrn+=1;  SFLLIB=LIBCOD;  SFLTTL=LIBTTL;  SFLDIS=LIBDIS;</span>
<span class="fn">    WRITE SFLIB;</span>
<span class="fn">    READ LIBREC;</span>
<span class="kw">  ENDDO;</span>
<span class="fn">  *IN73=*ON;  *IN71=*ON;</span>   <span class="cm">← marcar fin y mostrar</span>
<span class="kw">END-PROC;</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>SETLL *LOVAL</code> y <code>*HIVAL</code> — Posicionamiento en LF</div>
  <div class="th-concept-desc">
    <code>SETLL</code> (Set Lower Limit) posiciona el cursor del LF <em>antes</em> del primer registro
    que cumpla la condición. El próximo <code>READ</code> lee ese primer registro.
    <br>• <code>*LOVAL</code>: el valor más bajo posible — posiciona al inicio absoluto del índice.
    <br>• <code>*HIVAL</code>: el valor más alto posible — posiciona al final. Útil con <code>READP</code>
      para iterar en orden inverso.
    <br><br>
    Con un LF <code>DESCEND</code> (orden descendente), el "inicio" es el mayor valor.
    Para iterar desde el mayor: <code>SETLL *HIVAL LIBREC; READP LIBREC;</code> — pero aquí
    LIBXTTL es ascendente, así que usamos <code>*LOVAL</code> + <code>READ</code>.
  </div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>DCL-F con SFILE incorrecto:</strong> El nombre del formato del subfile en <code>SFILE(SFLIB:nRrn)</code> debe coincidir <em>exactamente</em> con el nombre del formato <code>R</code> en el DSPF. Si escribes <code>SFILE(SFL:nRrn)</code> y el formato se llama SFLIB, el compilador da error de resolución.</li>
    <li><strong>nRrn no se incrementa antes de WRITE:</strong> El contador del subfile debe incrementarse <em>antes</em> de hacer <code>WRITE SFLIB</code>. El patrón correcto es: <code>nRrn += 1; WRITE SFLIB;</code>. Si lo incrementas después, el primer registro va al RRN 0 (inválido).</li>
    <li><strong>No resetear nRrn a 0 al limpiar el subfile:</strong> Al activar SFLCLR para borrar el subfile, también debes reiniciar <code>nRrn = 0;</code>. Si no lo haces, la siguiente carga comienza desde donde dejó el anterior y los RRNs no coinciden.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>En vez de cargar todos los registros de golpe, considera paginación real: carga solo <code>SFLPAG</code> registros por página y usa las teclas de avance/retroceso para cargar el siguiente bloque. Esto evita superar el límite de <code>SFLSIZ</code> en tablas grandes.</p>
</div>`,
        obj:'Manejar el ciclo completo de carga de un subfile con RPGLE.',
        enun:'Escribe LIBLST que lee todos los libros del LF LIBXTTL, los carga en el subfile de LIBD01 y permite navegar con F3=Salir y F5=Refrescar. Implementa la carga en el subprocedimiento CargarSubfile.',
        hints:[
          'Declara el archivo con: <code>DCL-F LIBD01 WORKSTN SFILE(SFLIB:nRrn);</code>',
          'Para limpiar el SFL: <code>*IN72=*ON; WRITE SFCTLLIB; *IN72=*OFF;</code>',
          'Para mostrar: <code>*IN71=*ON;</code> antes de EXFMT SFCTLLIB',
          'SFLEND indicator: <code>*IN73=*ON;</code> cuando %EOF es verdadero'
        ],
        conceptos:['SFILE','SETLL/*LOVAL','SFLDSP','SFLCLR','Carga subfile'],
        solucion:`**FREE
CTL-OPT OPTION(*NODEBUGIO:*SRCSTMT) DFTACTGRP(*NO) ACTGRP(*CALLER);

DCL-F LIBXTTL USAGE(*INPUT) KEYED;
DCL-F LIBD01  WORKSTN SFILE(SFLIB:nRrn);

DCL-S nRrn   INT(5);
DCL-S vSalir IND INZ(*OFF);

CargarSubfile();

DOW NOT vSalir;
  *IN71 = *ON;
  EXFMT SFCTLLIB;
  SELECT;
    WHEN *IN03; vSalir = *ON;
    WHEN *IN05; CargarSubfile();
  ENDSL;
ENDDO;

*INLR = *ON;
RETURN;

DCL-PROC CargarSubfile;
  nRrn  = 0;
  *IN71 = *OFF;
  *IN72 = *ON;
  WRITE SFCTLLIB;
  *IN72 = *OFF;
  *IN73 = *OFF;

  SETLL *LOVAL LIBREC;
  READ  LIBREC;

  DOW NOT %EOF(LIBXTTL);
    nRrn += 1;
    SFLLIB = LIBCOD;
    SFLTTL = LIBTTL;
    SFLDIS = LIBDIS;
    WRITE SFLIB;
    READ LIBREC;
  ENDDO;

  *IN73 = *ON;
END-PROC;`
      },
      {
        id:'F3-E3', nivel:'D', title:'Registrar préstamo con múltiples validaciones', simId:'SIM-12',
        theory:`
<div class="th-concept">
  <div class="th-concept-name"><code>%ADDDUR(fecha : N : *D/*M/*Y)</code> — Aritmética de fechas</div>
  <div class="th-concept-desc">
    <code>%ADDDUR</code> suma (o resta con valor negativo) una duración a una fecha.
    El tercer parámetro indica la unidad: <code>*D</code> = días, <code>*M</code> = meses,
    <code>*Y</code> = años. IBM i maneja automáticamente los casos borde
    (fin de mes, años bisiesto, etc.).
    <br><br>
    <strong>¿Por qué no sumar simplemente +15?</strong> Porque las fechas no son números enteros.
    Una fecha <code>L</code> en RPGLE es un tipo especial — no puedes hacer <code>PRESFEC + 15</code>.
    Necesitas <code>%ADDDUR</code> para que IBM i calcule correctamente.
  </div>
  <div class="th-example"><span class="cm">*── Calcular fecha de devolución (hoy + 15 días) ───────────────────</span>
<span class="fn">PRESDVL = %ADDDUR(%DATE() : 15 : *D);</span>
<span class="cm">            ↑          ↑      ↑</span>
<span class="cm">          base:hoy  +15 días  unidad=días</span>

<span class="cm">*── Otros ejemplos:</span>
<span class="fn">%ADDDUR(%DATE() : -1 : *M)</span>  <span class="cm">← hace 1 mes</span>
<span class="fn">%ADDDUR(SOCFEC  : 1  : *Y)</span>  <span class="cm">← aniversario del socio</span>
<span class="fn">%ADDDUR(%DATE() : 3  : *M)</span>  <span class="cm">← 3 meses a futuro</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>%DATE()</code> y <code>%CHAR(fecha:*ISO)</code> — Fechas en RPGLE</div>
  <div class="th-concept-desc">
    <code>%DATE()</code> retorna la fecha actual del sistema como tipo <code>DATE</code>.
    <code>%CHAR(fecha:*ISO)</code> la convierte a string con formato <code>YYYY-MM-DD</code>.
    <code>%CHAR(fecha:*ISO0)</code> la convierte sin separadores: <code>YYYYMMDD</code> — útil para
    generar claves o nombres de archivo con la fecha.
  </div>
  <div class="th-example"><span class="fn">DCL-S vHoy   DATE;</span>
<span class="fn">DCL-S vFecStr VARCHAR(10);</span>

<span class="fn">vHoy    = %DATE();</span>                     <span class="cm">← 2024-12-25</span>
<span class="fn">vFecStr = %CHAR(%DATE():*ISO);</span>         <span class="cm">← '2024-12-25' (string)</span>
<span class="fn">vFecStr = %CHAR(%DATE():*ISO0);</span>        <span class="cm">← '20241225' (sin guiones)</span>

<span class="cm">*── Para generar código único de préstamo:</span>
<span class="fn">PRESCOD = 'P' + %CHAR(%DATE():*ISO0);</span>  <span class="cm">← 'P20241225'</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>CHAIN → UPDATE</code> — Modificar un registro existente</div>
  <div class="th-concept-desc">
    Para actualizar un registro en RPGLE nativo:
    <br>1. El archivo debe declararse con <code>USAGE(*UPDATE)</code> o <code>USAGE(*INPUT *UPDATE)</code>
    <br>2. Hacer <code>CHAIN</code> para cargar el registro (y bloquearlo para escritura)
    <br>3. Modificar los campos que necesitas
    <br>4. Hacer <code>UPDATE FORMATO</code> para escribir los cambios de vuelta
    <br><br>
    Si omites el <code>CHAIN</code> previo, el <code>UPDATE</code> falla porque no hay registro cargado.
    Si omites el <code>UPDATE</code> después de modificar, los cambios se pierden al leer el siguiente registro.
  </div>
  <div class="th-example"><span class="cm">*── Decrementar LIBDIS en 1 ─────────────────────────────────────────</span>
<span class="fn">CHAIN pCodLib LIBREC;</span>      <span class="cm">← carga el registro y lo bloquea</span>
<span class="kw">IF %FOUND(LIBROS);</span>
  <span class="fn">  LIBDIS -= 1;</span>            <span class="cm">← modifica el campo en el buffer</span>
  <span class="fn">  UPDATE LIBREC;</span>          <span class="cm">← escribe los cambios al disco</span>
<span class="kw">ENDIF;</span>

<span class="cm">*── ¿Por qué USAGE(*INPUT *UPDATE) y no solo *UPDATE?</span>
<span class="cm">*   Porque *UPDATE solo no permite CHAIN — necesitas *INPUT para buscar</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">Subprocedimientos con parámetros por referencia</div>
  <div class="th-concept-desc">
    En RPGLE, los parámetros son <strong>por referencia por defecto</strong> — el subprocedimiento
    puede modificar la variable del llamador. <code>CONST</code> indica que el parámetro es
    de entrada solamente (como paso por valor). Sin <code>CONST</code>, el subprocedimiento
    puede cambiar el valor del parámetro y el llamador verá el cambio.
    <br><br>
    Este patrón se usa para retornar múltiples valores: el resultado (IND) y el mensaje (CHAR).
  </div>
  <div class="th-example"><span class="cm">*── Subprocedimiento que retorna OK/mensaje por referencia ─────────</span>
<span class="kw">DCL-PROC ValidarSocio;</span>
  <span class="kw">DCL-PI *N;</span>
    <span class="fn">  pCod CHAR(7) CONST;</span>  <span class="cm">← entrada: no puede modificarse</span>
    <span class="fn">  pOk  IND;</span>           <span class="cm">← salida: el llamador ve el cambio</span>
    <span class="fn">  pMsg CHAR(100);</span>     <span class="cm">← salida: el llamador lee el mensaje</span>
  <span class="kw">END-PI;</span>
  <span class="cm">  ...</span>
<span class="kw">END-PROC;</span>

<span class="cm">*── Llamada:</span>
<span class="fn">ValidarSocio(pCodSoc : vOk : vMsg);</span>
<span class="cm">IF NOT vOk; pResult = vMsg; *INLR=*ON; RETURN; ENDIF;</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>%ADDDUR con tipo de duración incorrecto:</strong> <code>%ADDDUR(%DATE():15:*D)</code> suma 15 días. Pero <code>*M</code> suma meses y <code>*Y</code> suma años. Usar <code>*M</code> cuando quieres días da una fecha completamente diferente sin error de compilación.</li>
    <li><strong>UPDATE sin CHAIN previo:</strong> Para hacer <code>UPDATE LIBREC</code>, el archivo debe estar bloqueado con un <code>CHAIN</code> o <code>READ</code> previo con <code>USAGE(*INPUT *UPDATE)</code>. Si intentas UPDATE sin haber leído primero, obtienes <code>CPF5007 - Operation not valid for record</code>.</li>
    <li><strong>Parámetros por referencia modificados accidentalmente:</strong> Si un subprocedimiento recibe un parámetro sin <code>CONST</code> y lo modifica, el llamador ve el cambio. Esto es poderoso pero peligroso: siempre declara los parámetros de entrada con <code>CONST</code> para protegerlos de modificaciones accidentales.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>Para generar códigos de secuencia únicos en IBM i la forma más robusta en entornos multi-job es usar una <strong>Data Area con LOCK</strong>: <code>RTVDTAARA</code> → incrementar → <code>CHGDTAARA</code> dentro de un bloque MONMSG. O bien una tabla SQL con <code>GENERATED ALWAYS AS IDENTITY</code> que DB2 gestiona de forma atómica sin locks manuales.</p>
</div>`,
        obj:'Combinar operaciones de archivo, subprocedimientos con parámetros y %ADDDUR.',
        enun:'Escribe PRESREG que registra un préstamo: (a) valida que el socio existe y está activo, (b) valida que el libro tiene LIBDIS > 0, (c) genera código de préstamo único, (d) inserta en PRESTAMOS con PRESDVL = hoy+15 días, (e) decrementa LIBDIS en 1. Cada validación en su propio subprocedimiento.',
        hints:[
          'Fecha devolución: <code>%ADDDUR(%DATE():15:*D)</code>',
          'Código préstamo: <code>\'P\' + %CHAR(%DATE():*ISO0) + %EDITC(nSec:\'X\')</code>',
          'Para decrementar: CHAIN → modificar campo → UPDATE',
          'Pasa un parámetro IND y CHAR(100) por referencia en cada subprocedimiento'
        ],
        conceptos:['%ADDDUR','%DATE','UPDATE','Subprocedimientos encadenados'],
        solucion:`**FREE
CTL-OPT OPTION(*NODEBUGIO:*SRCSTMT) DFTACTGRP(*NO) ACTGRP(*CALLER);

DCL-F SOCIOS    USAGE(*INPUT) KEYED;
DCL-F LIBROS    USAGE(*INPUT *UPDATE) KEYED;
DCL-F PRESTAMOS USAGE(*OUTPUT) KEYED;

DCL-PI *N;
  pCodSoc CHAR(7)   CONST;
  pCodLib CHAR(7)   CONST;
  pResult CHAR(100);
END-PI;

DCL-S vMsg  CHAR(100);
DCL-S vOk   IND;
DCL-S nSec  PACKED(2:0) INZ(1);

ValidarSocio(pCodSoc : vOk : vMsg);
IF NOT vOk; pResult = vMsg; *INLR=*ON; RETURN; ENDIF;

ValidarLibro(pCodLib : vOk : vMsg);
IF NOT vOk; pResult = vMsg; *INLR=*ON; RETURN; ENDIF;

InsertarPrestamo(pCodSoc : pCodLib : nSec : vOk : vMsg);
IF vOk;
  CHAIN pCodLib LIBREC;
  IF %FOUND(LIBROS);
    LIBDIS -= 1;
    UPDATE LIBREC;
  ENDIF;
ENDIF;

pResult = vMsg;
*INLR = *ON;
RETURN;

DCL-PROC ValidarSocio;
  DCL-PI *N; pCod CHAR(7) CONST; pOk IND; pMsg CHAR(100); END-PI;
  CHAIN pCod SOCREC;
  IF NOT %FOUND(SOCIOS);
    pOk=*OFF; pMsg='Socio no encontrado: '+pCod; RETURN;
  ENDIF;
  IF SOCACT <> 'S';
    pOk=*OFF; pMsg='Socio inactivo: '+pCod; RETURN;
  ENDIF;
  pOk=*ON; pMsg=*BLANKS;
END-PROC;

DCL-PROC ValidarLibro;
  DCL-PI *N; pCod CHAR(7) CONST; pOk IND; pMsg CHAR(100); END-PI;
  CHAIN pCod LIBREC;
  IF NOT %FOUND(LIBROS);
    pOk=*OFF; pMsg='Libro no encontrado: '+pCod; RETURN;
  ENDIF;
  IF LIBDIS <= 0;
    pOk=*OFF; pMsg='Sin disponibles: '+pCod; RETURN;
  ENDIF;
  pOk=*ON; pMsg=*BLANKS;
END-PROC;

DCL-PROC InsertarPrestamo;
  DCL-PI *N;
    pSoc CHAR(7)     CONST;
    pLib CHAR(7)     CONST;
    pSec PACKED(2:0);
    pOk  IND;
    pMsg CHAR(100);
  END-PI;
  CLEAR PRESREC;
  PRESCOD = 'P' + %CHAR(%DATE():*ISO0) + %EDITC(pSec:'X');
  PRESLIB = pLib;
  PRESSOC = pSoc;
  PRESFEC = %DATE();
  PRESDVL = %ADDDUR(%DATE():15:*D);
  PRESEST = 'P';
  MONITOR;
    WRITE PRESREC;
    pSec += 1;
    pOk = *ON;
    pMsg = 'Préstamo registrado: ' + PRESCOD;
  ON-ERROR;
    pOk = *OFF;
    pMsg = 'Error al registrar: ' + %CHAR(%STATUS);
  ENDMON;
END-PROC;`
      }
    ]
  },
