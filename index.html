    </p>
    <p class="pi-text" style="margin-top:8px">
      <strong>IWS (IBM i Web Services)</strong> permite exponer programas RPGLE existentes como
      endpoints REST o SOAP sin modificar el código. IBM i configura automáticamente el WSDL o
      la especificación OpenAPI a partir de la firma del programa (parámetros de entrada/salida).
    </p>`,
    whyMatters:`La integración es el futuro de IBM i. Ya no existe el mainframe aislado — necesita consumir y publicar APIs, procesar JSON/XML, y comunicarse con sistemas modernos. Dominar estos mecanismos te permite conectar sistemas legados con arquitecturas cloud sin reescribir nada.`,
    keyTerms:['CRTDTAQ','QSNDDTAQ','QRCVDTAQ','HTTPAPI','http_url_get','YAJL','JSON_OBJECT','XML-INTO','%XML','IWS','REST endpoint'],
    exercises:[
      {
        id:'F7-E1', nivel:'E', title:'Data Queues — comunicación asíncrona entre jobs',
        background:'Una Data Queue es un objeto IBM i (*DTAQ) que actúa como una cola FIFO de mensajes. Un job envía mensajes con <code>QSNDDTAQ</code> (una API del sistema operativo, no un comando) y otro job los recibe con <code>QRCVDTAQ</code>. El receptor puede esperar indefinidamente (tiempo=-1) o por N segundos. Esta es la base de los patrones productor-consumidor en IBM i.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">Data Queue vs otros mecanismos de comunicación IBM i</div>
  <div class="th-concept-desc">
    IBM i tiene varios mecanismos para que los jobs se comuniquen. Elegir el correcto importa:
  </div>
  <table class="th-table">
    <tr><th>Mecanismo</th><th>Caso de uso</th><th>Ventaja</th></tr>
    <tr><td><code>*DTAQ</code> Data Queue</td><td>Mensajes entre jobs async</td><td>Extremadamente rápida, en memoria del sistema</td></tr>
    <tr><td><code>*DTAARA</code> Data Area</td><td>Variable global del sistema</td><td>Persiste entre jobs, simple de leer/escribir</td></tr>
    <tr><td><code>*MSGQ</code> Message Queue</td><td>Mensajes al operador/usuario</td><td>Con prioridades, expiración, formato estructurado</td></tr>
    <tr><td>Tabla SQL</td><td>Cola de trabajo persistente</td><td>Transaccional, consultable con SQL</td></tr>
  </table>
  <div class="th-example"><span class="cm">*── Data Queue es ideal cuando:</span>
<span class="cm">   - Job A genera solicitudes y Job B las procesa async</span>
<span class="cm">   - Necesitas desacoplar la velocidad del productor y el consumidor</span>
<span class="cm">   - Los mensajes son temporales (no necesitan persistir si el sistema se reinicia)</span>
<span class="cm">   - Necesitas latencia ultra-baja (< 1ms vs tabla SQL que requiere I/O)</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">QSNDDTAQ / QRCVDTAQ: APIs del sistema operativo, no comandos</div>
  <div class="th-concept-desc">
    A diferencia de los comandos CL como <code>CRTLIB</code> o <code>CALL</code>, las APIs
    <code>QSNDDTAQ</code> y <code>QRCVDTAQ</code> son <em>programas del sistema</em> que se llaman
    con <code>CALLP</code> (o <code>CALL</code>) desde RPGLE.
    <br><br>
    Por eso necesitas <strong>prototipos</strong> (<code>DCL-PR ... EXTPGM</code>) que definen los
    parámetros con sus tipos exactos. Los parámetros están ordenados y son posicionales — no
    tienen nombres con palabras clave como los comandos CL.
    <br><br>
    <strong>Trampa común:</strong> el parámetro de longitud en QSNDDTAQ es el largo del mensaje que
    vas a enviar, <em>no</em> el MAXLEN de la queue. Si envías un mensaje de 150 bytes pero declaras
    la variable como 200 y le pasas 200, los últimos 50 bytes serán basura.
  </div>
  <div class="th-example"><span class="cm">*── Firma de QSNDDTAQ:</span>
<span class="kw">DCL-PR QSNDDTAQ EXTPGM('QSNDDTAQ');</span>
<span class="fn">  pNom  CHAR(10)    CONST;</span>  <span class="cm">← nombre de la DTAQ (10 chars, rellenado con blancos)</span>
<span class="fn">  pLib  CHAR(10)    CONST;</span>  <span class="cm">← librería (*LIBL si no importa)</span>
<span class="fn">  pLen  PACKED(5:0) CONST;</span> <span class="cm">← longitud REAL del mensaje (no el máximo)</span>
<span class="fn">  pData CHAR(200)   CONST;</span> <span class="cm">← contenido del mensaje</span>
<span class="kw">END-PR;</span>

<span class="cm">*── Envío correcto: longitud = %LEN del mensaje real</span>
<span class="fn">vMsg = 'LIBRO:LIB0001:SOCIO:SOC001';</span>
<span class="fn">QSNDDTAQ('PEDQTAQ' : 'BIBLIOTECA' : %LEN(%TRIMR(vMsg)) : vMsg);</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">Tiempo de espera en QRCVDTAQ: el parámetro más importante</div>
  <div class="th-concept-desc">
    El quinto parámetro de <code>QRCVDTAQ</code> controla cuánto tiempo espera el job receptor:
    <br>• <code>0</code>: no espera. Si no hay mensajes, retorna inmediatamente con longitud=0.
    <br>• <code>N</code> (positivo): espera hasta N segundos. Si llega un mensaje antes, retorna antes.
    <br>• <code>-1</code>: espera indefinidamente. El job se bloquea hasta que llegue un mensaje.
    <br><br>
    El patrón <code>-1</code> es ideal para un "worker job" batch que siempre está corriendo
    esperando trabajo. Con <code>30</code>, el job despierta cada 30 segundos para poder
    verificar otras condiciones (flag de parada, timeout, etc.).
  </div>
  <div class="th-example"><span class="cm">*── Worker que procesa mensajes indefinidamente:</span>
<span class="fn">DOW NOT vSalir;</span>
<span class="fn">  QRCVDTAQ('PEDQTAQ':'BIBLIOTECA':vLen:vMsg:<span class="hl">30</span>);</span>  <span class="cm">← 30s timeout</span>
<span class="kw">  IF vLen = 0;</span>
<span class="fn">    // Sin mensajes: verificar si debemos parar</span>
<span class="fn">    RTVDTAARA DTAARA(BIBLIOTECA/STOPFLAG) RTNVAR(&vStop);</span>
<span class="kw">    IF &vStop = 'S'; vSalir = *ON; ENDIF;</span>
<span class="kw">    ITER;</span>
<span class="kw">  ENDIF;</span>
<span class="cm">  // Hay mensaje: procesarlo</span>
<span class="fn">  ProcesarMensaje(vMsg);</span>
<span class="fn">ENDDO;</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>MAXLEN menor que el mensaje real:</strong> <code>CRTDTAQ MAXLEN(200)</code> define el tamaño máximo de cada mensaje. Si intentas enviar un mensaje más largo, <code>QSNDDTAQ</code> falla con <code>CPF9C50</code>. El tamaño debe acomodar el peor caso del dato real, no el promedio.</li>
    <li><strong>Tiempo de espera 0 en QRCVDTAQ:</strong> Con <code>WAITTIME(0)</code>, si la cola está vacía el programa retorna inmediatamente con longitud de dato = 0. Muchos programas confunden este retorno con un mensaje vacío y lo procesan incorrectamente. Verifica siempre que <code>DTALEN &gt; 0</code> antes de procesar.</li>
    <li><strong>DTAQ *LIFO vs *FIFO:</strong> Por defecto una Data Queue es <code>*FIFO</code> (primero en entrar, primero en salir). Si creas con <code>SEQUENCE(*LIFO)</code>, el receptor procesa los mensajes en orden inverso — útil para pilas, pero confuso si esperas FIFO.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>Para monitorear cuántos mensajes hay en una Data Queue sin consumirlos usa: <code>SELECT DATA_QUEUE_NAME, NUMBER_OF_MESSAGES FROM QSYS2.DATA_QUEUE_INFO WHERE DATA_QUEUE_LIBRARY = 'BIBLIOTECA'</code>. Esto permite crear alertas cuando la cola crece demasiado (backpressure) sin afectar los receptores.</p>
</div>`,
        obj:'Entender el mecanismo de Data Queues para pasar mensajes entre programas/jobs sin acoplamiento.',
        enun:'Crea la Data Queue PEDQTAQ. Escribe el programa DTAQSEND que envía un mensaje con formato "LIBRO:LIB0001:SOCIO:SOC0001:FECHA:2024-12-25". Escribe el programa DTAQRECV que espera mensajes y los procesa. Prueba enviando desde un job y recibiendo desde otro.',
        hints:[
          '<code>CRTDTAQ DTAQ(BIBLIOTECA/PEDQTAQ) MAXLEN(200) TEXT(\'Cola préstamos\')</code>',
          'Prototipo QSNDDTAQ: nombre(10), librería(10), longitud PACKED(5:0), datos(200)',
          'Prototipo QRCVDTAQ: igual + tiempo espera PACKED(5:0) — usa -1 para esperar indefinido',
          'El campo "tiempo espera" en QRCVDTAQ: 0=no espera, -1=espera siempre, N=N segundos',
          'Verifica mensajes pendientes: <code>SELECT * FROM QSYS2.DATA_QUEUE_INFO WHERE DATA_QUEUE_NAME=\'PEDQTAQ\'</code>'
        ],
        conceptos:['CRTDTAQ','QSNDDTAQ','QRCVDTAQ','Data Queue','Comunicación async','Jobs'],
        solucion:`/* ── Crear Data Queue ──────────────────────────────────────────────── */
CRTDTAQ DTAQ(BIBLIOTECA/PEDQTAQ) MAXLEN(200)
        TEXT('Cola de solicitudes de préstamo')

// ── DTAQSEND — Envía solicitud de préstamo a la cola ────────────────
**FREE
CTL-OPT OPTION(*NODEBUGIO:*SRCSTMT) DFTACTGRP(*NO) ACTGRP(*CALLER);

// Prototipo de la API del sistema para enviar a DTAQ
DCL-PR QSNDDTAQ EXTPGM('QSNDDTAQ');
  pNom   CHAR(10)      CONST;
  pLib   CHAR(10)      CONST;
  pLen   PACKED(5:0)   CONST;
  pData  CHAR(200)     CONST;
END-PR;

DCL-PI *N;
  pCodLib CHAR(7) CONST;
  pCodSoc CHAR(7) CONST;
END-PI;

DCL-S vMsg  CHAR(200);
DCL-S vFec  VARCHAR(10);

vFec = %CHAR(%DATE():*ISO);
vMsg = 'LIBRO:' + pCodLib + ':SOCIO:' + pCodSoc + ':FECHA:' + vFec;

QSNDDTAQ('PEDQTAQ' : 'BIBLIOTECA' : 200 : vMsg);
DSPLY ('Enviado: ' + %TRIM(vMsg));
*INLR = *ON;

// ── DTAQRECV — Recibe y procesa mensajes de la cola ─────────────────
**FREE
CTL-OPT OPTION(*NODEBUGIO:*SRCSTMT) DFTACTGRP(*NO) ACTGRP(*CALLER);

DCL-PR QRCVDTAQ EXTPGM('QRCVDTAQ');
  pNom    CHAR(10)    CONST;
  pLib    CHAR(10)    CONST;
  pLen    PACKED(5:0);     // Longitud recibida (OUTPUT)
  pData   CHAR(200);       // Datos recibidos (OUTPUT)
  pWait   PACKED(5:0) CONST; // Tiempo espera: -1=indefinido
END-PR;

DCL-S vMsg    CHAR(200);
DCL-S vLen    PACKED(5:0);
DCL-S vCodLib CHAR(7);
DCL-S vCodSoc CHAR(7);
DCL-S vFecha  CHAR(10);
DCL-S vSalir  IND INZ(*OFF);

DOW NOT vSalir;
  vLen = 0;
  vMsg = *BLANKS;

  // Esperar hasta 30 segundos por un mensaje
  QRCVDTAQ('PEDQTAQ' : 'BIBLIOTECA' : vLen : vMsg : 30);

  IF vLen = 0;
    // Timeout — no llegó mensaje en 30 seg
    DSPLY 'Sin mensajes. Esperando...';
    ITER;
  ENDIF;

  // Parsear mensaje: 'LIBRO:LIBXXXX:SOCIO:SOCXXXX:FECHA:YYYY-MM-DD'
  vCodLib = %SUBST(vMsg : 7 : 7);   // posición 7, largo 7
  vCodSoc = %SUBST(vMsg : 21 : 7);  // posición 21, largo 7
  vFecha  = %SUBST(vMsg : 35 : 10); // posición 35, largo 10

  DSPLY ('Procesando libro ' + vCodLib + ' para socio ' + vCodSoc);
  // Aquí llamarías a PRESREG para registrar el préstamo
ENDDO;

*INLR = *ON;

/* Verificar mensajes pendientes en la cola: */
SELECT DATA_QUEUE_NAME, NUMBER_OF_MESSAGES, MESSAGE_LENGTH
FROM   QSYS2.DATA_QUEUE_INFO
WHERE  DATA_QUEUE_SCHEMA = 'BIBLIOTECA';`
      },
      {
        id:'F7-E2', nivel:'M', title:'Consumir una API REST externa con HTTPAPI',
        background:'HTTPAPI es la librería open source más usada para HTTP en IBM i, creada y mantenida por Scott Klement. A diferencia de UTL_HTTP (SQL) o Java en PASE, HTTPAPI está escrita en RPGLE nativo — corre como un Service Program que cualquier programa puede vincular con BNDDIR.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">Opciones para HTTP en IBM i: HTTPAPI vs UTL_HTTP vs PASE</div>
  <div class="th-concept-desc">
    IBM i tiene múltiples caminos para hacer peticiones HTTP. Cada uno tiene sus ventajas:
  </div>
  <table class="th-table">
    <tr><th>Opción</th><th>Lenguaje</th><th>Ventaja</th><th>Limitación</th></tr>
    <tr><td><strong>HTTPAPI</strong></td><td>RPGLE nativo</td><td>Simple, bien documentada, SSL integrado</td><td>Requiere instalar la librería</td></tr>
    <tr><td><code>UTL_HTTP</code></td><td>SQL (DB2)</td><td>Sin instalación, directo desde SQL</td><td>Más verboso, menos control</td></tr>
    <tr><td>Java en PASE</td><td>Java/JVM</td><td>Librerías modernas (Apache HttpClient)</td><td>Requiere JVM, más pesado</td></tr>
    <tr><td>Python en PASE</td><td>Python</td><td>requests, aiohttp, ecosistema rico</td><td>Requiere Python instalado en PASE</td></tr>
  </table>
  <div class="th-example"><span class="cm">// HTTPAPI: mínimo para un GET</span>
<span class="fn">CTL-OPT BNDDIR('LIBHTTP/HTTPAPI');</span>

<span class="fn">DCL-PR http_url_get INT(10) EXTPROC('http_url_get');</span>
<span class="fn">  url     VARCHAR(32767) CONST;</span>
<span class="fn">  outfile VARCHAR(256)   CONST;</span>
<span class="fn">END-PR;</span>

<span class="fn">vRc = http_url_get('https://api.ejemplo.com/libros' : '/tmp/resp.json');</span>
<span class="kw">IF vRc &lt;&gt; 1; DSPLY http_error(); ENDIF;</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">El archivo IFS como intermediario: GET → archivo → SQL</div>
  <div class="th-concept-desc">
    El patrón más común con HTTPAPI es guardar la respuesta en el IFS y luego procesarla
    con SQL. <code>http_url_get(url : rutaIFS)</code> escribe la respuesta al archivo
    indicado. Luego <code>QSYS2.IFS_READ_UTF8</code> lo lee línea por línea para parsearlo.
    <br><br>
    Este patrón funciona bien para respuestas pequeñas o moderadas. Para respuestas muy
    grandes (megabytes), conviene usar las funciones de streaming de HTTPAPI que procesan
    el JSON/XML en chunks sin escribir todo al disco primero.
  </div>
  <div class="th-example"><span class="cm">// Paso 1: GET → archivo IFS</span>
<span class="fn">vRc = http_url_get('https://api.com/libros' : '/tmp/resp.json');</span>

<span class="cm">// Paso 2: leer y procesar con SQL</span>
<span class="fn">EXEC SQL</span>
<span class="fn">  SELECT JSON_VALUE(LINE, 'lax $.titulo')</span>
<span class="fn">  INTO   :vTitulo</span>
<span class="fn">  FROM TABLE(QSYS2.IFS_READ_UTF8('/tmp/resp.json'))</span>
<span class="fn">  FETCH FIRST 1 ROW ONLY;</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>HTTPAPI no en BNDDIR antes de compilar:</strong> Después de instalar HTTPAPI en una librería, debes agregar esa librería al BNDDIR del programa antes de compilar. Sin eso, el programa compila (los prototipos están en el copy book) pero falla en tiempo de ejecución con <code>MCH4439</code>.</li>
    <li><strong>Archivo IFS sin permisos de escritura:</strong> La ruta <code>/tmp/resp.json</code> generalmente tiene permisos de escritura, pero rutas personalizadas pueden no tenerlos. El error no es claro — HTTPAPI retorna <code>0</code> (error) pero el mensaje puede apuntar al problema de permisos IFS. Verifica con <code>WRKLNK OBJ('/tmp')</code>.</li>
    <li><strong>Respuesta JSON mayor a VARCHAR(32766):</strong> Si la API retorna un JSON grande y lo lees con <code>IFS_READ_UTF8</code> línea por línea, cada línea debe caber en el VARCHAR destino. APIs que retornan un JSON de una sola línea enorme deben procesarse de forma diferente (streaming o CLOB).</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>Para APIs que requieren autenticación OAuth2, HTTPAPI soporta headers personalizados. Pasa el token con <code>http_setOption(HTTP_OPTION_HEADER : 'Authorization: Bearer ' + %TRIM(vToken))</code>. Para no hardcodear el token, guárdalo en una Data Area cifrada o en la tabla de configuración del sistema.</p>
</div>`,
        obj:'Usar la librería open source HTTPAPI para hacer peticiones HTTP GET y POST desde RPGLE.',
        enun:'Instala HTTPAPI en la librería LIBHTTP. Escribe el programa APILIBROS que: (a) hace un GET a https://openlibrary.org/search.json?q=garcia+marquez&limit=3 para buscar libros, (b) guarda la respuesta JSON en el IFS en /tmp/api_resp.json, (c) muestra el SQLSTATE de la escritura IFS. El programa debe verificar el código de retorno de HTTPAPI.',
        hints:[
          'Descarga HTTPAPI desde: <code>http://www.scottklement.com/httpapi/</code>',
          'La función principal: <code>http_url_get(url : outfile)</code> retorna 1=OK, 0=error',
          'Para leer el error: <code>http_error()</code> retorna el mensaje de error',
          'La URL va en una variable <code>VARCHAR(32767)</code>',
          'Usa <code>CTL-OPT BNDDIR(\'LIBHTTP/HTTPAPI\');</code> para vincular la librería'
        ],
        conceptos:['HTTPAPI','http_url_get','BNDDIR','REST GET','IFS','open source IBM i'],
        solucion:`// ── APILIBROS — Consultar API REST Open Library ─────────────────────
**FREE
CTL-OPT OPTION(*NODEBUGIO:*SRCSTMT) DFTACTGRP(*NO) ACTGRP(*NEW)
        BNDDIR('LIBHTTP/HTTPAPI');

// Prototipos HTTPAPI (normalmente se incluyen con /COPY)
DCL-PR http_url_get  INT(10) EXTPROC('http_url_get');
  url     VARCHAR(32767) CONST;
  outfile VARCHAR(256)   CONST;
END-PR;

DCL-PR http_error  VARCHAR(256) EXTPROC('http_error');
END-PR;

DCL-PR http_set_timeout EXTPROC('http_set_timeout');
  seconds INT(10) CONST;
END-PR;

DCL-S vUrl    VARCHAR(32767);
DCL-S vOut    VARCHAR(256);
DCL-S vRc     INT(10);
DCL-S vErr    VARCHAR(256);

// URL de la API pública de Open Library
vUrl = 'https://openlibrary.org/search.json?q=garcia+marquez&limit=3';
vOut = '/tmp/api_resp.json';

// Timeout de 30 segundos
http_set_timeout(30);

// Ejecutar GET
vRc = http_url_get(vUrl : vOut);

IF vRc = 1;
  DSPLY 'GET exitoso — respuesta en /tmp/api_resp.json';
  // Ahora podrías leer el archivo y parsearlo con YAJL
  // O usar QSYS2.IFS_READ_UTF8 para leerlo línea por línea
ELSE;
  vErr = http_error();
  DSPLY ('Error HTTP: ' + %TRIM(vErr));
ENDIF;

// Verificar el archivo creado en el IFS
EXEC SQL
  SELECT COUNT(*) INTO :vRc
  FROM TABLE(QSYS2.IFS_READ_UTF8(PATH_NAME => '/tmp/api_resp.json'));

DSPLY ('Líneas en respuesta: ' + %CHAR(vRc));

*INLR = *ON;

/* Instalar HTTPAPI (desde PASE/bash en IBM i): */
/* cd /tmp && curl -O http://www.scottklement.com/httpapi/httpapi.savf */
/* CPYFRMSTMF FROMSTMF('/tmp/httpapi.savf') TOMBR('/QSYS.LIB/LIBHTTP.LIB/HTTPAPI.FILE') MBROPT(*REPLACE) CVTDTA(*NONE) */
/* RSTOBJ OBJ(*ALL) SAVLIB(HTTPAPI) DEV(*SAVF) SAVF(LIBHTTP/HTTPAPI) RSTLIB(LIBHTTP) */`
      },
      {
        id:'F7-E3', nivel:'M', title:'Generar y parsear JSON con YAJL', simId:'SIM-23',
        background:'En V7R4+, DB2 for i ofrece funciones nativas de JSON: JSON_OBJECT para generar y JSON_VALUE/JSON_TABLE para parsear — sin necesidad de instalar YAJL. Para sistemas más antiguos o respuestas complejas que requieren streaming, YAJL (Yet Another JSON Library) es el estándar de la comunidad IBM i.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">JSON nativo en DB2 for i (V7R4+) vs YAJL</div>
  <div class="th-concept-desc">
    Desde V7R4, DB2 for i incluye funciones SQL nativas para JSON que son la opción recomendada
    para la mayoría de casos. YAJL sigue siendo útil para casos de streaming o generación
    programática compleja.
  </div>
  <table class="th-table">
    <tr><th>Función SQL (V7R4+)</th><th>Propósito</th></tr>
    <tr><td><code>JSON_OBJECT('key' VALUE expr)</code></td><td>Genera un objeto JSON simple</td></tr>
    <tr><td><code>JSON_ARRAY(val1, val2)</code></td><td>Genera un array JSON</td></tr>
    <tr><td><code>JSON_VALUE(json, 'lax $.campo')</code></td><td>Extrae un valor escalar</td></tr>
    <tr><td><code>JSON_TABLE(json, '$' COLUMNS(...))</code></td><td>Convierte JSON en tabla relacional</td></tr>
    <tr><td><code>JSON_ARRAYAGG(expr)</code></td><td>Agrega filas como array JSON</td></tr>
  </table>
  <div class="th-example"><span class="cm">-- Generar JSON de un libro (sin YAJL):</span>
<span class="fn">SELECT JSON_OBJECT(</span>
<span class="fn">  'codigo'      VALUE TRIM(LIBCOD),</span>
<span class="fn">  'titulo'      VALUE TRIM(LIBTTL),</span>
<span class="fn">  'disponibles' VALUE LIBDIS</span>
<span class="fn">) FROM BIBLIOTECA/LIBROS WHERE LIBCOD = 'LIB0001';</span>

<span class="cm">-- Resultado: {"codigo":"LIB0001","titulo":"Cien años de soledad","disponibles":3}</span>

<span class="cm">-- Parsear JSON con JSON_VALUE:</span>
<span class="fn">SELECT JSON_VALUE(:vJson, 'lax $.titulo') FROM SYSIBM.SYSDUMMY1;</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">Escribir JSON al IFS con <code>QSYS2.IFS_WRITE_UTF8</code></div>
  <div class="th-concept-desc">
    Para exponer datos como JSON a sistemas externos (APIs, archivos de intercambio),
    el flujo moderno en IBM i es: generar el JSON con SQL → escribirlo al IFS con
    <code>QSYS2.IFS_WRITE_UTF8</code>. Todo desde SQLRPGLE sin instalar librerías externas.
    <br><br>
    <code>OVERWRITE => 'REPLACE'</code> sobreescribe si el archivo ya existe.
    <code>END_OF_LINE => 'NONE'</code> no agrega newline al final de cada escritura
    (útil para construir el JSON línea por línea).
  </div>
  <div class="th-example"><span class="fn">EXEC SQL SELECT JSON_OBJECT('id' VALUE LIBCOD, 'ttl' VALUE LIBTTL)</span>
<span class="fn">          INTO :vJson FROM BIBLIOTECA/LIBROS WHERE LIBCOD = :pCod;</span>

<span class="fn">EXEC SQL CALL QSYS2.IFS_WRITE_UTF8(</span>
<span class="fn">  PATH_NAME   => '/tmp/libro.json',</span>
<span class="fn">  LINE        => :vJson,</span>
<span class="fn">  OVERWRITE   => 'REPLACE',</span>
<span class="fn">  END_OF_LINE => 'NONE'</span>
<span class="fn">);</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>JSON_VALUE con path incorrecto:</strong> <code>JSON_VALUE(doc, 'lax $.titulo')</code> retorna NULL silenciosamente si el path no existe o si hay un error de tipeo en el nombre. Usa <code>JSON_VALUE(doc, 'strict $.titulo')</code> durante desarrollo para que lance un error en lugar de devolver NULL.</li>
    <li><strong>OVERWRITE = 'APPEND' con archivo existente sin salto de línea:</strong> Si escribes varios objetos JSON con <code>APPEND</code> y sin <code>END_OF_LINE</code>, los objetos se concatenan sin separador. Para construir un array JSON manual, debes añadir las comas y corchetes explícitamente.</li>
    <li><strong>Acentos y caracteres especiales en JSON:</strong> <code>IFS_WRITE_UTF8</code> escribe en UTF-8, pero si la variable RPGLE tiene datos en EBCDIC con codificación 37 (Latin), los acentos pueden convertirse incorrectamente. Especifica el CCSID de la sesión con <code>SET OPTION NAMING=*SYS, DFTCCSID=1208</code>.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>La alternativa moderna a YAJL para JSON sencillo en V7R4+ es usar directamente las funciones SQL nativas: <code>JSON_OBJECT</code>, <code>JSON_ARRAYAGG</code>, <code>JSON_VALUE</code>. Son parte de DB2 for i sin instalar nada — y para leer JSON estructurado en RPGLE, <code>JSON_TABLE</code> convierte el JSON en filas de una tabla SQL consultable.</p>
</div>`,
        obj:'Usar la librería YAJL para crear y leer documentos JSON desde RPGLE de forma estructurada.',
        enun:'Con la librería YAJL instalada, escribe: (a) el programa YJLGEN que genera un JSON de un libro con campos código, título, autor y disponibles — y lo escribe en /tmp/libro.json, (b) el programa YJLREAD que lee /tmp/libro.json y extrae el valor del campo "titulo" mostrándolo con DSPLY.',
        hints:[
          'YAJL usa un modelo de generación por eventos: yajl_genOpen → yajl_beginObject → yajl_addChar → yajl_genClose',
          'Para leer: yajl_open(file) → navegar con yajl_next() → extraer con yajl_getString()',
          'Incluye los prototipos con <code>/COPY YAJL/QRPGLESRC,YAJL</code>',
          'Enlaza con <code>CTL-OPT BNDDIR(\'YAJL/YAJL\');</code>',
          'Alternativa más sencilla: usar JSON_OBJECT de SQL para generar y IFS_READ para leer'
        ],
        conceptos:['YAJL','JSON generar','JSON parsear','BNDDIR','open source IBM i'],
        solucion:`// ── Alternativa moderna: JSON con SQL + IFS (sin YAJL) ──────────────
// Si no tienes YAJL instalado, usa esta alternativa con SQL puro:

**FREE
CTL-OPT OPTION(*NODEBUGIO:*SRCSTMT) DFTACTGRP(*NO) ACTGRP(*CALLER);

// ── a) GENERAR JSON de un libro ──────────────────────────────────────
DCL-S vJson   VARCHAR(2000);
DCL-S vCod    CHAR(7)   INZ('LIB0001');

// Construir JSON con SQL
EXEC SQL
  SELECT JSON_OBJECT(
    'codigo'      VALUE TRIM(LIBCOD),
    'titulo'      VALUE TRIM(LIBTTL),
    'editorial'   VALUE TRIM(LIBEDI),
    'anio'        VALUE LIBANIO,
    'disponibles' VALUE LIBDIS
  )
  INTO :vJson
  FROM BIBLIOTECA/LIBROS
  WHERE LIBCOD = :vCod;

IF SQLSTATE = '00000';
  // Escribir en IFS
  EXEC SQL CALL QSYS2.IFS_WRITE_UTF8(
    PATH_NAME   => '/tmp/libro.json',
    LINE        => :vJson,
    OVERWRITE   => 'REPLACE',
    END_OF_LINE => 'NONE'
  );
  DSPLY ('JSON escrito: ' + %TRIM(vJson));
ELSE;
  DSPLY ('Error SQL: ' + SQLSTATE);
ENDIF;

// ── b) LEER y parsear JSON desde IFS ────────────────────────────────
DCL-S vLinea  VARCHAR(2000);
DCL-S vTitulo VARCHAR(60);

// Leer el archivo del IFS
EXEC SQL
  SELECT LINE INTO :vLinea
  FROM TABLE(QSYS2.IFS_READ_UTF8(PATH_NAME => '/tmp/libro.json'))
  FETCH FIRST 1 ROW ONLY;

IF SQLSTATE = '00000';
  // Extraer campo con JSON_VALUE (DB2 for i V7R4+)
  EXEC SQL
    SELECT JSON_VALUE(:vLinea, 'lax $.titulo')
    INTO   :vTitulo;
  DSPLY ('Título leído: ' + %TRIM(vTitulo));
ENDIF;

*INLR = *ON;

/* Si tienes YAJL instalado (www.scottklement.com/yajl/), el código
   sería similar pero usando: yajl_open, yajl_next, yajl_getString
   Referencia: /COPY YAJL/QRPGLESRC,YAJL */`
      },
      {
        id:'F7-E4', nivel:'D', title:'Parsear XML con XML-INTO y exponer servicio REST vía IWS',
        background:'XML-INTO es una operación nativa de RPGLE **FREE que mapea un documento XML directamente a una Data Structure. IWS (Integrated Web Services) convierte programas RPGLE existentes en endpoints REST o SOAP sin modificar el código — usa la firma del programa (parámetros de entrada/salida) para generar automáticamente la especificación de la API.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name"><code>XML-INTO</code>: mapeo directo de XML a DS</div>
  <div class="th-concept-desc">
    <code>XML-INTO</code> lee un string XML y pobla automáticamente una Data Structure
    cuyo nombre de campos coincida con las etiquetas XML. Es el equivalente RPGLE de
    un XML deserializer.
    <br><br>
    <code>%XML(vXmlStr : 'case=any')</code> define el origen (<code>vXmlStr</code>) y las
    opciones. <code>case=any</code> hace el matching case-insensitive: la etiqueta
    <code>&lt;SOCCOD&gt;</code> mapea al campo <code>soccod</code>, <code>SocCod</code> o
    <code>SOCCOD</code> indistintamente.
    <br><br>
    Si el XML tiene etiquetas que no coinciden con campos de la DS, se ignoran silenciosamente.
    Si la DS tiene campos sin etiqueta correspondiente, quedan en blanco/cero.
  </div>
  <div class="th-example"><span class="cm">// XML de entrada:</span>
<span class="cm">// &lt;socio&gt;&lt;soccod&gt;SOC0001&lt;/soccod&gt;&lt;socnom&gt;Juan García&lt;/socnom&gt;&lt;/socio&gt;</span>

<span class="cm">// DS con campos que coinciden con etiquetas:</span>
<span class="kw">DCL-DS dsSocio QUALIFIED;</span>
<span class="fn">  soccod CHAR(7);  socnom CHAR(40);  socact CHAR(1);</span>
<span class="kw">END-DS;</span>

<span class="kw">MONITOR;</span>
<span class="fn">  XML-INTO dsSocio %XML(vXml : 'case=any');</span>
<span class="fn">  // dsSocio.soccod = 'SOC0001', dsSocio.socnom = 'Juan García'</span>
<span class="fn">  // dsSocio.socact = '' (no estaba en el XML)</span>
<span class="kw">ON-ERROR 00352;</span>  <span class="cm">← XML mal formado</span>
<span class="fn">  pResult = 'ERROR: XML inválido';</span>
<span class="kw">ENDMON;</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">IWS: exponer RPGLE como REST sin tocar el código</div>
  <div class="th-concept-desc">
    IBM i Web Services (IWS) actúa como un proxy HTTP que recibe peticiones REST/SOAP
    y las convierte en llamadas a programas RPGLE. El programa no sabe que viene de una
    petición HTTP — simplemente recibe sus parámetros normales.
    <br><br>
    El proceso de publicación:
    <br>1. En ACS (Access Client Solutions) → Integrated Web Services → New Service
    <br>2. Seleccionar la librería y el programa
    <br>3. IWS lee la firma del programa (*PGM) y mapea cada parámetro
    <br>4. Configurar: método HTTP (GET/POST), formato de respuesta (JSON/XML), autenticación
    <br>5. El endpoint queda disponible en <code>http://servidor:10080/web/services/nombre</code>
    <br><br>
    La ventaja es zero-code: el programa legado RPGLE queda expuesto como microservicio
    moderno sin una sola línea de código nueva.
  </div>
  <div class="th-example"><span class="cm">-- Llamar al endpoint IWS desde cualquier cliente HTTP:</span>
<span class="fn">curl -X POST http://ibmi-server:10080/web/services/LIBRAGR \</span>
<span class="fn">     -H "Content-Type: application/json" \</span>
<span class="fn">     -d '{"pCod":"LIB0001","pTtl":"Don Quijote","pAuto":"AUT001"}'</span>

<span class="cm">-- Respuesta automática (IWS serializa los parámetros OUT):</span>
<span class="fn">{"pResult":"OK: Libro LIB0001 agregado."}</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>XML-INTO sin case=any:</strong> Sin la opción <code>case=any</code>, XML-INTO es sensible a mayúsculas/minúsculas. La etiqueta <code>&lt;Codigo&gt;</code> no mapea al campo DS llamado <code>codigo</code>. Con <code>'case=any'</code>, el mapeo es insensible a mayúsculas.</li>
    <li><strong>IWS con parámetros CHAR de longitud fija:</strong> IWS puede truncar o rellenar con espacios los parámetros CHAR si el cliente envía una longitud diferente a la declarada. Para APIs REST modernas, declara los parámetros de entrada como <code>VARCHAR</code> para mayor flexibilidad.</li>
    <li><strong>Programa RPGLE con estado compartido en IWS:</strong> Si el programa usa variables globales (módulo con <code>ACTGRP('NOMBRE')</code> fijo), múltiples peticiones concurrentes pueden pisar las variables entre sí. Los endpoints IWS deben usar <code>ACTGRP(*NEW)</code> para ser stateless.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>IWS genera automáticamente un documento OpenAPI (Swagger) de tu endpoint RPGLE. Accede a él desde <code>https://servidor:10101/web/services/NOMBRE_SERVICIO?wsdl</code>. Puedes importarlo en Postman o cualquier cliente REST para tener auto-completado y pruebas sin configuración adicional.</p>
</div>`,
        obj:'Usar XML-INTO para leer respuestas XML y comprender cómo IWS expone programas RPGLE como endpoints REST.',
        enun:'Parte A: Escribe el programa XMLREAD que recibe un string XML con datos de un socio y usa XML-INTO para poblar una DS. Parte B: Describe los pasos para publicar el programa LIBRAGR (F3-E1) como endpoint REST usando IWS, y qué archivo XML/JSON de configuración se necesita.',
        hints:[
          'XML-INTO usa la sintaxis: <code>XML-INTO dsVar %XML(vXmlStr : \'case=any\')</code>',
          'La DS debe tener nombres de campos que coincidan con las etiquetas XML',
          'Para IWS: usar IBM i Services en ACS, sección "Web Services"',
          'IWS crea automáticamente el WSDL/OpenAPI desde la firma del programa RPGLE',
          'El parámetro <code>case=any</code> hace el mapping case-insensitive'
        ],
        conceptos:['XML-INTO','%XML','IWS','REST endpoint','Data Structure mapping','case=any'],
        solucion:`// ── XMLREAD — Parsear XML con XML-INTO ──────────────────────────────
**FREE
CTL-OPT OPTION(*NODEBUGIO:*SRCSTMT) DFTACTGRP(*NO) ACTGRP(*CALLER);

DCL-PI *N;
  pXmlIn  VARCHAR(2000) CONST;
  pResult CHAR(100);
END-PI;

// DS con nombres que coincidan con etiquetas XML
DCL-DS dsSocio QUALIFIED;
  soccod  CHAR(7);
  socnom  CHAR(40);
  soceml  CHAR(60);
  socact  CHAR(1);
END-DS;

DCL-S vXml VARCHAR(2000);

// XML de ejemplo que se procesaría
// <socio><soccod>SOC0001</soccod><socnom>Juan García</socnom>
//        <soceml>juan@mail.com</soceml><socact>S</socact></socio>

vXml = pXmlIn;

MONITOR;
  // XML-INTO mapea automáticamente etiquetas → campos DS
  XML-INTO dsSocio %XML(vXml : 'case=any');

  pResult = 'OK - Socio: ' + %TRIM(dsSocio.soccod)
          + ' / ' + %TRIM(dsSocio.socnom);
ON-ERROR 00352;  // Error de XML mal formado
  pResult = 'ERROR: XML inválido o campos faltantes';
ON-ERROR;
  pResult = 'ERROR: ' + %CHAR(%STATUS);
ENDMON;

*INLR = *ON;

/* ─────────────────────────────────────────────────────────────────
   PARTE B: Publicar LIBRAGR como REST con IWS
   ─────────────────────────────────────────────────────────────────
   1. En ACS → "Integrated Web Services" → "Create New Service"
   2. Seleccionar programa: BIBLIOTECA/LIBRAGR
   3. IWS genera automáticamente la definición del endpoint
   4. Mapear parámetros:
      - pCod    (IN)  → parámetro URL o body
      - pTtl    (IN)  → body JSON
      - pResult (OUT) → response body
   5. El endpoint queda disponible en:
      http://servidor:10080/web/services/LIBRAGR
   6. Probar con curl:
      curl -X POST http://srv:10080/web/services/LIBRAGR \
           -H "Content-Type: application/json" \
           -d '{"pCod":"LIB0001","pTtl":"Cien años de soledad",...}'

   Archivo de configuración IWS (se genera automáticamente):
   /www/apche2/htdocs/wsconfig/LIBRAGR.properties
   Contenido relevante:
     pgm.name=BIBLIOTECA/LIBRAGR
     transport=http
     response.format=json
     method=POST
   ────────────────────────────────────────────────────────────────── */`
      }
    ]
  },
  /* ═══════════════════════════════ FASE 8 ══════════════════════════════════════════ */
  {
    id:'f8', num:8, icon:'⚡', title:'Performance y Diagnóstico',
    color:'#39d353', nivel:'Senior',
    desc:'Visual Explain, índices, Plan Cache, locks, RUNSTATS',
    intro:`<p class="pi-text">
      El rendimiento en IBM i se diagnostica desde varios ángulos. La herramienta más poderosa es el
      <strong>Plan Cache</strong> (vistas <code>QSYS2.PLAN_CACHE_SUMMARY</code> y
      <code>PLAN_CACHE_STMTS</code>): registra cada SQL ejecutado con su plan de acceso, costo
      estimado y tiempo real. Es como el <code>EXPLAIN</code> de otros motores, pero histórico y
      para todo el sistema.
    </p>
    <p class="pi-text" style="margin-top:8px">
      Los <strong>table scans</strong> (lectura completa de la tabla) son la principal causa de
      queries lentas. La solución son índices correctamente diseñados. En DB2 for i, la cláusula
      <code>INCLUDE</code> en un índice crea un "index-only scan": el motor satisface la query
      completa desde el índice sin acceder a la tabla base.
    </p>
    <p class="pi-text" style="margin-top:8px">
      Los <strong>locks (bloqueos)</strong> son otro problema clásico: un cursor SQL abierto sin
      cerrar bloquea recursos para otros jobs. <code>QSYS2.OBJECT_LOCK_INFO</code> muestra en
      tiempo real qué jobs tienen bloqueos activos. El <strong>Database Monitor</strong>
      (<code>STRDBMON/ENDDBMON</code>) captura el plan de acceso REAL de las queries, no el estimado.
    </p>`,
    whyMatters:`El 80% de los problemas de performance en IBM i se deben a queries SQL sin índices o cursores no cerrados. Saber diagnosticar con Plan Cache y Database Monitor es la diferencia entre un sistema que "tarda minutos" y uno que responde en milisegundos. Es una habilidad crítica en producción.`,
    keyTerms:['PLAN_CACHE_SUMMARY','CREATE INDEX','INCLUDE','RUNSTATS','SYSINDEXSTAT','OBJECT_LOCK_INFO','STRDBMON','ENDDBMON','Visual Explain','QQI9'],
    exercises:[
      {
        id:'F8-E1', nivel:'M', title:'Detectar y corregir queries lentas con índices', simId:'SIM-25',
        background:'El Plan Cache de DB2 for i registra cada sentencia SQL ejecutada en el sistema con su costo estimado. <code>QSYS2.PLAN_CACHE_SUMMARY</code> agrupa por texto de sentencia mostrando cuántas veces se ejecutó y el tiempo total/promedio. Cuando ves costo alto y tiempo alto, es señal de table scan. La solución es un índice sobre los campos usados en WHERE y JOIN.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">Table Scan vs Index Scan: el impacto en producción</div>
  <div class="th-concept-desc">
    Un <strong>table scan</strong> lee <em>cada registro de la tabla</em> para encontrar los que
    cumplen la condición WHERE. Con 1,000 registros es imperceptible; con 10 millones, puede tardar
    minutos. Un <strong>index scan</strong> navega el árbol B+ del índice para encontrar solo
    los registros relevantes — tiempo logarítmico independiente del tamaño de la tabla.
    <br><br>
    DB2 for i decide automáticamente qué plan de acceso usar (basado en estadísticas de RUNSTATS).
    Si las estadísticas están desactualizadas, puede elegir un table scan aunque exista un índice.
    Por eso <code>RUNSTATS</code> es obligatorio después de cargas masivas de datos.
  </div>
  <table class="th-table">
    <tr><th>Tabla: 1M registros</th><th>Sin índice (table scan)</th><th>Con índice</th></tr>
    <tr><td>WHERE PRESSOC = 'SOC0001'</td><td>~5,000ms (lee todos)</td><td>~2ms (árbol B+)</td></tr>
    <tr><td>JOIN PRESTAMOS→LIBROS</td><td>~15,000ms (producto cartesiano)</td><td>~8ms (index probe)</td></tr>
    <tr><td>ORDER BY PRESFEC DESC</td><td>Sort de 1M filas en memoria</td><td>Solo si índice en PRESFEC</td></tr>
  </table>
</div>

<div class="th-concept">
  <div class="th-concept-name">Índices compuestos y <code>INCLUDE</code>: la regla de los prefijos</div>
  <div class="th-concept-desc">
    Un índice compuesto como <code>(PRESSOC, PRESFEC)</code> solo puede usarse eficientemente
    cuando el query filtra por <em>el primer campo o los primeros N campos</em> del índice.
    Filtrar solo por PRESFEC en un índice <code>(PRESSOC, PRESFEC)</code> no aprovecha el índice.
    <br><br>
    La cláusula <code>INCLUDE(campos adicionales)</code> agrega columnas al índice
    <em>sin incluirlas en la clave de ordenación</em>. Esto permite que el motor satisfaga
    el SELECT completo desde el índice sin acceder a la tabla base — llamado "index-only scan".
  </div>
  <div class="th-example"><span class="cm">-- Índice compuesto con INCLUDE para index-only scan:</span>
<span class="fn">CREATE INDEX BIBLIOTECA/PRXSOCFEC</span>
<span class="fn">  ON BIBLIOTECA/PRESTAMOS (PRESSOC, PRESFEC)</span>  <span class="cm">← clave de búsqueda</span>
<span class="hl">  INCLUDE (PRESLIB, PRESEST);</span>  <span class="cm">← columnas adicionales en el índice</span>

<span class="cm">-- Esta query usa index-only scan (no accede a la tabla):</span>
<span class="fn">SELECT PRESSOC, PRESFEC, PRESLIB, PRESEST</span>
<span class="fn">FROM   PRESTAMOS</span>
<span class="fn">WHERE  PRESSOC = 'SOC001'</span>   <span class="cm">← usa PRESSOC (primer campo del índice)</span>
<span class="fn">ORDER BY PRESFEC;</span>           <span class="cm">← PRESFEC ya está en el índice, sin sort</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>RUNSTATS</code> — Actualizar estadísticas después de cargas</div>
  <div class="th-concept-desc">
    DB2 for i toma decisiones de plan de acceso basándose en estadísticas de la tabla:
    cuántos registros hay, cuántos valores distintos tiene cada columna, distribución de datos.
    Si estas estadísticas están desactualizadas (tabla vacía según el catálogo pero con millones
    de registros reales), DB2 puede elegir un plan ineficiente.
    <br><br>
    Cuándo ejecutar RUNSTATS:
    <br>• Después de una carga masiva (CPYF, INSERT de miles de filas)
    <br>• Después de borrar muchos registros
    <br>• Cuando las queries de repente se vuelven lentas sin razón obvia
  </div>
  <div class="th-example"><span class="cm">-- Actualizar estadísticas de una tabla:</span>
<span class="fn">CALL QSYS2.RUNSTATS(</span>
<span class="fn">  TABLE_SCHEMA => 'BIBLIOTECA',</span>
<span class="fn">  TABLE_NAME   => 'PRESTAMOS',</span>
<span class="fn">  BASED_ON     => 'CURRENT'</span>  <span class="cm">← usa datos actuales, no muestreo</span>
<span class="fn">);</span>

<span class="cm">-- Verificar cuándo fue el último RUNSTATS:</span>
<span class="fn">SELECT TABLE_NAME, LAST_STATISTICS</span>
<span class="fn">FROM   QSYS2.SYSTABLESTAT</span>
<span class="fn">WHERE  TABLE_SCHEMA = 'BIBLIOTECA';</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>Crear un índice por cada columna individualmente:</strong> Crear 5 índices de una columna cada uno es peor que crear 1 índice compuesto con las 5 columnas en el orden correcto de filtro. El optimizador prefiere un índice que cubra toda la query sobre múltiples índices parciales.</li>
    <li><strong>RUNSTATS después de un INSERT masivo pero no después de DELETE masivo:</strong> Un DELETE masivo deja el índice con muchas entradas marcadas como borradas. Sin RUNSTATS post-DELETE, el optimizador sigue creyendo que la tabla es grande y puede elegir planes subóptimos.</li>
    <li><strong>Índice en campo con baja cardinalidad:</strong> Un índice en SOCACT (solo 'S' o 'N') tiene baja cardinalidad — el optimizador probablemente hará table scan de todas formas porque es más rápido que navegar el árbol para retornar el 50% de las filas.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>IBM i tiene <strong>STA (System-Managed Access-Path Protection)</strong> que mantiene los índices automáticamente activos, incluso tras IPL. Actívala con <code>CHGPF FILE(BIBLIOTECA/PRESTAMOS) MAINT(*IMMED)</code>. Con <code>MAINT(*DLY)</code>, el índice se mantiene en lotes — más rápido para tablas con muchos INSERT, pero puede devolver datos desactualizados hasta que se procese el batch.</p>
</div>`,
        obj:'Usar PLAN_CACHE_SUMMARY para identificar table scans y crear índices correctivos.',
        enun:'Ejecuta las queries del F4-E2 y consulta QSYS2.PLAN_CACHE_SUMMARY para identificar cuáles hacen table scan. Crea los índices necesarios (compound, con INCLUDE, filtrado). Verifica con RUNSTATS.',
        hints:[
          'Busca en Plan Cache: <code>WHERE STATEMENT_TEXT LIKE \'%PRESTAMOS%\'</code>',
          'Para filtros por fecha: índice en PRESFEC',
          'Para JOIN PRESTAMOS→LIBROS: índice en PRESLIB',
          '<code>INCLUDE(cols)</code> crea index-only scan y evita acceso a la tabla'
        ],
        conceptos:['PLAN_CACHE_SUMMARY','CREATE INDEX','INCLUDE','RUNSTATS','SYSINDEXSTAT'],
        solucion:`-- 1. Identificar queries costosas en Plan Cache
SELECT SUBSTR(STATEMENT_TEXT,1,80) AS QUERY,
       STATEMENT_COUNT, TOTAL_TIME_MS,
       TOTAL_TIME_MS / STATEMENT_COUNT AS AVG_MS
FROM   QSYS2.PLAN_CACHE_SUMMARY
WHERE  STATEMENT_TEXT LIKE '%PRESTAMOS%'
ORDER BY AVG_MS DESC
FETCH FIRST 10 ROWS ONLY;

-- 2. Crear índices para optimizar queries frecuentes

-- Búsquedas por fecha de préstamo
CREATE INDEX BIBLIOTECA/PRXFEC
  ON BIBLIOTECA/PRESTAMOS (PRESFEC);

-- JOIN PRESTAMOS → LIBROS
CREATE INDEX BIBLIOTECA/PRXLIB
  ON BIBLIOTECA/PRESTAMOS (PRESLIB);

-- Filtro por estado + socio
CREATE INDEX BIBLIOTECA/PRXESTSOC
  ON BIBLIOTECA/PRESTAMOS (PRESEST, PRESSOC);

-- Index-only scan: incluye columnas adicionales
CREATE INDEX BIBLIOTECA/PRXSOCFEC
  ON      BIBLIOTECA/PRESTAMOS (PRESSOC, PRESFEC)
  INCLUDE (PRESLIB, PRESEST);

-- 3. Actualizar estadísticas
CALL QSYS2.RUNSTATS(
  TABLE_SCHEMA => 'BIBLIOTECA',
  TABLE_NAME   => 'PRESTAMOS',
  BASED_ON     => 'CURRENT'
);

-- 4. Verificar uso de índices
SELECT INDEX_NAME, LAST_USED_TIMESTAMP,
       NUMBER_OF_ENTRIES, ESTIMATED_SIZE_KB
FROM   QSYS2.SYSINDEXSTAT
WHERE  TABLE_NAME   = 'PRESTAMOS'
  AND  TABLE_SCHEMA = 'BIBLIOTECA';`
      },
      {
        id:'F8-E2', nivel:'M', title:'Locks y esperas: diagnóstico con OBJECT_LOCK_INFO',
        background:'En IBM i, cuando un job abre un cursor SQL con FOR UPDATE o hace un CHAIN en RPGLE nativo, el registro (o el archivo completo dependiendo del nivel de aislamiento) se bloquea para otros jobs. Si el job no hace COMMIT, ROLLBACK ni CLOSE del cursor, el lock permanece indefinidamente — bloqueando a cualquier otro job que intente acceder al mismo objeto.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">Tipos de locks en IBM i: archivo vs registro</div>
  <div class="th-concept-desc">
    IBM i tiene dos granularidades de bloqueo principales:
    <br>• <strong>Lock de objeto (*EXCLRD, *EXCL, *SHRNUP)</strong>: bloquea el archivo completo.
      Ocurre cuando un programa abre el archivo en modo exclusivo o cuando IBM i está cargando estadísticas.
    <br>• <strong>Lock de registro</strong>: bloquea solo el registro específico que está siendo
      leído con FOR UPDATE o CHAIN en modo actualización.
    <br><br>
    El nivel de aislamiento SQL también afecta el tipo de lock. Con <code>*CS</code> (Cursor Stability),
    el lock de registro se libera al leer el siguiente registro. Con <code>*RS</code>, se mantiene
    hasta el COMMIT — bloqueando todos los registros leídos en la transacción.
  </div>
  <table class="th-table">
    <tr><th>Tipo de acceso</th><th>Lock creado</th><th>Cuándo se libera</th></tr>
    <tr><td>CHAIN en RPGLE (USAGE *UPDATE)</td><td>Lock de registro</td><td>Al hacer UPDATE o al leer otro registro</td></tr>
    <tr><td>EXEC SQL FOR UPDATE cursor abierto</td><td>Lock de registro</td><td>Al CLOSE cursor o COMMIT</td></tr>
    <tr><td>EXEC SQL FOR READ ONLY</td><td>Sin lock (o *CS)</td><td>Según isolation level</td></tr>
    <tr><td>CRTPF con WAITRCD(*NOMAX)</td><td>Lock de objeto compartido</td><td>Al cerrar el archivo</td></tr>
  </table>
</div>

<div class="th-concept">
  <div class="th-concept-name">El escenario clásico de deadlock en IBM i</div>
  <div class="th-concept-desc">
    Un <strong>deadlock</strong> ocurre cuando dos jobs se bloquean mutuamente:
    Job A tiene lock sobre el registro 1 y espera el registro 2; Job B tiene lock sobre el registro 2
    y espera el registro 1. IBM i detecta el ciclo y cancela uno de los jobs con error CPF5034.
    <br><br>
    La solución es <strong>orden consistente</strong>: si todos los programas siempre adquieren locks
    en el mismo orden (primero LIBROS, luego PRESTAMOS), los deadlocks son imposibles.
  </div>
  <div class="th-example"><span class="cm">*── Deadlock: Job A y Job B se bloquean mutuamente ─────────────────</span>
<span class="cm">   Job A:  CHAIN LIB0001 LIBREC    ← lock en libro LIB0001</span>
<span class="cm">   Job B:  CHAIN SOC0001 SOCREC    ← lock en socio SOC0001</span>
<span class="cm">   Job A:  CHAIN SOC0001 SOCREC    ← espera a Job B → BLOQUEADO</span>
<span class="cm">   Job B:  CHAIN LIB0001 LIBREC    ← espera a Job A → DEADLOCK</span>

<span class="cm">*── Solución: orden consistente</span>
<span class="good">   Todos los programas: primero CHAIN SOCOS, luego CHAIN LIBROS</span>
<span class="cm">   → nunca puede haber espera circular</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">Diagnosticar locks con <code>QSYS2.OBJECT_LOCK_INFO</code></div>
  <div class="th-concept-desc">
    La vista <code>QSYS2.OBJECT_LOCK_INFO</code> muestra en tiempo real todos los bloqueos activos.
    Los campos clave:
    <br>• <code>JOB_NAME</code>: el job que tiene el lock (formato: número/usuario/nombre)
    <br>• <code>LOCK_STATE</code>: tipo de lock (EXCL=exclusivo, SHRRD=compartido lectura, SHRNUP=no update)
    <br>• <code>LOCK_SCOPE</code>: *OBJECT=archivo completo, *MEMBER=miembro específico
    <br><br>
    <strong>Procedimiento de diagnóstico:</strong> busca el JOB_NAME que tiene el lock,
    ve al operador a revisar qué hace ese job (<code>WRKACTJOB JOB(nombre)</code>),
    y si está colgado, finalízalo con <code>ENDJOB</code> — solo en desarrollo/pruebas.
  </div>
  <div class="th-example"><span class="cm">-- Ver todos los locks sobre PRESTAMOS:</span>
<span class="fn">SELECT JOB_NAME, LOCK_STATE, LOCK_SCOPE, LOCK_TYPE</span>
<span class="fn">FROM   QSYS2.OBJECT_LOCK_INFO</span>
<span class="fn">WHERE  OBJECT_NAME = 'PRESTAMOS'</span>
<span class="fn">  AND  OBJECT_SCHEMA = 'BIBLIOTECA';</span>

<span class="cm">-- Resultado: 123456/USRDEV/QPADEV001 | EXCL | *MEMBER | *RECORD</span>
<span class="cm">-- → Job interactivo (QPADEV001) tiene lock exclusivo en un registro</span>

<span class="cm">-- Ver qué programa está ejecutando ese job:</span>
<span class="fn">SELECT PROGRAM_NAME, SQL_STATEMENT_TEXT</span>
<span class="fn">FROM   QSYS2.ACTIVE_JOB_INFO</span>
<span class="fn">WHERE  JOB_NAME = '123456/USRDEV/QPADEV001';</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>ENDJOB *IMMED en producción sin verificar:</strong> <code>ENDJOB OPTION(*IMMED)</code> termina el job inmediatamente, pero si tenía transacciones abiertas, DB2 hace ROLLBACK automático — lo cual puede ser correcto, pero también puede corromper secuencias si el job tenía operaciones a medio completar. Usa <code>ENDJOB OPTION(*CNTRLD)</code> cuando sea posible.</li>
    <li><strong>Confundir lock de objeto con lock de registro:</strong> <code>OBJECT_LOCK_INFO</code> muestra locks de objeto (tabla completa). Los locks de registro individual se ven en <code>QSYS2.RECORD_LOCK_INFO</code>. Un programa que hace <code>CHAIN ... FOR UPDATE</code> puede tener lock de registro sin lock de objeto.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>Para investigar un deadlock después de que ocurrió, consulta <code>QSYS2.DEADLOCK_INFO</code>: muestra los dos jobs involucrados, los objetos bloqueados y el SQL que cada uno estaba ejecutando en el momento del deadlock. Combínalo con <code>QSYS2.ACTIVE_JOB_INFO</code> para ver el stack de llamadas completo.</p>
</div>`,
        obj:'Detectar bloqueos activos en la base de datos y liberar locks problemáticos usando vistas del catálogo del sistema.',
        enun:'Simula un escenario de lock: abre PRESTAMOS con un cursor sin cerrar en una sesión, luego desde otra sesión consulta QSYS2.OBJECT_LOCK_INFO para identificar el bloqueo. Aprende a finalizar el job bloqueante si es necesario.',
        hints:[
          'En sesión A: <code>EXEC SQL DECLARE C1 CURSOR FOR SELECT * FROM PRESTAMOS FOR UPDATE;</code> sin CLOSE',
          'En sesión B: <code>SELECT * FROM QSYS2.OBJECT_LOCK_INFO WHERE OBJECT_NAME = \'PRESTAMOS\'</code>',
          'Identifica el campo <code>JOB_NAME</code> del job que tiene el lock',
          '<code>ENDJOB JOB(nombre) OPTION(*IMMED)</code> — úsalo solo en pruebas'
        ],
        conceptos:['OBJECT_LOCK_INFO','FOR UPDATE','LOCK_STATE','COMMIT','ENDJOB'],
        solucion:`-- ════ SESIÓN A: Simular lock ════
-- 1. Abrir cursor con FOR UPDATE (crea lock de fila)
EXEC SQL DECLARE C_LOCK CURSOR FOR
  SELECT PRESCOD, PRESLIB, PRESSOC, PRESEST
  FROM   BIBLIOTECA/PRESTAMOS
  FOR    UPDATE OF PRESEST;

EXEC SQL OPEN C_LOCK;
EXEC SQL FETCH NEXT FROM C_LOCK INTO :vCod,:vLib,:vSoc,:vEst;

-- (No hacemos CLOSE ni COMMIT → el lock permanece activo)

-- ════ SESIÓN B: Diagnosticar locks ════
-- 2. Ver todos los locks sobre PRESTAMOS
SELECT JOB_NAME, LOCK_STATE, LOCK_SCOPE,
       LOCK_TYPE, OBJECT_TYPE, OBJECT_NAME
FROM   QSYS2.OBJECT_LOCK_INFO
WHERE  OBJECT_NAME   = 'PRESTAMOS'
  AND  OBJECT_SCHEMA = 'BIBLIOTECA'
ORDER  BY JOB_NAME;

-- 3. Ver historial de esperas de lock
SELECT *
FROM   QSYS2.JOB_LOCK_WAIT_INFO
WHERE  OBJECT_NAME = 'PRESTAMOS'
FETCH FIRST 20 ROWS ONLY;

-- 4. Identificar el job bloqueante y terminarlo si aplica
-- (Copiar el JOB_NAME del resultado anterior)
-- ENDJOB JOB('123456/USUARIO/QZDASOINIT') OPTION(*IMMED)

-- ════ Buenas prácticas ════
-- Siempre cerrar cursores y hacer COMMIT/ROLLBACK
-- Usar ISOLATION LEVEL adecuado (NC, CS, ALL, RS)
-- Configurar LOCK WAIT TIMEOUT en CTL-OPT:
-- CTL-OPT ISOLATION(*CS);`
      },
      {
        id:'F8-E3', nivel:'D', title:'Monitor de rendimiento con ACTIVITY_DB_INFO y alertas CL',
        background:'El monitoreo proactivo en IBM i sigue el patrón: consultar vistas de catálogo del sistema → evaluar umbrales → alertar si se superan. Las vistas QSYS2.ACTIVE_DB_INFO y QSYS2.PLAN_CACHE_SUMMARY dan una foto en tiempo real del estado de la base de datos. Un job CL batch que corre cada 5 minutos puede detectar problemas antes de que los usuarios los reporten.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">Vistas de diagnóstico en tiempo real: el catálogo QSYS2</div>
  <div class="th-concept-desc">
    IBM i expone el estado del sistema a través de vistas SQL en el esquema <code>QSYS2</code>.
    Son de solo lectura, no requieren permisos especiales y se actualizan en tiempo real.
  </div>
  <table class="th-table">
    <tr><th>Vista</th><th>Qué muestra</th></tr>
    <tr><td><code>QSYS2.ACTIVE_DB_INFO</code></td><td>Conexiones activas a DB2 (job, usuario, estado)</td></tr>
    <tr><td><code>QSYS2.PLAN_CACHE_SUMMARY</code></td><td>Queries SQL con costo y tiempo de ejecución</td></tr>
    <tr><td><code>QSYS2.OBJECT_LOCK_INFO</code></td><td>Bloqueos activos por objeto y job</td></tr>
    <tr><td><code>QSYS2.ACT_GRP_INFO</code></td><td>Activation groups activos por job</td></tr>
    <tr><td><code>QSYS2.ACTIVE_JOB_INFO</code></td><td>Jobs activos con CPU%, memoria, estado</td></tr>
    <tr><td><code>QSYS2.JOB_LOG_INFO</code></td><td>Entradas del job log de jobs activos</td></tr>
  </table>
</div>

<div class="th-concept">
  <div class="th-concept-name">Patrón de monitoreo: consultar → evaluar → alertar → programar</div>
  <div class="th-concept-desc">
    Un monitor proactivo efectivo sigue cuatro pasos:
    <br>1. <strong>Consultar</strong>: leer las vistas de catálogo con SQL
    <br>2. <strong>Evaluar</strong>: comparar contra umbrales configurables
    <br>3. <strong>Alertar</strong>: enviar mensaje al operador (<code>SNDMSG</code>) o a una cola de mensajes
    <br>4. <strong>Programar</strong>: someter el job repetidamente con <code>SBMJOB</code>
    <br><br>
    La frecuencia depende del entorno: cada 5 minutos para sistemas de alta transaccionalidad,
    cada hora para sistemas de menor carga. En producción, considera usar IBM i Job Scheduler
    (JOBSCDE) para mayor control que el SBMJOB encadenado.
  </div>
  <div class="th-example"><span class="cm">*── CL de monitoreo: estructura básica ──────────────────────────────</span>
<span class="fn">PGM</span>
<span class="fn">  DCL VAR(&CONNS) TYPE(*DEC) LEN(7 0)</span>
<span class="cm">  /* 1. Consultar conexiones */</span>
<span class="fn">  RUNSQL SQL('SELECT COUNT(*) FROM QSYS2.ACTIVE_DB_INFO INTO :CONNS') COMMIT(*NONE)</span>
<span class="cm">  /* 2. Evaluar umbral */</span>
<span class="fn">  IF COND(&CONNS *GT 50) THEN(DO)</span>
<span class="cm">    /* 3. Alertar */</span>
<span class="fn">    SNDMSG MSG('ALERTA: ' *CAT &CONNS *CAT ' conexiones') TOUSR(*SYSOPR)</span>
<span class="fn">  ENDDO</span>
<span class="cm">  /* 4. Programar próxima ejecución (5 min) */</span>
<span class="fn">  SBMJOB CMD(CALL PGM(MONITORDB)) SCDTIME(*CURRENT+00:05)</span>
<span class="fn">ENDPGM</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>Monitor en un job interactivo:</strong> El programa de monitoreo debe correr como un <code>SBMJOB</code> batch, no interactivo. Un job interactivo ocupa una sesión 5250 y tiene un tiempo máximo. El <code>SBMJOB</code> con re-programación es el patrón correcto para monitores continuos.</li>
    <li><strong>RUNSQL sin manejo de errores:</strong> <code>RUNSQL SQL('...')</code> en CL retorna <code>SQLSTATE</code> pero no aborta automáticamente el programa si la query falla. Siempre verifica el SQLSTATE después de RUNSQL o usa <code>MONMSG MSGID(SQL0000)</code>.</li>
    <li><strong>Umbral demasiado bajo generando spam:</strong> Si el umbral es 50 conexiones y el sistema normalmente tiene 45, el monitor enviará alertas constantemente. Calibra los umbrales con datos reales de línea base del sistema en condiciones normales.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>En lugar de un job CL que se reprograma a sí mismo, considera usar <strong>IBM i Event Monitor</strong> (<code>STRMON</code>): monitorea umbrales del sistema automáticamente sin código. También puedes crear un <em>Scheduled Job</em> con <code>ADDJOBSCDE</code> que ejecuta el CL en un horario fijo — más limpio y visible en <code>WRKJOBSCDE</code>.</p>
</div>`,
        obj:'Crear un programa CL que monitorea el rendimiento de la base de datos y envía un mensaje al operador si supera umbrales.',
        enun:'Crea el programa CL MONITORDB que consulta QSYS2.ACTIVITY_DB_INFO para revisar: conexiones activas, queries en ejecución, tiempos promedio. Si hay más de 50 conexiones o el tiempo promedio supera 5000ms, envía un mensaje CPFAD06 al operador QSYSOPR. Ejecuta el monitor cada 5 minutos con SBMJOB.',
        hints:[
          'Usa <code>RUNSQL SQL(...)</code> en CL para consultas SQL simples',
          'O bien llama a un programa RPGLE que retorna los valores como parámetros',
          '<code>SNDMSG MSG(texto) TOUSR(*SYSOPR)</code> para alertas',
          '<code>SBMJOB CMD(CALL PGM(MONITORDB)) SCDDATE(*CURRENT) SCDTIME(*CURRENT) FRQ(*EVERY) FRQSECONDS(300)</code>'
        ],
        conceptos:['ACTIVITY_DB_INFO','SNDMSG','SBMJOB','RUNSQL en CL','Monitoreo proactivo'],
        solucion:`/* MONITORDB — CL de monitoreo de DB2 */
PGM

DCL VAR(&CONNS)   TYPE(*DEC) LEN(7 0)
DCL VAR(&AVGMS)   TYPE(*DEC) LEN(11 2)
DCL VAR(&ALERTA)  TYPE(*CHAR) LEN(200)
DCL VAR(&SQLERR)  TYPE(*CHAR) LEN(7)

/* Obtener conexiones activas */
RUNSQL SQL('SELECT COUNT(*) FROM QSYS2.ACTIVE_DB_INFO +
            INTO :CONNS') COMMIT(*NONE)
MONMSG MSGID(SQL0000) EXEC(DO)
  SNDPGMMSG MSG('MONITORDB: error SQL en ACTIVE_DB_INFO') +
            TOMSGQ(QSYSOPR)
  GOTO CMDLBL(SALIR)
ENDDO

/* Obtener tiempo promedio de queries */
RUNSQL SQL('SELECT AVG(TOTAL_TIME_MS) +
            FROM QSYS2.PLAN_CACHE_SUMMARY +
            WHERE STATEMENT_COUNT > 0 +
            INTO :AVGMS') COMMIT(*NONE)

/* Evaluar umbral de conexiones */
IF COND(&CONNS *GT 50) THEN(DO)
  CHGVAR VAR(&ALERTA) VALUE('⚠ ALERTA DB2: ' *CAT +
         'Conexiones activas: ' *CAT &CONNS)
  SNDMSG MSG(&ALERTA) TOUSR(*SYSOPR)
ENDDO

/* Evaluar tiempo promedio */
IF COND(&AVGMS *GT 5000) THEN(DO)
  CHGVAR VAR(&ALERTA) VALUE('⚠ ALERTA DB2: Tiempo promedio ' *CAT +
         'de queries: ' *CAT &AVGMS *CAT ' ms')
  SNDMSG MSG(&ALERTA) TOUSR(*SYSOPR)
ENDDO

SALIR:
ENDPGM

/* Para programar ejecución cada 5 minutos: */
/* SBMJOB CMD(CALL PGM(BIBLIOTECA/MONITORDB)) */
/*   JOB(MONDB) JOBD(QBATCH) */
/*   SCDDATE(*CURRENT) SCDTIME(*CURRENT) */`
      },
      {
        id:'F8-E4', nivel:'D', title:'Profiling con SQL Performance Monitor y Visual Explain',
        background:'El Database Monitor de IBM i captura el plan de acceso REAL que DB2 usó para cada query (no el estimado del EXPLAIN). La diferencia importa: el optimizador puede estimar un index scan pero en producción con datos reales terminar haciendo un table scan por estadísticas desactualizadas. STRDBMON te da la evidencia forense para diagnósticos definitivos.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">Plan Cache estimado vs Database Monitor real</div>
  <div class="th-concept-desc">
    Hay dos niveles de diagnóstico SQL en IBM i:
    <br>• <strong>Plan Cache</strong> (<code>QSYS2.PLAN_CACHE_SUMMARY</code>): muestra el plan
      <em>estimado</em> que DB2 eligió. Es rápido de consultar, siempre disponible, pero puede no
      reflejar lo que pasó en una ejecución específica.
    <br>• <strong>Database Monitor</strong> (<code>STRDBMON/ENDDBMON</code>): captura el plan
      <em>real</em> de cada query durante una sesión específica. Incluye tiempo exacto, filas
      procesadas, método de acceso usado y costo real. Es el diagnóstico definitivo.
    <br><br>
    Flujo de diagnóstico: si Plan Cache muestra una query costosa, usa Database Monitor para
    confirmar qué pasó exactamente — puede revelar que DB2 eligió un plan diferente al estimado
    por un cambio en los datos o estadísticas.
  </div>
  <div class="th-example"><span class="cm">-- Diagnóstico en dos etapas:</span>
<span class="cm">-- Etapa 1: Plan Cache para identificar candidatos</span>
<span class="fn">SELECT SUBSTR(STATEMENT_TEXT,1,60), TOTAL_TIME_MS/STATEMENT_COUNT AS AVG_MS</span>
<span class="fn">FROM QSYS2.PLAN_CACHE_SUMMARY ORDER BY AVG_MS DESC FETCH FIRST 5 ROWS ONLY;</span>

<span class="cm">-- Etapa 2: Database Monitor para la query específica</span>
<span class="fn">STRDBMON OUTFILE(BIBLIOTECA/DBMON) JOB(*)</span>
<span class="cm">-- (ejecutar la query sospechosa)</span>
<span class="fn">ENDDBMON JOB(*)</span>
<span class="fn">SELECT QQI9, QQF4, QQTIM FROM BIBLIOTECA/DBMON WHERE QQI9 = 'T';</span>
<span class="cm">-- QQI9='T' = table scan real → necesitas un índice</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">Columnas clave de la tabla de Database Monitor</div>
  <div class="th-concept-desc">
    La tabla de salida de STRDBMON tiene decenas de columnas. Las más útiles para diagnóstico:
  </div>
  <table class="th-table">
    <tr><th>Columna</th><th>Significado</th><th>Valor de alerta</th></tr>
    <tr><td><code>QQI9</code></td><td>Método de acceso</td><td><code>'T'</code> = table scan (malo)</td></tr>
    <tr><td><code>QQF4</code></td><td>Costo estimado del optimizador</td><td>Valores altos (&gt;10000)</td></tr>
    <tr><td><code>QQTIM</code></td><td>Tiempo real en milisegundos</td><td>Depende del SLA</td></tr>
    <tr><td><code>QQI5</code></td><td>Campos de sort</td><td>No vacío = sort en memoria (costoso)</td></tr>
    <tr><td><code>QQC2</code></td><td>Nombre de la tabla accedida</td><td>—</td></tr>
    <tr><td><code>QQROWS</code></td><td>Filas reales procesadas</td><td>Alto vs filas retornadas = ineficiente</td></tr>
  </table>
</div>

<div class="th-concept">
  <div class="th-concept-name">Visual Explain en ACS: análisis gráfico del plan</div>
  <div class="th-concept-desc">
    Access Client Solutions incluye Visual Explain, una herramienta gráfica que muestra
    el plan de acceso de una query como un árbol de nodos. Cada nodo representa una operación
    (table scan, index scan, join, sort). El color indica el costo relativo: nodos rojos
    son cuellos de botella.
    <br><br>
    Para usar Visual Explain: en ACS → Run SQL Scripts → escribe la query →
    clic derecho → "Visual Explain". Muestra el plan sin ejecutar la query,
    lo que es seguro para queries de larga duración o queries destructivas.
  </div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>STRDBMON con JOB(*) en producción:</strong> <code>JOB(*)</code> monitorea <em>todos</em> los jobs del sistema — puede generar archivos de cientos de miles de registros y degradar el rendimiento. En producción, monitorea un job específico con <code>JOB(número/usuario/nombre)</code>.</li>
    <li><strong>Buscar solo QQI9='T' (table scan):</strong> Los table scans son el síntoma más visible, pero un plan puede ser ineficiente por otras razones: JOIN orden incorrecto (QQI9='H' = hash join costoso), sort sin índice (QQI9='S'), o muchos re-opens (QQC2 alto). Analiza todos los tipos de registros.</li>
    <li><strong>Crear índice y no re-ejecutar para confirmar:</strong> Después de crear un índice, la query debe re-ejecutarse y el Database Monitor re-capturarse para confirmar que el optimizador lo usa. Borrar el caché con <code>PRTSQLINF</code> o reiniciar puede ser necesario para que el nuevo plan tome efecto.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>Para un análisis más profundo que el Database Monitor, usa <strong>IBM i Db2 Performance Center</strong> (parte de ACS): captura el plan de acceso en tiempo real, muestra el árbol de nodos de ejecución con costos y permite comparar el plan antes y después de crear un índice. Es Visual Explain potenciado con historial de planes.</p>
</div>`,
        obj:'Usar Database Monitor (STRDBMON/ENDDBMON) para capturar el plan de acceso real de queries complejas y analizar con SQL.',
        enun:'Ejecuta STRDBMON para iniciar la captura en un archivo de salida. Lanza las queries de informes de PRESTAMOS (F4-E2). Para con ENDDBMON. Analiza la tabla de salida para encontrar: operaciones con mayor costo, table scans sin índice, queries con SORT. Crea al menos 2 índices correctivos.',
        hints:[
          '<code>STRDBMON OUTFILE(BIBLIOTECA/DBMON) JOB(*)</code>',
          '<code>ENDDBMON JOB(*)</code>',
          'Analiza con: <code>SELECT QQI5,QQI9,QQC2,QQF4,QQTIM FROM BIBLIOTECA/DBMON WHERE QQI9 = \'T\'</code> (T = table scan)',
          'QQI9=\'T\' = Table scan, QQI9=\'I\' = Index scan, QQF4 = costo estimado'
        ],
        conceptos:['STRDBMON','ENDDBMON','Database Monitor','QQI9','Visual Explain','QQTIM'],
        solucion:`-- ════ 1. Iniciar Database Monitor ════
STRDBMON OUTFILE(BIBLIOTECA/DBMON) JOB(*)

-- ════ 2. Ejecutar queries a analizar ════
-- (Ejecutar desde ACS o tu programa RPGLE)
SELECT L.LIBTTL, COUNT(*) AS VECES
FROM   BIBLIOTECA/PRESTAMOS P
JOIN   BIBLIOTECA/LIBROS    L ON P.PRESLIB = L.LIBCOD
GROUP  BY L.LIBTTL
ORDER  BY VECES DESC
FETCH FIRST 5 ROWS ONLY;

SELECT S.SOCNOM, MAX(P.PRESFEC) AS ULT_PRESTAMO
FROM   BIBLIOTECA/SOCIOS    S
JOIN   BIBLIOTECA/PRESTAMOS P ON P.PRESSOC = S.SOCCOD
WHERE  P.PRESEST = 'A'
GROUP  BY S.SOCNOM;

-- ════ 3. Detener monitor ════
ENDDBMON JOB(*)

-- ════ 4. Analizar resultados ════

-- Ver table scans (QQI9 = 'T')
SELECT QQJNUM,
       SUBSTR(QQC2,1,40)    AS TABLA,
       QQI9                  AS TIPO_ACCESO,
       QQF4                  AS COSTO_EST,
       QQTIM                 AS TIEMPO_MS
FROM   BIBLIOTECA/DBMON
WHERE  QQI9 = 'T'
ORDER  BY QQF4 DESC;

-- Ver queries con SORT
SELECT QQJNUM, SUBSTR(QQC2,1,40) AS TABLA,
       QQI5 AS SORT_COLS, QQF4 AS COSTO
FROM   BIBLIOTECA/DBMON
WHERE  QQI5 <> ' '
ORDER  BY QQF4 DESC;

-- ════ 5. Crear índices correctivos ════

-- Para el GROUP BY por LIBCOD en PRESTAMOS
CREATE INDEX BIBLIOTECA/PRXLIBCOD
  ON BIBLIOTECA/PRESTAMOS (PRESLIB)
  INCLUDE (PRESEST, PRESFEC);

-- Para el filtro PRESEST + JOIN PRESSOC
CREATE INDEX BIBLIOTECA/PRXESTSOC2
  ON BIBLIOTECA/PRESTAMOS (PRESEST, PRESSOC, PRESFEC);

-- ════ 6. Re-ejecutar y comparar ════
-- Volver a STRDBMON → ejecutar → ENDDBMON → comparar QQF4`
      }
    ]
  },
  /* ═══════════════════════════════ FASE 9 ══════════════════════════════════════════ */
  {
    id:'f9', num:9, icon:'🏗️', title:'Patrones de Diseño y Arquitectura',
    color:'#bc8cff', nivel:'Architect',
    desc:'Repository, Strategy, DTO, Clean Code, Service Programs modulares',
    intro:`<p class="pi-text">
      Los <strong>patrones de diseño</strong> no son exclusivos de Java u OOP clásico: aplican
      perfectamente en RPGLE. El desafío es que la mayoría del código IBM i es <em>legado monolítico</em>:
      un solo programa de miles de líneas que hace validaciones, acceso a BD, lógica de negocio
      y mensajes al usuario. Refactorizar a módulos cohesivos mejora drásticamente el mantenimiento.
    </p>
    <p class="pi-text" style="margin-top:8px">
      El <strong>patrón Repository</strong> abstrae el acceso a datos detrás de una interfaz limpia:
      en lugar de que cada programa haga su propio CHAIN/WRITE/UPDATE, todas las operaciones sobre
      LIBROS van por <code>LibRepo_GetById</code>, <code>LibRepo_Save</code>, etc. El
      <strong>patrón Strategy</strong> en RPGLE usa punteros de función (<code>%PADDR</code>)
      para intercambiar algoritmos en runtime.
    </p>
    <p class="pi-text" style="margin-top:8px">
      El principio <strong>SRP (Single Responsibility Principle)</strong> — cada módulo tiene
      una sola razón para cambiar — es especialmente valioso en IBM i, donde los cambios a
      programas de producción deben ser mínimos y controlados. Un Service Program bien diseñado
      puede actualizarse sin recompilar todos sus consumidores.
    </p>`,
    whyMatters:`Aplicar patrones de diseño en IBM i es lo que transforma código legacy en código mantenible. Un sistema con Repository centralizado puede cambiar de PF nativo a SQLRPGLE sin tocar los programas de negocio. Esto reduce el riesgo de regresiones y acorta el tiempo de onboarding de nuevos desarrolladores.`,
    keyTerms:['Repository Pattern','Strategy Pattern','SRP','Guard Pattern','DTO','LIKEDS TEMPLATE','NOMAIN','EXPORT','Clean Code','Refactoring'],
    exercises:[
      {
        id:'F9-E1', nivel:'D', title:'Patrón Repository para LIBROS (Service Program)',
        background:'El patrón Repository separa "qué datos necesito" de "cómo los obtengo". El consumidor llama <code>LibRepo_GetById(cod : data : found)</code> sin saber si adentro usa CHAIN o EXEC SQL. Esto permite cambiar la implementación sin tocar el llamador. La DS <code>dsLibro QUALIFIED TEMPLATE</code> en el copy book define el contrato de datos.',
        theory:`
<div class="th-concept">
  <div class="th-concept-name">Por qué el acceso directo a datos crea dependencias frágiles</div>
  <div class="th-concept-desc">
    Sin el patrón Repository, cada programa que necesita datos de LIBROS tiene código como este
    directamente: <code>DCL-F LIBROS KEYED;</code>, <code>CHAIN pCod LIBREC;</code>, etc.
    Esto crea un <strong>acoplamiento directo</strong> entre la lógica de negocio y el mecanismo
    de acceso a datos.
    <br><br>
    El problema real: si mañana necesitas cambiar de PF nativo a SQLRPGLE (para aprovechar JOIN,
    rendimiento SQL, etc.), tienes que modificar <em>cada uno</em> de esos 50 programas.
    Con Repository, cambias <em>una sola implementación</em> y los 50 consumidores no saben la diferencia.
  </div>
  <div class="th-example"><span class="cm">*── Sin Repository: acoplamiento directo en cada programa ────────────</span>
<span class="bad">DCL-F LIBROS USAGE(*INPUT) KEYED;</span>
<span class="bad">CHAIN pCod LIBREC;</span>
<span class="bad">IF %FOUND(LIBROS); ... ENDIF;</span>
<span class="cm">← 50 programas con este código → migrar a SQL = tocar 50 programas</span>

<span class="cm">*── Con Repository: acceso abstraído ────────────────────────────────</span>
<span class="good">LibRepo_GetById(pCod : dsLibro : vEncontrado);</span>
<span class="good">IF vEncontrado; // usar dsLibro.ttl, dsLibro.dis, etc. ENDIF;</span>
<span class="cm">← 50 programas → migrar a SQL = cambiar solo LIBREPO.SRVPGM</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name"><code>LIKEDS(dsLibro) TEMPLATE</code> — El contrato de datos</div>
  <div class="th-concept-desc">
    <code>TEMPLATE</code> en la definición de la DS en el copy book le dice al compilador que
    esa DS es <em>solo una plantilla de tipos</em> — no ocupa memoria por sí sola.
    Se usa para declarar parámetros de tipo <code>LIKEDS(dsLibro)</code> en los prototipos.
    <br><br>
    <code>LIKEDS(dsLibro)</code> en el prototipo de <code>LibRepo_GetById</code> significa:
    "este parámetro tiene exactamente la misma estructura que dsLibro". El compilador verifica
    que el llamador pase una DS compatible. Si agregas un campo a dsLibro y no actualizas el
    llamador, el compilador te avisará.
  </div>
  <div class="th-example"><span class="cm">// En el copy book (LIBREPO_H):</span>
<span class="kw">DCL-DS dsLibro QUALIFIED</span> <span class="hl">TEMPLATE</span><span class="kw">;</span>  <span class="cm">← solo tipado, sin memoria</span>
<span class="fn">  cod  CHAR(7);  ttl CHAR(60);  dis PACKED(2:0);</span>
<span class="kw">END-DS;</span>

<span class="kw">DCL-PR LibRepo_GetById;</span>
<span class="fn">  pCod  CHAR(7)           CONST;</span>
<span class="fn">  pData</span> <span class="hl">LIKEDS(dsLibro)</span><span class="fn">;</span>  <span class="cm">← parámetro del tipo dsLibro</span>
<span class="fn">  pOk   IND;</span>
<span class="kw">END-PR;</span>

<span class="cm">// En el consumidor:</span>
<span class="fn">DCL-DS miLibro</span> <span class="hl">LIKEDS(dsLibro)</span><span class="fn">;</span>  <span class="cm">← instancia del tipo</span>
<span class="fn">LibRepo_GetById('LIB001' : miLibro : vOk);</span>
<span class="fn">IF vOk; DSPLY miLibro.ttl; ENDIF;</span></div>
</div>

<div class="th-concept">
  <div class="th-concept-name">LibRepo_Save: INSERT o UPDATE según si existe</div>
  <div class="th-concept-desc">
    El patrón "save" unificado (también llamado "upsert") decide internamente si hacer INSERT
    o UPDATE basándose en si el registro ya existe. El consumidor no necesita saber la diferencia
    — simplemente llama a <code>LibRepo_Save</code> con los datos y el Repository hace lo correcto.
    <br><br>
    Este es el equivalente IBM i del patrón Active Record o DAO.Save() en otros lenguajes.
    La ventaja es que la lógica de "¿ya existe?" está en un solo lugar.
  </div>
  <div class="th-example"><span class="cm">// Implementación interna del Repository:</span>
<span class="kw">DCL-PROC LibRepo_Save EXPORT;</span>
<span class="fn">  CHAIN pData.cod LIBREC;</span>
<span class="kw">  IF %FOUND(LIBROS);</span>
<span class="fn">    // Ya existe → UPDATE</span>
<span class="fn">    LIBTTL = pData.ttl;  LIBDIS = pData.dis;</span>
<span class="fn">    UPDATE LIBREC;</span>
<span class="kw">  ELSE;</span>
<span class="fn">    // No existe → INSERT</span>
<span class="fn">    CLEAR LIBREC;</span>
<span class="fn">    LIBCOD = pData.cod;  LIBTTL = pData.ttl;  LIBDIS = pData.dis;</span>
<span class="fn">    WRITE LIBREC;</span>
<span class="kw">  ENDIF;</span>
<span class="kw">END-PROC;</span></div>
</div>

<div class="th-pitfall">
  <div class="th-pitfall-title">⚠️ Errores comunes</div>
  <ul>
    <li><strong>DS TEMPLATE usada directamente:</strong> Una <code>DCL-DS ... TEMPLATE</code> no ocupa memoria — es solo un molde. Intentar pasar la DS template directamente como parámetro en vez de una instancia <code>LIKEDS(dsLibro)</code> da error de compilación o comportamiento inesperado.</li>
    <li><strong>LibRepo_Save sin CHAIN previo al UPDATE:</strong> Para hacer UPDATE se necesita tener el registro bloqueado (CHAIN previo con <code>USAGE(*INPUT *UPDATE)</code>). En el patrón upsert, el CHAIN del "¿existe?" también prepara el UPDATE. Si haces CHAIN en un archivo de solo lectura y luego UPDATE en otro, el sistema no tiene el lock.</li>
    <li><strong>Exponer el DS interno en la interfaz pública:</strong> Si la DS tiene campos con nombres de columna de la BD (LIBCOD, LIBTTL...) y cambias el PF, debes cambiar también la DS pública del copy book. Mejor: usa un DS con nombres semánticos (cod, titulo, disponibles) y mapea internamente en el SRVPGM.</li>
  </ul>
</div>

<div class="th-tip">
  <div class="th-tip-title">💡 Tip Pro</div>
  <p>El patrón Repository se complementa perfectamente con un <strong>cache en STATIC</strong>: la primera llamada a <code>LibRepo_GetById</code> consulta la BD y guarda el resultado en una DS STATIC; las llamadas siguientes retornan el cache sin I/O. Invalida el cache cuando <code>LibRepo_Save</code> modifica el mismo registro.</p>
</div>`,
        obj:'Crear un SRVPGM que abstrae todo el acceso a datos de LIBROS con el patrón Repository.',
        enun:'Crea el SRVPGM LIBREPO con: LibRepo_GetById, LibRepo_Save (INSERT o UPDATE según exista), LibRepo_Delete. Define un copy book en QCPYSRC con la DS dsLibro y los prototipos. Exporta todos los procedimientos.',
        hints:[
          'Usa <code>CTL-OPT NOMAIN</code> para el módulo sin ciclo principal',
          'Define <code>DCL-DS dsLibro QUALIFIED TEMPLATE;</code> en el copy book',
          '<code>DCL-PROC MiProc EXPORT;</code> para exportar el procedimiento',
          'Compila: <code>CRTRPGMOD</code> + <code>CRTSRVPGM SRVPGM(LIB/SRV) MODULE(LIB/MOD) EXPORT(*ALL)</code>'
        ],
        conceptos:['NOMAIN','EXPORT','LIKEDS TEMPLATE','Repository Pattern','CRTSRVPGM'],
        solucion:`// ── Copy book: QCPYSRC/LIBREPO_H ─────────────────────────────────────
DCL-DS dsLibro QUALIFIED TEMPLATE;
  cod   CHAR(7);
  ttl   CHAR(60);
  auto  CHAR(7);
  edi   CHAR(20);
  anio  PACKED(4:0);
  dis   PACKED(2:0);
END-DS;

DCL-PR LibRepo_GetById;
  pCod   CHAR(7)         CONST;
  pData  LIKEDS(dsLibro);
  pFound IND;
END-PR;

DCL-PR LibRepo_Save;
  pData   LIKEDS(dsLibro) CONST;
  pResult CHAR(5);
END-PR;

DCL-PR LibRepo_Delete;
  pCod    CHAR(7) CONST;
  pResult CHAR(5);
END-PR;

// ── Implementación: QRPGLESRC/LIBREPO ────────────────────────────────
**FREE
CTL-OPT NOMAIN OPTION(*NODEBUGIO:*SRCSTMT)
        DFTACTGRP(*NO) ACTGRP('BIBLIOTECA');

/COPY BIBLIOTECA/QCPYSRC,LIBREPO_H

DCL-PROC LibRepo_GetById EXPORT;
  DCL-PI *N;
    pCod   CHAR(7)         CONST;
    pData  LIKEDS(dsLibro);
    pFound IND;
  END-PI;

END-PROC;

DCL-PROC LibRepo_Save EXPORT;
  DCL-PI *N;
    pData   LIKEDS(dsLibro) CONST;
    pResult CHAR(5);
  END-PI;
  DCL-S vCount INT(10);
  EXEC SQL SELECT COUNT(*) INTO :vCount
           FROM  BIBLIOTECA/LIBROS WHERE LIBCOD = :pData.cod;

  pResult = SQLSTATE;
END-PROC;

DCL-PROC LibRepo_Delete EXPORT;
  DCL-PI *N; pCod CHAR(7) CONST; pResult CHAR(5); END-PI;
